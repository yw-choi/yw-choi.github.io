<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="sans-serif">
  <defs>
    <marker id="axis-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#6B7280"/>
    </marker>
    <marker id="blue-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563EB"/>
    </marker>
    <style>
      .axis { stroke: #6B7280; stroke-width: 2; }
      .guide { stroke: #6B7280; stroke-width: 1.6; stroke-dasharray: 7 6; }
      .circle { fill: #F3F4F6; fill-opacity: 0.45; stroke: #6B7280; stroke-width: 2.2; }
      .radius { stroke: #8B0029; stroke-width: 4; stroke-linecap: round; }
      .angle { fill: none; stroke: #8B0029; stroke-width: 2.7; }
      .label-bg { fill: #ffffff; fill-opacity: 0.94; }
      .label { font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect width="800" height="430" fill="#ffffff"/>

  <line x1="130" y1="220" x2="642" y2="220" class="axis" marker-end="url(#axis-arrow)"/>
  <line x1="350" y1="55" x2="350" y2="376" class="guide"/>
  <text x="660" y="227" font-size="20" font-style="italic" fill="#6B7280">x</text>

  <circle cx="350" cy="220" r="150" class="circle"/>
  <circle cx="350" cy="220" r="5.5" fill="#6B7280"/>
  <text x="328" y="244" text-anchor="middle" class="label" fill="#6B7280">O</text>

  <line x1="350" y1="220" x2="446" y2="105" class="radius"/>
  <circle cx="446" cy="105" r="11" fill="#8B0029"/>
  <rect x="461" y="73" width="42" height="30" rx="4" class="label-bg"/>
  <text x="482" y="96" text-anchor="middle" font-size="23" font-weight="700" fill="#8B0029">P′</text>

  <line x1="446" y1="105" x2="446" y2="220" class="guide"/>
  <circle cx="446" cy="220" r="10" fill="#2563EB"/>
  <rect x="460" y="230" width="34" height="30" rx="4" class="label-bg"/>
  <text x="477" y="253" text-anchor="middle" font-size="23" font-weight="700" fill="#2563EB">P</text>

  <path d="M405 220 A55 55 0 0 0 385.4 177.9" class="angle"/>
  <rect x="395" y="178" width="28" height="26" rx="4" class="label-bg"/>
  <text x="409" y="198" text-anchor="middle" class="label" font-style="italic" fill="#8B0029">θ</text>

  <line x1="350" y1="252" x2="446" y2="252" stroke="#2563EB" stroke-width="3.2" marker-end="url(#blue-arrow)"/>
  <line x1="350" y1="220" x2="350" y2="262" stroke="#2563EB" stroke-width="1.6"/>
  <line x1="446" y1="220" x2="446" y2="262" stroke="#2563EB" stroke-width="1.6"/>
  <rect x="376" y="263" width="58" height="28" rx="4" class="label-bg"/>
  <text x="405" y="285" text-anchor="middle" class="label" font-style="italic" fill="#2563EB">x(t)</text>

  <rect x="377" y="130" width="38" height="28" rx="4" class="label-bg"/>
  <text x="396" y="151" text-anchor="middle" class="label" font-style="italic" fill="#8B0029">x<tspan baseline-shift="sub" font-size="13">m</tspan></text>

  <line x1="446" y1="105" x2="446" y2="220" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="3 5"/>
</svg>
