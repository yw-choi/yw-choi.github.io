<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="wsArrG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#6B7280">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <!-- === Constructive Interference (Top) === -->
  <text x="200" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#8B0029">보강 간섭 (&#x3D5; = 0)</text>

  <g transform="translate(30, 35)">
    <!-- Axis -->
    <line x1="20" y1="80" x2="360" y2="80" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Wave 1 (dashed) -->
    <path d="M 20,80 C 40,80 50,35 70,35 C 90,35 100,80 120,80 C 140,80 150,125 170,125 C 190,125 200,80 220,80 C 240,80 250,35 270,35 C 290,35 300,80 320,80 C 340,80 345,65 350,60" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Wave 2 (dashed, same phase) -->
    <path d="M 20,80 C 40,80 50,35 70,35 C 90,35 100,80 120,80 C 140,80 150,125 170,125 C 190,125 200,80 220,80 C 240,80 250,35 270,35 C 290,35 300,80 320,80 C 340,80 345,65 350,60" fill="none" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Labels -->
    <text x="355" y="50" font-size="12" fill="#2563EB" font-style="italic">y&#x2081;</text>
    <text x="355" y="70" font-size="12" fill="#8B0029" font-style="italic">y&#x2082;</text>

    <!-- Plus sign -->
    <text x="375" y="85" font-size="24" font-weight="bold" fill="#6B7280">=</text>
  </g>

  <!-- Resultant constructive -->
  <g transform="translate(420, 35)">
    <line x1="20" y1="80" x2="360" y2="80" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Resultant (double amplitude) -->
    <path d="M 20,80 C 40,80 50,-10 70,-10 C 90,-10 100,80 120,80 C 140,80 150,170 170,170 C 190,170 200,80 220,80 C 240,80 250,-10 270,-10 C 290,-10 300,80 320,80 C 340,80 345,50 350,35" fill="none" stroke="#8B0029" stroke-width="2.5"/>

    <text x="280" y="18" font-size="13" fill="#8B0029" font-weight="bold">2y&#x2098;</text>
    <text x="190" y="170" text-anchor="middle" font-size="12" fill="#6B7280">진폭 = 2y&#x2098;</text>
  </g>

  <!-- === Destructive Interference (Middle) === -->
  <text x="200" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="#8B0029">상쇄 간섭 (&#x3D5; = &#x3C0;)</text>

  <g transform="translate(30, 230)">
    <line x1="20" y1="80" x2="360" y2="80" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Wave 1 -->
    <path d="M 20,80 C 40,80 50,35 70,35 C 90,35 100,80 120,80 C 140,80 150,125 170,125 C 190,125 200,80 220,80 C 240,80 250,35 270,35 C 290,35 300,80 320,80" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Wave 2 (opposite phase) -->
    <path d="M 20,80 C 40,80 50,125 70,125 C 90,125 100,80 120,80 C 140,80 150,35 170,35 C 190,35 200,80 220,80 C 240,80 250,125 270,125 C 290,125 300,80 320,80" fill="none" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="6 3"/>

    <text x="330" y="35" font-size="12" fill="#2563EB" font-style="italic">y&#x2081;</text>
    <text x="330" y="130" font-size="12" fill="#8B0029" font-style="italic">y&#x2082;</text>

    <text x="375" y="85" font-size="24" font-weight="bold" fill="#6B7280">=</text>
  </g>

  <!-- Resultant destructive -->
  <g transform="translate(420, 230)">
    <line x1="20" y1="80" x2="360" y2="80" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Flat line = zero -->
    <line x1="20" y1="80" x2="320" y2="80" stroke="#8B0029" stroke-width="2.5"/>

    <text x="170" y="106" text-anchor="middle" font-size="12" fill="#6B7280">진폭 = 0 (완전 상쇄)</text>
  </g>

  <!-- === Intermediate (Bottom) === -->
  <text x="200" y="390" text-anchor="middle" font-size="16" font-weight="bold" fill="#8B0029">중간 간섭 (&#x3D5; &#x2248; 2&#x3C0;/3)</text>

  <g transform="translate(30, 400)">
    <line x1="20" y1="50" x2="360" y2="50" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Wave 1 -->
    <path d="M 20,50.0 L 25,44.7 L 30,39.7 L 35,35.0 L 40,30.9 L 45,27.6 L 50,25.1 L 55,23.5 L 60,23.0 L 65,23.5 L 70,25.1 L 75,27.6 L 80,30.9 L 85,35.0 L 90,39.7 L 95,44.7 L 100,50.0 L 105,55.3 L 110,60.3 L 115,65.0 L 120,69.1 L 125,72.4 L 130,74.9 L 135,76.5 L 140,77.0 L 145,76.5 L 150,74.9 L 155,72.4 L 160,69.1 L 165,65.0 L 170,60.3 L 175,55.3 L 180,50.0 L 185,44.7 L 190,39.7 L 195,35.0 L 200,30.9 L 205,27.6 L 210,25.1 L 215,23.5 L 220,23.0 L 225,23.5 L 230,25.1 L 235,27.6 L 240,30.9 L 245,35.0 L 250,39.7 L 255,44.7 L 260,50.0 L 265,55.3 L 270,60.3 L 275,65.0 L 280,69.1 L 285,72.4 L 290,74.9 L 295,76.5 L 300,77.0 L 305,76.5 L 310,74.9 L 315,72.4 L 320,69.1 L 325,65.0 L 330,60.3 L 335,55.3 L 340,50.0" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Wave 2 (shifted by ~120 deg) -->
    <path d="M 20,26.6 L 25,29.7 L 30,33.6 L 35,38.1 L 40,43.0 L 45,48.2 L 50,53.5 L 55,58.7 L 60,63.5 L 65,67.8 L 70,71.4 L 75,74.2 L 80,76.1 L 85,76.9 L 90,76.8 L 95,75.6 L 100,73.4 L 105,70.3 L 110,66.4 L 115,61.9 L 120,57.0 L 125,51.8 L 130,46.5 L 135,41.3 L 140,36.5 L 145,32.2 L 150,28.6 L 155,25.8 L 160,23.9 L 165,23.1 L 170,23.2 L 175,24.4 L 180,26.6 L 185,29.7 L 190,33.6 L 195,38.1 L 200,43.0 L 205,48.2 L 210,53.5 L 215,58.7 L 220,63.5 L 225,67.8 L 230,71.4 L 235,74.2 L 240,76.1 L 245,76.9 L 250,76.8 L 255,75.6 L 260,73.4 L 265,70.3 L 270,66.4 L 275,61.9 L 280,57.0 L 285,51.8 L 290,46.5 L 295,41.3 L 300,36.5 L 305,32.2 L 310,28.6 L 315,25.8 L 320,23.9 L 325,23.1 L 330,23.2 L 335,24.4 L 340,26.6" fill="none" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="6 3"/>

    <text x="345" y="54" font-size="12" fill="#2563EB" font-style="italic">y&#x2081;</text>
    <text x="345" y="31" font-size="12" fill="#8B0029" font-style="italic">y&#x2082;</text>

    <text x="375" y="55" font-size="24" font-weight="bold" fill="#6B7280">=</text>
  </g>

  <!-- Resultant intermediate -->
  <g transform="translate(420, 400)">
    <line x1="20" y1="50" x2="360" y2="50" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Resultant with intermediate amplitude -->
    <path d="M 20,26.6 L 25,24.4 L 30,23.2 L 35,23.1 L 40,23.9 L 45,25.8 L 50,28.6 L 55,32.2 L 60,36.5 L 65,41.3 L 70,46.5 L 75,51.8 L 80,57.0 L 85,61.9 L 90,66.4 L 95,70.3 L 100,73.4 L 105,75.6 L 110,76.8 L 115,76.9 L 120,76.1 L 125,74.2 L 130,71.4 L 135,67.8 L 140,63.5 L 145,58.7 L 150,53.5 L 155,48.2 L 160,43.0 L 165,38.1 L 170,33.6 L 175,29.7 L 180,26.6 L 185,24.4 L 190,23.2 L 195,23.1 L 200,23.9 L 205,25.8 L 210,28.6 L 215,32.2 L 220,36.5 L 225,41.3 L 230,46.5 L 235,51.8 L 240,57.0 L 245,61.9 L 250,66.4 L 255,70.3 L 260,73.4 L 265,75.6 L 270,76.8 L 275,76.9 L 280,76.1 L 285,74.2 L 290,71.4 L 295,67.8 L 300,63.5 L 305,58.7 L 310,53.5 L 315,48.2 L 320,43.0 L 325,38.1 L 330,33.6 L 335,29.7 L 340,26.6" fill="none" stroke="#8B0029" stroke-width="2.5"/>

    <text x="180" y="15" text-anchor="middle" font-size="12" fill="#6B7280">&#x3D5; &#x2248; 2&#x3C0;/3 &#x2192; 진폭 = y&#x2098;</text>
  </g>
</svg>
