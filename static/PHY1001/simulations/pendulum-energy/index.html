 hidden" style="z-index: 100;"> <div class="absolute inset-0 bg-black/40" id="feedback-backdrop"></div> <div class="absolute inset-0 flex items-center justify-center p-4"> <div class="bg-white rounded-2xl shadow-2xl border border-[#8B0029]/20 w-full max-w-md p-6"> <h3 class="text-[#8B0029] font-bold text-lg mb-4">강의 피드백</h3> <div class="space-y-3"> <div> <label class="text-sm text-gray-600 block mb-1">주제</label> <input id="fb-topic" type="text" placeholder="예: 3장 강의, 시뮬레이션 오류, 일반 건의 등" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#8B0029]"> </div> <div> <label class="text-sm text-gray-600 block mb-1">내용 <span class="text-[#8B0029]">*</span></label> <textarea id="fb-content" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#8B0029] resize-none" placeholder="자유롭게 작성해주세요"></textarea> </div> <div> <label class="text-sm text-gray-600 block mb-1">이름 (선택)</label> <input id="fb-name" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#8B0029]"> </div> </div> <div class="flex justify-end gap-2 mt-5"> <button id="fb-cancel" class="px-4 py-2 text-sm text-gray-500 hover:text-gray-700 rounded-lg">취소</button> <button id="fb-submit" class="px-4 py-2 text-sm text-white bg-[#8B0029] hover:bg-[#a3003a] rounded-lg font-medium">보내기</button> </div> <div id="fb-status" class="text-sm mt-2 text-center hidden"></div> </div> </div> </div> <script>
      (function() {
        var modal = document.getElementById('feedback-modal');
        var topic = document.getElementById('fb-topic');
        var content = document.getElementById('fb-content');
        var status = document.getElementById('fb-status');

        document.getElementById('btn-feedback').addEventListener('click', function() {
          topic.value = document.title.replace(' | 일반물리 I', '');
          content.value = '';
          status.classList.add('hidden');
          modal.classList.remove('hidden');
          content.focus();
        });
        document.getElementById('feedback-backdrop').addEventListener('click', close);
        document.getElementById('fb-cancel').addEventListener('click', close);
        function close() { modal.classList.add('hidden'); }

        document.getElementById('fb-submit').addEventListener('click', async function() {
          var text = content.value.trim();
          if (!text) {
            status.textContent = '내용을 입력해주세요.';
            status.className = 'text-sm mt-2 text-center text-[#8B0029]';
            status.classList.remove('hidden');
            return;
          }
          this.disabled = true; this.textContent = '보내는 중...';
          try {
            var res = await fetch('https://vesper.sogang.ac.kr/PHY1001/api/feedback', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ lecture: topic.value || '(미입력)', content: text, name: document.getElementById('fb-name').value.trim() }),
            });
            var data = await res.json();
            if (data.ok) {
              status.textContent = '피드백이 전송되었습니다. 감사합니다!';
              status.className = 'text-sm mt-2 text-center text-green-600';
              status.classList.remove('hidden');
              setTimeout(close, 1500);
            } else { throw 0; }
          } catch(e) {
            status.textContent = '전송에 실패했습니다. 다시 시도해주세요.';
            status.className = 'text-sm mt-2 text-center text-[#8B0029]';
            status.classList.remove('hidden');
          } finally {
            this.disabled = false; this.textContent = '보내기';
          }
        });
      })();
    </script> </body> </html>
