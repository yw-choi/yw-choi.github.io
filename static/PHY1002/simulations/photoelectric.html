<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>광전효과 실험실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; overflow: hidden; }
.container { display: flex; height: 100vh; }
.canvas-area { flex: 1; position: relative; background: #fafafa; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.controls { width: 260px; padding: 14px 16px; border-left: 2px solid #eee; display: flex; flex-direction: column; gap: 9px; overflow-y: auto; }
.controls h2 { color: #8B0029; font-size: 15px; margin-bottom: 0; }
.subtitle { color: #888; font-size: 11px; margin-bottom: 2px; }
.control-group { display: flex; flex-direction: column; gap: 3px; }
.control-group label { font-size: 12.5px; font-weight: 600; color: #444; }
.control-group input[type="range"] { width: 100%; accent-color: #8B0029; }
.control-group select { width: 100%; padding: 5px 6px; font-size: 12.5px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #1a1a1a; }
.theorem-box { background: #8B0029; color: #fff; border-radius: 8px; padding: 9px; font-size: 12.5px; text-align: center; font-weight: 700; line-height: 1.7; }
.theorem-box .katex { color: #fff; font-size: 13.5px; }
.info-box { background: #f8f0f2; border: 1px solid #e0c0c8; border-radius: 8px; padding: 9px 10px; font-size: 12px; line-height: 1.95; }
.info-box .label { color: #8B0029; font-weight: 700; }
.info-box .val { font-weight: 700; }
.info-box .katex { font-size: 12px; }
.graph-box { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px 8px 4px; }
.graph-box .gtitle { font-size: 11.5px; font-weight: 700; color: #8B0029; text-align: center; margin-bottom: 2px; }
.graph-box .gtitle .katex { font-size: 12px; }
.formula-box { background: #f9f0f2; border: 1px solid rgba(139,0,41,0.12); border-radius: 8px; padding: 8px 10px; font-size: 11.5px; line-height: 1.9; color: #555; }
.formula-box b { color: #8B0029; }
.formula-box .katex { font-size: 11.5px; }
button.reset-btn { background: #8B0029; color: #fff; border: none; border-radius: 6px; padding: 8px; font-size: 13px; cursor: pointer; font-weight: 600; }
button.reset-btn:hover { background: #a3003a; }
.canvas-title { position: absolute; top: 8px; left: 16px; right: 16px; pointer-events: none; font-size: 13.5px; font-weight: 700; color: #8B0029; line-height: 1.4; }
.canvas-title .katex { font-size: 13.5px; }
.canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
.canvas-overlay .katex-label { position: absolute; white-space: nowrap; font-size: 12.5px; line-height: 1;
  pointer-events: none; transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.88); padding: 2px 6px; border-radius: 4px; }
.canvas-overlay .katex-label .katex { font-size: 0.95em; }
.no-emit-banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
  background: rgba(139,0,41,0.92); color: #fff; font-size: 14px; font-weight: 700;
  padding: 10px 16px; border-radius: 8px; pointer-events: none; display: none; text-align: center; line-height: 1.6; }
@media (max-width: 700px) {
  .container { flex-direction: column; }
  .canvas-area { height: 55vh; }
  .controls { width: 100%; height: 45vh; border-left: none; border-top: 2px solid #eee; }
}
</style>
</head>
<body>
<div class="container">
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="canvas-overlay" id="overlay">
      <div class="katex-label" id="lblKmax" style="color:#2563EB;font-weight:bold;"></div>
      <div class="katex-label" id="lblPhoton" style="color:#8B0029;font-weight:bold;"></div>
    </div>
    <div class="canvas-title" id="canvasTitle"></div>
    <div class="no-emit-banner" id="noEmitBanner"></div>
  </div>
  <div class="controls">
    <div>
      <h2>광전효과 실험실</h2>
      <div class="subtitle">Photoelectric Effect (Ch.38)</div>
    </div>

    <div class="theorem-box" id="theoremBox"></div>

    <div class="control-group">
      <label>금속 (일함수 &Phi;)</label>
      <select id="metalSel">
        <option value="Na" selected>나트륨 Na (&Phi; = 2.28 eV)</option>
        <option value="K">칼륨 K (&Phi; = 2.30 eV)</option>
        <option value="Cs">세슘 Cs (&Phi; = 2.14 eV)</option>
        <option value="Pt">백금 Pt (&Phi; = 5.65 eV)</option>
      </select>
    </div>

    <div class="control-group">
      <label>빛의 진동수 f = <span id="freqVal">7.0</span> &times;10<sup>14</sup> Hz (&lambda; = <span id="lamVal">429</span> nm)</label>
      <input type="range" id="freqSlider" min="3" max="15" value="7" step="0.1">
    </div>

    <div class="control-group">
      <label>빛의 세기 = <span id="intVal">60</span> %</label>
      <input type="range" id="intSlider" min="5" max="100" value="60" step="5">
    </div>

    <div class="control-group">
      <label>감속(정지) 전압 V = <span id="voltVal">0.00</span> V</label>
      <input type="range" id="voltSlider" min="0" max="4" value="0" step="0.05">
    </div>

    <div class="info-box" id="infoBox"></div>

    <div class="graph-box">
      <div class="gtitle" id="graphTitle"></div>
      <canvas id="graph" width="220" height="150" style="width:100%;display:block;"></canvas>
    </div>

    <div class="formula-box" id="formulaBox"></div>

    <button class="reset-btn" id="resetBtn">&#8635; 기본값 복원</button>
  </div>
</div>

<script>
function tex(expr) {
  if (typeof katex === 'undefined') return expr;
  return katex.renderToString(expr, { throwOnError: false, displayMode: false });
}

// ---------- physical constants ----------
const H_EVS = 4.14e-15;        // Planck constant (eV*s)
const METALS = {
  Na: { name: '나트륨 Na', phi: 2.28 },
  K:  { name: '칼륨 K',    phi: 2.30 },
  Cs: { name: '세슘 Cs',   phi: 2.14 },
  Pt: { name: '백금 Pt',   phi: 5.65 },
};

// ---------- state (logical / physical only; NO pixel coordinates stored) ----------
const state = {
  metal: 'Na',
  f14: 7.0,        // frequency in units of 1e14 Hz
  intensity: 60,   // percent
  volt: 0.0,       // retarding voltage (V)
};
// electrons stored in LOGICAL coordinates: s in [0,1] across the gap, yFrac in [0,1] of plate height
let electrons = [];
let photons = [];   // sFrac along the beam (0 source -> 1 metal)

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const gcan = document.getElementById('graph');
const gctx = gcan.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let CW = 0, CH = 0;

// ---------- derived physics ----------
function phi() { return METALS[state.metal].phi; }
function hf() { return H_EVS * state.f14 * 1e14; }               // photon energy (eV)
function f0_14() { return phi() / H_EVS / 1e14; }                // cutoff frequency (1e14 Hz)
function kmax() { return Math.max(0, hf() - phi()); }            // eV
function emitting() { return hf() > phi(); }
function lambdaNm() { return 3.0e8 / (state.f14 * 1e14) * 1e9; }
// photocurrent (arb. units): 0 if below cutoff; linear cut by retarding voltage
function current() {
  if (!emitting()) return 0;
  const frac = Math.max(0, 1 - state.volt / kmax());
  return state.intensity / 100 * frac;
}

// ---------- layout mapping (recomputed every draw; iframe-safe) ----------
function geom() {
  return {
    plateX: 0.17 * CW, plateW: Math.max(10, 0.030 * CW),
    plateY0: 0.30 * CH, plateY1: 0.80 * CH,
    collX: 0.82 * CW, collW: Math.max(8, 0.022 * CW),
    beamSrc: { x: 0.03 * CW, y: 0.06 * CH },
  };
}

// ---------- resize (lazy, iframe-safe) ----------
function resize() {
  dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  if (rect.width < 20 || rect.height < 20) { requestAnimationFrame(resize); return; }
  CW = rect.width; CH = rect.height;
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

// ---------- color from wavelength ----------
function beamColor() {
  const l = lambdaNm();
  if (l > 750) return { css: 'rgba(160,60,60,0.55)', dot: '#a03c3c', name: '적외선' };
  if (l < 380) return { css: 'rgba(120,60,200,0.6)', dot: '#7830c8', name: '자외선' };
  // crude visible mapping
  let r, g, b;
  if (l >= 620) { r = 255; g = Math.round(140 * (750 - l) / 130); b = 0; }
  else if (l >= 570) { r = 255; g = 220; b = 0; }
  else if (l >= 495) { r = Math.round(255 * (570 - l) / 75 * 0.3); g = 200; b = 60; }
  else if (l >= 450) { r = 0; g = Math.round(120 + 80 * (l - 450) / 45); b = 255; }
  else { r = 90; g = 40; b = 255; }
  return { css: `rgba(${r},${g},${b},0.55)`, dot: `rgb(${r},${g},${b})`, name: '가시광' };
}

// ---------- particles ----------
let lastT = 0, emitAcc = 0, photAcc = 0;
function step(dt) {
  // photons along beam
  photAcc += dt * (4 + state.intensity * 0.12);
  while (photAcc >= 1) { photAcc -= 1; photons.push({ s: 0 }); }
  for (const p of photons) p.s += dt * 0.9;
  photons = photons.filter(p => p.s < 1);

  // electron emission
  if (emitting()) {
    emitAcc += dt * (2 + state.intensity * 0.13);
    while (emitAcc >= 1) {
      emitAcc -= 1;
      electrons.push({ s: 0, y: 0.08 + 0.84 * Math.random(), dir: 1 });
    }
  } else { emitAcc = 0; }

  // electron motion: K(s) = kmax - V*s  (eV), v ∝ sqrt(K)
  const K0 = kmax(), V = state.volt;
  const SPEED = 0.34; // gap fractions per second per sqrt(eV)
  for (const e of electrons) {
    const Ks = K0 - V * e.s;
    if (e.dir > 0 && Ks <= 0.005) e.dir = -1;   // turned back by the field
    const v = SPEED * Math.sqrt(Math.max(Ks, 0.01));
    e.s += e.dir * v * dt;
  }
  electrons = electrons.filter(e => e.s > -0.02 && e.s < 1.0);
  if (electrons.length > 90) electrons = electrons.slice(electrons.length - 90);
}

// ---------- drawing ----------
function drawTextWithBg(c, txt, x, y, color, font, align = 'center') {
  c.font = font || '12px sans-serif';
  c.textAlign = align; c.textBaseline = 'middle';
  const w = c.measureText(txt).width;
  const x0 = align === 'center' ? x - w / 2 : (align === 'left' ? x : x - w);
  c.fillStyle = 'rgba(255,255,255,0.85)';
  c.fillRect(x0 - 3, y - 9, w + 6, 18);
  c.fillStyle = color;
  c.fillText(txt, x, y);
}

function draw() {
  if (CW < 20) return;
  ctx.clearRect(0, 0, CW, CH);
  const g = geom();
  const col = beamColor();

  // --- light beam (source -> metal plate upper half) ---
  const tx = g.plateX + g.plateW, ty = (g.plateY0 * 0.45 + g.plateY1 * 0.55);
  const bw = 6 + state.intensity * 0.22;   // beam half-width ~ intensity
  const dx = tx - g.beamSrc.x, dy = ty - g.beamSrc.y;
  const len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
  const nx = -uy, ny = ux;
  ctx.fillStyle = col.css;
  ctx.beginPath();
  ctx.moveTo(g.beamSrc.x + nx * bw, g.beamSrc.y + ny * bw);
  ctx.lineTo(tx + nx * bw * 0.7, ty + ny * bw * 0.7);
  ctx.lineTo(tx - nx * bw * 0.7, ty - ny * bw * 0.7);
  ctx.lineTo(g.beamSrc.x - nx * bw, g.beamSrc.y - ny * bw);
  ctx.closePath(); ctx.fill();
  // photon dots on the beam
  ctx.fillStyle = col.dot;
  for (const p of photons) {
    const px = g.beamSrc.x + dx * p.s, py = g.beamSrc.y + dy * p.s;
    ctx.beginPath(); ctx.arc(px, py, 3.2, 0, Math.PI * 2); ctx.fill();
  }
  drawTextWithBg(ctx, '빛 (' + col.name + ', λ = ' + lambdaNm().toFixed(0) + ' nm)',
    g.beamSrc.x + dx * 0.35, g.beamSrc.y + dy * 0.35 - 22, '#8B0029', 'bold 12.5px sans-serif');

  // --- metal plate (emitter) ---
  ctx.fillStyle = '#F3F4F6';
  ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 2;
  ctx.fillRect(g.plateX - g.plateW, g.plateY0, g.plateW, g.plateY1 - g.plateY0);
  ctx.strokeRect(g.plateX - g.plateW, g.plateY0, g.plateW, g.plateY1 - g.plateY0);
  ctx.fillStyle = '#8B0029';
  ctx.fillRect(g.plateX - 4, g.plateY0, 4, g.plateY1 - g.plateY0);
  drawTextWithBg(ctx, METALS[state.metal].name + ' (Φ = ' + phi().toFixed(2) + ' eV)',
    g.plateX - g.plateW / 2, g.plateY1 + 18, '#1a1a1a', 'bold 12.5px sans-serif');

  // --- collector ---
  ctx.fillStyle = '#dbe5f8';
  ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 2;
  ctx.fillRect(g.collX, g.plateY0, g.collW, g.plateY1 - g.plateY0);
  ctx.strokeRect(g.collX, g.plateY0, g.collW, g.plateY1 - g.plateY0);
  drawTextWithBg(ctx, '컬렉터', g.collX + g.collW / 2, g.plateY1 + 18, '#2563EB', 'bold 12.5px sans-serif');

  // --- retarding field arrow between plates (if V > 0) ---
  if (state.volt > 0.01) {
    const fy = g.plateY0 - 16;
    ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1.5;
    const ax0 = g.collX - 8, ax1 = g.plateX + 40;
    ctx.beginPath(); ctx.moveTo(ax0, fy); ctx.lineTo(ax1 + 8, fy); ctx.stroke();
    ctx.fillStyle = '#6B7280';
    ctx.beginPath();
    ctx.moveTo(ax1, fy); ctx.lineTo(ax1 + 10, fy - 4); ctx.lineTo(ax1 + 10, fy + 4);
    ctx.closePath(); ctx.fill();
    drawTextWithBg(ctx, '전기력 (감속 V = ' + state.volt.toFixed(2) + ' V)',
      (ax0 + ax1) / 2, fy - 13, '#6B7280', '11.5px sans-serif');
  }

  // --- electrons ---
  const gap0 = g.plateX, gap1 = g.collX;
  for (const e of electrons) {
    const ex = gap0 + (gap1 - gap0) * Math.max(0, e.s);
    const ey = g.plateY0 + (g.plateY1 - g.plateY0) * e.y;
    ctx.fillStyle = e.dir > 0 ? '#2563EB' : '#93b4f0';
    ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('−', ex, ey + 0.5);
  }

  // --- current meter bar (bottom) ---
  const i = current(), imax = 1.0;
  const mbX = CW * 0.20, mbW = CW * 0.55, mbY = CH * 0.915, mbH = 12;
  ctx.fillStyle = '#F3F4F6'; ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1.5;
  ctx.fillRect(mbX, mbY, mbW, mbH); ctx.strokeRect(mbX, mbY, mbW, mbH);
  ctx.fillStyle = i > 0 ? '#8B0029' : '#d1d5db';
  ctx.fillRect(mbX + 1.5, mbY + 1.5, Math.max(0, (mbW - 3) * Math.min(1, i / imax)), mbH - 3);
  drawTextWithBg(ctx, '광전류 i ' + (i > 0 ? '' : '= 0'), mbX - 12, mbY + mbH / 2, '#1a1a1a', 'bold 12px sans-serif', 'right');

  // --- overlays (KaTeX labels) ---
  const lblK = document.getElementById('lblKmax');
  const lblP = document.getElementById('lblPhoton');
  if (emitting()) {
    lblK.style.display = 'block';
    lblK.style.left = (gap0 + (gap1 - gap0) * 0.5) + 'px';
    lblK.style.top = (g.plateY0 - (state.volt > 0.01 ? 48 : 18)) + 'px';
    lblK.innerHTML = tex('K_{max} = hf - \\Phi = ' + kmax().toFixed(2) + '\\ \\text{eV}');
  } else {
    lblK.style.display = 'none';
  }
  lblP.style.left = (g.beamSrc.x + dx * 0.62) + 'px';
  lblP.style.top = (g.beamSrc.y + dy * 0.62 - 20) + 'px';
  lblP.innerHTML = tex('E_{photon} = hf = ' + hf().toFixed(2) + '\\ \\text{eV}');

  // --- no-emission banner ---
  const banner = document.getElementById('noEmitBanner');
  if (!emitting()) {
    banner.style.display = 'block';
    banner.innerHTML = 'f &lt; f<sub>0</sub> = ' + f0_14().toFixed(2) + '&times;10<sup>14</sup> Hz<br>'
      + '광자 한 개의 에너지 hf &lt; &Phi; &rarr; <u>세기를 아무리 높여도</u> 전자가 나오지 않는다!';
  } else {
    banner.style.display = 'none';
  }
}

// ---------- K_max vs f graph (control panel) ----------
function drawGraph() {
  const W = gcan.width, H = gcan.height;
  gctx.clearRect(0, 0, W, H);
  const padL = 30, padR = 10, padT = 12, padB = 26;
  const pw = W - padL - padR, ph = H - padT - padB;
  const fmin = 3, fmax = 15, KmaxAxis = 4.5;
  const X = f => padL + (f - fmin) / (fmax - fmin) * pw;
  const Y = K => padT + ph - Math.min(K, KmaxAxis) / KmaxAxis * ph;
  // axes
  gctx.strokeStyle = '#9ca3af'; gctx.lineWidth = 1;
  gctx.beginPath();
  gctx.moveTo(padL, padT); gctx.lineTo(padL, padT + ph); gctx.lineTo(padL + pw, padT + ph);
  gctx.stroke();
  gctx.fillStyle = '#6B7280'; gctx.font = '9.5px sans-serif';
  gctx.textAlign = 'left'; gctx.textBaseline = 'top';
  gctx.fillText('K_max (eV)', padL - 26, 0);
  gctx.textAlign = 'right'; gctx.textBaseline = 'bottom';
  gctx.fillText('f (10¹⁴ Hz)', W - 2, H - 1);
  // ticks
  gctx.textAlign = 'center'; gctx.textBaseline = 'top';
  for (const f of [4, 8, 12]) {
    gctx.fillText(String(f), X(f), padT + ph + 3);
    gctx.beginPath(); gctx.moveTo(X(f), padT + ph); gctx.lineTo(X(f), padT + ph + 3); gctx.stroke();
  }
  gctx.textAlign = 'right'; gctx.textBaseline = 'middle';
  for (const K of [2, 4]) gctx.fillText(String(K), padL - 4, Y(K));
  const f0 = f0_14();
  // K = 0 segment then line hf - phi
  gctx.strokeStyle = '#8B0029'; gctx.lineWidth = 2;
  gctx.beginPath();
  gctx.moveTo(X(fmin), Y(0));
  gctx.lineTo(X(Math.min(f0, fmax)), Y(0));
  if (f0 < fmax) {
    const fend = fmax, Kend = H_EVS * fend * 1e14 - phi();
    gctx.lineTo(X(fend), Y(Kend));
  }
  gctx.stroke();
  // cutoff marker
  if (f0 >= fmin && f0 <= fmax) {
    gctx.fillStyle = '#8B0029';
    gctx.beginPath(); gctx.arc(X(f0), Y(0), 3.2, 0, Math.PI * 2); gctx.fill();
    gctx.font = 'bold 10px sans-serif'; gctx.textAlign = 'center'; gctx.textBaseline = 'bottom';
    gctx.fillText('f₀ = ' + f0.toFixed(1), X(f0), Y(0) - 5);
  }
  // slope note
  gctx.fillStyle = '#6B7280'; gctx.font = 'italic 9.5px sans-serif';
  gctx.textAlign = 'left'; gctx.textBaseline = 'top';
  gctx.fillText('기울기 = h', padL + 6, padT + 2);
  // current operating point
  const fc = state.f14, Kc = kmax();
  gctx.fillStyle = '#2563EB';
  gctx.beginPath(); gctx.arc(X(fc), Y(Kc), 4, 0, Math.PI * 2); gctx.fill();
  gctx.strokeStyle = '#fff'; gctx.lineWidth = 1.2; gctx.stroke();
  gctx.strokeStyle = 'rgba(37,99,235,0.45)'; gctx.lineWidth = 1;
  gctx.setLineDash([3, 2]);
  gctx.beginPath(); gctx.moveTo(X(fc), Y(Kc)); gctx.lineTo(X(fc), Y(0)); gctx.stroke();
  gctx.setLineDash([]);
}

// ---------- panel text ----------
function renderStatic() {
  document.getElementById('canvasTitle').innerHTML =
    '광전효과: 광자 <b>한 개</b>가 전자 <b>한 개</b>에게 에너지를 전달 &mdash; ' + tex('hf = K_{max} + \\Phi');
  document.getElementById('theoremBox').innerHTML =
    '광전 방정식 (에너지 보존)<br>' + tex('hf = K_{max} + \\Phi') + '<br>' +
    '<span style="font-size:10.5px;font-weight:400">' +
    tex('h = 4.14\\times10^{-15}\\ \\text{eV}\\cdot\\text{s} = 6.63\\times10^{-34}\\ \\text{J}\\cdot\\text{s}') + '</span>';
  document.getElementById('graphTitle').innerHTML =
    tex('K_{max} = hf - \\Phi') + ' 그래프';
  document.getElementById('formulaBox').innerHTML =
    '<b>세기&uarr;</b> = 광자 수&uarr; &rarr; 전자 수&uarr; (에너지 불변)<br>' +
    '<b>진동수&uarr;</b> = 광자 에너지&uarr; &rarr; ' + tex('K_{max}') + '&uarr;<br>' +
    '<b>문턱:</b> ' + tex('f_0 = \\Phi/h') + ' 미만이면 전자 없음<br>' +
    '<b>정지 전압:</b> ' + tex('eV_{stop} = K_{max}');
}

function updateInfo() {
  const box = document.getElementById('infoBox');
  const K = kmax(), i = current();
  let rows = '';
  rows += '<span class="label">광자 에너지</span> <span class="val">hf = ' + hf().toFixed(2) + ' eV</span><br>';
  rows += '<span class="label">일함수</span> <span class="val">&Phi; = ' + phi().toFixed(2) + ' eV</span><br>';
  if (emitting()) {
    rows += '<span class="label">최대 운동에너지</span> <span class="val" style="color:#2563EB">K<sub>max</sub> = ' + K.toFixed(2) + ' eV</span><br>';
    rows += '<span class="label">정지 전압</span> <span class="val">V<sub>stop</sub> = ' + K.toFixed(2) + ' V</span><br>';
    if (state.volt >= K) {
      rows += '<span class="val" style="color:#8B0029">V &ge; V<sub>stop</sub> &rarr; 전류 차단 (i = 0)</span>';
    } else {
      rows += '<span class="label">광전류</span> <span class="val">i = ' + (i * 100).toFixed(0) + ' (임의 단위)</span>';
    }
  } else {
    rows += '<span class="val" style="color:#8B0029">hf &lt; &Phi; &rarr; 광전자 방출 없음 (i = 0)</span>';
  }
  box.innerHTML = rows;
}

// ---------- controls ----------
const freqSlider = document.getElementById('freqSlider');
const intSlider = document.getElementById('intSlider');
const voltSlider = document.getElementById('voltSlider');
const metalSel = document.getElementById('metalSel');

function refreshControls() {
  document.getElementById('freqVal').textContent = state.f14.toFixed(1);
  document.getElementById('lamVal').textContent = lambdaNm().toFixed(0);
  document.getElementById('intVal').textContent = state.intensity;
  document.getElementById('voltVal').textContent = state.volt.toFixed(2);
  updateInfo(); drawGraph();
}
freqSlider.addEventListener('input', () => {
  state.f14 = parseFloat(freqSlider.value);
  if (!emitting()) electrons = [];
  refreshControls();
});
intSlider.addEventListener('input', () => { state.intensity = parseInt(intSlider.value); refreshControls(); });
voltSlider.addEventListener('input', () => { state.volt = parseFloat(voltSlider.value); refreshControls(); });
metalSel.addEventListener('change', () => { state.metal = metalSel.value; electrons = []; refreshControls(); });
document.getElementById('resetBtn').addEventListener('click', () => {
  state.metal = 'Na'; state.f14 = 7.0; state.intensity = 60; state.volt = 0;
  metalSel.value = 'Na'; freqSlider.value = 7; intSlider.value = 60; voltSlider.value = 0;
  electrons = []; photons = [];
  refreshControls();
});

// ---------- main loop ----------
function loop(t) {
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000; lastT = t;
  if (dt > 0.1) dt = 0.1;
  if (CW < 20) resize();      // lazy init inside iframe
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

renderStatic();
refreshControls();
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
