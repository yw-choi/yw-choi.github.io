<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전기장: 중첩과 힘선</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root { --red:#8B0029; --blue:#2563EB; --ink:#171717; --gray:#6B7280; --line:#D1D5DB; }
* { box-sizing:border-box; }
html,body { width:100%; height:100%; margin:0; }
body { overflow:hidden; background:#fff; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.app { display:flex; width:100%; height:100%; min-height:0; }
.stage { position:relative; flex:1 1 auto; min-width:0; background:#fff; touch-action:none; }
canvas { display:block; width:100%; height:100%; cursor:default; }
.controls { flex:0 0 248px; width:248px; padding:20px 18px; border-left:1px solid var(--line); overflow:auto; }
h1 { margin:0; color:var(--red); font-size:20px; line-height:1.25; letter-spacing:-.02em; }
.formula { min-height:37px; margin:9px 0 18px; font-size:17px; line-height:1.5; white-space:nowrap; }
.label { display:block; margin:0 0 7px; color:var(--gray); font-size:15px; font-weight:650; }
.segmented { display:grid; grid-template-columns:1fr 1fr; margin:0 0 18px; border:1px solid var(--ink); }
.segmented button { min-height:40px; padding:0 5px; border:0; border-right:1px solid var(--ink); border-radius:0; background:#fff; color:var(--ink); font:650 15px/1 inherit; cursor:pointer; }
.segmented button:last-child { border-right:0; }
.segmented button[aria-pressed="true"] { background:var(--ink); color:#fff; }
.control { margin:0 0 17px; }
.control label { display:flex; justify-content:space-between; gap:8px; margin-bottom:8px; font-size:15px; font-weight:650; }
.control output { font-variant-numeric:tabular-nums; }
input[type="range"] { display:block; width:100%; margin:0; accent-color:var(--red); }
.readout { display:grid; grid-template-columns:auto 1fr; gap:8px 12px; margin:20px 0 11px; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:15px; }
.readout dt { color:var(--gray); }
.readout dd { margin:0; text-align:right; font-weight:650; font-variant-numeric:tabular-nums; }
.topology { min-height:42px; margin:0 0 15px; color:var(--gray); font-size:15px; line-height:1.45; }
.reset { width:100%; min-height:42px; border:1px solid var(--ink); border-radius:2px; background:#fff; color:var(--ink); font:650 15px/1 inherit; cursor:pointer; }
.reset:hover { border-color:var(--red); color:var(--red); }
button:focus-visible,input:focus-visible { position:relative; z-index:1; outline:3px solid rgba(37,99,235,.28); outline-offset:2px; }
.sr-only { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
@media (max-width:700px) {
  .app { flex-direction:column; }
  .stage { flex:0 0 60%; min-height:275px; }
  .controls { flex:1 1 auto; width:100%; padding:14px 18px 18px; border-left:0; border-top:1px solid var(--line); }
  h1 { font-size:19px; }
  .formula { margin:5px 0 10px; font-size:16px; }
  .segmented { margin-bottom:11px; }
  .control { margin-bottom:11px; }
  .readout { margin:12px 0 8px; padding:9px 0; }
  .topology { min-height:0; margin-bottom:9px; }
}
@media (max-width:390px) {
  .stage { flex-basis:57%; min-height:250px; }
  .segmented button { min-height:38px; }
}
</style>
</head>
<body>
<main class="app">
  <section class="stage" id="stage">
    <canvas id="canvas" aria-label="두 점전하와 측정점 P를 직접 끌어 전기장 중첩과 전기력선을 확인하는 시뮬레이션"></canvas>
    <span class="sr-only">기본 상태는 크기가 같은 양전하와 음전하로 이루어진 전기쌍극자다.</span>
  </section>
  <aside class="controls" aria-label="시뮬레이션 조절">
    <h1>전기장: 중첩과 힘선</h1>
    <div class="formula" id="formula"></div>

    <span class="label">표시</span>
    <div class="segmented" id="mode" role="group" aria-label="전기장 표시 방식">
      <button type="button" data-value="lines" aria-pressed="true">힘선</button>
      <button type="button" data-value="vectors" aria-pressed="false">벡터</button>
    </div>

    <div class="control">
      <label for="q1"><span>전하 <i>q</i><sub>1</sub></span><output id="q1Out">+3.0 μC</output></label>
      <input id="q1" type="range" min="-5" max="5" step="0.5" value="3">
    </div>
    <div class="control">
      <label for="q2"><span>전하 <i>q</i><sub>2</sub></span><output id="q2Out">−3.0 μC</output></label>
      <input id="q2" type="range" min="-5" max="5" step="0.5" value="-3">
    </div>

    <dl class="readout">
      <dt><i>E</i><sub>x</sub></dt><dd id="exOut">0 N/C</dd>
      <dt><i>E</i><sub>y</sub></dt><dd id="eyOut">0 N/C</dd>
      <dt>|<i>E</i>|</dt><dd id="magOut">0 N/C</dd>
    </dl>
    <p class="topology" id="topology">총전하 0 · 힘선은 +에서 나와 −로 들어감</p>
    <button class="reset" id="reset" type="button">기본 쌍극자</button>
  </aside>
</main>

<script>
(() => {
  'use strict';
  const K=8.99e9;
  const MICRO=1e-6;
  const RED='#8B0029';
  const BLUE='#2563EB';
  const INK='#171717';
  const GRAY='#6B7280';
  const LIGHT='#D1D5DB';
  const WORLD={xmin:-1.6,xmax:1.6,ymin:-1.05,ymax:1.05};
  const TRACE_LIMIT=6;
  const canvas=document.getElementById('canvas');
  const stage=document.getElementById('stage');
  const ctx=canvas.getContext('2d');
  const q1Input=document.getElementById('q1');
  const q2Input=document.getElementById('q2');
  const state={
    charges:[{x:-.52,y:0,q:3},{x:.52,y:0,q:-3}],
    probe:{x:0,y:.58},
    mode:'lines',
    drag:-1,
    hover:-1,
    width:0,
    height:0,
    dpr:1
  };
  let transform=null;

  function renderTex(expression) {
    const target=document.getElementById('formula');
    if (window.katex) target.innerHTML=katex.renderToString(expression,{throwOnError:false});
    else target.textContent='E(r) = Σ Ei(r)';
  }

  function pointFieldSI(charges,point) {
    let Ex=0,Ey=0;
    for (const charge of charges) {
      if (!charge.q_C) continue;
      const dx=point.x_m-charge.x_m;
      const dy=point.y_m-charge.y_m;
      const r2=dx*dx+dy*dy;
      if (r2===0) return {Ex:NaN,Ey:NaN,magnitude:Infinity};
      const r=Math.sqrt(r2);
      const scale=K*charge.q_C/(r2*r);
      Ex+=scale*dx;
      Ey+=scale*dy;
    }
    return {Ex,Ey,magnitude:Math.hypot(Ex,Ey)};
  }

  function chargesSI() {
    return state.charges.map(c=>({x_m:c.x,y_m:c.y,q_C:c.q*MICRO}));
  }

  function fieldAt(x,y) {
    return pointFieldSI(chargesSI(),{x_m:x,y_m:y});
  }

  function fieldLineBudget(chargesMicro) {
    const units=chargesMicro.map(q=>Math.round(Math.abs(q)*3));
    let positive=0,negative=0;
    chargesMicro.forEach((q,i)=>{if(q>0) positive+=units[i]; else if(q<0) negative+=units[i];});
    return {
      positive,
      negative,
      toInfinity:Math.max(0,positive-negative),
      fromInfinity:Math.max(0,negative-positive)
    };
  }

  function layout() {
    const pad=26;
    const sx=(state.width-pad*2)/(WORLD.xmax-WORLD.xmin);
    const sy=(state.height-pad*2)/(WORLD.ymax-WORLD.ymin);
    const scale=Math.max(1,Math.min(sx,sy));
    const usedW=scale*(WORLD.xmax-WORLD.xmin);
    const usedH=scale*(WORLD.ymax-WORLD.ymin);
    transform={left:(state.width-usedW)/2,top:(state.height-usedH)/2,width:usedW,height:usedH};
  }

  function worldToScreen(x,y) {
    return {
      x:transform.left+(x-WORLD.xmin)/(WORLD.xmax-WORLD.xmin)*transform.width,
      y:transform.top+(WORLD.ymax-y)/(WORLD.ymax-WORLD.ymin)*transform.height
    };
  }

  function screenToWorld(x,y) {
    return {
      x:WORLD.xmin+(x-transform.left)/transform.width*(WORLD.xmax-WORLD.xmin),
      y:WORLD.ymax-(y-transform.top)/transform.height*(WORLD.ymax-WORLD.ymin)
    };
  }

  function line(x1,y1,x2,y2,color,width,dash=[]) {
    ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
  }

  function arrowHead(x,y,angle,color,size=8) {
    ctx.save(); ctx.fillStyle=color; ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x-size*Math.cos(angle-.43),y-size*Math.sin(angle-.43));
    ctx.lineTo(x-size*Math.cos(angle+.43),y-size*Math.sin(angle+.43));
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function arrow(x1,y1,x2,y2,color,width=2) {
    line(x1,y1,x2,y2,color,width);
    arrowHead(x2,y2,Math.atan2(y2-y1,x2-x1),color,9);
  }

  function textBg(text,x,y,options={}) {
    const size=options.size||15;
    ctx.save();
    ctx.font=`${options.weight||600} ${size}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
    ctx.textAlign=options.align||'center'; ctx.textBaseline='middle';
    const w=ctx.measureText(text).width;
    let left=x-w/2-4;
    if (ctx.textAlign==='left') left=x-4;
    if (ctx.textAlign==='right') left=x-w-4;
    ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fillRect(left,y-size*.65-2,w+8,size+5);
    ctx.fillStyle=options.color||INK; ctx.fillText(text,x,y); ctx.restore();
  }

  function insideWorld(p,margin=0) {
    return p.x>=WORLD.xmin-margin&&p.x<=WORLD.xmax+margin&&p.y>=WORLD.ymin-margin&&p.y<=WORLD.ymax+margin;
  }

  function traceLine(start,direction,sourceIndex) {
    const points=[{x:start.x,y:start.y}];
    let x=start.x,y=start.y;
    let ending='limit';
    for (let step=0;step<2400;step++) {
      const f1=fieldAt(x,y);
      if (!Number.isFinite(f1.magnitude)||f1.magnitude<1e-7) break;
      const ux=direction*f1.Ex/f1.magnitude;
      const uy=direction*f1.Ey/f1.magnitude;
      const h=.014;
      const mid={x:x+ux*h*.5,y:y+uy*h*.5};
      const fm=fieldAt(mid.x,mid.y);
      if (!Number.isFinite(fm.magnitude)||fm.magnitude<1e-7) break;
      x+=direction*fm.Ex/fm.magnitude*h;
      y+=direction*fm.Ey/fm.magnitude*h;
      points.push({x,y});
      if (step>5) {
        for (let i=0;i<state.charges.length;i++) {
          if (i===sourceIndex) continue;
          const c=state.charges[i];
          if (c.q===0) continue;
          if (Math.hypot(x-c.x,y-c.y)<.065) {ending='charge'; return {points,ending};}
        }
      }
      if (Math.abs(x)>TRACE_LIMIT||Math.abs(y)>TRACE_LIMIT) {ending='infinity'; break;}
    }
    return {points,ending};
  }

  function fieldLines() {
    const lines=[];
    const budget=fieldLineBudget(state.charges.map(c=>c.q));
    const positives=state.charges.map((charge,index)=>({...charge,index})).filter(charge=>charge.q>0);
    let remainingCharge=Math.min(budget.positive,budget.negative);
    let remainingInfinity=budget.toInfinity;
    let remainingPositive=budget.positive;
    positives.forEach((charge,sourceNumber)=>{
      const count=Math.round(Math.abs(charge.q)*3);
      let targetCharge=sourceNumber===positives.length-1
        ? remainingCharge
        : Math.min(count,Math.round(remainingCharge*count/Math.max(1,remainingPositive)));
      let targetInfinity=count-targetCharge;
      if (targetInfinity>remainingInfinity) {
        const transfer=targetInfinity-remainingInfinity;
        targetInfinity-=transfer;
        targetCharge+=transfer;
      }
      let acceptedCharge=0,acceptedInfinity=0;
      const maxAttempts=Math.max(36,count*48);
      for (let attempt=0;attempt<maxAttempts&&(acceptedCharge<targetCharge||acceptedInfinity<targetInfinity);attempt++) {
        const angle=(attempt*2.399963229728653+.19)%(2*Math.PI);
        const start={x:charge.x+.07*Math.cos(angle),y:charge.y+.07*Math.sin(angle)};
        const traced=traceLine(start,1,charge.index);
        if (traced.ending==='charge'&&acceptedCharge<targetCharge) {
          lines.push({points:traced.points,ending:'charge'}); acceptedCharge++;
        } else if (traced.ending==='infinity'&&acceptedInfinity<targetInfinity) {
          lines.push({points:traced.points,ending:'infinity'}); acceptedInfinity++;
        }
      }
      remainingCharge-=acceptedCharge;
      remainingInfinity-=acceptedInfinity;
      remainingPositive-=count;
    });
    if (budget.fromInfinity>0) {
      const negatives=state.charges.map((c,i)=>({...c,index:i})).filter(c=>c.q<0);
      const totalWeight=negatives.reduce((sum,c)=>sum+Math.abs(c.q),0);
      let remaining=budget.fromInfinity;
      negatives.forEach((charge,j)=>{
        const count=j===negatives.length-1?remaining:Math.round(budget.fromInfinity*Math.abs(charge.q)/totalWeight);
        remaining-=count;
        let accepted=0;
        const maxAttempts=Math.max(24,count*24);
        for (let attempt=0;attempt<maxAttempts&&accepted<count;attempt++) {
          const angle=(attempt*2.399963229728653+.41)%(2*Math.PI);
          const start={x:charge.x+.07*Math.cos(angle),y:charge.y+.07*Math.sin(angle)};
          const traced=traceLine(start,-1,charge.index);
          if (traced.ending!=='infinity') continue;
          lines.push({points:traced.points.slice().reverse(),ending:'from-infinity'});
          accepted++;
        }
      });
    }
    return lines;
  }

  function drawFieldLines() {
    ctx.save();
    ctx.beginPath();
    ctx.rect(transform.left,transform.top,transform.width,transform.height);
    ctx.clip();
    for (const traced of fieldLines()) {
      const visible=traced.points.filter(p=>insideWorld(p,.03));
      if (visible.length<2) continue;
      ctx.strokeStyle=INK; ctx.lineWidth=1.25; ctx.beginPath();
      visible.forEach((p,i)=>{
        const s=worldToScreen(p.x,p.y);
        if (i===0) ctx.moveTo(s.x,s.y); else ctx.lineTo(s.x,s.y);
      });
      ctx.stroke();
      const index=Math.min(visible.length-2,Math.max(1,Math.floor(visible.length*.55)));
      const a=worldToScreen(visible[index-1].x,visible[index-1].y);
      const b=worldToScreen(visible[index+1].x,visible[index+1].y);
      arrowHead(b.x,b.y,Math.atan2(b.y-a.y,b.x-a.x),INK,7);
    }
    ctx.restore();
  }

  function drawVectorField() {
    const nx=state.width<440?7:10;
    const ny=state.height<400?5:7;
    for (let iy=0;iy<ny;iy++) {
      for (let ix=0;ix<nx;ix++) {
        const x=WORLD.xmin+.12+(WORLD.xmax-WORLD.xmin-.24)*ix/(nx-1);
        const y=WORLD.ymin+.12+(WORLD.ymax-WORLD.ymin-.24)*iy/(ny-1);
        if (state.charges.some(c=>Math.hypot(x-c.x,y-c.y)<.18)) continue;
        const f=fieldAt(x,y);
        if (!Number.isFinite(f.magnitude)||f.magnitude===0) continue;
        const p=worldToScreen(x,y);
        const length=12+11*Math.min(1,Math.log10(1+f.magnitude)/6);
        arrow(p.x,p.y,p.x+f.Ex/f.magnitude*length,p.y-f.Ey/f.magnitude*length,GRAY,1.25);
      }
    }
  }

  function drawCharge(charge,index) {
    const p=worldToScreen(charge.x,charge.y);
    const radius=22;
    const color=charge.q>=0?RED:BLUE;
    ctx.save();
    ctx.fillStyle=charge.q===0?'#fff':color; ctx.strokeStyle=charge.q===0?GRAY:color;
    ctx.lineWidth=state.hover===index||state.drag===index?3:2;
    ctx.beginPath(); ctx.arc(p.x,p.y,radius,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=charge.q===0?GRAY:'#fff';
    ctx.font='700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(charge.q>0?'+':charge.q<0?'−':'0',p.x,p.y-1);
    ctx.restore();
    textBg(`q${index+1}`,p.x,p.y+35,{size:15,color,weight:700});
  }

  function drawProbe() {
    const p=worldToScreen(state.probe.x,state.probe.y);
    const f=fieldAt(state.probe.x,state.probe.y);
    const nearCharge=state.charges.some(c=>Math.hypot(state.probe.x-c.x,state.probe.y-c.y)<.25);
    ctx.save();
    ctx.fillStyle='#fff'; ctx.strokeStyle=BLUE; ctx.lineWidth=state.hover===2||state.drag===2?3:2;
    ctx.beginPath(); ctx.arc(p.x,p.y,8,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
    textBg('P',p.x,p.y+(nearCharge?-22:22),{size:15,color:BLUE,weight:700});
    if (Number.isFinite(f.magnitude)&&f.magnitude>0) {
      const length=30+24*Math.min(1,Math.log10(1+f.magnitude)/6);
      arrow(p.x,p.y,p.x+f.Ex/f.magnitude*length,p.y-f.Ey/f.magnitude*length,BLUE,2.5);
    }
  }

  function drawScale() {
    const a=worldToScreen(WORLD.xmin+.12,WORLD.ymin+.1);
    const b=worldToScreen(WORLD.xmin+.62,WORLD.ymin+.1);
    line(a.x,a.y,b.x,b.y,INK,2);
    line(a.x,a.y-4,a.x,a.y+4,INK,1);
    line(b.x,b.y-4,b.x,b.y+4,INK,1);
    textBg('0.5 m',(a.x+b.x)/2,a.y-14,{size:15,color:GRAY});
  }

  function formatField(value) {
    const absolute=Math.abs(value);
    if (absolute===0) return '0 N/C';
    if (absolute>=1e4||absolute<1) return `${value.toExponential(2)} N/C`;
    return `${Math.round(value).toLocaleString('en-US')} N/C`;
  }

  function updateControls() {
    const f=fieldAt(state.probe.x,state.probe.y);
    const signed=value=>`${value>0?'+':value<0?'−':''}${Math.abs(value).toFixed(1)} μC`;
    document.getElementById('q1Out').textContent=signed(state.charges[0].q);
    document.getElementById('q2Out').textContent=signed(state.charges[1].q);
    document.getElementById('exOut').textContent=formatField(f.Ex);
    document.getElementById('eyOut').textContent=formatField(f.Ey);
    document.getElementById('magOut').textContent=formatField(f.magnitude);
    const total=state.charges[0].q+state.charges[1].q;
    document.getElementById('topology').textContent=total===0
      ? '총전하 0 · 힘선은 +에서 나와 −로 들어감'
      : total>0
        ? '총전하 > 0 · 남는 힘선은 무한대로 나감'
        : '총전하 < 0 · 남는 힘선은 무한대에서 들어옴';
  }

  function draw() {
    if (!state.width||!state.height) return;
    ctx.clearRect(0,0,state.width,state.height);
    layout();
    if (state.mode==='lines') drawFieldLines(); else drawVectorField();
    state.charges.forEach(drawCharge);
    drawProbe();
    drawScale();
    updateControls();
  }

  let frame=0;
  function requestDraw() {
    if (frame) return;
    frame=requestAnimationFrame(()=>{frame=0;draw();});
  }

  function resize() {
    const rect=stage.getBoundingClientRect();
    if (!rect.width||!rect.height) return;
    state.width=rect.width; state.height=rect.height; state.dpr=Math.max(1,window.devicePixelRatio||1);
    canvas.width=Math.round(state.width*state.dpr); canvas.height=Math.round(state.height*state.dpr);
    canvas.style.width=`${state.width}px`; canvas.style.height=`${state.height}px`;
    ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
    draw();
  }

  function pointerPosition(event) {
    const rect=canvas.getBoundingClientRect();
    return {x:event.clientX-rect.left,y:event.clientY-rect.top};
  }

  function hitItem(p) {
    const candidates=[
      ...state.charges.map((c,i)=>({index:i,...worldToScreen(c.x,c.y)})),
      {index:2,...worldToScreen(state.probe.x,state.probe.y)}
    ];
    let best=-1,distance=Infinity;
    candidates.forEach(item=>{
      const d=Math.hypot(p.x-item.x,p.y-item.y);
      if (d<30&&d<distance) {best=item.index;distance=d;}
    });
    return best;
  }

  function moveItem(index,p) {
    const world=screenToWorld(p.x,p.y);
    const margin=.09;
    let x=Math.max(WORLD.xmin+margin,Math.min(WORLD.xmax-margin,world.x));
    let y=Math.max(WORLD.ymin+margin,Math.min(WORLD.ymax-margin,world.y));
    if (index<2) {
      const other=state.charges[1-index];
      const dx=x-other.x,dy=y-other.y,r=Math.hypot(dx,dy);
      if (r<.17) {
        const ux=r>1e-6?dx/r:(index===0?-1:1),uy=r>1e-6?dy/r:0;
        x=other.x+ux*.17; y=other.y+uy*.17;
      }
      state.charges[index].x=x; state.charges[index].y=y;
    } else {
      state.probe.x=x; state.probe.y=y;
    }
  }

  canvas.addEventListener('pointerdown',event=>{
    const hit=hitItem(pointerPosition(event));
    if (hit<0) return;
    state.drag=hit; state.hover=hit; canvas.setPointerCapture(event.pointerId); canvas.style.cursor='grabbing';
    event.preventDefault(); requestDraw();
  });
  canvas.addEventListener('pointermove',event=>{
    const p=pointerPosition(event);
    if (state.drag>=0) {moveItem(state.drag,p);requestDraw();return;}
    state.hover=hitItem(p); canvas.style.cursor=state.hover>=0?'grab':'default'; requestDraw();
  });
  function endDrag(event) {
    if (state.drag>=0&&canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    state.drag=-1; canvas.style.cursor=state.hover>=0?'grab':'default'; requestDraw();
  }
  canvas.addEventListener('pointerup',endDrag);
  canvas.addEventListener('pointercancel',endDrag);
  canvas.addEventListener('pointerleave',()=>{if(state.drag<0){state.hover=-1;canvas.style.cursor='default';requestDraw();}});

  document.getElementById('mode').addEventListener('click',event=>{
    const button=event.target.closest('button[data-value]');
    if (!button) return;
    state.mode=button.dataset.value;
    document.querySelectorAll('#mode button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
    draw();
  });
  function syncCharges() {
    state.charges[0].q=Number(q1Input.value);
    state.charges[1].q=Number(q2Input.value);
    draw();
  }
  q1Input.addEventListener('input',syncCharges);
  q2Input.addEventListener('input',syncCharges);
  document.getElementById('reset').addEventListener('click',()=>{
    state.charges=[{x:-.52,y:0,q:3},{x:.52,y:0,q:-3}];
    state.probe={x:0,y:.58}; state.mode='lines';
    q1Input.value='3'; q2Input.value='-3';
    document.querySelectorAll('#mode button').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.value==='lines')));
    draw();
  });

  function runValidation() {
    const single=pointFieldSI([{x_m:0,y_m:0,q_C:1e-6}],{x_m:1,y_m:0});
    const checkpoint=pointFieldSI([{x_m:0,y_m:0,q_C:2e-6}],{x_m:.5,y_m:0});
    const symmetricLike=pointFieldSI([{x_m:-.5,y_m:0,q_C:2e-6},{x_m:.5,y_m:0,q_C:2e-6}],{x_m:0,y_m:0});
    const dipole=pointFieldSI([{x_m:-.5,y_m:0,q_C:3e-6},{x_m:.5,y_m:0,q_C:-3e-6}],{x_m:0,y_m:0});
    const equalBudget=fieldLineBudget([3,-3]);
    const positiveBudget=fieldLineBudget([3,-1]);
    const negativeBudget=fieldLineBudget([1,-3]);
    const originalCharges=state.charges.map(charge=>charge.q);
    state.charges[0].q=3; state.charges[1].q=-1;
    const actualPositiveInfinity=fieldLines().filter(line=>line.ending==='infinity').length;
    state.charges[0].q=1; state.charges[1].q=-3;
    const actualNegativeInfinity=fieldLines().filter(line=>line.ending==='from-infinity').length;
    state.charges.forEach((charge,index)=>{charge.q=originalCharges[index];});
    const tests={
      single_charge_reference:Math.abs(single.Ex-8990)<1e-9&&Math.abs(single.Ey)<1e-12,
      checkpoint_2uC_at_0_5m:Math.abs(checkpoint.Ex-71920)<1e-9&&Math.abs(checkpoint.Ey)<1e-12,
      equal_like_midpoint_zero:Math.abs(symmetricLike.Ex)<1e-12&&Math.abs(symmetricLike.Ey)<1e-12,
      dipole_midpoint_direction:dipole.Ex>0&&Math.abs(dipole.Ey)<1e-12,
      neutral_topology:equalBudget.toInfinity===0&&equalBudget.fromInfinity===0,
      positive_to_infinity:positiveBudget.toInfinity>0&&positiveBudget.fromInfinity===0,
      negative_from_infinity:negativeBudget.fromInfinity>0&&negativeBudget.toInfinity===0,
      traced_positive_surplus:actualPositiveInfinity>=positiveBudget.toInfinity,
      traced_negative_surplus:actualNegativeInfinity===negativeBudget.fromInfinity
    };
    const pass=Object.values(tests).every(Boolean);
    document.body.dataset.physicsValidated=pass?'pass':'fail';
    return {pass,tests,reference:{q_2uC_r_0_5m_E_N_per_C:checkpoint.Ex,equal_like_midpoint_E_N_per_C:symmetricLike.magnitude,dipole_midpoint_Ex_N_per_C:dipole.Ex,traced_positive_to_infinity:actualPositiveInfinity,traced_negative_from_infinity:actualNegativeInfinity}};
  }
  window.__physicsValidation={
    constants:{k_N_m2_per_C2:K},
    pointField:pointFieldSI,
    fieldLineBudget,
    run:runValidation
  };
  window.__simulationState=state;
  renderTex(String.raw`\vec E(\vec r)=k\sum_i q_i\frac{\vec r-\vec r_i}{|\vec r-\vec r_i|^3}`);
  runValidation();
  new ResizeObserver(resize).observe(stage);
  window.addEventListener('load',resize,{once:true});
})();
</script>
</body>
</html>
