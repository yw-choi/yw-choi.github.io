<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>정전기 유도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root { --red:#8B0029; --blue:#2563EB; --ink:#171717; --gray:#6B7280; --line:#D1D5DB; --light:#F3F4F6; }
* { box-sizing:border-box; }
html,body { width:100%; height:100%; margin:0; }
body { overflow:hidden; background:#fff; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.app { display:flex; width:100%; height:100%; min-height:0; }
.stage { position:relative; flex:1 1 auto; min-width:0; background:#fff; touch-action:none; }
canvas { display:block; width:100%; height:100%; cursor:default; }
.controls { flex:0 0 248px; width:248px; padding:20px 18px; border-left:1px solid var(--line); overflow:auto; }
h1 { margin:0; color:var(--red); font-size:20px; line-height:1.25; letter-spacing:-.02em; }
.formula { min-height:37px; margin:9px 0 18px; font-size:18px; line-height:1.5; white-space:nowrap; }
.label { display:block; margin:0 0 7px; color:var(--gray); font-size:15px; font-weight:650; }
.segmented { display:grid; grid-template-columns:1fr 1fr; margin:0 0 17px; border:1px solid var(--ink); }
.segmented button { min-height:40px; padding:0 5px; border:0; border-right:1px solid var(--ink); border-radius:0; background:#fff; color:var(--ink); font:650 15px/1 inherit; cursor:pointer; }
.segmented button:last-child { border-right:0; }
.segmented button[aria-pressed="true"] { background:var(--ink); color:#fff; }
.segmented button:focus-visible, .action:focus-visible { position:relative; z-index:1; outline:3px solid rgba(37,99,235,.28); outline-offset:2px; }
.readout { display:grid; grid-template-columns:auto 1fr; gap:9px 12px; margin:20px 0 11px; padding:15px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:15px; }
.readout dt { color:var(--gray); }
.readout dd { margin:0; text-align:right; font-weight:650; }
.qualitative { margin:0 0 16px; color:var(--gray); font-size:15px; line-height:1.45; }
.action { width:100%; min-height:44px; border:1px solid var(--red); border-radius:2px; background:var(--red); color:#fff; font:700 15px/1 inherit; cursor:pointer; }
.action:hover:not(:disabled) { background:#a3003a; }
.action:disabled { border-color:var(--line); background:#fff; color:var(--gray); cursor:not-allowed; }
.sr-only { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
@media (max-width:700px) {
  .app { flex-direction:column; }
  .stage { flex:0 0 62%; min-height:285px; }
  .controls { flex:1 1 auto; width:100%; padding:14px 18px 18px; border-left:0; border-top:1px solid var(--line); }
  h1 { font-size:19px; }
  .formula { margin:6px 0 11px; }
  .label { margin-bottom:5px; }
  .segmented { margin-bottom:11px; }
  .readout { margin:12px 0 8px; padding:9px 0; }
  .qualitative { margin-bottom:10px; }
}
@media (max-width:390px) {
  .stage { flex-basis:58%; min-height:255px; }
  .segmented button { min-height:38px; }
}
</style>
</head>
<body>
<main class="app">
  <section class="stage" id="stage">
    <canvas id="canvas" aria-label="막대를 끌어 도체와 부도체의 전하 재배치를 비교하는 정전기 유도 시뮬레이션"></canvas>
    <span class="sr-only">막대를 가까이 가져간 뒤 접지 연결, 접지 끊기, 막대 제거 순서로 조작한다.</span>
  </section>
  <aside class="controls" aria-label="시뮬레이션 조절">
    <h1>정전기 유도</h1>
    <div class="formula" id="formula"></div>

    <span class="label">물질</span>
    <div class="segmented" id="material" role="group" aria-label="물질 선택">
      <button type="button" data-value="conductor" aria-pressed="true">도체</button>
      <button type="button" data-value="insulator" aria-pressed="false">부도체</button>
    </div>

    <span class="label">막대 전하</span>
    <div class="segmented" id="rodSign" role="group" aria-label="막대 전하 부호">
      <button type="button" data-value="1" aria-pressed="true">+</button>
      <button type="button" data-value="-1" aria-pressed="false">−</button>
    </div>

    <dl class="readout">
      <dt>현재 단계</dt><dd id="phaseOut">막대 접근</dd>
      <dt>물체의 순전하</dt><dd id="chargeOut">0</dd>
    </dl>
    <p class="qualitative">정성 모형 · 점 개수는 전하량 축척 아님</p>
    <button class="action" id="action" type="button" disabled>막대를 가까이 이동</button>
  </aside>
</main>

<script>
(() => {
  'use strict';
  const RED='#8B0029';
  const BLUE='#2563EB';
  const INK='#171717';
  const GRAY='#6B7280';
  const LIGHT='#F3F4F6';
  const WORLD={xmin:-1.6,xmax:1.6,ymin:-1,ymax:1};
  const ROD_RANGE={far:-1.34,near:-.58};
  const NEAR_THRESHOLD=-.88;
  const canvas=document.getElementById('canvas');
  const stage=document.getElementById('stage');
  const ctx=canvas.getContext('2d');
  const state={
    material:'conductor',
    rodSign:1,
    rodX:ROD_RANGE.far,
    phase:'approach',
    drag:false,
    hover:false,
    width:0,
    height:0,
    dpr:1
  };
  let transform=null;

  function renderTex(expression) {
    const target=document.getElementById('formula');
    if (window.katex) target.innerHTML=katex.renderToString(expression,{throwOnError:false});
    else target.textContent='Qnet = Σ qsurface';
  }

  function isNear(snapshot=state) {
    return snapshot.rodX>=NEAR_THRESHOLD&&snapshot.phase!=='removed';
  }

  function modelState({material,rodSign,phase,rodNear=true}) {
    const conductor=material==='conductor';
    const rodPresent=phase!=='removed';
    const grounded=conductor&&phase==='grounded';
    let netCharge=0;
    if (conductor&&(phase==='grounded'||phase==='isolated'||phase==='removed')) netCharge=-Math.sign(rodSign||1);
    return {
      material,
      phase,
      rodSign:Math.sign(rodSign||1),
      rodNear:Boolean(rodNear&&rodPresent),
      rodPresent,
      grounded,
      netCharge,
      mobileCharge:conductor
    };
  }

  function transition(phase,action,options={}) {
    const material=options.material||'conductor';
    const rodNear=Boolean(options.rodNear);
    if (action==='reset') return 'approach';
    if (material!=='conductor') return phase;
    if (phase==='approach'&&action==='connect'&&rodNear) return 'grounded';
    if (phase==='grounded'&&action==='disconnect') return 'isolated';
    if (phase==='isolated'&&action==='remove') return 'removed';
    return phase;
  }

  function layout() {
    const pad=26;
    const sx=(state.width-pad*2)/(WORLD.xmax-WORLD.xmin);
    const sy=(state.height-pad*2)/(WORLD.ymax-WORLD.ymin);
    const scale=Math.max(1,Math.min(sx,sy));
    const usedW=scale*(WORLD.xmax-WORLD.xmin);
    const usedH=scale*(WORLD.ymax-WORLD.ymin);
    transform={left:(state.width-usedW)/2,top:(state.height-usedH)/2,width:usedW,height:usedH};
  }

  function worldToScreen(x,y) {
    return {
      x:transform.left+(x-WORLD.xmin)/(WORLD.xmax-WORLD.xmin)*transform.width,
      y:transform.top+(WORLD.ymax-y)/(WORLD.ymax-WORLD.ymin)*transform.height
    };
  }

  function screenToWorldX(x) {
    return WORLD.xmin+(x-transform.left)/transform.width*(WORLD.xmax-WORLD.xmin);
  }

  function line(x1,y1,x2,y2,color,width,dash=[]) {
    ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
  }

  function textBg(text,x,y,options={}) {
    const size=options.size||15;
    ctx.save();
    ctx.font=`${options.weight||600} ${size}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
    ctx.textAlign=options.align||'center'; ctx.textBaseline='middle';
    const w=ctx.measureText(text).width;
    let left=x-w/2-4;
    if (ctx.textAlign==='left') left=x-4;
    if (ctx.textAlign==='right') left=x-w-4;
    ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fillRect(left,y-size*.65-2,w+8,size+5);
    ctx.fillStyle=options.color||INK; ctx.fillText(text,x,y); ctx.restore();
  }

  function drawCharge(x,y,sign,radius=9) {
    const color=sign>0?RED:BLUE;
    ctx.save();
    ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font=`700 ${Math.max(13,radius*1.6)}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(sign>0?'+':'−',x,y-.5); ctx.restore();
  }

  function ellipsePoint(cx,cy,rx,ry,angle) {
    return {x:cx+rx*Math.cos(angle),y:cy+ry*Math.sin(angle)};
  }

  function drawGround(x,y) {
    line(x,y,x,y+38,INK,2);
    line(x-18,y+38,x+18,y+38,INK,2);
    line(x-12,y+45,x+12,y+45,INK,2);
    line(x-6,y+52,x+6,y+52,INK,2);
  }

  function drawRod() {
    const p=worldToScreen(state.rodX,0);
    const top=worldToScreen(state.rodX,.48).y;
    const bottom=worldToScreen(state.rodX,-.48).y;
    const color=state.rodSign>0?RED:BLUE;
    ctx.save();
    ctx.strokeStyle=color; ctx.lineWidth=28; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(p.x,top); ctx.lineTo(p.x,bottom); ctx.stroke();
    ctx.strokeStyle=state.hover||state.drag?INK:'#fff'; ctx.lineWidth=state.hover||state.drag?2:1;
    ctx.beginPath(); ctx.moveTo(p.x,top); ctx.lineTo(p.x,bottom); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    [-.3,0,.3].forEach(y=>ctx.fillText(state.rodSign>0?'+':'−',p.x,worldToScreen(state.rodX,y).y));
    ctx.restore();
    textBg(state.phase==='approach'?'끌어서 접근':'막대 유지',p.x,top-22,{size:15,color:GRAY});
  }

  function drawConductor(model) {
    const center=worldToScreen(.42,0);
    const edgeX=worldToScreen(.42+.58,0).x-center.x;
    const edgeY=center.y-worldToScreen(.42,.43).y;
    ctx.save();
    ctx.fillStyle=LIGHT; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(center.x,center.y,edgeX,edgeY,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
    textBg('도체',center.x,center.y,{size:16,color:GRAY,weight:650});

    if (model.phase==='approach') {
      const count=4+Math.round(proximity()*6);
      for (let i=0;i<count;i++) {
        const t=(i+.5)/count;
        const nearAngle=Math.PI/2+Math.PI*t;
        const farAngle=-Math.PI/2+Math.PI*t;
        const near=ellipsePoint(center.x,center.y,edgeX,edgeY,nearAngle);
        const far=ellipsePoint(center.x,center.y,edgeX,edgeY,farAngle);
        drawCharge(near.x,near.y,-state.rodSign,8);
        drawCharge(far.x,far.y,state.rodSign,8);
      }
    } else if (model.phase==='grounded'||model.phase==='isolated') {
      const count=11;
      for (let i=0;i<count;i++) {
        const spread=.14*Math.PI+.72*Math.PI*(i+.5)/count;
        const angle=Math.PI/2+spread;
        const p=ellipsePoint(center.x,center.y,edgeX,edgeY,angle);
        drawCharge(p.x,p.y,-state.rodSign,8);
      }
    } else {
      const count=12;
      for (let i=0;i<count;i++) {
        const p=ellipsePoint(center.x,center.y,edgeX,edgeY,Math.PI*2*(i+.5)/count);
        drawCharge(p.x,p.y,-state.rodSign,8);
      }
    }

    if (model.grounded) drawGround(center.x,center.y+edgeY);
  }

  function drawInsulator() {
    const center=worldToScreen(.42,0);
    const edgeX=worldToScreen(.42+.58,0).x-center.x;
    const edgeY=center.y-worldToScreen(.42,.43).y;
    ctx.save();
    ctx.fillStyle='#fff'; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(center.x,center.y,edgeX,edgeY,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
    const shift=-state.rodSign*(2+5*proximity());
    for (let row=0;row<3;row++) {
      for (let col=0;col<5;col++) {
        const wx=.42-.39+col*.195;
        const wy=.24-row*.24;
        const p=worldToScreen(wx,wy);
        ctx.save();
        ctx.fillStyle='rgba(37,99,235,.20)'; ctx.strokeStyle=BLUE; ctx.lineWidth=1.3;
        ctx.beginPath(); ctx.arc(p.x+shift,p.y,10,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.restore();
        drawCharge(p.x,p.y,1,5.5);
      }
    }
    textBg('부도체 · 국소 분극',center.x,center.y+edgeY+24,{size:15,color:GRAY});
  }

  function proximity() {
    if (state.phase==='removed') return 0;
    return Math.max(0,Math.min(1,(state.rodX-ROD_RANGE.far)/(ROD_RANGE.near-ROD_RANGE.far)));
  }

  function phaseLabel() {
    if (state.material==='insulator') return isNear()?'국소 분극':'막대 접근';
    return {approach:isNear()?'접지 준비':'막대 접근',grounded:'접지 연결',isolated:'접지 끊김',removed:'막대 제거'}[state.phase];
  }

  function drawSequence() {
    const labels=['접근','접지','분리','제거'];
    const index=state.phase==='approach'?0:state.phase==='grounded'?1:state.phase==='isolated'?2:3;
    const y=28;
    const totalWidth=Math.min(state.width-42,380);
    const start=(state.width-totalWidth)/2;
    const gap=totalWidth/(labels.length-1);
    line(start,y,start+totalWidth,y,'#D1D5DB',1);
    labels.forEach((label,i)=>{
      const x=start+i*gap;
      ctx.fillStyle=i===index?RED:'#fff'; ctx.strokeStyle=i===index?RED:GRAY; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill(); ctx.stroke();
      textBg(label,x,y+23,{size:15,color:i===index?RED:GRAY,weight:i===index?700:500});
    });
  }

  function updateControls(model) {
    document.getElementById('phaseOut').textContent=phaseLabel();
    document.getElementById('chargeOut').textContent=model.netCharge===0?'0':model.netCharge>0?'> 0':'< 0';
    const button=document.getElementById('action');
    if (state.material==='insulator') {
      button.textContent='부도체 · 접지 불가'; button.disabled=true;
    } else if (state.phase==='approach') {
      button.textContent=isNear()?'접지 연결':'막대를 가까이 이동'; button.disabled=!isNear();
    } else if (state.phase==='grounded') {
      button.textContent='접지 끊기'; button.disabled=false;
    } else if (state.phase==='isolated') {
      button.textContent='막대 제거'; button.disabled=false;
    } else {
      button.textContent='처음부터'; button.disabled=false;
    }
  }

  function draw() {
    if (!state.width||!state.height) return;
    ctx.clearRect(0,0,state.width,state.height);
    layout();
    drawSequence();
    const model=modelState({material:state.material,rodSign:state.rodSign,phase:state.phase,rodNear:isNear()});
    if (state.material==='conductor') drawConductor(model); else drawInsulator();
    if (state.phase!=='removed') drawRod();
    textBg('정성 모형',24,state.height-22,{size:15,color:GRAY,align:'left'});
    updateControls(model);
  }

  function resize() {
    const rect=stage.getBoundingClientRect();
    if (!rect.width||!rect.height) return;
    state.width=rect.width; state.height=rect.height; state.dpr=Math.max(1,window.devicePixelRatio||1);
    canvas.width=Math.round(state.width*state.dpr); canvas.height=Math.round(state.height*state.dpr);
    canvas.style.width=`${state.width}px`; canvas.style.height=`${state.height}px`;
    ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
    draw();
  }

  function pointerPosition(event) {
    const rect=canvas.getBoundingClientRect();
    return {x:event.clientX-rect.left,y:event.clientY-rect.top};
  }

  function hitRod(p) {
    if (state.phase!=='approach') return false;
    const rod=worldToScreen(state.rodX,0);
    const top=worldToScreen(state.rodX,.55).y;
    const bottom=worldToScreen(state.rodX,-.55).y;
    return Math.abs(p.x-rod.x)<34&&p.y>top-18&&p.y<bottom+18;
  }

  canvas.addEventListener('pointerdown',event=>{
    if (!hitRod(pointerPosition(event))) return;
    state.drag=true; state.hover=true; canvas.setPointerCapture(event.pointerId); canvas.style.cursor='grabbing';
    event.preventDefault(); draw();
  });
  canvas.addEventListener('pointermove',event=>{
    const p=pointerPosition(event);
    if (state.drag) {
      state.rodX=Math.max(ROD_RANGE.far,Math.min(ROD_RANGE.near,screenToWorldX(p.x)));
      draw(); return;
    }
    state.hover=hitRod(p); canvas.style.cursor=state.hover?'grab':'default'; draw();
  });
  function endDrag(event) {
    if (state.drag&&canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    state.drag=false; canvas.style.cursor=state.hover?'grab':'default'; draw();
  }
  canvas.addEventListener('pointerup',endDrag);
  canvas.addEventListener('pointercancel',endDrag);
  canvas.addEventListener('pointerleave',()=>{if(!state.drag){state.hover=false;canvas.style.cursor='default';draw();}});

  function select(group,value) {
    document.querySelectorAll(`#${group} button`).forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.value===String(value))));
  }

  document.getElementById('material').addEventListener('click',event=>{
    const button=event.target.closest('button[data-value]');
    if (!button) return;
    state.material=button.dataset.value; state.phase='approach'; state.rodX=ROD_RANGE.far;
    select('material',state.material); draw();
  });
  document.getElementById('rodSign').addEventListener('click',event=>{
    const button=event.target.closest('button[data-value]');
    if (!button) return;
    state.rodSign=Number(button.dataset.value); state.phase='approach'; state.rodX=ROD_RANGE.far;
    select('rodSign',state.rodSign); draw();
  });
  document.getElementById('action').addEventListener('click',()=>{
    if (state.phase==='approach') state.phase=transition(state.phase,'connect',{material:state.material,rodNear:isNear()});
    else if (state.phase==='grounded') state.phase=transition(state.phase,'disconnect',{material:state.material,rodNear:isNear()});
    else if (state.phase==='isolated') state.phase=transition(state.phase,'remove',{material:state.material,rodNear:isNear()});
    else {state.phase=transition(state.phase,'reset',{material:state.material,rodNear:false}); state.rodX=ROD_RANGE.far;}
    draw();
  });

  function getState() {
    return {...modelState({material:state.material,rodSign:state.rodSign,phase:state.phase,rodNear:isNear()}),rodX_m:state.rodX};
  }

  function runValidation() {
    const neutral=modelState({material:'conductor',rodSign:1,phase:'approach',rodNear:true});
    const plusGround=modelState({material:'conductor',rodSign:1,phase:'grounded',rodNear:true});
    const minusGround=modelState({material:'conductor',rodSign:-1,phase:'grounded',rodNear:true});
    const plusIsolated=modelState({material:'conductor',rodSign:1,phase:'isolated',rodNear:true});
    const plusRemoved=modelState({material:'conductor',rodSign:1,phase:'removed',rodNear:false});
    const minusIsolated=modelState({material:'conductor',rodSign:-1,phase:'isolated',rodNear:true});
    const minusRemoved=modelState({material:'conductor',rodSign:-1,phase:'removed',rodNear:false});
    const insulated=modelState({material:'insulator',rodSign:1,phase:'grounded',rodNear:true});
    const sequence1=transition('approach','connect',{material:'conductor',rodNear:true});
    const sequence2=transition(sequence1,'disconnect',{material:'conductor',rodNear:true});
    const sequence3=transition(sequence2,'remove',{material:'conductor',rodNear:true});
    const tests={
      neutral_induction:neutral.netCharge===0,
      grounded_opposes_rod:plusGround.netCharge===-1&&minusGround.netCharge===1,
      charge_persists_after_disconnect:plusIsolated.netCharge===-1&&minusIsolated.netCharge===1,
      charge_persists_after_rod_removal:plusRemoved.netCharge===-1&&minusRemoved.netCharge===1,
      correct_sequence:sequence1==='grounded'&&sequence2==='isolated'&&sequence3==='removed',
      no_early_ground:transition('approach','connect',{material:'conductor',rodNear:false})==='approach',
      insulator_conserves_charge:insulated.netCharge===0&&transition('approach','connect',{material:'insulator',rodNear:true})==='approach'
    };
    const pass=Object.values(tests).every(Boolean);
    document.body.dataset.physicsValidated=pass?'pass':'fail';
    return {pass,tests};
  }
  window.__physicsValidation={modelState,transition,getState,run:runValidation};
  renderTex(String.raw`Q_{\mathrm{net}}=\sum_i q_i`);
  runValidation();
  new ResizeObserver(resize).observe(stage);
  window.addEventListener('load',resize,{once:true});
})();
</script>
</body>
</html>
