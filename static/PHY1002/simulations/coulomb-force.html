<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿨롱 힘 놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; overflow: hidden; }
.container { display: flex; height: 100vh; }
.canvas-area { flex: 1; position: relative; background: #fafafa; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.controls { width: 260px; padding: 16px; border-left: 2px solid #eee; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.controls h2 { color: #8B0029; font-size: 15px; margin-bottom: 0; }
.subtitle { color: #888; font-size: 11px; margin-bottom: 4px; }
.control-group { display: flex; flex-direction: column; gap: 3px; }
.control-group label { font-size: 12.5px; font-weight: 600; color: #444; }
.control-group input[type="range"] { width: 100%; accent-color: #8B0029; }
.q1pos { accent-color: #8B0029; }
.q2neg { accent-color: #2563EB; }
.info-box { background: #f8f0f2; border: 1px solid #e0c0c8; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.9; }
.info-box .label { color: #8B0029; font-weight: 700; }
.info-box .val { font-weight: 700; }
.info-box .katex { font-size: 12px; }
.theorem-box { background: #8B0029; color: #fff; border-radius: 8px; padding: 10px; font-size: 13px; text-align: center; font-weight: 700; line-height: 1.6; }
.theorem-box .katex { color: #fff; font-size: 14px; }
.formula-box { background: #f9f0f2; border: 1px solid rgba(139,0,41,0.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 2.0; color: #555; }
.formula-box b { color: #8B0029; }
.formula-box .katex { font-size: 12px; }
button.reset-btn { background: #8B0029; color: #fff; border: none; border-radius: 6px; padding: 9px; font-size: 13px; cursor: pointer; font-weight: 600; }
button.reset-btn:hover { background: #a3003a; }
.canvas-title { position: absolute; top: 8px; left: 16px; right: 16px; pointer-events: none; font-size: 14px; font-weight: 700; color: #8B0029; line-height: 1.4; }
.hint { position: absolute; bottom: 8px; left: 16px; pointer-events: none; font-size: 11px; color: #6B7280; }
.relation-box { background: #eef3fe; border: 1px solid #c3d4f5; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.8; color: #2b4a8b; }
.relation-box .katex { font-size: 12px; }
.relation-box b { color: #1a3a7a; }

.canvas-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; overflow: hidden;
}
.canvas-overlay .katex-label {
  position: absolute; white-space: nowrap; font-size: 13px; line-height: 1;
  pointer-events: none; transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.85); padding: 1px 5px; border-radius: 4px;
}
.canvas-overlay .katex-label .katex { font-size: 0.95em; }

@media (max-width: 700px) {
  .container { flex-direction: column; }
  .canvas-area { height: 55vh; }
  .controls { width: 100%; height: 45vh; border-left: none; border-top: 2px solid #eee; }
}
</style>
</head>
<body>
<div class="container">
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="canvas-overlay" id="overlay">
      <div class="katex-label" id="lblF1" style="color:#8B0029;font-weight:bold;"></div>
      <div class="katex-label" id="lblF2" style="color:#8B0029;font-weight:bold;"></div>
      <div class="katex-label" id="lblR" style="color:#6B7280;"></div>
    </div>
    <div class="canvas-title" id="canvasTitle"></div>
    <div class="hint">두 전하를 마우스(또는 손가락)로 끌어보세요</div>
  </div>
  <div class="controls">
    <div>
      <h2>쿨롱 힘 놀이터</h2>
      <div class="subtitle">Coulomb's Law (Ch.21)</div>
    </div>

    <div class="theorem-box" id="theoremBox"></div>

    <div class="control-group">
      <label>전하 q<sub>1</sub> = <span id="q1Val">+3.0</span> μC</label>
      <input type="range" id="q1Slider" min="-5" max="5" value="3" step="0.5">
    </div>

    <div class="control-group">
      <label>전하 q<sub>2</sub> = <span id="q2Val">-3.0</span> μC</label>
      <input type="range" id="q2Slider" min="-5" max="5" value="-3" step="0.5">
    </div>

    <div class="info-box" id="infoBox"></div>

    <div class="relation-box" id="relationBox"></div>

    <div class="formula-box" id="formulaBox"></div>

    <button class="reset-btn" id="resetBtn">&#8635; 기본값 복원</button>
  </div>
</div>

<script>
function tex(expr) { return katex.renderToString(expr, { throwOnError: false, displayMode: false }); }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
let dpr = window.devicePixelRatio || 1;
let CW, CH;

const q1Slider = document.getElementById('q1Slider');
const q2Slider = document.getElementById('q2Slider');
const resetBtn = document.getElementById('resetBtn');

// Physics constants
const k = 8.99e9;          // N·m²/C²
const MICRO = 1e-6;        // μC -> C
const M_PER_PX = 0.0025;   // 1 canvas px = 2.5 mm  => 100 px = 0.25 m

// Charge state: position stored in screen pixels (canvas-local)
// Initialized properly in resetPositions() once canvas size known.
const charge = [
  { x: 0, y: 0, q: parseFloat(q1Slider.value) },  // q1
  { x: 0, y: 0, q: parseFloat(q2Slider.value) },  // q2
];

let dragIdx = -1;
let positionsInit = false;

function resetPositions() {
  charge[0].x = CW * 0.34;
  charge[0].y = CH * 0.5;
  charge[1].x = CW * 0.66;
  charge[1].y = CH * 0.5;
  positionsInit = true;
}

function clampInside() {
  for (const c of charge) {
    const r = chargeRadius(c.q);
    c.x = Math.max(r + 6, Math.min(CW - r - 6, c.x));
    c.y = Math.max(r + 6, Math.min(CH - r - 6, c.y));
  }
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  CW = rect.width; CH = rect.height;
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!positionsInit) resetPositions();
  clampInside();
  draw();
}

function chargeRadius(q) {
  return 16 + Math.abs(q) * 2.6;   // scale slightly with |q|
}

// Returns force magnitude (N), separation r (m), unit vector from c0 -> c1
function computeForce() {
  const dx = charge[1].x - charge[0].x;
  const dy = charge[1].y - charge[0].y;
  const distPx = Math.hypot(dx, dy);
  const r = Math.max(distPx * M_PER_PX, 1e-4);
  const q1 = charge[0].q * MICRO;
  const q2 = charge[1].q * MICRO;
  const F = k * Math.abs(q1) * Math.abs(q2) / (r * r);
  const ux = distPx > 1e-6 ? dx / distPx : 1;
  const uy = distPx > 1e-6 ? dy / distPx : 0;
  // product sign: >0 repulsive (same sign), <0 attractive (opposite)
  const prod = charge[0].q * charge[1].q;
  return { F, r, distPx, ux, uy, prod };
}

function drawArrow(x1, y1, x2, y2, color, lw) {
  const headLen = 11;
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  // stop the shaft short of the head so the tip is crisp
  ctx.lineTo(x2 - (headLen - 2) * Math.cos(angle), y2 - (headLen - 2) * Math.sin(angle));
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - 0.42), y2 - headLen * Math.sin(angle - 0.42));
  ctx.lineTo(x2 - headLen * Math.cos(angle + 0.42), y2 - headLen * Math.sin(angle + 0.42));
  ctx.closePath(); ctx.fill();
}

function draw() {
  if (!positionsInit) return;
  ctx.clearRect(0, 0, CW, CH);

  const { F, r, distPx, ux, uy, prod } = computeForce();

  // --- connecting line between charges ---
  ctx.strokeStyle = 'rgba(107,114,128,0.5)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.moveTo(charge[0].x, charge[0].y);
  ctx.lineTo(charge[1].x, charge[1].y);
  ctx.stroke();
  ctx.setLineDash([]);

  // --- force arrows (only when both charges are nonzero) ---
  const bothNonZero = Math.abs(charge[0].q) > 1e-6 && Math.abs(charge[1].q) > 1e-6;
  let clamped = false;
  if (bothNonZero && distPx > 1) {
    // Map F (N) to arrow length (px), log-scaled, clamped.
    const maxLen = Math.min(CW, CH) * 0.32;
    const minLen = 22;
    // F can span many orders of magnitude; use log scaling.
    let len = 36 * Math.log10(1 + F / 1e-3);
    if (len > maxLen) { len = maxLen; clamped = true; }
    if (len < minLen) len = minLen;

    // direction of force ON charge 0:
    //   repulsive (prod>0): away from charge1  => -u (u points 0->1)
    //   attractive(prod<0): toward charge1     => +u
    const sign0 = prod > 0 ? -1 : 1;   // along u (0->1) for force on charge0
    // force on charge1 is exactly opposite => -sign0
    // Newton's 3rd law: same |len|, opposite direction.

    const f0x = sign0 * ux, f0y = sign0 * uy;
    const f1x = -sign0 * ux, f1y = -sign0 * uy;

    const r0 = chargeRadius(charge[0].q);
    const r1 = chargeRadius(charge[1].q);

    // arrow on charge 0 starts at its edge along the force direction
    const a0sx = charge[0].x + f0x * (r0 + 2);
    const a0sy = charge[0].y + f0y * (r0 + 2);
    const a0ex = a0sx + f0x * len;
    const a0ey = a0sy + f0y * len;

    const a1sx = charge[1].x + f1x * (r1 + 2);
    const a1sy = charge[1].y + f1y * (r1 + 2);
    const a1ex = a1sx + f1x * len;
    const a1ey = a1sy + f1y * len;

    drawArrow(a0sx, a0sy, a0ex, a0ey, '#8B0029', 3);
    drawArrow(a1sx, a1sy, a1ex, a1ey, '#8B0029', 3);

    // store arrow tip positions for overlay labels
    draw._lblF1 = { x: a0ex, y: a0ey, fx: f0x, fy: f0y };
    draw._lblF2 = { x: a1ex, y: a1ey, fx: f1x, fy: f1y };
  } else {
    draw._lblF1 = null;
    draw._lblF2 = null;
  }

  // --- charges ---
  drawCharge(charge[0], 'q_1');
  drawCharge(charge[1], 'q_2');

  positionLabels(F, r, distPx, clamped, bothNonZero);
  updateInfo(F, r, prod, bothNonZero, clamped);
}

function drawCharge(c, name) {
  const r = chargeRadius(c.q);
  const isPos = c.q > 1e-6;
  const isNeg = c.q < -1e-6;

  // glow
  const grad = ctx.createRadialGradient(c.x, c.y, r * 0.2, c.x, c.y, r);
  if (isPos) {
    grad.addColorStop(0, '#c4234f');
    grad.addColorStop(1, '#8B0029');
  } else if (isNeg) {
    grad.addColorStop(0, '#5b8cf5');
    grad.addColorStop(1, '#2563EB');
  } else {
    grad.addColorStop(0, '#d1d5db');
    grad.addColorStop(1, '#9ca3af');
  }
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // sign symbol
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const sym = isPos ? '+' : (isNeg ? '−' : '0');
  ctx.font = 'bold ' + Math.round(r * 1.25) + 'px sans-serif';
  ctx.fillText(sym, c.x, c.y + 1);

  // name label below
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 13px sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText(name === 'q_1' ? 'q₁' : 'q₂', c.x, c.y + r + 5);
  ctx.textBaseline = 'alphabetic';
}

// Place KaTeX labels (force magnitudes + r) avoiding overlap with charges & each other.
function positionLabels(F, r, distPx, clamped, bothNonZero) {
  const lblF1 = document.getElementById('lblF1');
  const lblF2 = document.getElementById('lblF2');
  const lblR = document.getElementById('lblR');

  // r label: midpoint of connecting line, offset perpendicular (upward-ish)
  if (bothNonZero || true) {
    const mx = (charge[0].x + charge[1].x) / 2;
    const my = (charge[0].y + charge[1].y) / 2;
    // perpendicular offset to keep it off the line
    let nx = -(charge[1].y - charge[0].y);
    let ny = (charge[1].x - charge[0].x);
    const nl = Math.hypot(nx, ny) || 1;
    nx /= nl; ny /= nl;
    const off = 20;
    lblR.style.display = 'block';
    lblR.style.left = (mx + nx * off) + 'px';
    lblR.style.top = (my + ny * off) + 'px';
    lblR.innerHTML = tex('r = ' + formatR(r));
  } else {
    lblR.style.display = 'none';
  }

  // Force magnitude labels near each arrow tip
  if (draw._lblF1 && draw._lblF2) {
    const fStr = formatF(F);
    const html = tex('F = ' + fStr) + (clamped ? '' : '');
    [ [lblF1, draw._lblF1], [lblF2, draw._lblF2] ].forEach(([el, info]) => {
      el.style.display = 'block';
      // push a bit beyond the tip along the force direction
      let lx = info.x + info.fx * 16;
      let ly = info.y + info.fy * 16;
      // keep on screen
      lx = Math.max(40, Math.min(CW - 40, lx));
      ly = Math.max(16, Math.min(CH - 16, ly));
      el.style.left = lx + 'px';
      el.style.top = ly + 'px';
      el.innerHTML = html + (clamped ? ' <span style="font-size:9px;color:#6B7280;">(화살표 길이 제한됨)</span>' : '');
    });

    // overlap check between the two force labels: if too close, nudge vertically
    const b1 = draw._lblF1, b2 = draw._lblF2;
    const px1 = parseFloat(lblF1.style.left), py1 = parseFloat(lblF1.style.top);
    const px2 = parseFloat(lblF2.style.left), py2 = parseFloat(lblF2.style.top);
    if (Math.hypot(px1 - px2, py1 - py2) < 70) {
      lblF1.style.top = (py1 - 16) + 'px';
      lblF2.style.top = (py2 + 16) + 'px';
    }
  } else {
    lblF1.style.display = 'none';
    lblF2.style.display = 'none';
  }
}

function formatR(r) {
  if (r >= 1) return r.toFixed(2) + '\\,\\text{m}';
  return (r * 100).toFixed(1) + '\\,\\text{cm}';
}

function formatF(F) {
  if (F === 0) return '0';
  const exp = Math.floor(Math.log10(F));
  if (F >= 1e-2 && F < 1e4) {
    // plain decimal in a readable range
    let v = F;
    if (F >= 1000) return (F / 1000).toFixed(2) + '\\times 10^{3}\\,\\text{N}';
    if (F >= 1) return F.toFixed(2) + '\\,\\text{N}';
    return F.toFixed(3) + '\\,\\text{N}';
  }
  const mant = (F / Math.pow(10, exp)).toFixed(2);
  return mant + '\\times 10^{' + exp + '}\\,\\text{N}';
}

function updateInfo(F, r, prod, bothNonZero, clamped) {
  const box = document.getElementById('infoBox');
  let kind, color;
  if (!bothNonZero) {
    kind = '전하 없음 (힘 = 0)'; color = '#6B7280';
  } else if (prod > 0) {
    kind = '척력 (서로 밀어냄)'; color = '#8B0029';
  } else {
    kind = '인력 (서로 끌어당김)'; color = '#2563EB';
  }

  let html = '';
  html += '<span class="label">거리</span> ' +
          '<span class="val">r = ' + (r >= 1 ? r.toFixed(3) + ' m' : (r * 100).toFixed(1) + ' cm') + '</span><br>';
  html += '<span class="label">힘의 크기</span> ' +
          '<span class="val">|F| = ' + sciN(F) + ' N</span><br>';
  html += '<span class="label">종류</span> ' +
          '<span class="val" style="color:' + color + '">' + kind + '</span>';
  if (clamped) {
    html += '<br><span style="font-size:10.5px;color:#6B7280">화살표는 최대 길이로 제한됨 (실제 |F|는 위 수치)</span>';
  }
  box.innerHTML = html;
}

// plain-text scientific notation for the info box "N" readout
function sciN(F) {
  if (F === 0) return '0';
  if (F >= 1e-2 && F < 1e4) {
    if (F >= 1) return F.toFixed(2);
    return F.toFixed(3);
  }
  const exp = Math.floor(Math.log10(F));
  const mant = (F / Math.pow(10, exp)).toFixed(2);
  return mant + '×10' + superscript(exp);
}
function superscript(n) {
  const map = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³',
                '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  return String(n).split('').map(c => map[c] || c).join('');
}

function renderStatic() {
  document.getElementById('canvasTitle').innerHTML =
    '쿨롱 법칙: 같은 부호는 <span style="color:#8B0029">척력</span>, 반대 부호는 <span style="color:#2563EB">인력</span> &mdash; 힘은 거리의 제곱에 반비례';

  document.getElementById('theoremBox').innerHTML =
    '쿨롱 법칙<br>' +
    tex('F = k\\dfrac{|q_1||q_2|}{r^2}') + '<br>' +
    '<span style="font-size:11px;font-weight:400">' + tex('k = 8.99\\times10^{9}\\ \\text{N·m}^2/\\text{C}^2') + '</span>';

  document.getElementById('formulaBox').innerHTML =
    '<b>빨강 화살표:</b> 전하에 작용하는 정전기력 ' + tex('\\vec{F}') + '<br>' +
    '<b>뉴턴 3법칙:</b> 두 힘은 크기 같고 방향 반대 ' + tex('\\vec{F}_{12} = -\\vec{F}_{21}') + '<br>' +
    '점전하 크기 ' + tex('\\propto |q|') + ', 부호로 색 구분';
}

function renderRelation() {
  // inverse-square intuition with the current state
  const { F, r } = computeForce();
  const box = document.getElementById('relationBox');
  const Fhalf = F * 4;     // r/2 -> 4F
  const Fdouble = F / 4;   // 2r  -> F/4
  box.innerHTML =
    '<b>거리의 제곱에 반비례</b><br>' +
    tex('r \\to 2r \\;\\Rightarrow\\; F \\to \\tfrac{1}{4}F') + '<br>' +
    tex('r \\to \\tfrac{1}{2}r \\;\\Rightarrow\\; F \\to 4F');
  drawMiniPlot();
}

// --- small F-vs-r curve in a tiny offscreen-ish canvas drawn into the panel ---
// We render it as an inline SVG-like canvas via the relation box image.
let miniCanvas = null;
function ensureMiniCanvas() {
  if (miniCanvas) return;
  miniCanvas = document.createElement('canvas');
  miniCanvas.width = 220; miniCanvas.height = 90;
  miniCanvas.style.width = '100%';
  miniCanvas.style.maxWidth = '220px';
  miniCanvas.style.display = 'block';
  miniCanvas.style.marginTop = '6px';
  document.getElementById('relationBox').appendChild(miniCanvas);
}
function drawMiniPlot() {
  ensureMiniCanvas();
  const mc = miniCanvas;
  const g = mc.getContext('2d');
  const W = mc.width, H = mc.height;
  g.clearRect(0, 0, W, H);
  const padL = 26, padR = 8, padT = 8, padB = 18;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  // axes
  g.strokeStyle = '#9ca3af'; g.lineWidth = 1;
  g.beginPath();
  g.moveTo(padL, padT); g.lineTo(padL, padT + plotH); g.lineTo(padL + plotW, padT + plotH);
  g.stroke();

  // F ~ 1/r^2 curve, normalized
  const { r } = computeForce();
  const rMaxView = Math.max(r * 2.2, 0.05);
  const rMin = rMaxView * 0.12;
  // value at rMin sets the top
  const fAt = (rr) => 1 / (rr * rr);
  const fTop = fAt(rMin);
  g.strokeStyle = '#8B0029'; g.lineWidth = 2;
  g.beginPath();
  let first = true;
  for (let i = 0; i <= 100; i++) {
    const rr = rMin + (rMaxView - rMin) * (i / 100);
    const px = padL + (rr / rMaxView) * plotW;
    const py = padT + plotH - (fAt(rr) / fTop) * plotH;
    if (first) { g.moveTo(px, py); first = false; } else g.lineTo(px, py);
  }
  g.stroke();

  // current point marker
  if (r >= rMin && r <= rMaxView) {
    const px = padL + (r / rMaxView) * plotW;
    const py = padT + plotH - (fAt(r) / fTop) * plotH;
    g.fillStyle = '#2563EB';
    g.beginPath(); g.arc(px, py, 4, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke();
    // dashed drop line
    g.strokeStyle = 'rgba(37,99,235,0.5)'; g.lineWidth = 1;
    g.setLineDash([3, 2]);
    g.beginPath(); g.moveTo(px, py); g.lineTo(px, padT + plotH); g.stroke();
    g.setLineDash([]);
  }

  // axis labels
  g.fillStyle = '#6B7280'; g.font = '10px sans-serif';
  g.textAlign = 'left'; g.textBaseline = 'top';
  g.fillText('F', padL - 22, padT - 2);
  g.textAlign = 'right'; g.textBaseline = 'bottom';
  g.fillText('r', padL + plotW, H - 2);
}

// ---------- dragging ----------
function eventToCanvas(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  return { x: cx, y: cy };
}

function hitTest(x, y) {
  for (let i = charge.length - 1; i >= 0; i--) {
    const c = charge[i];
    const r = chargeRadius(c.q);
    if (Math.hypot(x - c.x, y - c.y) <= r + 6) return i;
  }
  return -1;
}

function onDown(e) {
  const p = eventToCanvas(e);
  const idx = hitTest(p.x, p.y);
  if (idx >= 0) {
    dragIdx = idx;
    canvas.style.cursor = 'grabbing';
    e.preventDefault();
  }
}
function onMove(e) {
  const p = eventToCanvas(e);
  if (dragIdx >= 0) {
    charge[dragIdx].x = p.x;
    charge[dragIdx].y = p.y;
    clampInside();
    draw();
    renderRelation();
    e.preventDefault();
  } else {
    canvas.style.cursor = hitTest(p.x, p.y) >= 0 ? 'grab' : 'default';
  }
}
function onUp() {
  dragIdx = -1;
  canvas.style.cursor = 'default';
}

canvas.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onUp);

// ---------- sliders ----------
function fmtCharge(v) { return (v >= 0 ? '+' : '') + v.toFixed(1); }

q1Slider.addEventListener('input', () => {
  charge[0].q = parseFloat(q1Slider.value);
  document.getElementById('q1Val').textContent = fmtCharge(charge[0].q);
  clampInside();
  draw(); renderRelation();
});
q2Slider.addEventListener('input', () => {
  charge[1].q = parseFloat(q2Slider.value);
  document.getElementById('q2Val').textContent = fmtCharge(charge[1].q);
  clampInside();
  draw(); renderRelation();
});

resetBtn.addEventListener('click', () => {
  q1Slider.value = 3; q2Slider.value = -3;
  charge[0].q = 3; charge[1].q = -3;
  document.getElementById('q1Val').textContent = '+3.0';
  document.getElementById('q2Val').textContent = '-3.0';
  resetPositions();
  clampInside();
  draw(); renderRelation();
});

window.addEventListener('resize', resize);

renderStatic();
document.getElementById('q1Val').textContent = fmtCharge(charge[0].q);
document.getElementById('q2Val').textContent = fmtCharge(charge[1].q);
resize();
renderRelation();
</script>
