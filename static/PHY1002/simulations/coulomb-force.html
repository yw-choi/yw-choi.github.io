<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>두 전하와 쿨롱 힘</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root { --red:#8B0029; --blue:#2563EB; --ink:#171717; --gray:#6B7280; --line:#D1D5DB; }
* { box-sizing:border-box; }
html, body { width:100%; height:100%; margin:0; }
body { overflow:hidden; background:#fff; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.app { display:flex; width:100%; height:100%; min-height:0; }
.stage { position:relative; flex:1 1 auto; min-width:0; background:#fff; touch-action:none; }
canvas { display:block; width:100%; height:100%; cursor:default; }
.controls { flex:0 0 248px; width:248px; padding:20px 18px; border-left:1px solid var(--line); overflow:auto; }
h1 { margin:0; color:var(--red); font-size:20px; line-height:1.25; letter-spacing:-.02em; }
.formula { min-height:37px; margin:9px 0 20px; font-size:18px; line-height:1.5; white-space:nowrap; }
.control { margin:0 0 18px; }
.control label { display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; font-size:15px; font-weight:650; }
.control output { font-variant-numeric:tabular-nums; }
input[type="range"] { display:block; width:100%; margin:0; accent-color:var(--red); }
.readout { display:grid; grid-template-columns:auto 1fr; gap:8px 12px; margin:22px 0 18px; padding:15px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:15px; }
.readout dt { color:var(--gray); }
.readout dd { margin:0; text-align:right; font-weight:650; font-variant-numeric:tabular-nums; }
.relation { min-height:24px; margin:0 0 18px; color:var(--ink); font-size:15px; line-height:1.5; }
button { width:100%; min-height:42px; border:1px solid var(--ink); border-radius:2px; background:#fff; color:var(--ink); font:650 15px/1 inherit; cursor:pointer; }
button:hover { border-color:var(--red); color:var(--red); }
button:focus-visible, input:focus-visible { outline:3px solid rgba(37,99,235,.28); outline-offset:2px; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
@media (max-width:700px) {
  .app { flex-direction:column; }
  .stage { flex:0 0 58%; min-height:260px; }
  .controls { flex:1 1 auto; width:100%; padding:15px 18px 18px; border-left:0; border-top:1px solid var(--line); }
  h1 { font-size:19px; }
  .formula { margin:6px 0 12px; }
  .control { margin-bottom:12px; }
  .readout { margin:14px 0 12px; padding:10px 0; }
  button { min-height:40px; }
}
@media (max-width:390px) {
  .stage { flex-basis:55%; min-height:238px; }
  .controls { padding-top:12px; }
  .formula { font-size:17px; }
}
</style>
</head>
<body>
<main class="app">
  <section class="stage" id="stage">
    <canvas id="canvas" aria-label="드래그 가능한 두 전하와 쿨롱 힘의 거리 의존성 플롯"></canvas>
    <p class="sr-only" id="canvasHelp">두 전하를 끌어 거리를 바꾸면 힘 화살표와 거리-힘 플롯이 함께 바뀐다.</p>
  </section>
  <aside class="controls" aria-label="시뮬레이션 조절">
    <h1>두 전하와 쿨롱 힘</h1>
    <div class="formula" id="formula" aria-label="쿨롱 법칙"></div>

    <div class="control">
      <label for="q1"><span>전하 <i>q</i><sub>1</sub></span><output id="q1Out">+3.0 μC</output></label>
      <input id="q1" type="range" min="-5" max="5" step="0.5" value="3">
    </div>
    <div class="control">
      <label for="q2"><span>전하 <i>q</i><sub>2</sub></span><output id="q2Out">−3.0 μC</output></label>
      <input id="q2" type="range" min="-5" max="5" step="0.5" value="-3">
    </div>

    <dl class="readout">
      <dt>거리 <i>r</i></dt><dd id="rOut">1.10 m</dd>
      <dt>힘 |<i>F</i>|</dt><dd id="fOut">0.067 N</dd>
    </dl>
    <p class="relation" id="relation">인력 · 작용·반작용 크기 같음</p>
    <button id="reset" type="button">기본 배치</button>
  </aside>
</main>

<script>
(() => {
  'use strict';
  const K = 8.99e9;
  const MICRO = 1e-6;
  const RED = '#8B0029';
  const BLUE = '#2563EB';
  const INK = '#171717';
  const GRAY = '#6B7280';
  const LIGHT = '#D1D5DB';
  const WORLD = { xmin:-1.4, xmax:1.4, ymin:-0.72, ymax:0.72 };
  const PLOT = { xmin:0.2, xmax:2.8, ymin:0, ymax:6 };
  const MIN_R = 0.2;

  const canvas = document.getElementById('canvas');
  const stage = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const q1Input = document.getElementById('q1');
  const q2Input = document.getElementById('q2');
  const state = {
    charges: [
      { x:-0.55, y:0, q:Number(q1Input.value) },
      { x: 0.55, y:0, q:Number(q2Input.value) }
    ],
    drag:-1,
    hover:-1,
    width:0,
    height:0,
    dpr:1
  };
  let diagramRect = null;

  function tex(expression) {
    const target = document.getElementById('formula');
    if (window.katex) target.innerHTML = katex.renderToString(expression, { throwOnError:false });
    else target.textContent = '|F| = k |q₁q₂| / r²';
  }

  function forceMagnitudeSI(q1C, q2C, rMetres) {
    if (rMetres <= 0) return Infinity;
    return K * Math.abs(q1C*q2C) / (rMetres*rMetres);
  }

  function forceVectorSI(qSourceC, qTestC, source, test) {
    const dx=test.x-source.x;
    const dy=test.y-source.y;
    const r=Math.hypot(dx,dy);
    if (r===0) return {x:NaN,y:NaN,magnitude:Infinity};
    const signed=K*qSourceC*qTestC/(r*r);
    return {x:signed*dx/r,y:signed*dy/r,magnitude:Math.abs(signed)};
  }

  function forceMagnitude(q1Micro, q2Micro, rMetres) {
    return forceMagnitudeSI(q1Micro*MICRO,q2Micro*MICRO,rMetres);
  }

  function separation() {
    const [a,b] = state.charges;
    return Math.hypot(b.x-a.x,b.y-a.y);
  }

  function diagramLayout() {
    const top=34;
    const split=Math.max(150,Math.round(state.height*.54));
    const left=24;
    const right=state.width-24;
    const bottom=split-15;
    const sx=(right-left)/(WORLD.xmax-WORLD.xmin);
    const sy=(bottom-top)/(WORLD.ymax-WORLD.ymin);
    const scale=Math.max(1,Math.min(sx,sy));
    const usedW=scale*(WORLD.xmax-WORLD.xmin);
    const usedH=scale*(WORLD.ymax-WORLD.ymin);
    return {left:(left+right-usedW)/2,top:(top+bottom-usedH)/2,width:usedW,height:usedH,split};
  }

  function worldToScreen(x,y) {
    return {
      x:diagramRect.left+(x-WORLD.xmin)/(WORLD.xmax-WORLD.xmin)*diagramRect.width,
      y:diagramRect.top+(WORLD.ymax-y)/(WORLD.ymax-WORLD.ymin)*diagramRect.height
    };
  }

  function screenToWorld(x,y) {
    return {
      x:WORLD.xmin+(x-diagramRect.left)/diagramRect.width*(WORLD.xmax-WORLD.xmin),
      y:WORLD.ymax-(y-diagramRect.top)/diagramRect.height*(WORLD.ymax-WORLD.ymin)
    };
  }

  function chargeColor(q) { return q>=0?RED:BLUE; }
  function chargeText(q) { return q>0?'+':q<0?'−':'0'; }

  function line(x1,y1,x2,y2,color,width,dash=[]) {
    ctx.save();
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.restore();
  }

  function arrow(x1,y1,x2,y2,color,width=2.2) {
    const angle=Math.atan2(y2-y1,x2-x1);
    const head=10;
    line(x1,y1,x2,y2,color,width);
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-head*Math.cos(angle-.43),y2-head*Math.sin(angle-.43));
    ctx.lineTo(x2-head*Math.cos(angle+.43),y2-head*Math.sin(angle+.43));
    ctx.closePath(); ctx.fill();
  }

  function textWithBackground(text,x,y,options={}) {
    const size=options.size||15;
    ctx.save();
    ctx.font=`${options.weight||500} ${size}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
    ctx.textAlign=options.align||'center';
    ctx.textBaseline='middle';
    const m=ctx.measureText(text);
    const pad=4;
    let left=x-m.width/2-pad;
    if (ctx.textAlign==='left') left=x-pad;
    if (ctx.textAlign==='right') left=x-m.width-pad;
    ctx.fillStyle='rgba(255,255,255,.92)';
    ctx.fillRect(left,y-size*.62-pad/2,m.width+pad*2,size+pad);
    ctx.fillStyle=options.color||INK;
    ctx.fillText(text,x,y);
    ctx.restore();
  }

  function drawCharges() {
    const [a,b]=state.charges;
    const pa=worldToScreen(a.x,a.y);
    const pb=worldToScreen(b.x,b.y);
    const r=separation();
    line(pa.x,pa.y,pb.x,pb.y,GRAY,1,[5,5]);
    textWithBackground(`r = ${r.toFixed(2)} m`,(pa.x+pb.x)/2,(pa.y+pb.y)/2+(state.width<440?23:-15),{size:15,color:GRAY});

    const dx=b.x-a.x;
    const dy=b.y-a.y;
    const ux=dx/r;
    const uy=-dy/r;
    const magnitude=forceMagnitude(a.q,b.q,r);
    if (magnitude>0&&Number.isFinite(magnitude)) {
      const direction=a.q*b.q>0?-1:1;
      const visualLength=28+62*Math.sqrt(Math.min(1,magnitude/PLOT.ymax));
      const aDir={x:direction*ux,y:direction*uy};
      const bDir={x:-aDir.x,y:-aDir.y};
      const aStart={x:pa.x+aDir.x*25,y:pa.y+aDir.y*25};
      const aEnd={x:pa.x+aDir.x*(25+visualLength),y:pa.y+aDir.y*(25+visualLength)};
      const bStart={x:pb.x+bDir.x*25,y:pb.y+bDir.y*25};
      const bEnd={x:pb.x+bDir.x*(25+visualLength),y:pb.y+bDir.y*(25+visualLength)};
      arrow(aStart.x,aStart.y,aEnd.x,aEnd.y,RED);
      arrow(bStart.x,bStart.y,bEnd.x,bEnd.y,RED);
      if (state.width<440) {
        textWithBackground('F₁₂',(aStart.x+aEnd.x)/2,(aStart.y+aEnd.y)/2-18,{size:15,color:RED,weight:650});
        textWithBackground('F₂₁',(bStart.x+bEnd.x)/2,(bStart.y+bEnd.y)/2-18,{size:15,color:RED,weight:650});
      } else {
        const offsetA=aDir.y>.35?17:-17;
        const offsetB=bDir.y>.35?17:-17;
        textWithBackground('F₁₂',pa.x+aDir.x*(37+visualLength),pa.y+aDir.y*(37+visualLength)+offsetA,{size:15,color:RED,weight:650});
        textWithBackground('F₂₁',pb.x+bDir.x*(37+visualLength),pb.y+bDir.y*(37+visualLength)+offsetB,{size:15,color:RED,weight:650});
      }
    }

    state.charges.forEach((c,i) => {
      const p=worldToScreen(c.x,c.y);
      const radius=21;
      ctx.save();
      ctx.fillStyle=c.q===0?'#fff':chargeColor(c.q);
      ctx.strokeStyle=c.q===0?GRAY:chargeColor(c.q);
      ctx.lineWidth=state.hover===i||state.drag===i?3:2;
      ctx.beginPath(); ctx.arc(p.x,p.y,radius,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=c.q===0?GRAY:'#fff';
      ctx.font='700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(chargeText(c.q),p.x,p.y-1);
      ctx.restore();
      textWithBackground(`q${i+1}`,p.x,p.y+34,{size:15,color:chargeColor(c.q),weight:650});
    });

    ctx.fillStyle=GRAY;
    ctx.font='600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText('(a) 전하를 직접 끌어 이동',24,25);
  }

  function drawPlot() {
    const split=diagramRect.split;
    const left=state.width<440?58:66;
    const right=state.width-24;
    const top=split+28;
    const bottom=state.height-48;
    if (right-left<120||bottom-top<78) return;
    const px=r=>left+(r-PLOT.xmin)/(PLOT.xmax-PLOT.xmin)*(right-left);
    const py=f=>bottom-(f-PLOT.ymin)/(PLOT.ymax-PLOT.ymin)*(bottom-top);

    ctx.save();
    ctx.strokeStyle=INK; ctx.fillStyle=INK; ctx.lineWidth=1;
    ctx.font='14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    ctx.textBaseline='middle';
    line(left,top,left,bottom,INK,1);
    line(left,bottom,right,bottom,INK,1);
    const xTicks=state.width<440?[0.2,1.0,1.9,2.8]:[0.2,0.8,1.4,2.0,2.8];
    ctx.textAlign='center';
    xTicks.forEach(v=>{ const x=px(v); line(x,bottom,x,bottom+5,INK,1); ctx.fillText(v.toFixed(1),x,bottom+17); });
    const yTicks=[0,2,4,6];
    ctx.textAlign='right';
    yTicks.forEach(v=>{ const y=py(v); line(left-5,y,left,y,INK,1); ctx.fillText(String(v),left-9,y); });
    ctx.textAlign='center'; ctx.fillText('r (m)',(left+right)/2,state.height-15);
    ctx.save(); ctx.translate(18,(top+bottom)/2); ctx.rotate(-Math.PI/2); ctx.fillText('|F| (N)',0,0); ctx.restore();

    const a=state.charges[0],b=state.charges[1];
    ctx.strokeStyle=RED; ctx.lineWidth=2; ctx.beginPath();
    for (let i=0;i<=180;i++) {
      const r=PLOT.xmin+(PLOT.xmax-PLOT.xmin)*i/180;
      const f=Math.min(PLOT.ymax,forceMagnitude(a.q,b.q,r));
      const x=px(r),y=py(f);
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();

    const currentR=separation();
    if (currentR>=PLOT.xmin&&currentR<=PLOT.xmax) {
      const currentF=Math.min(PLOT.ymax,forceMagnitude(a.q,b.q,currentR));
      const x=px(currentR),y=py(currentF);
      line(x,bottom,x,y,LIGHT,1,[4,4]);
      ctx.fillStyle=RED; ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle=GRAY; ctx.font='600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.fillText('(b) 거리의 역제곱',left,top-10);
    ctx.restore();
  }

  function updateReadout() {
    const [a,b]=state.charges;
    const r=separation();
    const f=forceMagnitude(a.q,b.q,r);
    const signed=value=>`${value>0?'+':value<0?'−':''}${Math.abs(value).toFixed(1)} μC`;
    document.getElementById('q1Out').textContent=signed(a.q);
    document.getElementById('q2Out').textContent=signed(b.q);
    document.getElementById('rOut').textContent=`${r.toFixed(2)} m`;
    document.getElementById('fOut').textContent=f===0?'0 N':f<.01?`${f.toExponential(2)} N`:`${f.toFixed(3)} N`;
    const type=a.q===0||b.q===0?'힘 없음':a.q*b.q<0?'인력':'척력';
    document.getElementById('relation').textContent=`${type} · |F₁₂| = |F₂₁|`;
  }

  function draw() {
    if (!state.width||!state.height) return;
    ctx.clearRect(0,0,state.width,state.height);
    diagramRect=diagramLayout();
    drawCharges();
    drawPlot();
    updateReadout();
  }

  function resize() {
    const rect=stage.getBoundingClientRect();
    if (!rect.width||!rect.height) return;
    state.width=rect.width; state.height=rect.height; state.dpr=Math.max(1,window.devicePixelRatio||1);
    canvas.width=Math.round(state.width*state.dpr);
    canvas.height=Math.round(state.height*state.dpr);
    canvas.style.width=`${state.width}px`; canvas.style.height=`${state.height}px`;
    ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
    draw();
  }

  function pointerPosition(event) {
    const rect=canvas.getBoundingClientRect();
    return {x:event.clientX-rect.left,y:event.clientY-rect.top};
  }

  function hitCharge(p) {
    let best=-1,distance=Infinity;
    state.charges.forEach((c,i)=>{
      const s=worldToScreen(c.x,c.y);
      const d=Math.hypot(p.x-s.x,p.y-s.y);
      if (d<30&&d<distance) {best=i; distance=d;}
    });
    return best;
  }

  function moveCharge(index,p) {
    const world=screenToWorld(p.x,p.y);
    const margin=.09;
    let x=Math.max(WORLD.xmin+margin,Math.min(WORLD.xmax-margin,world.x));
    let y=Math.max(WORLD.ymin+margin,Math.min(WORLD.ymax-margin,world.y));
    const other=state.charges[1-index];
    const dx=x-other.x,dy=y-other.y;
    const r=Math.hypot(dx,dy);
    if (r<MIN_R) {
      const ux=r>1e-6?dx/r:(index===0?-1:1);
      const uy=r>1e-6?dy/r:0;
      x=other.x+ux*MIN_R; y=other.y+uy*MIN_R;
    }
    state.charges[index].x=x; state.charges[index].y=y;
  }

  canvas.addEventListener('pointerdown',event=>{
    const hit=hitCharge(pointerPosition(event));
    if (hit<0) return;
    state.drag=hit; state.hover=hit; canvas.setPointerCapture(event.pointerId); canvas.style.cursor='grabbing';
    event.preventDefault(); draw();
  });
  canvas.addEventListener('pointermove',event=>{
    const p=pointerPosition(event);
    if (state.drag>=0) {moveCharge(state.drag,p); draw(); return;}
    state.hover=hitCharge(p); canvas.style.cursor=state.hover>=0?'grab':'default'; draw();
  });
  function endDrag(event) {
    if (state.drag>=0&&canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    state.drag=-1; canvas.style.cursor=state.hover>=0?'grab':'default'; draw();
  }
  canvas.addEventListener('pointerup',endDrag);
  canvas.addEventListener('pointercancel',endDrag);
  canvas.addEventListener('pointerleave',()=>{if(state.drag<0){state.hover=-1;canvas.style.cursor='default';draw();}});

  function syncInputs() {
    state.charges[0].q=Number(q1Input.value);
    state.charges[1].q=Number(q2Input.value);
    draw();
  }
  q1Input.addEventListener('input',syncInputs);
  q2Input.addEventListener('input',syncInputs);
  document.getElementById('reset').addEventListener('click',()=>{
    state.charges[0]={x:-.55,y:0,q:3};
    state.charges[1]={x:.55,y:0,q:-3};
    q1Input.value='3'; q2Input.value='-3'; draw();
  });

  function runValidation() {
    const close=forceMagnitudeSI(3e-6,-3e-6,.5);
    const far=forceMagnitudeSI(3e-6,-3e-6,1);
    const checkpoint=forceMagnitudeSI(3e-6,-3e-6,.4);
    const checkpointDoubledR=forceMagnitudeSI(3e-6,-3e-6,.8);
    const checkpointDoubledQ=forceMagnitudeSI(6e-6,-3e-6,.4);
    const f12=forceVectorSI(3e-6,-3e-6,{x:0,y:0},{x:.5,y:0});
    const f21=forceVectorSI(-3e-6,3e-6,{x:.5,y:0},{x:0,y:0});
    const tests={
      reference_value:Math.abs(close-.32364)<1e-8,
      checkpoint_r_0_4m:Math.abs(checkpoint-.5056875)<1e-12,
      checkpoint_double_r:Math.abs(checkpointDoubledR-.126421875)<1e-12,
      checkpoint_double_q:Math.abs(checkpointDoubledQ-1.011375)<1e-12,
      inverse_square:Math.abs(close/far-4)<1e-12,
      action_reaction:Math.hypot(f12.x+f21.x,f12.y+f21.y)<1e-12,
      zero_charge:forceMagnitudeSI(0,5e-6,.4)===0
    };
    const pass=Object.values(tests).every(Boolean);
    document.body.dataset.physicsValidated=pass?'pass':'fail';
    return {pass,tests,reference:{q1_C:3e-6,q2_C:-3e-6,r_m:.4,F_N:checkpoint,double_r_F_N:checkpointDoubledR,double_q1_F_N:checkpointDoubledQ}};
  }
  window.__physicsValidation={
    constants:{k_N_m2_per_C2:K},
    forceMagnitude:forceMagnitudeSI,
    forceVector:forceVectorSI,
    run:runValidation
  };
  window.__simulationState=state;
  tex(String.raw`|\vec F|=k\,\frac{|q_1q_2|}{r^2}`);
  runValidation();
  new ResizeObserver(resize).observe(stage);
  window.addEventListener('load',resize,{once:true});
})();
</script>
</body>
</html>
