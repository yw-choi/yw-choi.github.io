<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무한 퍼텐셜 우물</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; overflow: hidden; }
.container { display: flex; height: 100vh; }
.canvas-area { flex: 1; position: relative; background: #fafafa; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.controls { width: 260px; padding: 16px; border-left: 2px solid #eee; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.controls h2 { color: #8B0029; font-size: 15px; margin-bottom: 0; }
.subtitle { color: #888; font-size: 11px; margin-bottom: 4px; }
.control-group { display: flex; flex-direction: column; gap: 3px; }
.control-group label { font-size: 12.5px; font-weight: 600; color: #444; }
.control-group input[type="range"] { width: 100%; accent-color: #8B0029; }
.nbtns { display: flex; gap: 4px; }
.nbtns button { flex: 1; padding: 6px 0; font-size: 13px; font-weight: 700; border: 1.5px solid #d8c0c8; background: #fff; color: #8B0029; border-radius: 6px; cursor: pointer; }
.nbtns button.active { background: #8B0029; color: #fff; border-color: #8B0029; }
.info-box { background: #f8f0f2; border: 1px solid #e0c0c8; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.9; }
.info-box .label { color: #8B0029; font-weight: 700; }
.info-box .val { font-weight: 700; }
.info-box .katex { font-size: 12px; }
.theorem-box { background: #8B0029; color: #fff; border-radius: 8px; padding: 10px; font-size: 13px; text-align: center; font-weight: 700; line-height: 1.6; }
.theorem-box .katex { color: #fff; font-size: 14px; }
.relation-box { background: #eef3fe; border: 1px solid #c3d4f5; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.8; color: #2b4a8b; }
.relation-box .katex { font-size: 12px; }
.relation-box b { color: #1a3a7a; }
.formula-box { background: #f9f0f2; border: 1px solid rgba(139,0,41,0.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 2.0; color: #555; }
.formula-box b { color: #8B0029; }
.formula-box .katex { font-size: 12px; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #444; }
.chk input { accent-color: #8B0029; width: 15px; height: 15px; }
button.reset-btn { background: #8B0029; color: #fff; border: none; border-radius: 6px; padding: 9px; font-size: 13px; cursor: pointer; font-weight: 600; }
button.reset-btn:hover { background: #a3003a; }
.canvas-title { position: absolute; top: 8px; left: 16px; right: 16px; pointer-events: none; font-size: 14px; font-weight: 700; color: #8B0029; line-height: 1.4; }
.hint { position: absolute; bottom: 8px; left: 16px; pointer-events: none; font-size: 11px; color: #6B7280; }
.canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
.canvas-overlay .katex-label {
  position: absolute; white-space: nowrap; font-size: 13px; line-height: 1;
  pointer-events: none; transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.85); padding: 1px 5px; border-radius: 4px;
}
.canvas-overlay .katex-label .katex { font-size: 0.95em; }
@media (max-width: 700px) {
  .container { flex-direction: column; }
  .canvas-area { height: 55vh; }
  .controls { width: 100%; height: 45vh; border-left: none; border-top: 2px solid #eee; }
}
</style>
</head>
<body>
<div class="container">
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="canvas-overlay" id="overlay">
      <div class="katex-label" id="lblPsi" style="color:#8B0029;"></div>
      <div class="katex-label" id="lblPsi2" style="color:#2563EB;"></div>
      <div class="katex-label" id="lblEn" style="color:#8B0029;font-weight:bold;"></div>
    </div>
    <div class="canvas-title" id="canvasTitle"></div>
    <div class="hint">오른쪽 에너지 준위를 클릭하면 전이 (광자 방출·흡수)</div>
  </div>
  <div class="controls">
    <div>
      <h2>무한 퍼텐셜 우물</h2>
      <div class="subtitle">Infinite Potential Well (Ch.39)</div>
    </div>

    <div class="theorem-box" id="theoremBox"></div>

    <div class="control-group">
      <label>양자수 n = <span id="nVal">1</span></label>
      <div class="nbtns" id="nBtns"></div>
    </div>

    <div class="control-group">
      <label>우물 폭 L = <span id="LVal">100</span> pm</label>
      <input type="range" id="LSlider" min="50" max="1000" value="100" step="10">
    </div>

    <label class="chk"><input type="checkbox" id="animChk"> 시간 진화 (위상 회전) 보기</label>

    <div class="info-box" id="infoBox"></div>

    <div class="relation-box" id="transBox"></div>

    <div class="formula-box" id="formulaBox"></div>

    <button class="reset-btn" id="resetBtn">&#8635; 기본값 복원</button>
  </div>
</div>

<script>
function tex(expr) { return katex.renderToString(expr, { throwOnError: false, displayMode: false }); }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let CW = 0, CH = 0;

// ---------- physics (SI) ----------
const h  = 6.62607015e-34;   // J s
const me = 9.1093837015e-31; // kg
const eC = 1.602176634e-19;  // J/eV
const HC_EVNM = 1239.84;     // hc in eV·nm

// ---------- state (logical, no pixels) ----------
let n = 1;               // quantum number 1..6
let Lpm = 100;           // well width in pm
let animate = false;
let phase = 0;           // time-evolution phase (rad)
let lastN = null;        // previous n for transition display
let transition = null;   // {from, to, dE, lam, kind}
const NMAX = 6;

function E_eV(nn, LL) {  // E_n in eV for width LL (pm)
  const Lm = LL * 1e-12;
  return (h * h * nn * nn) / (8 * me * Lm * Lm) / eC;
}

// ---------- layout (recomputed from CW/CH every draw: iframe/resize safe) ----------
function layout() {
  const padT = 56, padB = 40;
  const ladderW = Math.max(150, Math.min(220, CW * 0.30));
  const plotX0 = 52, plotX1 = CW - ladderW - 40;
  const availH = CH - padT - padB;
  const topH = availH * 0.46, gap = 34;
  return {
    plotX0, plotX1,
    psiY: padT + topH * 0.55, psiAmp: topH * 0.42,       // ψ plot: centerline & amplitude
    rhoY: padT + topH + gap + availH * 0.44,             // ψ² baseline
    rhoH: availH * 0.40,
    ladX0: CW - ladderW - 8, ladX1: CW - 66,
    ladY0: CH - padB, ladY1: padT + 8                    // 0 .. E6 span
  };
}

let levelHits = [];   // {n, y} screen coords, rebuilt each draw

function resize() {
  dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  if (rect.width < 10 || rect.height < 10) return false;  // hidden iframe: retry later
  if (Math.abs(rect.width - CW) < 1 && Math.abs(rect.height - CH) < 1 && canvas.width > 0) return true;
  CW = rect.width; CH = rect.height;
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return true;
}

function drawTextWithBg(txt, x, y, color, font, align) {
  ctx.font = font || '12px sans-serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width;
  const x0 = align === 'right' ? x - w : (align === 'center' ? x - w/2 : x);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(x0 - 3, y - 9, w + 6, 18);
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
}

function draw() {
  ctx.clearRect(0, 0, CW, CH);
  const Lt = layout();

  // ===== well walls for both plots =====
  ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
  for (const xw of [Lt.plotX0, Lt.plotX1]) {
    ctx.beginPath(); ctx.moveTo(xw, Lt.psiY - Lt.psiAmp - 12); ctx.lineTo(xw, Lt.rhoY); ctx.stroke();
  }
  ctx.setLineDash([]);

  // ===== top plot: psi_n(x,t) =====
  ctx.strokeStyle = 'rgba(107,114,128,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(Lt.plotX0, Lt.psiY); ctx.lineTo(Lt.plotX1, Lt.psiY); ctx.stroke();

  const cosP = animate ? Math.cos(phase) : 1;
  if (animate) {
    // envelope ±psi_n (dashed)
    ctx.setLineDash([5, 4]); ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(139,0,41,0.45)';
    for (const sgn of [1, -1]) {
      ctx.beginPath();
      for (let i = 0; i <= 160; i++) {
        const t = i / 160;
        const y = Lt.psiY - sgn * Lt.psiAmp * Math.sin(n * Math.PI * t);
        const x = Lt.plotX0 + (Lt.plotX1 - Lt.plotX0) * t;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  ctx.strokeStyle = '#8B0029'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i <= 200; i++) {
    const t = i / 200;
    const y = Lt.psiY - Lt.psiAmp * cosP * Math.sin(n * Math.PI * t);
    const x = Lt.plotX0 + (Lt.plotX1 - Lt.plotX0) * t;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();

  // ===== bottom plot: |psi_n|^2 (stationary) =====
  ctx.strokeStyle = 'rgba(107,114,128,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(Lt.plotX0, Lt.rhoY); ctx.lineTo(Lt.plotX1, Lt.rhoY); ctx.stroke();
  ctx.fillStyle = 'rgba(37,99,235,0.10)';
  ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(Lt.plotX0, Lt.rhoY);
  for (let i = 0; i <= 200; i++) {
    const t = i / 200;
    const s = Math.sin(n * Math.PI * t);
    ctx.lineTo(Lt.plotX0 + (Lt.plotX1 - Lt.plotX0) * t, Lt.rhoY - Lt.rhoH * s * s);
  }
  ctx.lineTo(Lt.plotX1, Lt.rhoY);
  ctx.fill();
  ctx.beginPath();
  for (let i = 0; i <= 200; i++) {
    const t = i / 200;
    const s = Math.sin(n * Math.PI * t);
    const x = Lt.plotX0 + (Lt.plotX1 - Lt.plotX0) * t;
    i ? ctx.lineTo(x, Lt.rhoY - Lt.rhoH * s * s) : ctx.moveTo(x, Lt.rhoY - Lt.rhoH * s * s);
  }
  ctx.stroke();

  // x labels
  drawTextWithBg('x = 0', Lt.plotX0, Lt.rhoY + 16, '#6B7280', '12px sans-serif', 'center');
  drawTextWithBg('x = L', Lt.plotX1, Lt.rhoY + 16, '#6B7280', '12px sans-serif', 'center');
  if (animate) {
    drawTextWithBg('|ψ|²은 시간에 무관 (정상 상태)', (Lt.plotX0 + Lt.plotX1) / 2, Lt.rhoY - Lt.rhoH - 14, '#2563EB', '11.5px sans-serif', 'center');
  }

  // ===== energy ladder =====
  const E1 = E_eV(1, Lpm), E6 = E_eV(NMAX, Lpm);
  const yOf = nn => Lt.ladY0 - (E_eV(nn, Lpm) / E6) * (Lt.ladY0 - Lt.ladY1);
  // axis
  ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(Lt.ladX0 - 8, Lt.ladY0); ctx.lineTo(Lt.ladX0 - 8, Lt.ladY1 - 4); ctx.stroke();
  drawTextWithBg('E', Lt.ladX0 - 8, Lt.ladY1 - 14, '#6B7280', 'italic 13px sans-serif', 'center');
  drawTextWithBg('0', Lt.ladX0 - 8, Lt.ladY0 + 14, '#6B7280', '11px sans-serif', 'center');

  levelHits = [];
  for (let nn = 1; nn <= NMAX; nn++) {
    const y = yOf(nn);
    const cur = nn === n;
    ctx.strokeStyle = cur ? '#8B0029' : '#9ca3af';
    ctx.lineWidth = cur ? 3.5 : 2;
    ctx.beginPath(); ctx.moveTo(Lt.ladX0, y); ctx.lineTo(Lt.ladX1, y); ctx.stroke();
    drawTextWithBg('n=' + nn + '  ' + fmtE(E_eV(nn, Lpm)) + ' eV',
                   Lt.ladX1 + 6, y, cur ? '#8B0029' : '#6B7280',
                   (cur ? 'bold ' : '') + '11px sans-serif', 'left');
    levelHits.push({ n: nn, y });
  }
  // electron dot on current level
  const ycur = yOf(n);
  ctx.fillStyle = '#8B0029';
  ctx.beginPath(); ctx.arc((Lt.ladX0 + Lt.ladX1) / 2, ycur - 7, 5, 0, Math.PI * 2); ctx.fill();

  // transition arrow
  if (transition) {
    const y1 = yOf(transition.from), y2 = yOf(transition.to);
    const xa = Lt.ladX0 + (Lt.ladX1 - Lt.ladX0) * 0.24;
    const up = y2 < y1;
    ctx.strokeStyle = up ? '#8B0029' : '#2563EB';
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(xa, y1); ctx.lineTo(xa, y2 + (up ? 6 : -6)); ctx.stroke();
    const dir = up ? -1 : 1;
    ctx.beginPath();
    ctx.moveTo(xa, y2);
    ctx.lineTo(xa - 5, y2 - dir * 9);
    ctx.lineTo(xa + 5, y2 - dir * 9);
    ctx.closePath(); ctx.fill();
  }

  positionOverlay(Lt, ycur);
}

function fmtE(E) {
  if (E >= 100) return E.toFixed(0);
  if (E >= 10) return E.toFixed(1);
  return E.toFixed(2);
}

// KaTeX overlay labels (re-rendered only when state changes; repositioned every draw)
let overlayDirty = true;
function positionOverlay(Lt, ycur) {
  const lp = document.getElementById('lblPsi');
  const lp2 = document.getElementById('lblPsi2');
  const le = document.getElementById('lblEn');
  if (overlayDirty) {
    lp.innerHTML = tex('\\psi_' + n + '(x)');
    lp2.innerHTML = tex('|\\psi_' + n + '(x)|^2');
    le.innerHTML = tex('E_' + n + ' = ' + fmtE(E_eV(n, Lpm)) + '\\ \\text{eV}');
    overlayDirty = false;
  }
  lp.style.left = (Lt.plotX0 + 34) + 'px';
  lp.style.top = (Lt.psiY - Lt.psiAmp - 4) + 'px';
  lp2.style.left = (Lt.plotX0 + 44) + 'px';
  lp2.style.top = (Lt.rhoY - Lt.rhoH - 4) + 'px';
  // E_n label: above current level, clamped inside; avoid overlapping level text (put left of ladder)
  le.style.left = (Lt.ladX0 - 46) + 'px';
  le.style.top = Math.max(Lt.ladY1 + 10, ycur - 18) + 'px';
}

// ---------- interactions ----------
function setN(nn, viaClick) {
  nn = Math.max(1, Math.min(NMAX, nn));
  if (nn === n) return;
  lastN = n;
  n = nn;
  const Ei = E_eV(lastN, Lpm), Ef = E_eV(n, Lpm);
  const dE = Ef - Ei;
  transition = {
    from: lastN, to: n,
    dE: Math.abs(dE),
    lam: HC_EVNM / Math.abs(dE),         // nm
    kind: dE > 0 ? 'absorb' : 'emit'
  };
  overlayDirty = true;
  syncUI(); renderInfo(); scheduleDraw();
}

function canvasClick(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  const Lt = layout();
  if (x < Lt.ladX0 - 30) return;
  let best = null, bd = 1e9;
  for (const lv of levelHits) {
    const d = Math.abs(lv.y - y);
    if (d < bd) { bd = d; best = lv; }
  }
  if (best && bd < 16) setN(best.n, true);
}
canvas.addEventListener('mousedown', canvasClick);
canvas.addEventListener('touchstart', canvasClick, { passive: true });

// ---------- controls ----------
const nBtns = document.getElementById('nBtns');
for (let i = 1; i <= NMAX; i++) {
  const b = document.createElement('button');
  b.textContent = i;
  b.dataset.n = i;
  b.addEventListener('click', () => setN(i));
  nBtns.appendChild(b);
}
const LSlider = document.getElementById('LSlider');
LSlider.addEventListener('input', () => {
  Lpm = parseFloat(LSlider.value);
  document.getElementById('LVal').textContent = Lpm;
  if (transition) {  // recompute photon for current widths
    const dE = Math.abs(E_eV(transition.to, Lpm) - E_eV(transition.from, Lpm));
    transition.dE = dE; transition.lam = HC_EVNM / dE;
  }
  overlayDirty = true;
  renderInfo(); scheduleDraw();
});
document.getElementById('animChk').addEventListener('change', (e) => {
  animate = e.target.checked;
  scheduleDraw();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  n = 1; Lpm = 100; transition = null; lastN = null; phase = 0;
  LSlider.value = 100;
  document.getElementById('LVal').textContent = 100;
  document.getElementById('animChk').checked = false;
  animate = false;
  overlayDirty = true;
  syncUI(); renderInfo(); scheduleDraw();
});

function syncUI() {
  document.getElementById('nVal').textContent = n;
  for (const b of nBtns.children) b.classList.toggle('active', parseInt(b.dataset.n) === n);
}

// ---------- info panels ----------
function specRegion(lam) {
  if (lam < 10) return ['X선', '#6B7280'];
  if (lam < 380) return ['자외선', '#7c3aed'];
  if (lam <= 750) return ['가시광', wavelengthColor(lam)];
  if (lam < 1e6) return ['적외선', '#b45309'];
  return ['전파', '#6B7280'];
}
function wavelengthColor(lam) {
  // rough visible color for swatch
  if (lam < 450) return '#4338ca';
  if (lam < 495) return '#2563EB';
  if (lam < 570) return '#16a34a';
  if (lam < 590) return '#ca8a04';
  if (lam < 620) return '#ea580c';
  return '#dc2626';
}
function fmtLam(lam) {
  if (lam >= 1000) return (lam / 1000).toFixed(2) + ' μm';
  if (lam >= 10) return lam.toFixed(0) + ' nm';
  return lam.toFixed(2) + ' nm';
}

function renderInfo() {
  const E1 = E_eV(1, Lpm), En = E_eV(n, Lpm);
  const lamDB = 2 * Lpm / n;  // de Broglie wavelength in pm
  let html = '';
  html += '<span class="label">현재 상태</span> <span class="val">n = ' + n + (n === 1 ? ' (바닥상태)' : '') + '</span><br>';
  html += '<span class="label">에너지</span> <span class="val">E<sub>' + n + '</sub> = ' + fmtE(En) + ' eV</span><br>';
  html += '<span class="label">영점 에너지</span> E<sub>1</sub> = ' + fmtE(E1) + ' eV<br>';
  html += '<span class="label">드브로이 파장</span> λ = 2L/n = ' + lamDB.toFixed(0) + ' pm';
  document.getElementById('infoBox').innerHTML = html;

  const tb = document.getElementById('transBox');
  if (!transition) {
    tb.innerHTML = '<b>전이 없음</b><br>에너지 준위를 클릭하거나 n 버튼을 눌러 양자 도약을 일으켜 보세요.';
  } else {
    const t = transition;
    const [region, color] = specRegion(t.lam);
    const kindTxt = t.kind === 'emit'
      ? '<b style="color:#2563EB">광자 방출</b> (아래로 점프)'
      : '<b style="color:#8B0029">광자 흡수</b> (위로 점프)';
    tb.innerHTML =
      '<b>양자 도약</b> n = ' + t.from + ' → ' + t.to + '<br>' +
      kindTxt + '<br>' +
      tex('\\Delta E = ' + fmtE(t.dE) + '\\ \\text{eV}') + '<br>' +
      tex('\\lambda = hc/\\Delta E') + ' = <b>' + fmtLam(t.lam) + '</b> ' +
      '<span style="color:' + color + ';font-weight:700">(' + region + ')</span>';
  }
}

function renderStatic() {
  document.getElementById('canvasTitle').innerHTML =
    '구속 &rarr; 양자화: ' + tex('E_n = \\dfrac{n^2 h^2}{8mL^2}') +
    ' &mdash; 갇힌 전자는 불연속 에너지만 가진다';
  document.getElementById('theoremBox').innerHTML =
    '에너지 양자화<br>' + tex('E_n = \\dfrac{n^2h^2}{8mL^2},\\quad n=1,2,3,\\dots');
  document.getElementById('formulaBox').innerHTML =
    '<b>빨강 곡선:</b> 파동함수 ' + tex('\\psi_n(x)=\\sqrt{2/L}\\,\\sin(n\\pi x/L)') + '<br>' +
    '<b>파랑 곡선:</b> 확률밀도 ' + tex('|\\psi_n(x)|^2') + '<br>' +
    '<b>광자 전이:</b> ' + tex('hf = hc/\\lambda = \\Delta E') + '<br>' +
    'L을 줄이면 준위 간격 확대 (양자점의 원리)';
}

// ---------- animation / render loop (iframe-safe lazy init) ----------
let needDraw = true;
function scheduleDraw() { needDraw = true; }
let lastT = 0;
function loop(tms) {
  requestAnimationFrame(loop);
  const ok = resize();          // re-measures every frame; cheap, handles hidden->visible iframes
  if (!ok) return;              // still hidden (zero size)
  const dt = lastT ? Math.min((tms - lastT) / 1000, 0.1) : 0;
  lastT = tms;
  if (animate) {
    // phase advances ∝ E_n (visual scale): higher n → faster rotation
    phase += dt * (0.8 + 0.5 * n * n);
    needDraw = true;
  }
  if (needDraw) { draw(); needDraw = false; }
}

window.addEventListener('resize', () => scheduleDraw());

renderStatic();
syncUI();
renderInfo();
requestAnimationFrame(loop);
</script>
</body>
</html>
