<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC 회로: 충전과 방전</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; overflow: hidden; }
.container { display: flex; height: 100vh; }
.canvas-area { flex: 1; position: relative; background: #fafafa; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.controls { width: 260px; padding: 16px; border-left: 2px solid #eee; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.controls h2 { color: #8B0029; font-size: 15px; margin-bottom: 0; }
.subtitle { color: #888; font-size: 11px; margin-bottom: 4px; }
.control-group { display: flex; flex-direction: column; gap: 3px; }
.control-group label { font-size: 12.5px; font-weight: 600; color: #444; }
.control-group input[type="range"] { width: 100%; accent-color: #8B0029; }
.info-box { background: #f8f0f2; border: 1px solid #e0c0c8; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.9; }
.info-box .label { color: #8B0029; font-weight: 700; }
.info-box .val { font-weight: 700; }
.info-box .katex { font-size: 12px; }
.theorem-box { background: #8B0029; color: #fff; border-radius: 8px; padding: 10px; font-size: 13px; text-align: center; font-weight: 700; line-height: 1.6; }
.theorem-box .katex { color: #fff; font-size: 14px; }
.formula-box { background: #f9f0f2; border: 1px solid rgba(139,0,41,0.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 2.0; color: #555; }
.formula-box b { color: #8B0029; }
.formula-box .katex { font-size: 11.5px; }
.relation-box { background: #eef3fe; border: 1px solid #c3d4f5; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.8; color: #2b4a8b; }
.relation-box .katex { font-size: 12px; }
.relation-box b { color: #1a3a7a; }
.mode-btns { display: flex; gap: 6px; }
.mode-btns button { flex: 1; border: 2px solid #8B0029; background: #fff; color: #8B0029; border-radius: 6px; padding: 8px 4px; font-size: 12.5px; cursor: pointer; font-weight: 700; }
.mode-btns button.active { background: #8B0029; color: #fff; }
.mode-btns button#dischargeBtn { border-color: #2563EB; color: #2563EB; }
.mode-btns button#dischargeBtn.active { background: #2563EB; color: #fff; }
button.reset-btn { background: #8B0029; color: #fff; border: none; border-radius: 6px; padding: 9px; font-size: 13px; cursor: pointer; font-weight: 600; }
button.reset-btn:hover { background: #a3003a; }
.canvas-title { position: absolute; top: 8px; left: 16px; right: 16px; pointer-events: none; font-size: 13.5px; font-weight: 700; color: #8B0029; line-height: 1.4; }
.canvas-title .katex { font-size: 13px; }
.hint { position: absolute; bottom: 6px; left: 16px; pointer-events: none; font-size: 11px; color: #6B7280; }
.canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
.canvas-overlay .katex-label {
  position: absolute; white-space: nowrap; font-size: 12.5px; line-height: 1;
  pointer-events: none; transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.85); padding: 1px 5px; border-radius: 4px;
}
.canvas-overlay .katex-label .katex { font-size: 0.95em; }
@media (max-width: 700px) {
  .container { flex-direction: column; }
  .canvas-area { height: 55vh; }
  .controls { width: 100%; height: 45vh; border-left: none; border-top: 2px solid #eee; }
}
</style>
</head>
<body>
<div class="container">
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="canvas-overlay" id="overlay">
      <div class="katex-label" id="lblQ" style="color:#8B0029;font-weight:bold;"></div>
      <div class="katex-label" id="lblVc" style="color:#6B7280;"></div>
    </div>
    <div class="canvas-title" id="canvasTitle"></div>
    <div class="hint">R, C 슬라이더를 움직이고 충전/방전 스위치를 전환해 보세요</div>
  </div>
  <div class="controls">
    <div>
      <h2>RC 회로: 충전과 방전</h2>
      <div class="subtitle">RC Circuits (Ch.27) &middot; ℰ = 10 V</div>
    </div>

    <div class="theorem-box" id="theoremBox"></div>

    <div class="control-group">
      <label>저항 R = <span id="rVal">2.0</span> kΩ</label>
      <input type="range" id="rSlider" min="0.5" max="5" value="2" step="0.1">
    </div>

    <div class="control-group">
      <label>전기용량 C = <span id="cVal">500</span> μF</label>
      <input type="range" id="cSlider" min="100" max="1000" value="500" step="10">
    </div>

    <div class="mode-btns">
      <button id="chargeBtn" class="active">충전 (S→a)</button>
      <button id="dischargeBtn">방전 (S→b)</button>
    </div>

    <div class="info-box" id="infoBox"></div>

    <div class="relation-box" id="relationBox"></div>

    <div class="formula-box" id="formulaBox"></div>

    <button class="reset-btn" id="resetBtn">&#8635; 처음부터 (q = 0, 충전)</button>
  </div>
</div>

<script>
function tex(expr) { return katex.renderToString(expr, { throwOnError: false, displayMode: false }); }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let CW = 0, CH = 0;   // logical canvas size; 0 until first laid-out frame (iframe-safe)

// ---------- physics state ----------
const EMF = 10;                 // V (fixed)
let R = 2000;                   // ohm  (slider: kΩ)
let C = 500e-6;                 // F    (slider: μF)
let q = 0;                      // C, charge on capacitor
let mode = 'charge';            // 'charge' | 'discharge'
let simT = 0;                   // s, global sim clock
let tFlip = 0;                  // s, time of last switch throw
let lastNow = null;

// history for graphs
const hist = [];                // {t, q, i}
let lastPush = -1;

// switch lever animation: 0 = on a (charge), 1 = on b (discharge)
let lever = 0;

// moving current dots: {seg, d}
let dots = [];

function tau() { return R * C; }
function currentI() {
  // sign convention: charging current (battery pushes charge onto C) is positive
  return mode === 'charge' ? (EMF - q / C) / R : -(q / C) / R;
}

// ---------- simulation step ----------
function step(dt) {
  const qT = mode === 'charge' ? C * EMF : 0;
  q = qT + (q - qT) * Math.exp(-dt / tau());
  simT += dt;
  // lever animation
  const target = mode === 'charge' ? 0 : 1;
  lever += (target - lever) * Math.min(1, dt * 12);
  // record history
  if (simT - lastPush > 0.02) {
    hist.push({ t: simT, q: q, i: currentI() });
    lastPush = simT;
    if (hist.length > 4000) hist.splice(0, 1000);
  }
  // advance dots
  const iRel = Math.abs(currentI()) / (EMF / R);   // 1 at t=0, decays
  const v = 150 * iRel;                            // px/s along wire
  for (const d of dots) d.d += v * dt;
}

// ---------- geometry (computed every frame from CW/CH: iframe-safe) ----------
function geom() {
  const W = CW, H = CH;
  const cy0 = H * 0.075, cy1 = H * 0.55;           // circuit region
  const g = {};
  g.L = W * 0.10; g.R = W * 0.88;
  g.T = cy0 + (cy1 - cy0) * 0.14;
  g.B = cy0 + (cy1 - cy0) * 0.94;
  g.batY = cy0 + (cy1 - cy0) * 0.60;               // battery center y
  g.aX = g.L + (g.R - g.L) * 0.22;                 // contact a
  g.aY = cy0 + (cy1 - cy0) * 0.30;
  g.bX = g.aX;                                     // contact b
  g.bY = cy0 + (cy1 - cy0) * 0.50;
  g.pivX = g.L + (g.R - g.L) * 0.36;               // switch pivot on top wire
  g.pivY = g.T;
  g.bDropX = g.aX + (g.R - g.L) * 0.075;           // b-wire vertical
  g.rzX1 = g.L + (g.R - g.L) * 0.48;               // resistor zigzag on top wire
  g.rzX2 = g.L + (g.R - g.L) * 0.70;
  g.capY = cy0 + (cy1 - cy0) * 0.58;               // capacitor center y
  g.capGap = Math.max(10, (cy1 - cy0) * 0.075);
  g.capHalf = Math.min(34, (g.R - g.L) * 0.09);
  // graphs region
  g.gy0 = H * 0.62; g.gy1 = H - 46;
  const midX = W * 0.5;
  g.q0x = 46; g.q1x = midX - 24;
  g.i0x = midX + 52; g.i1x = W - 18;
  return g;
}

// wire path (list of points) that the conduction current follows, per mode
function currentPaths(g) {
  const plateTop = g.capY - g.capGap / 2, plateBot = g.capY + g.capGap / 2;
  if (mode === 'charge') {
    return [
      // battery + terminal -> a -> pivot -> R -> top plate
      [[g.L, g.batY - 12], [g.L, g.aY], [g.aX, g.aY], [g.pivX, g.pivY], [g.R, g.T], [g.R, plateTop]],
      // bottom plate -> bottom wire -> battery - terminal
      [[g.R, plateBot], [g.R, g.B], [g.L, g.B], [g.L, g.batY + 12]],
    ];
  }
  return [
    // top plate -> R -> pivot -> b -> down -> bottom wire -> bottom plate
    [[g.R, plateTop], [g.R, g.T], [g.pivX, g.pivY], [g.bX, g.bY], [g.bDropX, g.bY], [g.bDropX, g.B], [g.R, g.B], [g.R, plateBot]],
  ];
}

function pathLength(pts) {
  let s = 0;
  for (let k = 1; k < pts.length; k++) s += Math.hypot(pts[k][0] - pts[k-1][0], pts[k][1] - pts[k-1][1]);
  return s;
}
function pointAt(pts, d) {
  for (let k = 1; k < pts.length; k++) {
    const seg = Math.hypot(pts[k][0] - pts[k-1][0], pts[k][1] - pts[k-1][1]);
    if (d <= seg) {
      const f = seg > 0 ? d / seg : 0;
      return [pts[k-1][0] + (pts[k][0] - pts[k-1][0]) * f, pts[k-1][1] + (pts[k][1] - pts[k-1][1]) * f];
    }
    d -= seg;
  }
  return pts[pts.length - 1].slice();
}

function rebuildDots() {
  dots = [];
  const g = geom();
  if (CW < 10) return;
  const paths = currentPaths(g);
  paths.forEach((pts, si) => {
    const len = pathLength(pts);
    const n = Math.max(2, Math.floor(len / 46));
    for (let k = 0; k < n; k++) dots.push({ seg: si, d: (len * k) / n });
  });
}

// ---------- drawing helpers ----------
function drawArrow(x1, y1, x2, y2, color, lw) {
  const headLen = 9;
  const ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2 - (headLen - 2) * Math.cos(ang), y2 - (headLen - 2) * Math.sin(ang));
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(ang - 0.42), y2 - headLen * Math.sin(ang - 0.42));
  ctx.lineTo(x2 - headLen * Math.cos(ang + 0.42), y2 - headLen * Math.sin(ang + 0.42));
  ctx.closePath(); ctx.fill();
}

function drawTextWithBg(txt, x, y, color, font, align) {
  ctx.font = font || '12px sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width;
  const bx = align === 'left' ? x : (align === 'right' ? x - w : x - w / 2);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(bx - 3, y - 8, w + 6, 16);
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
}

function zigzagH(x1, x2, y) {
  const n = 6, amp = 8;
  const lead = (x2 - x1) * 0.12;
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x1 + lead, y);
  const zw = (x2 - x1) - 2 * lead;
  const stepw = zw / n;
  let px = x1 + lead;
  ctx.lineTo(px + stepw / 2, y - amp);
  for (let k = 1; k < n; k++) {
    ctx.lineTo(px + stepw / 2 + k * stepw, y + (k % 2 === 1 ? amp : -amp));
  }
  ctx.lineTo(x2 - lead, y);
  ctx.lineTo(x2, y);
  ctx.stroke();
}

// ---------- main draw ----------
function draw() {
  ctx.clearRect(0, 0, CW, CH);
  const g = geom();
  drawCircuit(g);
  drawGraphs(g);
  positionOverlay(g);
}

function drawCircuit(g) {
  const plateTop = g.capY - g.capGap / 2, plateBot = g.capY + g.capGap / 2;
  const i = currentI();
  const iRel = i / (EMF / R);   // -1..1

  // --- wires ---
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath();
  // battery branch + wire to contact a
  ctx.moveTo(g.L, g.batY - 12); ctx.lineTo(g.L, g.aY); ctx.lineTo(g.aX - 5, g.aY);
  // top wire from pivot to right, resistor drawn separately
  ctx.moveTo(g.pivX, g.pivY); ctx.lineTo(g.rzX1, g.T);
  ctx.moveTo(g.rzX2, g.T); ctx.lineTo(g.R, g.T); ctx.lineTo(g.R, plateTop);
  // bottom plate down to bottom wire, back to battery
  ctx.moveTo(g.R, plateBot); ctx.lineTo(g.R, g.B); ctx.lineTo(g.L, g.B); ctx.lineTo(g.L, g.batY + 12);
  // b-contact wire down to bottom wire
  ctx.moveTo(g.bX + 5, g.bY); ctx.lineTo(g.bDropX, g.bY); ctx.lineTo(g.bDropX, g.B);
  ctx.stroke();

  // junction dot where b-wire meets bottom wire
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(g.bDropX, g.B, 3.5, 0, Math.PI * 2); ctx.fill();

  // --- resistor ---
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
  zigzagH(g.rzX1, g.rzX2, g.T);
  drawTextWithBg('R', (g.rzX1 + g.rzX2) / 2, g.T - 20, '#1a1a1a', 'italic bold 15px serif');

  // --- battery ---
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(g.L - 16, g.batY - 12); ctx.lineTo(g.L + 16, g.batY - 12); ctx.stroke();
  ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.moveTo(g.L - 9, g.batY + 6); ctx.lineTo(g.L + 9, g.batY + 6); ctx.stroke();
  drawTextWithBg('ℰ = 10 V', g.L + 2, g.batY + 30, '#8B0029', 'bold 12.5px sans-serif');
  ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('+', g.L + 22, g.batY - 13);
  ctx.fillText('−', g.L + 22, g.batY + 7);

  // --- switch ---
  const lx = g.aX + (g.bX - g.aX) * lever;
  const ly = g.aY + (g.bY - g.aY) * lever;
  ctx.strokeStyle = mode === 'charge' ? '#8B0029' : '#2563EB';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(g.pivX, g.pivY); ctx.lineTo(lx + 4, ly - 2); ctx.stroke();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(g.pivX, g.pivY, 4, 0, Math.PI * 2); ctx.fill();
  // contacts
  for (const [cx, cy] of [[g.aX, g.aY], [g.bX, g.bY]]) {
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2; ctx.stroke();
  }
  drawTextWithBg('a', g.aX - 15, g.aY + 10, '#8B0029', 'italic bold 13px serif');
  drawTextWithBg('b', g.bX - 14, g.bY + 8, '#2563EB', 'italic bold 13px serif');
  drawTextWithBg('S', g.pivX + 2, g.pivY - 18, '#1a1a1a', 'italic bold 14px serif');
  drawTextWithBg(mode === 'charge' ? '충전 중' : '방전 중',
                 g.pivX + 40, g.pivY - 18, mode === 'charge' ? '#8B0029' : '#2563EB', 'bold 12px sans-serif');

  // --- capacitor plates + accumulated charge ---
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(g.R - g.capHalf, plateTop); ctx.lineTo(g.R + g.capHalf, plateTop); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(g.R - g.capHalf, plateBot); ctx.lineTo(g.R + g.capHalf, plateBot); ctx.stroke();
  drawTextWithBg('C', g.R + g.capHalf + 14, g.capY, '#1a1a1a', 'italic bold 15px serif');

  const frac = Math.max(0, Math.min(1, q / (C * EMF)));
  const nSym = Math.round(frac * 8);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let k = 0; k < nSym; k++) {
    const sx = g.R - g.capHalf + 6 + (2 * g.capHalf - 12) * (nSym === 1 ? 0.5 : k / (nSym - 1));
    ctx.fillStyle = '#8B0029'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText('+', sx, plateTop - 8);
    ctx.fillStyle = '#2563EB'; ctx.font = 'bold 13px sans-serif';
    ctx.fillText('−', sx, plateBot + 9);
  }
  // field arrows between plates (if charged enough)
  if (frac > 0.12 && g.capGap > 14) {
    ctx.strokeStyle = 'rgba(139,0,41,0.45)';
    for (let k = -1; k <= 1; k += 2) {
      drawArrow(g.R + k * g.capHalf * 0.55, plateTop + 3, g.R + k * g.capHalf * 0.55, plateBot - 3, 'rgba(139,0,41,0.45)', 1.5);
    }
  }

  // --- moving current dots ---
  const paths = currentPaths(g);
  const lens = paths.map(pathLength);
  const iAbs = Math.abs(iRel);
  if (iAbs > 0.004) {
    ctx.fillStyle = '#2563EB';
    for (const d of dots) {
      if (d.seg >= paths.length) continue;
      const p = pointAt(paths[d.seg], d.d % lens[d.seg]);
      ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, Math.PI * 2); ctx.fill();
    }
  }

  // --- current direction arrow on top wire ---
  if (iAbs > 0.004) {
    const ax = (g.rzX2 + g.R) / 2;
    const len = 18 + 34 * iAbs;
    if (mode === 'charge') drawArrow(ax - len / 2, g.T - 14, ax + len / 2, g.T - 14, '#2563EB', 2.5);
    else drawArrow(ax + len / 2, g.T - 14, ax - len / 2, g.T - 14, '#2563EB', 2.5);
    drawTextWithBg('i = ' + (Math.abs(i) * 1000).toFixed(2) + ' mA', ax, g.T - 30, '#2563EB', 'bold 12px sans-serif');
  } else {
    drawTextWithBg('i ≈ 0', (g.rzX2 + g.R) / 2, g.T - 14, '#6B7280', 'bold 12px sans-serif');
  }
}

function drawGraphs(g) {
  const t = simT;
  const Wt = Math.max(2, Math.min(20, 8 * tau()));   // time window
  const t0 = Math.max(0, t - Wt);

  // ----- q(t) panel -----
  drawPanel(g.q0x, g.q1x, g.gy0, g.gy1, '전하 q(t)', '#8B0029', t0, t, Wt, (pt) => pt.q,
            0, C * EMF * 1.15, C * EMF, 'Cℰ (최종값)', false);
  // ----- i(t) panel -----
  const iMax = (EMF / R) * 1.15;
  drawPanel(g.i0x, g.i1x, g.gy0, g.gy1, '전류 i(t)', '#2563EB', t0, t, Wt, (pt) => pt.i,
            -iMax, iMax, EMF / R, 'ℰ/R', true);
}

function drawPanel(x0, x1, y0, y1, title, color, t0, t, Wt, getter, vMin, vMax, refV, refLabel, zeroLine) {
  const px = (tt) => x0 + ((tt - t0) / Wt) * (x1 - x0);
  const py = (v) => y1 - ((v - vMin) / (vMax - vMin)) * (y1 - y0);

  // axes
  ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x0, y0 - 4); ctx.lineTo(x0, y1); ctx.lineTo(x1, y1);
  ctx.stroke();

  // title
  ctx.fillStyle = color; ctx.font = 'bold 12.5px sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText(title, x0, y0 - 8);

  // zero line (for i panel)
  if (zeroLine) {
    const zy = py(0);
    ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, zy); ctx.lineTo(x1, zy); ctx.stroke();
    ctx.fillStyle = '#9ca3af'; ctx.font = '10px sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('0', x0 - 4, zy);
  }

  // reference dashed line
  const ry = py(refV);
  ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(x0, ry); ctx.lineTo(x1, ry); ctx.stroke();
  ctx.setLineDash([]);
  drawTextWithBg(refLabel, x1 - 4, ry - 9, '#6B7280', '11px sans-serif', 'right');

  // τ marker since last switch flip
  const tMark = tFlip + tau();
  if (tMark > t0 && tMark < t0 + Wt) {
    const mx = px(tMark);
    ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(mx, y0 + 2); ctx.lineTo(mx, y1); ctx.stroke();
    ctx.setLineDash([]);
    drawTextWithBg('τ', mx, y1 + 10, '#1a1a1a', 'italic bold 13px serif');
  }

  // curve
  ctx.strokeStyle = color; ctx.lineWidth = 2.2;
  ctx.beginPath();
  let started = false;
  for (const pt of hist) {
    if (pt.t < t0) continue;
    const vx = px(pt.t), vy = Math.max(y0, Math.min(y1, py(getter(pt))));
    if (!started) { ctx.moveTo(vx, vy); started = true; } else ctx.lineTo(vx, vy);
  }
  if (started) ctx.stroke();

  // current point marker
  if (hist.length) {
    const last = hist[hist.length - 1];
    const vy = Math.max(y0, Math.min(y1, py(getter(last))));
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(px(last.t), vy, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  // t axis label
  ctx.fillStyle = '#6B7280'; ctx.font = 'italic 12px serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText('t (s)', x1, y1 + 5);
}

// ---------- overlay labels (KaTeX) ----------
function positionOverlay(g) {
  const lblQ = document.getElementById('lblQ');
  const lblVc = document.getElementById('lblVc');
  const plateTop = g.capY - g.capGap / 2;
  lblQ.style.display = 'block';
  lblQ.style.left = (g.R - g.capHalf - 46) + 'px';
  lblQ.style.top = (g.capY) + 'px';
  lblQ.innerHTML = tex('q = ' + (q * 1000).toFixed(2) + '\\,\\text{mC}');
  lblVc.style.display = 'block';
  lblVc.style.left = (g.R - g.capHalf - 52) + 'px';
  lblVc.style.top = (g.capY + 24) + 'px';
  lblVc.innerHTML = tex('V_C = q/C = ' + (q / C).toFixed(2) + '\\,\\text{V}');
}

// ---------- UI panels ----------
function renderStatic() {
  document.getElementById('canvasTitle').innerHTML =
    'RC 회로: 축전기의 충전과 방전은 <span style="white-space:nowrap;">시간 상수 ' + tex('\\tau = RC') + '</span> 가 지배한다';

  document.getElementById('formulaBox').innerHTML =
    '<b>충전 (S→a):</b> ' + tex('q = C\\mathcal{E}\\big(1 - e^{-t/RC}\\big)') + '<br>' +
    tex('i = \\dfrac{dq}{dt} = \\dfrac{\\mathcal{E}}{R}\\,e^{-t/RC}') + '<br>' +
    '<b>방전 (S→b):</b> ' + tex('q = q_0\\,e^{-t/RC}') + '<br>' +
    tex('i = -\\dfrac{q_0}{RC}\\,e^{-t/RC}');
}

function renderTheorem() {
  const tv = tau();
  document.getElementById('theoremBox').innerHTML =
    '시간 상수<br>' +
    tex('\\tau = RC = ' + tv.toFixed(2) + '\\ \\text{s}') + '<br>' +
    '<span style="font-size:11px;font-weight:400">R = ' + (R / 1000).toFixed(1) + ' kΩ, C = ' + Math.round(C * 1e6) + ' μF</span>';
}

function renderRelation() {
  document.getElementById('relationBox').innerHTML =
    '<b>τ의 의미</b> — 스위치를 던진 뒤 ' + tex('t = \\tau') + ' 일 때:<br>' +
    '충전: 최종 전하의 <b>63%</b> ' + tex('\\big(1 - e^{-1}\\big)') + '<br>' +
    '방전: 처음 전하의 <b>37%</b> ' + tex('\\big(e^{-1}\\big)');
}

function updateInfo() {
  const box = document.getElementById('infoBox');
  const tp = simT - tFlip;
  const i = currentI();
  const qFull = C * EMF;
  let html = '';
  html += '<span class="label">전환 후 경과</span> <span class="val">t = ' + tp.toFixed(2) + ' s (' + (tp / tau()).toFixed(2) + 'τ)</span><br>';
  html += '<span class="label">전하</span> <span class="val">q = ' + (q * 1000).toFixed(2) + ' mC (' + Math.round(100 * q / qFull) + '%)</span><br>';
  html += '<span class="label">전류</span> <span class="val">i = ' + (i * 1000).toFixed(2) + ' mA</span><br>';
  html += '<span class="label">축전기 전압</span> <span class="val">V<sub>C</sub> = ' + (q / C).toFixed(2) + ' V</span>';
  box.innerHTML = html;
}

// ---------- events ----------
document.getElementById('rSlider').addEventListener('input', (e) => {
  R = parseFloat(e.target.value) * 1000;
  document.getElementById('rVal').textContent = parseFloat(e.target.value).toFixed(1);
  renderTheorem();
});
document.getElementById('cSlider').addEventListener('input', (e) => {
  C = parseFloat(e.target.value) * 1e-6;
  document.getElementById('cVal').textContent = Math.round(parseFloat(e.target.value));
  renderTheorem();
});
function setMode(m) {
  if (mode === m) return;
  mode = m;
  tFlip = simT;
  document.getElementById('chargeBtn').classList.toggle('active', m === 'charge');
  document.getElementById('dischargeBtn').classList.toggle('active', m === 'discharge');
  rebuildDots();
}
document.getElementById('chargeBtn').addEventListener('click', () => setMode('charge'));
document.getElementById('dischargeBtn').addEventListener('click', () => setMode('discharge'));
document.getElementById('resetBtn').addEventListener('click', () => {
  q = 0; simT = 0; tFlip = 0; lastPush = -1; hist.length = 0;
  setMode('charge');
  document.getElementById('chargeBtn').classList.add('active');
  document.getElementById('dischargeBtn').classList.remove('active');
  rebuildDots();
});

// ---------- resize (lazy init: safe when iframe layout is 0 at load) ----------
function maybeResize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  if (w === CW && h === CH) return;
  const hadSize = CW > 10;
  CW = w; CH = h;
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(CW * dpr));
  canvas.height = Math.max(1, Math.round(CH * dpr));
  canvas.style.width = CW + 'px';
  canvas.style.height = CH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (CW > 10) rebuildDots();   // (re)build dots in the new pixel space
}

// ---------- main loop ----------
function frame(now) {
  maybeResize();
  if (CW > 10 && CH > 10) {
    const t = now / 1000;
    if (lastNow === null) lastNow = t;
    const dt = Math.min(0.05, Math.max(0, t - lastNow));
    lastNow = t;
    step(dt);
    draw();
    updateInfo();
  }
  requestAnimationFrame(frame);
}

renderStatic();
renderTheorem();
renderRelation();
requestAnimationFrame(frame);
</script>
