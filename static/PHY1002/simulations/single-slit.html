<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단일슬릿 회절</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; overflow: hidden; }
.container { display: flex; height: 100vh; }
.canvas-area { flex: 1; position: relative; background: #fafafa; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.controls { width: 260px; padding: 16px; border-left: 2px solid #eee; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.controls h2 { color: #8B0029; font-size: 15px; margin-bottom: 0; }
.subtitle { color: #888; font-size: 11px; margin-bottom: 4px; }
.control-group { display: flex; flex-direction: column; gap: 3px; }
.control-group label { font-size: 12.5px; font-weight: 600; color: #444; }
.control-group input[type="range"] { width: 100%; accent-color: #8B0029; }
.info-box { background: #f8f0f2; border: 1px solid #e0c0c8; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.9; }
.info-box .label { color: #8B0029; font-weight: 700; }
.info-box .val { font-weight: 700; }
.info-box .katex { font-size: 12px; }
.theorem-box { background: #8B0029; color: #fff; border-radius: 8px; padding: 10px; font-size: 13px; text-align: center; font-weight: 700; line-height: 1.7; }
.theorem-box .katex { color: #fff; font-size: 13px; }
.formula-box { background: #f9f0f2; border: 1px solid rgba(139,0,41,0.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 2.0; color: #555; }
.formula-box b { color: #8B0029; }
.formula-box .katex { font-size: 12px; }
.relation-box { background: #eef3fe; border: 1px solid #c3d4f5; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.8; color: #2b4a8b; }
.relation-box .katex { font-size: 12px; }
.relation-box b { color: #1a3a7a; }
.mode-row { display: flex; align-items: center; gap: 8px; background: #f3f4f6; border-radius: 8px; padding: 8px 10px; }
.mode-row input { accent-color: #8B0029; width: 16px; height: 16px; cursor: pointer; }
.mode-row label { font-size: 12.5px; font-weight: 700; color: #444; cursor: pointer; }
button.reset-btn { background: #8B0029; color: #fff; border: none; border-radius: 6px; padding: 9px; font-size: 13px; cursor: pointer; font-weight: 600; }
button.reset-btn:hover { background: #a3003a; }
.canvas-title { position: absolute; top: 8px; left: 16px; right: 16px; pointer-events: none; font-size: 14px; font-weight: 700; color: #8B0029; line-height: 1.4; }
.canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
.canvas-overlay .katex-label {
  position: absolute; white-space: nowrap; font-size: 12px; line-height: 1;
  pointer-events: none; transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.88); padding: 1px 5px; border-radius: 4px;
}
.hidden { display: none !important; }
@media (max-width: 700px) {
  .container { flex-direction: column; }
  .canvas-area { height: 55vh; }
  .controls { width: 100%; height: 45vh; border-left: none; border-top: 2px solid #eee; }
}
</style>
</head>
<body>
<div class="container">
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="canvas-overlay" id="overlay">
      <div class="katex-label" id="lblMin" style="color:#2563EB;"></div>
    </div>
    <div class="canvas-title" id="canvasTitle"></div>
  </div>
  <div class="controls">
    <div>
      <h2>단일슬릿 회절</h2>
      <div class="subtitle">Single-Slit Diffraction (Ch.36)</div>
    </div>

    <div class="theorem-box" id="theoremBox"></div>

    <div class="control-group">
      <label>슬릿 폭 a = <span id="aVal">3.0</span> μm</label>
      <input type="range" id="aSlider" min="0.5" max="5" value="3" step="0.1">
    </div>

    <div class="control-group">
      <label>파장 λ = <span id="lamVal">550</span> nm</label>
      <input type="range" id="lamSlider" min="400" max="700" value="550" step="5">
    </div>

    <div class="mode-row">
      <input type="checkbox" id="dblChk">
      <label for="dblChk">이중슬릿 모드 (간섭 × 회절)</label>
    </div>

    <div class="control-group" id="ratioGroup" style="display:none">
      <label>슬릿 간격 비 d/a = <span id="ratioVal">4.0</span></label>
      <input type="range" id="ratioSlider" min="2" max="8" value="4" step="0.5">
    </div>

    <div class="info-box" id="infoBox"></div>

    <div class="relation-box" id="relationBox"></div>

    <div class="formula-box" id="formulaBox"></div>

    <button class="reset-btn" id="resetBtn">&#8635; 기본값 복원</button>
  </div>
</div>

<script>
function tex(expr) { return katex.renderToString(expr, { throwOnError: false, displayMode: false }); }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let CW = 0, CH = 0;

const aSlider = document.getElementById('aSlider');
const lamSlider = document.getElementById('lamSlider');
const ratioSlider = document.getElementById('ratioSlider');
const dblChk = document.getElementById('dblChk');
const resetBtn = document.getElementById('resetBtn');

// ---------- physics state (logical, pixel-independent) ----------
const state = {
  a: 3.0,      // slit width, μm
  lam: 550,    // wavelength, nm
  dbl: false,  // double-slit mode
  ratio: 4.0,  // d/a
};
const TH_MAX = 20;  // degrees, plot half-range

// I(θ)/I_m : diffraction factor, and interference factor in double mode
function intensity(sinth) {
  const a_nm = state.a * 1000;
  const al = Math.PI * a_nm * sinth / state.lam;      // α = πa sinθ/λ
  const diff = (Math.abs(al) < 1e-9) ? 1 : Math.pow(Math.sin(al) / al, 2);
  if (!state.dbl) return diff;
  const d_nm = state.ratio * a_nm;
  const be = Math.PI * d_nm * sinth / state.lam;      // β = πd sinθ/λ
  return Math.pow(Math.cos(be), 2) * diff;
}
function envelope(sinth) {
  const a_nm = state.a * 1000;
  const al = Math.PI * a_nm * sinth / state.lam;
  return (Math.abs(al) < 1e-9) ? 1 : Math.pow(Math.sin(al) / al, 2);
}

// wavelength(nm) -> [r,g,b] (approximate visible spectrum)
function wavelengthRGB(l) {
  let r=0,g=0,b=0;
  if (l < 440)      { r=-(l-440)/60; g=0; b=1; }
  else if (l < 490) { r=0; g=(l-440)/50; b=1; }
  else if (l < 510) { r=0; g=1; b=-(l-510)/20; }
  else if (l < 580) { r=(l-510)/70; g=1; b=0; }
  else if (l < 645) { r=1; g=-(l-645)/65; b=0; }
  else              { r=1; g=0; b=0; }
  return [Math.round(255*r), Math.round(255*g), Math.round(255*b)];
}

// ---------- layout helpers (recomputed every draw from CW/CH) ----------
function layout() {
  const gx0 = 56, gx1 = CW - 18;
  const gTop = 46, gBot = Math.max(gTop + 80, CH - 152);
  const sTop = gBot + 44, sBot = Math.min(sTop + 44, CH - 14);
  return { gx0, gx1, gTop, gBot, sTop, sBot };
}
function thToX(thDeg, L) { return L.gx0 + (thDeg + TH_MAX) / (2 * TH_MAX) * (L.gx1 - L.gx0); }

function drawTextWithBg(x, y, s, color, font, align) {
  ctx.font = font || '11px sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  const w = ctx.measureText(s).width;
  const x0 = align === 'left' ? x : (align === 'right' ? x - w : x - w/2);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(x0 - 2, y - 7, w + 4, 14);
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}

function draw() {
  if (CW < 40 || CH < 40) return;   // not yet laid out (iframe safety)
  ctx.clearRect(0, 0, CW, CH);
  const L = layout();

  // ---- axes ----
  ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(L.gx0, L.gTop); ctx.lineTo(L.gx0, L.gBot); ctx.lineTo(L.gx1, L.gBot);
  ctx.stroke();
  ctx.fillStyle = '#6B7280'; ctx.font = '11px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let t = -TH_MAX; t <= TH_MAX; t += 5) {
    const x = thToX(t, L);
    ctx.strokeStyle = '#d1d5db';
    ctx.beginPath(); ctx.moveTo(x, L.gBot); ctx.lineTo(x, L.gBot + 4); ctx.stroke();
    ctx.fillText(String(t), x, L.gBot + 7);
  }
  ctx.fillText('θ (°)', (L.gx0 + L.gx1) / 2, L.gBot + 22);
  ctx.save();
  ctx.translate(18, (L.gTop + L.gBot) / 2); ctx.rotate(-Math.PI / 2);
  ctx.textBaseline = 'middle';
  ctx.fillText('I / Iₘ', 0, 0);
  ctx.restore();
  // y-axis ticks 0, 0.5, 1
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const v of [0, 0.5, 1]) {
    const y = L.gBot - v * (L.gBot - L.gTop) * 0.94;
    ctx.fillText(v.toFixed(1), L.gx0 - 6, y);
    ctx.strokeStyle = '#e5e7eb';
    ctx.beginPath(); ctx.moveTo(L.gx0, y); ctx.lineTo(L.gx1, y); ctx.stroke();
  }

  // ---- single-slit dark-fringe markers: a sinθ = mλ ----
  const lam_um = state.lam / 1000;
  const minima = [];
  for (let m = 1; m <= 12; m++) {
    const s = m * lam_um / state.a;
    if (s >= Math.sin(TH_MAX * Math.PI / 180)) break;
    minima.push({ m, th: Math.asin(s) * 180 / Math.PI });
  }
  ctx.setLineDash([5, 4]);
  for (const mn of minima) {
    for (const sgn of [-1, 1]) {
      const x = thToX(sgn * mn.th, L);
      ctx.strokeStyle = 'rgba(37,99,235,0.55)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, L.gTop + 12); ctx.lineTo(x, L.gBot); ctx.stroke();
    }
  }
  ctx.setLineDash([]);
  // m labels (skip if markers crowd together)
  const gapPx = minima.length > 0 ? (thToX(minima[0].th, L) - thToX(0, L)) : 999;
  if (minima.length) {
    const skip = gapPx < 26 ? Math.ceil(26 / Math.max(gapPx, 8)) : 1;
    minima.forEach((mn, i) => {
      if (i % skip !== 0 && i !== minima.length - 1) return;
      for (const sgn of [-1, 1]) {
        drawTextWithBg(thToX(sgn * mn.th, L), L.gTop + 18, 'm=' + (sgn * mn.m), '#2563EB');
      }
    });
  }

  // ---- envelope (double mode) ----
  const n = Math.max(400, Math.floor((L.gx1 - L.gx0) * 1.5));
  if (state.dbl) {
    ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 1.2; ctx.setLineDash([6, 4]);
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const t = -TH_MAX + 2 * TH_MAX * i / n;
      const I = envelope(Math.sin(t * Math.PI / 180));
      const x = thToX(t, L), y = L.gBot - I * (L.gBot - L.gTop) * 0.94;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke(); ctx.setLineDash([]);
  }

  // ---- intensity curve ----
  ctx.strokeStyle = '#8B0029'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const t = -TH_MAX + 2 * TH_MAX * i / n;
    const I = intensity(Math.sin(t * Math.PI / 180));
    const x = thToX(t, L), y = L.gBot - I * (L.gBot - L.gTop) * 0.94;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // ---- screen fringe strip ----
  const [r, g, b] = wavelengthRGB(state.lam);
  ctx.fillStyle = '#111';
  ctx.fillRect(L.gx0, L.sTop, L.gx1 - L.gx0, L.sBot - L.sTop);
  for (let x = Math.ceil(L.gx0); x < L.gx1; x++) {
    const t = -TH_MAX + 2 * TH_MAX * (x - L.gx0) / (L.gx1 - L.gx0);
    const I = intensity(Math.sin(t * Math.PI / 180));
    const v = Math.pow(I, 0.55);   // gamma for visibility
    ctx.fillStyle = `rgba(${r},${g},${b},${v.toFixed(3)})`;
    ctx.fillRect(x, L.sTop, 1, L.sBot - L.sTop);
  }
  ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1;
  ctx.strokeRect(L.gx0, L.sTop, L.gx1 - L.gx0, L.sBot - L.sTop);
  drawTextWithBg(L.gx0 + 4, L.sTop - 12, '스크린에 보이는 무늬', '#6B7280', '11.5px sans-serif', 'left');

  positionOverlay(L, minima);
}

// KaTeX overlay label at the first minimum marker
function positionOverlay(L, minima) {
  const el = document.getElementById('lblMin');
  if (minima.length) {
    const x = thToX(minima[0].th, L);
    el.style.display = 'block';
    el.style.left = Math.min(x + 2, CW - 70) + 'px';
    el.style.top = (L.gBot - (L.gBot - L.gTop) * 0.42) + 'px';
    el.innerHTML = tex('a\\sin\\theta = \\lambda');
  } else {
    el.style.display = 'none';
  }
}

// ---------- panel rendering ----------
function renderTheorem() {
  const box = document.getElementById('theoremBox');
  if (!state.dbl) {
    box.innerHTML = '단일슬릿 세기<br>' +
      tex('I(\\theta) = I_m\\Bigl(\\dfrac{\\sin\\alpha}{\\alpha}\\Bigr)^{2}') + '<br>' +
      '<span style="font-size:11px;font-weight:400">' + tex('\\alpha = \\dfrac{\\pi a}{\\lambda}\\sin\\theta') + '</span>';
  } else {
    box.innerHTML = '이중슬릿 (간섭 × 회절)<br>' +
      tex('I = I_m\\cos^2\\!\\beta\\,\\Bigl(\\dfrac{\\sin\\alpha}{\\alpha}\\Bigr)^{2}') + '<br>' +
      '<span style="font-size:11px;font-weight:400">' + tex('\\beta = \\tfrac{\\pi d}{\\lambda}\\sin\\theta,\\;\\; \\alpha = \\tfrac{\\pi a}{\\lambda}\\sin\\theta') + '</span>';
  }
}

function renderInfo() {
  const box = document.getElementById('infoBox');
  const lam_um = state.lam / 1000;
  const s1 = lam_um / state.a;
  let html = '';
  html += '<span class="label">λ/a</span> <span class="val">= ' + s1.toFixed(3) + '</span><br>';
  if (s1 < 1) {
    const th1 = Math.asin(s1) * 180 / Math.PI;
    html += '<span class="label">첫 극소</span> <span class="val">θ₁ = ' + th1.toFixed(1) + '°</span><br>';
    html += '<span class="label">중앙 극대 각폭</span> <span class="val">2θ₁ = ' + (2 * th1).toFixed(1) + '°</span>';
  } else {
    html += '<span class="label">첫 극소</span> <span class="val">없음 (a ≤ λ: 중앙 극대가 화면 전체)</span>';
  }
  if (state.dbl) {
    const d_um = state.ratio * state.a;
    // interference maxima strictly inside the first diffraction minima: |m| < d/a
    const isInt = Math.abs(state.ratio - Math.round(state.ratio)) < 1e-9;
    const mMax = isInt ? Math.round(state.ratio) - 1 : Math.floor(state.ratio);
    const cnt = 2 * mMax + 1;
    html += '<br><span class="label">슬릿 간격</span> <span class="val">d = ' + d_um.toFixed(1) + ' μm</span>';
    html += '<br><span class="label">중앙 봉우리 속 밝은 무늬</span> <span class="val">' + cnt + '개</span>';
    if (isInt) html += '<br><span style="font-size:10.5px;color:#6B7280">m = ±' + Math.round(state.ratio) + ' 무늬는 회절 극소와 겹쳐 사라짐</span>';
  }
  box.innerHTML = html;
}

function renderRelation() {
  const box = document.getElementById('relationBox');
  let html = '<b>어두운 무늬 (파란 점선)</b><br>' + tex('a\\sin\\theta = m\\lambda,\\;\\; m = 1, 2, 3, \\dots');
  if (state.dbl) {
    html += '<br><b>밝은 간섭 무늬</b><br>' + tex('d\\sin\\theta = m\\lambda,\\;\\; m = 0, 1, 2, \\dots');
  }
  box.innerHTML = html;
}

function renderFormula() {
  const box = document.getElementById('formulaBox');
  let html = '<b>빨간 곡선:</b> 세기 분포 ' + tex('I(\\theta)/I_m') + '<br>';
  if (state.dbl) html += '<b>회색 점선:</b> 회절 포락선 ' + tex('(\\sin\\alpha/\\alpha)^2') + '<br>';
  html += '슬릿을 좁히면(a↓) 무늬가 <b>넓게 퍼지고</b>,<br>파장을 늘리면(λ↑) 같은 효과가 난다';
  box.innerHTML = html;
}

function renderTitle() {
  document.getElementById('canvasTitle').innerHTML = state.dbl
    ? '이중슬릿 회절: 간섭 무늬(cos²β)에 단일슬릿 회절 포락선이 씌워진다'
    : '단일슬릿 회절: 어두운 무늬는 a sin θ = mλ — 슬릿이 좁을수록 빛은 더 넓게 퍼진다';
}

function renderAll() {
  renderTheorem(); renderInfo(); renderRelation(); renderFormula(); renderTitle();
  draw();
}

// ---------- resize (iframe-safe: logical state only, remap every draw) ----------
function resize() {
  dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  if (rect.width < 10 || rect.height < 10) { requestAnimationFrame(resize); return; }
  CW = rect.width; CH = rect.height;
  canvas.width = Math.round(CW * dpr); canvas.height = Math.round(CH * dpr);
  canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener('resize', resize);
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => resize()).observe(canvas.parentElement);
}

// ---------- controls ----------
aSlider.addEventListener('input', () => {
  state.a = parseFloat(aSlider.value);
  document.getElementById('aVal').textContent = state.a.toFixed(1);
  renderAll();
});
lamSlider.addEventListener('input', () => {
  state.lam = parseInt(lamSlider.value, 10);
  document.getElementById('lamVal').textContent = state.lam;
  renderAll();
});
ratioSlider.addEventListener('input', () => {
  state.ratio = parseFloat(ratioSlider.value);
  document.getElementById('ratioVal').textContent = state.ratio.toFixed(1);
  renderAll();
});
dblChk.addEventListener('change', () => {
  state.dbl = dblChk.checked;
  document.getElementById('ratioGroup').style.display = state.dbl ? 'flex' : 'none';
  renderAll();
});
resetBtn.addEventListener('click', () => {
  state.a = 3.0; state.lam = 550; state.dbl = false; state.ratio = 4.0;
  aSlider.value = 3; lamSlider.value = 550; ratioSlider.value = 4; dblChk.checked = false;
  document.getElementById('aVal').textContent = '3.0';
  document.getElementById('lamVal').textContent = '550';
  document.getElementById('ratioVal').textContent = '4.0';
  document.getElementById('ratioGroup').style.display = 'none';
  renderAll();
});

renderAll();
resize();
</script>
</body>
</html>
