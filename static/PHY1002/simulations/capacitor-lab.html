<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>평행판 축전기 실험실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; overflow: hidden; }
.container { display: flex; height: 100vh; }
.canvas-area { flex: 1; position: relative; background: #fafafa; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.controls { width: 260px; padding: 14px; border-left: 2px solid #eee; display: flex; flex-direction: column; gap: 9px; overflow-y: auto; }
.controls h2 { color: #8B0029; font-size: 15px; margin-bottom: 0; }
.subtitle { color: #888; font-size: 11px; margin-bottom: 2px; }
.control-group { display: flex; flex-direction: column; gap: 3px; }
.control-group label { font-size: 12.5px; font-weight: 600; color: #444; }
.control-group input[type="range"] { width: 100%; accent-color: #8B0029; }
.theorem-box { background: #8B0029; color: #fff; border-radius: 8px; padding: 9px; font-size: 13px; text-align: center; font-weight: 700; line-height: 1.6; }
.theorem-box .katex { color: #fff; font-size: 14px; }
.info-box { background: #f8f0f2; border: 1px solid #e0c0c8; border-radius: 8px; padding: 9px 10px; font-size: 12px; line-height: 1.95; }
.info-box .label { color: #8B0029; font-weight: 700; }
.info-box .val { font-weight: 700; }
.info-box .katex { font-size: 12px; }
.relation-box { background: #eef3fe; border: 1px solid #c3d4f5; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.8; color: #2b4a8b; }
.relation-box .katex { font-size: 12px; }
.relation-box b { color: #1a3a7a; }
.formula-box { background: #f9f0f2; border: 1px solid rgba(139,0,41,0.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 2.0; color: #555; }
.formula-box b { color: #8B0029; }
.formula-box .katex { font-size: 12px; }
button.toggle-btn { border: none; border-radius: 6px; padding: 10px; font-size: 13px; cursor: pointer; font-weight: 700; color: #fff; transition: background 0.15s; }
button.toggle-btn.connected { background: #2563EB; }
button.toggle-btn.connected:hover { background: #1e4fc4; }
button.toggle-btn.disconnected { background: #8B0029; }
button.toggle-btn.disconnected:hover { background: #a3003a; }
.state-box { border-radius: 8px; padding: 8px 10px; font-size: 12.5px; font-weight: 700; text-align: center; line-height: 1.6; }
.state-box.connected { background: #eef3fe; border: 1px solid #c3d4f5; color: #1a3a7a; }
.state-box.disconnected { background: #f8f0f2; border: 1px solid #e0c0c8; color: #8B0029; }
.state-box .katex { font-size: 12.5px; }
button.reset-btn { background: #6B7280; color: #fff; border: none; border-radius: 6px; padding: 8px; font-size: 12.5px; cursor: pointer; font-weight: 600; }
button.reset-btn:hover { background: #4b5563; }
.canvas-title { position: absolute; top: 8px; left: 16px; right: 16px; pointer-events: none; font-size: 14px; font-weight: 700; color: #8B0029; line-height: 1.4; }
.canvas-title .katex { font-size: 14px; }
.canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
.canvas-overlay .katex-label {
  position: absolute; white-space: nowrap; font-size: 13px; line-height: 1;
  pointer-events: none; transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.87); padding: 1px 5px; border-radius: 4px;
}
.canvas-overlay .katex-label .katex { font-size: 0.95em; }
@media (max-width: 700px) {
  .container { flex-direction: column; }
  .canvas-area { height: 55vh; }
  .controls { width: 100%; height: 45vh; border-left: none; border-top: 2px solid #eee; }
}
</style>
</head>
<body>
<div class="container">
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="canvas-overlay" id="overlay">
      <div class="katex-label" id="lblE" style="color:#2563EB;font-weight:bold;"></div>
      <div class="katex-label" id="lblV" style="color:#1a1a1a;"></div>
    </div>
    <div class="canvas-title" id="canvasTitle"></div>
  </div>
  <div class="controls">
    <div>
      <h2>평행판 축전기 실험실</h2>
      <div class="subtitle">Capacitance (Ch.25)</div>
    </div>

    <div class="theorem-box" id="theoremBox"></div>

    <button class="toggle-btn connected" id="batteryBtn">배터리 분리하기</button>
    <div class="state-box connected" id="stateBox"></div>

    <div class="control-group">
      <label>판 면적 A = <span id="aVal">200</span> cm²</label>
      <input type="range" id="aSlider" min="50" max="400" value="200" step="10">
    </div>
    <div class="control-group">
      <label>판 간격 d = <span id="dVal">5.0</span> mm</label>
      <input type="range" id="dSlider" min="1" max="10" value="5" step="0.5">
    </div>
    <div class="control-group">
      <label>유전 상수 κ = <span id="kVal">1.0</span></label>
      <input type="range" id="kSlider" min="1" max="8" value="1" step="0.1">
    </div>

    <div class="info-box" id="infoBox"></div>

    <div class="relation-box" id="relationBox"></div>

    <div class="formula-box" id="formulaBox"></div>

    <button class="reset-btn" id="resetBtn">&#8635; 기본값 복원</button>
  </div>
</div>

<script>
function tex(expr) { return katex.renderToString(expr, { throwOnError: false, displayMode: false }); }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let CW = 0, CH = 0;

// ---------- physics state ----------
const EPS0 = 8.85e-12;    // F/m
const VBAT = 12;          // battery voltage (V)

const state = {
  A_cm2: 200,     // plate area in cm^2
  d_mm: 5,        // separation in mm
  kappa: 1,
  connected: true,
  qFrozen: 0,     // charge (C) frozen when disconnected
};

// derived quantities (SI)
function physics() {
  const A = state.A_cm2 * 1e-4;          // m^2
  const d = state.d_mm * 1e-3;           // m
  const C = state.kappa * EPS0 * A / d;  // F
  let q, V;
  if (state.connected) {
    V = VBAT;
    q = C * V;
  } else {
    q = state.qFrozen;
    V = q / C;
  }
  const E = V / d;                       // V/m (uniform field in the gap)
  const U = 0.5 * C * V * V;             // J
  const qInd = q * (1 - 1 / state.kappa); // induced surface charge on dielectric
  return { A, d, C, q, V, E, U, qInd };
}

// reference values (defaults, kappa=1, connected) for visual scaling
const REF = (() => {
  const C0 = EPS0 * 200e-4 / 5e-3;
  return { q: C0 * VBAT, E: VBAT / 5e-3, U: 0.5 * C0 * VBAT * VBAT };
})();

// displayed (animated) charge for smooth transitions
let dispQ = REF.q;

// ---------- formatting ----------
function fmt(x, digits = 2) {
  if (!isFinite(x)) return '—';
  if (x === 0) return '0';
  const ax = Math.abs(x);
  if (ax >= 0.01 && ax < 10000) {
    return x.toPrecision(3).replace(/\.?0+$/, m => (m.includes('.') ? '' : m));
  }
  const exp = Math.floor(Math.log10(ax));
  const mant = (x / Math.pow(10, exp)).toFixed(digits);
  return mant + '×10' + sup(exp);
}
function sup(n) {
  const map = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  return String(n).split('').map(c => map[c] || c).join('');
}
function fmtC(C) { return fmt(C * 1e12) + ' pF'; }
function fmtQ(q) { return (Math.abs(q) >= 1e-9) ? fmt(q * 1e9) + ' nC' : fmt(q * 1e12) + ' pC'; }
function fmtV(V) { return fmt(V) + ' V'; }
function fmtE(E) { return (Math.abs(E) >= 1e3) ? fmt(E / 1e3) + ' kV/m' : fmt(E) + ' V/m'; }
function fmtU(U) { return (Math.abs(U) >= 1e-9) ? fmt(U * 1e9) + ' nJ' : fmt(U * 1e12) + ' pJ'; }

// ---------- drawing helpers ----------
function drawArrow(x1, y1, x2, y2, color, lw) {
  const headLen = 9;
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2 - (headLen - 2) * Math.cos(angle), y2 - (headLen - 2) * Math.sin(angle));
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - 0.42), y2 - headLen * Math.sin(angle - 0.42));
  ctx.lineTo(x2 - headLen * Math.cos(angle + 0.42), y2 - headLen * Math.sin(angle + 0.42));
  ctx.closePath(); ctx.fill();
}

function drawTextWithBg(text, x, y, color, font, align = 'center') {
  ctx.font = font;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width;
  const x0 = align === 'center' ? x - w / 2 : (align === 'left' ? x : x - w);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(x0 - 3, y - 9, w + 6, 18);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

// ---------- geometry (computed every frame from CW/CH: iframe-safe) ----------
function layout() {
  // plate horizontal extent scales with sqrt(A); gap scales with d
  const fracW = 0.30 + 0.28 * Math.sqrt((state.A_cm2 - 50) / 350);   // 0.30..0.58 of CW
  const plateW = CW * fracW;
  const cx = CW * 0.44;
  const cy = CH * 0.52;
  const gap = CH * (0.09 + 0.30 * (state.d_mm - 1) / 9);             // 0.09..0.39 of CH
  const plateH = Math.max(10, CH * 0.028);
  return {
    cx, cy, plateW, gap, plateH,
    px0: cx - plateW / 2, px1: cx + plateW / 2,
    topY: cy - gap / 2 - plateH,   // top of top plate
    botY: cy + gap / 2,            // top of bottom plate
  };
}

// ---------- main draw ----------
function draw() {
  ctx.clearRect(0, 0, CW, CH);
  const P = physics();
  const L = layout();

  // animate displayed charge toward the true value
  dispQ += (P.q - dispQ) * 0.15;

  const gapTop = L.topY + L.plateH;   // bottom face of top plate
  const gapBot = L.botY;              // top face of bottom plate

  // --- wires + battery on the left ---
  const busX = Math.max(34, L.px0 - CW * 0.13);
  const batTop = L.cy - 16, batBot = L.cy + 16;
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  // top wire: plate -> left -> down to switch, then switch -> battery
  const swY = L.cy - 52;
  ctx.beginPath();
  ctx.moveTo(L.px0, L.topY + L.plateH / 2);
  ctx.lineTo(busX, L.topY + L.plateH / 2);
  ctx.lineTo(busX, swY - 14);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(busX, swY + 14);
  ctx.lineTo(busX, batTop);
  ctx.stroke();
  // bottom wire
  ctx.beginPath();
  ctx.moveTo(L.px0, L.botY + L.plateH / 2);
  ctx.lineTo(busX, L.botY + L.plateH / 2);
  ctx.lineTo(busX, batBot);
  ctx.stroke();
  // switch contacts
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(busX, swY - 14, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(busX, swY + 14, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // switch lever
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(busX, swY + 14);
  if (state.connected) ctx.lineTo(busX, swY - 12);
  else ctx.lineTo(busX + 20, swY - 8);
  ctx.stroke();
  drawTextWithBg(state.connected ? '스위치 닫힘' : '스위치 열림', busX + 26, swY, state.connected ? '#2563EB' : '#8B0029', 'bold 11px sans-serif', 'left');
  // battery symbol (+ long line on top)
  ctx.strokeStyle = state.connected ? '#1a1a1a' : '#9ca3af';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(busX - 14, batTop); ctx.lineTo(busX + 14, batTop); ctx.stroke();
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(busX - 8, batBot); ctx.lineTo(busX + 8, batBot); ctx.stroke();
  drawTextWithBg('+', busX - 22, batTop, '#8B0029', 'bold 13px sans-serif');
  drawTextWithBg('−', busX - 22, batBot, '#2563EB', 'bold 13px sans-serif');
  drawTextWithBg(VBAT + ' V', busX, batBot + 20, state.connected ? '#1a1a1a' : '#9ca3af', 'bold 12px sans-serif');

  // --- dielectric slab ---
  if (state.kappa > 1.001) {
    const alpha = 0.25 + 0.5 * (state.kappa - 1) / 7;
    ctx.fillStyle = 'rgba(139,0,41,' + (alpha * 0.16).toFixed(3) + ')';
    ctx.strokeStyle = 'rgba(107,114,128,0.8)';
    ctx.lineWidth = 1.5;
    ctx.fillRect(L.px0, gapTop + 2, L.plateW, gapBot - gapTop - 4);
    ctx.strokeRect(L.px0, gapTop + 2, L.plateW, gapBot - gapTop - 4);
    drawTextWithBg('유전체 κ = ' + state.kappa.toFixed(1), L.px1 - 4, L.botY + L.plateH + 16, '#6B7280', 'bold 12px sans-serif', 'right');
  }

  // --- field arrows (E from + plate down to − plate) ---
  const nE = Math.min(11, Math.max(0, Math.round(5 * P.E / REF.E)));
  const gapH = gapBot - gapTop;
  if (nE > 0 && gapH > 26) {
    const margin = 18;
    for (let i = 0; i < nE; i++) {
      const fx = L.px0 + L.plateW * (i + 0.5) / nE;
      drawArrow(fx, gapTop + margin * 0.55, fx, gapBot - margin * 0.55, '#2563EB', 2);
    }
  }

  // --- plates ---
  ctx.fillStyle = '#F3F4F6';
  ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 2;
  ctx.fillRect(L.px0, L.topY, L.plateW, L.plateH);
  ctx.strokeRect(L.px0, L.topY, L.plateW, L.plateH);
  ctx.fillRect(L.px0, L.botY, L.plateW, L.plateH);
  ctx.strokeRect(L.px0, L.botY, L.plateW, L.plateH);

  // --- plate charges (count ~ sqrt of q for visible dynamic range) ---
  const qRatio = Math.max(0, dispQ / REF.q);
  const nq = qRatio > 0.005 ? Math.min(24, Math.max(2, Math.round(8 * Math.sqrt(qRatio)))) : 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 13px sans-serif';
  for (let i = 0; i < nq; i++) {
    const fx = L.px0 + L.plateW * (i + 0.5) / nq;
    ctx.fillStyle = '#8B0029';
    ctx.fillText('+', fx, L.topY + L.plateH / 2);
    ctx.fillStyle = '#2563EB';
    ctx.fillText('−', fx, L.botY + L.plateH / 2);
  }
  // plate labels
  drawTextWithBg('+q', L.px1 + 20, L.topY + L.plateH / 2, '#8B0029', 'bold italic 14px sans-serif');
  drawTextWithBg('−q', L.px1 + 20, L.botY + L.plateH / 2, '#2563EB', 'bold italic 14px sans-serif');

  // --- induced charges on dielectric faces ---
  if (state.kappa > 1.001 && nq > 0 && gapH > 40) {
    const nInd = Math.round(nq * (1 - 1 / state.kappa));
    ctx.font = 'bold 11px sans-serif';
    for (let i = 0; i < nInd; i++) {
      const fx = L.px0 + L.plateW * (i + 0.5) / nInd;
      ctx.fillStyle = '#2563EB';
      ctx.fillText('−', fx, gapTop + 10);
      ctx.fillStyle = '#8B0029';
      ctx.fillText('+', fx, gapBot - 8);
    }
  }

  // --- dimension labels: A on top plate, d at right side of gap ---
  drawTextWithBg('면적 A = ' + state.A_cm2 + ' cm²', L.cx, L.topY - 14, '#6B7280', '12px sans-serif');
  const dimX = L.px1 + 52;
  ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(dimX, gapTop); ctx.lineTo(dimX, gapBot); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(dimX - 5, gapTop); ctx.lineTo(dimX + 5, gapTop); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(dimX - 5, gapBot); ctx.lineTo(dimX + 5, gapBot); ctx.stroke();
  drawTextWithBg('d = ' + state.d_mm.toFixed(1) + ' mm', dimX + 10, L.cy, '#6B7280', '12px sans-serif', 'left');

  // --- energy bar (title fixed above; value never covers the title) ---
  const barW = 34;
  const barX = CW - barW - 28;
  const barTop = CH * 0.22, barBot = CH * 0.86;
  const barH = barBot - barTop;
  ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1;
  ctx.strokeRect(barX, barTop, barW, barH);
  // log scale over 4 decades below/above a max
  const Umax = 1e-6; // 1 μJ full scale
  let frac = 0;
  if (P.U > 0) frac = Math.min(1, Math.max(0, 1 + Math.log10(P.U / Umax) / 4));
  const hpx = barH * frac;
  ctx.fillStyle = 'rgba(139,0,41,0.85)';
  ctx.fillRect(barX, barBot - hpx, barW, hpx);
  drawTextWithBg('에너지 U', barX + barW / 2, barTop - 30, '#1a1a1a', 'bold 12px sans-serif');
  drawTextWithBg('(log 눈금)', barX + barW / 2, barTop - 14, '#6B7280', '10px sans-serif');
  // value label: above bar tip, but never above the bar frame top (keeps clear of title)
  const valY = Math.max(barTop + 10, barBot - hpx - 12);
  if (barBot - hpx < barTop + 22) {
    // bar nearly full: draw value inside the bar in white
    drawTextWithBg(fmtU(P.U), barX + barW / 2, barTop + 14, '#8B0029', 'bold 11px sans-serif');
  } else {
    drawTextWithBg(fmtU(P.U), barX + barW / 2, valY, '#8B0029', 'bold 11px sans-serif');
  }

  // --- KaTeX overlay labels (E in the gap, V beside the plates) ---
  positionOverlay(P, L, gapTop, gapBot);
}

function positionOverlay(P, L, gapTop, gapBot) {
  const lblE = document.getElementById('lblE');
  const lblV = document.getElementById('lblV');
  const gapH = gapBot - gapTop;

  if (gapH > 46) {
    lblE.style.display = 'block';
    lblE.style.left = (L.cx) + 'px';
    lblE.style.top = ((gapTop + gapBot) / 2) + 'px';
    lblE.innerHTML = tex('E = V/d = ' + texNum(P.E, 'V/m'));
  } else {
    lblE.style.display = 'none';
  }

  // V label: right of plates, vertically centered on the gap, above E label zone
  lblV.style.display = 'block';
  const vx = Math.min(CW - 150, L.px1 + 96);
  lblV.style.left = vx + 'px';
  lblV.style.top = (gapTop - 24) + 'px';
  lblV.innerHTML = tex('V = ' + fmtTexPlain(P.V) + '\\,\\text{V}') +
    (state.connected ? ' <span style="font-size:10px;color:#2563EB;">(고정)</span>'
                     : '');
}

function texNum(x, unit) {
  if (!isFinite(x)) return '\\text{—}';
  const ax = Math.abs(x);
  if (ax >= 1e3) {
    return fmtTexPlain(x / 1e3) + '\\,\\text{k' + unit + '}';
  }
  return fmtTexPlain(x) + '\\,\\text{' + unit + '}';
}
function fmtTexPlain(x) {
  const ax = Math.abs(x);
  if (ax === 0) return '0';
  if (ax >= 0.01 && ax < 10000) return String(parseFloat(x.toPrecision(3)));
  const exp = Math.floor(Math.log10(ax));
  const mant = (x / Math.pow(10, exp)).toFixed(2);
  return mant + '\\times 10^{' + exp + '}';
}

// ---------- panel updates ----------
function updatePanel() {
  const P = physics();

  const info = document.getElementById('infoBox');
  info.innerHTML =
    '<span class="label">전기용량</span> <span class="val">C = ' + fmtC(P.C) + '</span><br>' +
    '<span class="label">전위차</span> <span class="val">V = ' + fmtV(P.V) + '</span><br>' +
    '<span class="label">전하</span> <span class="val">q = CV = ' + fmtQ(P.q) + '</span><br>' +
    '<span class="label">전기장</span> <span class="val">E = V/d = ' + fmtE(P.E) + '</span><br>' +
    '<span class="label">저장 에너지</span> <span class="val">U = ½CV² = ' + fmtU(P.U) + '</span>';

  const st = document.getElementById('stateBox');
  st.className = 'state-box ' + (state.connected ? 'connected' : 'disconnected');
  st.innerHTML = state.connected
    ? '배터리 연결됨: ' + tex('V = 12\\,\\text{V}') + ' 고정<br><span style="font-weight:400;font-size:11.5px">C가 변하면 q = CV가 따라 변한다</span>'
    : '배터리 분리됨: ' + tex('q = ' + fmtTexPlain(state.qFrozen * 1e9) + '\\,\\text{nC}') + ' 고정<br><span style="font-weight:400;font-size:11.5px">C가 변하면 V = q/C가 따라 변한다</span>';

  const btn = document.getElementById('batteryBtn');
  btn.className = 'toggle-btn ' + (state.connected ? 'connected' : 'disconnected');
  btn.textContent = state.connected ? '배터리 분리하기' : '배터리 연결하기';

  const rel = document.getElementById('relationBox');
  rel.innerHTML =
    '<b>유전체를 넣으면 (κ↑)</b><br>' +
    '연결 상태: ' + tex('V') + ' 그대로, ' + tex('q = \\kappa q_0') + ' 증가<br>' +
    '분리 상태: ' + tex('q') + ' 그대로, ' + tex('V = V_0/\\kappa') + ' 감소<br>' +
    '<span style="font-size:11px">두 경우 모두 ' + tex('C = \\kappa C_0') + ' 로 증가</span>';
}

function renderStatic() {
  document.getElementById('canvasTitle').innerHTML =
    '평행판 축전기: ' + tex('C = \\kappa\\varepsilon_0 A/d') +
    ' — <span style="color:#2563EB">연결 시 V 고정</span>, <span style="color:#8B0029">분리 시 q 고정</span>';

  document.getElementById('theoremBox').innerHTML =
    '전기용량의 정의 ' + tex('q = CV') + '<br>' +
    tex('C = \\kappa\\varepsilon_0 \\dfrac{A}{d}') + '<br>' +
    '<span style="font-size:11px;font-weight:400">' + tex('\\varepsilon_0 = 8.85\\,\\text{pF/m}') + '</span>';

  document.getElementById('formulaBox').innerHTML =
    '<b>전기장:</b> ' + tex('E = V/d') + '<br>' +
    '<b>에너지:</b> ' + tex('U = \\tfrac{1}{2}CV^2 = q^2/2C') + '<br>' +
    '<b>유도 전하:</b> ' + tex("q' = q(1 - 1/\\kappa)");
}

// ---------- events ----------
const aSlider = document.getElementById('aSlider');
const dSlider = document.getElementById('dSlider');
const kSlider = document.getElementById('kSlider');

aSlider.addEventListener('input', () => {
  state.A_cm2 = parseFloat(aSlider.value);
  document.getElementById('aVal').textContent = state.A_cm2;
  updatePanel();
});
dSlider.addEventListener('input', () => {
  state.d_mm = parseFloat(dSlider.value);
  document.getElementById('dVal').textContent = state.d_mm.toFixed(1);
  updatePanel();
});
kSlider.addEventListener('input', () => {
  state.kappa = parseFloat(kSlider.value);
  document.getElementById('kVal').textContent = state.kappa.toFixed(1);
  updatePanel();
});

document.getElementById('batteryBtn').addEventListener('click', () => {
  if (state.connected) {
    state.qFrozen = physics().q;   // freeze the current charge
    state.connected = false;
  } else {
    state.connected = true;        // V snaps back to 12 V
  }
  updatePanel();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  state.A_cm2 = 200; state.d_mm = 5; state.kappa = 1;
  state.connected = true; state.qFrozen = 0;
  aSlider.value = 200; dSlider.value = 5; kSlider.value = 1;
  document.getElementById('aVal').textContent = '200';
  document.getElementById('dVal').textContent = '5.0';
  document.getElementById('kVal').textContent = '1.0';
  updatePanel();
});

// ---------- iframe-safe sizing & render loop ----------
// The canvas may have zero size when the script runs inside an iframe.
// All geometry is derived from CW/CH inside draw(), and the rAF loop
// re-checks the parent size every frame, so the first nonzero-size frame
// lays everything out correctly (and resizes stay proportional).
function maybeResize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  const newDpr = window.devicePixelRatio || 1;
  if (w > 0 && h > 0 && (w !== CW || h !== CH || newDpr !== dpr)) {
    CW = w; CH = h; dpr = newDpr;
    canvas.width = CW * dpr; canvas.height = CH * dpr;
    canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}

function tick() {
  maybeResize();
  if (CW > 0 && CH > 0) draw();
  requestAnimationFrame(tick);
}

renderStatic();
updatePanel();
requestAnimationFrame(tick);
</script>
