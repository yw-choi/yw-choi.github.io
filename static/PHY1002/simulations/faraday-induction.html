<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>패러데이 유도 실험실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; overflow: hidden; }
.container { display: flex; height: 100vh; }
.canvas-area { flex: 1; position: relative; background: #fafafa; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.controls { width: 260px; padding: 16px; border-left: 2px solid #eee; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.controls h2 { color: #8B0029; font-size: 15px; margin-bottom: 0; }
.subtitle { color: #888; font-size: 11px; margin-bottom: 4px; }
.control-group { display: flex; flex-direction: column; gap: 3px; }
.control-group label { font-size: 12.5px; font-weight: 600; color: #444; }
.control-group input[type="range"] { width: 100%; accent-color: #8B0029; }
.info-box { background: #f8f0f2; border: 1px solid #e0c0c8; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.9; }
.info-box .label { color: #8B0029; font-weight: 700; }
.info-box .val { font-weight: 700; }
.info-box .katex { font-size: 12px; }
.theorem-box { background: #8B0029; color: #fff; border-radius: 8px; padding: 10px; font-size: 13px; text-align: center; font-weight: 700; line-height: 1.6; }
.theorem-box .katex { color: #fff; font-size: 14px; }
.formula-box { background: #f9f0f2; border: 1px solid rgba(139,0,41,0.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 2.0; color: #555; }
.formula-box b { color: #8B0029; }
.formula-box .katex { font-size: 12px; }
.relation-box { background: #eef3fe; border: 1px solid #c3d4f5; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.8; color: #2b4a8b; }
.relation-box .katex { font-size: 12px; }
.relation-box b { color: #1a3a7a; }
button.action-btn { background: #fff; color: #8B0029; border: 1.5px solid #8B0029; border-radius: 6px; padding: 8px; font-size: 13px; cursor: pointer; font-weight: 600; }
button.action-btn:hover { background: #f8f0f2; }
button.action-btn.active { background: #8B0029; color: #fff; }
button.reset-btn { background: #8B0029; color: #fff; border: none; border-radius: 6px; padding: 9px; font-size: 13px; cursor: pointer; font-weight: 600; }
button.reset-btn:hover { background: #a3003a; }
.canvas-title { position: absolute; top: 8px; left: 16px; right: 16px; pointer-events: none; font-size: 13.5px; font-weight: 700; color: #8B0029; line-height: 1.4; }
.canvas-title .katex { font-size: 13px; }
.hint { position: absolute; bottom: 8px; left: 16px; pointer-events: none; font-size: 11px; color: #6B7280; }
.canvas-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; overflow: hidden;
}
.canvas-overlay .katex-label {
  position: absolute; white-space: nowrap; font-size: 13px; line-height: 1;
  pointer-events: none; transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.85); padding: 1px 5px; border-radius: 4px;
}
.canvas-overlay .katex-label .katex { font-size: 0.95em; }

@media (max-width: 700px) {
  .container { flex-direction: column; }
  .canvas-area { height: 55vh; }
  .controls { width: 100%; height: 45vh; border-left: none; border-top: 2px solid #eee; }
}
</style>
</head>
<body>
<div class="container">
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="canvas-overlay" id="overlay">
      <div class="katex-label" id="lblPhi" style="color:#2563EB;font-weight:bold;"></div>
      <div class="katex-label" id="lblBind" style="color:#8B0029;font-weight:bold;"></div>
      <div class="katex-label" id="lblGPhi" style="color:#2563EB;"></div>
      <div class="katex-label" id="lblGEmf" style="color:#8B0029;"></div>
    </div>
    <div class="canvas-title" id="canvasTitle"></div>
    <div class="hint">자석을 좌우로 끌어 코일에 넣었다 빼 보세요</div>
  </div>
  <div class="controls">
    <div>
      <h2>패러데이 유도 실험실</h2>
      <div class="subtitle">Faraday's Law of Induction (Ch.30)</div>
    </div>

    <div class="theorem-box" id="theoremBox"></div>

    <div class="control-group">
      <label>코일 감김 수 N = <span id="nVal">20</span></label>
      <input type="range" id="nSlider" min="5" max="40" value="20" step="1">
    </div>

    <div class="control-group">
      <label>코일 저항 R = <span id="rVal">2.0</span> Ω</label>
      <input type="range" id="rSlider" min="0.5" max="10" value="2" step="0.5">
    </div>

    <button class="action-btn" id="polarityBtn">&#8646; 자석 극성 반전 (지금: N극이 오른쪽)</button>
    <button class="action-btn" id="autoBtn">&#9654; 자동 왕복 시작</button>

    <div class="info-box" id="infoBox"></div>

    <div class="relation-box" id="lenzBox"></div>

    <div class="formula-box" id="formulaBox"></div>

    <button class="reset-btn" id="resetBtn">&#8635; 기본값 복원</button>
  </div>
</div>

<script>
function tex(expr) { return katex.renderToString(expr, { throwOnError: false, displayMode: false }); }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let CW = 0, CH = 0;

// ---------------- physics state (logical coordinates only) ----------------
const MU0 = 4 * Math.PI * 1e-7;
const COIL_R = 0.06;        // coil radius (m)
const COIL_LEN = 0.12;      // coil length (m)
const MAG_LEN = 0.16;       // magnet length (m)
const MAG_M = 3.0;          // dipole moment magnitude (A·m^2)
const X_LIM = 0.33;         // magnet travel limit (m)
const SCENE_HALF = 0.42;    // half-width of scene (m)
const T_WINDOW = 6.0;       // graph time window (s)

const state = {
  x: -0.26,          // magnet center position (m) — logical, NOT pixels
  N: 20,             // turns
  R: 2.0,            // ohm
  pol: 1,            // +1: N pole on right side of magnet
  auto: false,
  autoT: 0,
  phi: 0,            // per-turn flux (Wb)
  emf: 0,            // smoothed emf (V)
  cur: 0,            // current (A)
  time: 0,
};
let prevPhi = null;
let history = [];    // {t, phi, emf}
let emfScale = 2e-3; // adaptive graph scale (V)
let dragging = false;

const PHI_MAX = MU0 * MAG_M / (2 * COIL_R);   // peak per-turn flux (magnet centered)

// per-turn flux from on-axis dipole at distance dx from coil center
function fluxAt(xm) {
  const dx = xm;  // coil center at x = 0
  return state.pol * MU0 * MAG_M * COIL_R * COIL_R /
         (2 * Math.pow(COIL_R * COIL_R + dx * dx, 1.5));
}

// ---------------- layout mapping (recomputed every draw; iframe-safe) ----------------
function layout() {
  const appH = CH * 0.56;                  // apparatus area height
  const scale = (CW * 0.94) / (2 * SCENE_HALF);
  return {
    scale,
    axisY: 34 + (appH - 34) * 0.5,         // apparatus vertical center (below title)
    appH,
    gX0: 64, gX1: CW - 18,
    g1Y0: CH * 0.60, g1H: CH * 0.155,
    g2Y0: CH * 0.785, g2H: CH * 0.155,
  };
}
function xToPx(xm, L) { return CW / 2 + xm * L.scale; }

// ---------------- drawing helpers ----------------
function drawArrow(x1, y1, x2, y2, color, lw) {
  const headLen = 10;
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2 - (headLen - 2) * Math.cos(angle), y2 - (headLen - 2) * Math.sin(angle));
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - 0.42), y2 - headLen * Math.sin(angle - 0.42));
  ctx.lineTo(x2 - headLen * Math.cos(angle + 0.42), y2 - headLen * Math.sin(angle + 0.42));
  ctx.closePath(); ctx.fill();
}

function drawTextWithBg(txt, x, y, color, font, align) {
  ctx.font = font || '12px sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width;
  const pad = 3;
  let bx = x;
  if ((align || 'center') === 'center') bx = x - w / 2;
  else if (align === 'right') bx = x - w;
  ctx.fillStyle = 'rgba(250,250,250,0.85)';
  ctx.fillRect(bx - pad, y - 8, w + 2 * pad, 16);
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
}

// ---------------- main draw ----------------
function draw() {
  ctx.clearRect(0, 0, CW, CH);
  const L = layout();
  drawApparatus(L);
  drawGraphs(L);
}

function drawApparatus(L) {
  const ay = L.axisY;
  const coilRpx = COIL_R * L.scale;
  const coilHalf = (COIL_LEN / 2) * L.scale;
  const persp = Math.max(7, coilRpx * 0.22);   // ellipse half-width (perspective)

  // axis line
  ctx.strokeStyle = 'rgba(107,114,128,0.4)';
  ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.moveTo(xToPx(-SCENE_HALF, L) + 4, ay);
  ctx.lineTo(xToPx(SCENE_HALF, L) - 4, ay);
  ctx.stroke(); ctx.setLineDash([]);

  // turn positions
  const n = state.N;
  const xs = [];
  for (let k = 0; k < n; k++) {
    const f = n === 1 ? 0.5 : k / (n - 1);
    xs.push(xToPx(-COIL_LEN / 2 + f * COIL_LEN, L));
  }

  // --- back half of turns (top arcs) ---
  ctx.strokeStyle = '#b48894'; ctx.lineWidth = 2;
  for (const cx of xs) {
    ctx.beginPath();
    ctx.ellipse(cx, ay, persp, coilRpx, 0, Math.PI, 2 * Math.PI);
    ctx.stroke();
  }

  // --- flux & induced-field arrows inside coil ---
  const phiSigned = state.phi / PHI_MAX;   // -1..1
  const maxArrow = coilHalf * 1.7;
  if (Math.abs(phiSigned) > 0.02) {
    const len = Math.max(24, Math.abs(phiSigned) * maxArrow);
    const dir = phiSigned > 0 ? 1 : -1;
    const y = ay - coilRpx * 0.45;
    drawArrow(CW / 2 - dir * len / 2, y, CW / 2 + dir * len / 2, y, '#2563EB', 2.5);
    draw._phiLbl = { x: CW / 2, y: y - 16 };
  } else { draw._phiLbl = null; }

  const iFrac = Math.max(-1, Math.min(1, state.cur / 0.005));  // full scale 5 mA
  if (Math.abs(iFrac) > 0.02) {
    const len = Math.max(24, Math.abs(iFrac) * maxArrow);
    const dir = (state.cur > 0 ? 1 : -1);   // i>0 ⇒ B_ind in +x
    const y = ay + coilRpx * 0.45;
    drawArrow(CW / 2 - dir * len / 2, y, CW / 2 + dir * len / 2, y, '#8B0029', 2.5);
    draw._bindLbl = { x: CW / 2, y: y + 18 };
  } else { draw._bindLbl = null; }

  // --- magnet ---
  const mx = xToPx(state.x, L);
  const mw = MAG_LEN * L.scale, mh = Math.min(coilRpx * 0.62, 40);
  const nRight = state.pol > 0;
  // S half
  ctx.fillStyle = nRight ? '#F3F4F6' : '#8B0029';
  ctx.strokeStyle = '#6B7280';
  ctx.fillRect(mx - mw / 2, ay - mh / 2, mw / 2, mh);
  // N half
  ctx.fillStyle = nRight ? '#8B0029' : '#F3F4F6';
  ctx.fillRect(mx, ay - mh / 2, mw / 2, mh);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.strokeRect(mx - mw / 2, ay - mh / 2, mw, mh);
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = nRight ? '#6B7280' : '#fff';
  ctx.fillText(nRight ? 'S' : 'N', mx - mw / 4, ay);
  ctx.fillStyle = nRight ? '#fff' : '#6B7280';
  ctx.fillText(nRight ? 'N' : 'S', mx + mw / 4, ay);

  // --- front half of turns (bottom arcs) + current markers ---
  ctx.strokeStyle = '#8B5A2B'; ctx.lineWidth = 2;
  for (const cx of xs) {
    ctx.beginPath();
    ctx.ellipse(cx, ay, persp, coilRpx, 0, 0, Math.PI);
    ctx.stroke();
  }

  // current direction markers (cross-section symbols on 3 representative turns)
  // i>0 ⇒ B_ind = +x ⇒ current out of screen at TOP of loops (⊙), into screen at bottom (⊗)
  if (Math.abs(iFrac) > 0.02 && xs.length > 0) {
    const marks = [xs[0], xs[Math.floor(xs.length / 2)], xs[xs.length - 1]];
    const out = state.cur > 0;   // true: top=⊙ bottom=⊗
    for (const cx of marks) {
      drawCurrentDot(cx, ay - coilRpx, out);
      drawCurrentDot(cx, ay + coilRpx, !out);
    }
    drawTextWithBg('유도 전류 i = ' + fmt(state.cur * 1e3, 2) + ' mA', CW / 2, ay + coilRpx + 26, '#8B0029', 'bold 12px sans-serif');
  }

  // coil label
  drawTextWithBg('코일 (N = ' + state.N + '회)', CW / 2, ay - coilRpx - 18, '#1a1a1a', 'bold 12px sans-serif');

  // --- galvanometer (needle ∝ current) ---
  drawMeter(L);
}

function drawCurrentDot(x, y, outOfScreen) {
  ctx.beginPath();
  ctx.arc(x, y, 7, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#8B0029'; ctx.lineWidth = 1.8;
  ctx.stroke();
  if (outOfScreen) {
    ctx.beginPath();
    ctx.arc(x, y, 2.2, 0, 2 * Math.PI);
    ctx.fillStyle = '#8B0029';
    ctx.fill();
  } else {
    ctx.strokeStyle = '#8B0029'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(x - 3.6, y - 3.6); ctx.lineTo(x + 3.6, y + 3.6);
    ctx.moveTo(x + 3.6, y - 3.6); ctx.lineTo(x - 3.6, y + 3.6);
    ctx.stroke();
  }
}

function drawMeter(L) {
  const r = Math.min(46, CH * 0.09);
  const cx = CW - r - 26, cy = 40 + r * 1.1;
  ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI * 1.15, Math.PI * 1.85);
  ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 2;
  ctx.stroke();
  // ticks
  for (const f of [-1, -0.5, 0, 0.5, 1]) {
    const a = Math.PI * 1.5 + f * Math.PI * 0.32;
    ctx.beginPath();
    ctx.moveTo(cx + (r - 5) * Math.cos(a), cy + (r - 5) * Math.sin(a));
    ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1;
    ctx.stroke();
  }
  const frac = Math.max(-1, Math.min(1, state.cur / 0.005));
  const a = Math.PI * 1.5 + frac * Math.PI * 0.32;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + (r - 8) * Math.cos(a), cy + (r - 8) * Math.sin(a));
  ctx.strokeStyle = '#8B0029'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 2 * Math.PI);
  ctx.fillStyle = '#1a1a1a'; ctx.fill();
  drawTextWithBg('검류계', cx, cy + 14, '#6B7280', '11px sans-serif');
}

// ---------------- graphs ----------------
function drawGraphs(L) {
  const now = state.time;
  drawStrip(L.gX0, L.g1Y0, L.gX1 - L.gX0, L.g1H, now,
    history.map(h => [h.t, h.phi]), PHI_MAX * 1.15, '#2563EB',
    (PHI_MAX * 1e6).toFixed(0) + ' μWb');
  drawStrip(L.gX0, L.g2Y0, L.gX1 - L.gX0, L.g2H, now,
    history.map(h => [h.t, h.emf]), emfScale, '#8B0029',
    (emfScale * 1e3).toFixed(1) + ' mV');
  draw._gPhiLbl = { x: L.gX0 + 44, y: L.g1Y0 + 10 };
  draw._gEmfLbl = { x: L.gX0 + 110, y: L.g2Y0 + 10 };
}

function drawStrip(x0, y0, w, h, now, data, vmax, color, topLabel) {
  // frame
  ctx.fillStyle = '#fff';
  ctx.fillRect(x0, y0, w, h);
  ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 1;
  ctx.strokeRect(x0, y0, w, h);
  const ymid = y0 + h / 2;
  // zero line
  ctx.strokeStyle = 'rgba(107,114,128,0.5)';
  ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(x0, ymid); ctx.lineTo(x0 + w, ymid); ctx.stroke();
  ctx.setLineDash([]);
  // scale labels
  ctx.font = '10px sans-serif'; ctx.fillStyle = '#6B7280';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('+' + topLabel, x0 - 4, y0 + 7);
  ctx.fillText('0', x0 - 4, ymid);
  ctx.fillText('−' + topLabel, x0 - 4, y0 + h - 7);
  // trace
  if (data.length > 1) {
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath();
    let started = false;
    for (const [t, v] of data) {
      const px = x0 + w * (1 - (now - t) / T_WINDOW);
      if (px < x0) continue;
      const py = ymid - Math.max(-1, Math.min(1, v / vmax)) * (h / 2 - 4);
      if (!started) { ctx.moveTo(px, py); started = true; }
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  // time axis note
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#9ca3af'; ctx.font = '10px sans-serif';
  ctx.fillText('← ' + T_WINDOW + '초', x0 + 4, y0 + h + 3);
}

// ---------------- overlay labels ----------------
function positionOverlay() {
  const set = (el, pos) => {
    if (pos) {
      el.style.display = 'block';
      el.style.left = pos.x + 'px';
      el.style.top = pos.y + 'px';
    } else el.style.display = 'none';
  };
  set(document.getElementById('lblPhi'), draw._phiLbl);
  set(document.getElementById('lblBind'), draw._bindLbl);
  set(document.getElementById('lblGPhi'), draw._gPhiLbl);
  set(document.getElementById('lblGEmf'), draw._gEmfLbl);
}

// ---------------- simulation loop ----------------
let lastTs = null;
function step(ts) {
  if (lastTs === null) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  dt = Math.max(1e-3, Math.min(dt, 0.05));
  state.time += dt;

  if (state.auto && !dragging) {
    state.autoT += dt;
    state.x = 0.27 * Math.sin(2 * Math.PI * state.autoT / 3.2);
  }

  // flux & numeric derivative
  const phi = fluxAt(state.x);
  if (prevPhi === null) prevPhi = phi;
  const rawEmf = -state.N * (phi - prevPhi) / dt;
  prevPhi = phi;
  state.phi = phi;
  state.emf = state.emf + 0.30 * (rawEmf - state.emf);   // smoothing
  if (Math.abs(state.emf) < 1e-7) state.emf = 0;
  state.cur = state.emf / state.R;

  // history
  history.push({ t: state.time, phi: phi, emf: state.emf });
  while (history.length && history[0].t < state.time - T_WINDOW - 0.5) history.shift();

  // adaptive emf scale (decays slowly, grows immediately)
  let peak = 1e-3;
  for (const h of history) peak = Math.max(peak, Math.abs(h.emf));
  emfScale = Math.max(peak * 1.15, emfScale * 0.995);
  emfScale = Math.max(emfScale, 1e-3);

  draw();
  positionOverlay();
  if ((step._n = (step._n || 0) + 1) % 5 === 0) updateInfo();
  requestAnimationFrame(step);
}

// ---------------- info panel ----------------
function fmt(v, d) {
  const s = v.toFixed(d);
  return s === '-' + (0).toFixed(d) ? (0).toFixed(d) : s;
}

function updateInfo() {
  const box = document.getElementById('infoBox');
  const phiU = state.phi * 1e6, emfM = state.emf * 1e3, curM = state.cur * 1e3;
  let html = '';
  html += '<span class="label">감김당 자속</span> <span class="val">' + tex('\\Phi_B = ' + fmt(phiU, 1) + '\\,\\mu\\text{Wb}') + '</span><br>';
  html += '<span class="label">유도 기전력</span> <span class="val">' + tex('\\mathcal{E} = ' + fmt(emfM, 2) + '\\,\\text{mV}') + '</span><br>';
  html += '<span class="label">유도 전류</span> <span class="val">' + tex('i = \\mathcal{E}/R = ' + fmt(curM, 2) + '\\,\\text{mA}') + '</span>';
  box.innerHTML = html;

  const lenz = document.getElementById('lenzBox');
  const dphi = -state.emf / state.N;   // sign of dΦ/dt (since ℰ = −N dΦ/dt)
  let status;
  if (Math.abs(state.emf) < 5e-5) {
    status = '자속 변화 없음 → 유도 전류 없음 <b>(자석이 움직여야 한다!)</b>';
  } else if (dphi > 0) {
    status = '자속 <b>증가 중</b> → 유도 전류의 자기장 ' + tex('\\vec{B}_{\\text{ind}}') + ' 은 자속과 <b>반대 방향</b> (증가를 방해)';
  } else {
    status = '자속 <b>감소 중</b> → 유도 전류의 자기장 ' + tex('\\vec{B}_{\\text{ind}}') + ' 은 자속과 <b>같은 방향</b> (감소를 방해)';
  }
  lenz.innerHTML = '<b>렌츠 법칙</b>: 유도 전류는 자속의 변화를 방해하는 방향으로 흐른다.<br>' + status;
}

function renderStatic() {
  document.getElementById('canvasTitle').innerHTML =
    '패러데이 법칙 ' + tex('\\mathcal{E} = -N\\,d\\Phi_B/dt') +
    ' &nbsp;·&nbsp; 렌츠 법칙: 유도 전류의 자기장은 자속 변화를 <span style="text-decoration:underline">방해</span>한다';

  document.getElementById('theoremBox').innerHTML =
    '패러데이 유도 법칙<br>' +
    tex('\\mathcal{E} = -N\\,\\dfrac{d\\Phi_B}{dt}') + '<br>' +
    '<span style="font-size:11px;font-weight:400">' + tex('\\Phi_B = \\int\\vec{B}\\cdot d\\vec{A}') + '</span>';

  document.getElementById('formulaBox').innerHTML =
    '<b>파란 화살표:</b> 자석이 만드는 자속 ' + tex('\\Phi_B') + '<br>' +
    '<b>빨간 화살표:</b> 유도 전류의 자기장 ' + tex('\\vec{B}_{\\text{ind}}') + '<br>' +
    '<b>⊙ / ⊗:</b> 코일 단면의 전류 방향<br>' +
    '빠르게 움직일수록 ' + tex('|\\mathcal{E}|') + ' 가 커진다';

  document.getElementById('lblPhi').innerHTML = tex('\\Phi_B');
  document.getElementById('lblBind').innerHTML = tex('\\vec{B}_{\\text{ind}}');
  document.getElementById('lblGPhi').innerHTML = tex('\\Phi_B(t)');
  document.getElementById('lblGEmf').innerHTML = tex('\\mathcal{E}(t) = -N\\,d\\Phi_B/dt');
}

// ---------------- interaction ----------------
function eventToCanvas(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  return { x: cx, y: cy };
}

function magnetHit(px, py) {
  const L = layout();
  const mx = xToPx(state.x, L);
  const mw = MAG_LEN * L.scale, mh = Math.min(COIL_R * L.scale * 0.62, 40);
  return Math.abs(px - mx) < mw / 2 + 12 && Math.abs(py - L.axisY) < mh / 2 + 14;
}

function onDown(e) {
  const p = eventToCanvas(e);
  if (magnetHit(p.x, p.y)) {
    dragging = true;
    canvas.style.cursor = 'grabbing';
    e.preventDefault();
  }
}
function onMove(e) {
  const p = eventToCanvas(e);
  if (dragging) {
    const L = layout();
    state.x = Math.max(-X_LIM, Math.min(X_LIM, (p.x - CW / 2) / L.scale));
    e.preventDefault();
  } else {
    canvas.style.cursor = magnetHit(p.x, p.y) ? 'grab' : 'default';
  }
}
function onUp() { dragging = false; canvas.style.cursor = 'default'; }

canvas.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onUp);

// ---------------- controls ----------------
const nSlider = document.getElementById('nSlider');
const rSlider = document.getElementById('rSlider');
const polarityBtn = document.getElementById('polarityBtn');
const autoBtn = document.getElementById('autoBtn');

nSlider.addEventListener('input', () => {
  state.N = parseInt(nSlider.value);
  document.getElementById('nVal').textContent = state.N;
});
rSlider.addEventListener('input', () => {
  state.R = parseFloat(rSlider.value);
  document.getElementById('rVal').textContent = state.R.toFixed(1);
});
polarityBtn.addEventListener('click', () => {
  state.pol *= -1;
  prevPhi = fluxAt(state.x);   // avoid a fake emf spike from instantaneous flip
  polarityBtn.innerHTML = '&#8646; 자석 극성 반전 (지금: N극이 ' + (state.pol > 0 ? '오른쪽' : '왼쪽') + ')';
});
autoBtn.addEventListener('click', () => {
  state.auto = !state.auto;
  if (state.auto) {
    // start the oscillation smoothly from the current position
    const s = Math.max(-1, Math.min(1, state.x / 0.27));
    state.autoT = Math.asin(s) * 3.2 / (2 * Math.PI);
    autoBtn.innerHTML = '&#9646;&#9646; 자동 왕복 정지';
    autoBtn.classList.add('active');
  } else {
    autoBtn.innerHTML = '&#9654; 자동 왕복 시작';
    autoBtn.classList.remove('active');
  }
});
document.getElementById('resetBtn').addEventListener('click', () => {
  state.x = -0.26; state.N = 20; state.R = 2.0; state.pol = 1;
  state.auto = false; state.autoT = 0;
  state.emf = 0; state.cur = 0;
  prevPhi = fluxAt(state.x);
  history = [];
  emfScale = 2e-3;
  nSlider.value = 20; rSlider.value = 2;
  document.getElementById('nVal').textContent = '20';
  document.getElementById('rVal').textContent = '2.0';
  polarityBtn.innerHTML = '&#8646; 자석 극성 반전 (지금: N극이 오른쪽)';
  autoBtn.innerHTML = '&#9654; 자동 왕복 시작';
  autoBtn.classList.remove('active');
});

// ---------------- resize (HiDPI) ----------------
function resize() {
  dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  CW = rect.width; CH = rect.height;
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
  positionOverlay();
}
window.addEventListener('resize', resize);

renderStatic();
resize();
updateInfo();
requestAnimationFrame(step);
</script>
