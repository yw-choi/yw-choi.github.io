<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이중슬릿 간섭</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; overflow: hidden; }
.container { display: flex; height: 100vh; }
.canvas-area { flex: 1; position: relative; background: #fafafa; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.controls { width: 260px; padding: 16px; border-left: 2px solid #eee; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.controls h2 { color: #8B0029; font-size: 15px; margin-bottom: 0; }
.subtitle { color: #888; font-size: 11px; margin-bottom: 4px; }
.control-group { display: flex; flex-direction: column; gap: 3px; }
.control-group label { font-size: 12.5px; font-weight: 600; color: #444; }
.control-group input[type="range"] { width: 100%; accent-color: #8B0029; }
.info-box { background: #f8f0f2; border: 1px solid #e0c0c8; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.9; }
.info-box .label { color: #8B0029; font-weight: 700; }
.info-box .val { font-weight: 700; }
.info-box .katex { font-size: 12px; }
.theorem-box { background: #8B0029; color: #fff; border-radius: 8px; padding: 10px; font-size: 13px; text-align: center; font-weight: 700; line-height: 1.9; }
.theorem-box .katex { color: #fff; font-size: 13px; }
.formula-box { background: #f9f0f2; border: 1px solid rgba(139,0,41,0.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 2.0; color: #555; }
.formula-box b { color: #8B0029; }
.formula-box .katex { font-size: 12px; }
.relation-box { background: #eef3fe; border: 1px solid #c3d4f5; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.8; color: #2b4a8b; }
.relation-box .katex { font-size: 12px; }
.relation-box b { color: #1a3a7a; }
button.play-btn, button.reset-btn { background: #8B0029; color: #fff; border: none; border-radius: 6px; padding: 9px; font-size: 13px; cursor: pointer; font-weight: 600; }
button.play-btn:hover, button.reset-btn:hover { background: #a3003a; }
button.play-btn.paused { background: #2563EB; }
.canvas-title { position: absolute; top: 8px; left: 16px; right: 16px; pointer-events: none; font-size: 13.5px; font-weight: 700; color: #8B0029; line-height: 1.4; }
.canvas-title .katex { font-size: 13px; }
.hint { position: absolute; bottom: 8px; left: 16px; pointer-events: none; font-size: 11px; color: #6B7280; }
.canvas-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; overflow: hidden;
}
.canvas-overlay .katex-label {
  position: absolute; white-space: nowrap; font-size: 13px; line-height: 1;
  pointer-events: none; transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.88); padding: 2px 6px; border-radius: 4px;
}
.canvas-overlay .katex-label .katex { font-size: 0.95em; }
@media (max-width: 700px) {
  .container { flex-direction: column; }
  .canvas-area { height: 55vh; }
  .controls { width: 100%; height: 45vh; border-left: none; border-top: 2px solid #eee; }
}
</style>
</head>
<body>
<div class="container">
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="canvas-overlay" id="overlay">
      <div class="katex-label" id="lblDy" style="color:#8B0029;font-weight:bold;"></div>
    </div>
    <div class="canvas-title" id="canvasTitle"></div>
    <div class="hint">슬라이더로 d, λ, D를 바꾸면 스크린의 간섭 무늬가 실시간으로 변합니다</div>
  </div>
  <div class="controls">
    <div>
      <h2>이중슬릿 간섭</h2>
      <div class="subtitle">Young's Double-Slit Experiment (Ch.35)</div>
    </div>

    <div class="theorem-box" id="theoremBox"></div>

    <div class="control-group">
      <label>슬릿 간격 d = <span id="dVal">0.15</span> mm</label>
      <input type="range" id="dSlider" min="0.05" max="0.30" value="0.15" step="0.01">
    </div>

    <div class="control-group">
      <label>파장 λ = <span id="lamVal">550</span> nm</label>
      <input type="range" id="lamSlider" min="400" max="700" value="550" step="10">
    </div>

    <div class="control-group">
      <label>스크린 거리 D = <span id="DVal">1.0</span> m</label>
      <input type="range" id="DSlider" min="0.5" max="2.0" value="1.0" step="0.1">
    </div>

    <div class="info-box" id="infoBox"></div>

    <div class="relation-box" id="relationBox"></div>

    <div class="formula-box" id="formulaBox"></div>

    <button class="play-btn" id="playBtn">&#10074;&#10074; 파동 정지</button>
    <button class="reset-btn" id="resetBtn">&#8635; 기본값 복원</button>
  </div>
</div>

<script>
function tex(expr) { return katex.renderToString(expr, { throwOnError: false, displayMode: false }); }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let CW = 0, CH = 0;

const dSlider = document.getElementById('dSlider');
const lamSlider = document.getElementById('lamSlider');
const DSlider = document.getElementById('DSlider');
const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');

// ---- physical parameters (SI) ----
let d_mm = 0.15;     // slit separation [mm]
let lam_nm = 550;    // wavelength [nm]
let D_m = 1.0;       // slit-screen distance [m]
const Y_MAX_MM = 12; // screen half-window shown [mm]

let running = true;
let phase = 0;       // wave animation phase [px]
let lastT = 0;

// ---- layout (recomputed every frame from CW/CH: iframe-safe) ----
function layout() {
  const xBarrier = Math.max(70, CW * 0.17);
  const xScreen  = CW - 170;                 // leave room for strip + graph + labels
  const cy = CH * 0.5;
  const halfH = Math.min(CH * 0.42, 230);    // half-height of screen window in px
  const dPx = 30 + (d_mm - 0.05) / 0.25 * 50; // schematic slit gap 30..80 px
  return { xBarrier, xScreen, cy, halfH, dPx };
}

// wavelength (nm) -> approximate RGB
function wavelengthToRGB(w) {
  let r = 0, g = 0, b = 0;
  if (w < 440)      { r = -(w - 440) / 60; g = 0; b = 1; }
  else if (w < 490) { r = 0; g = (w - 440) / 50; b = 1; }
  else if (w < 510) { r = 0; g = 1; b = -(w - 510) / 20; }
  else if (w < 580) { r = (w - 510) / 70; g = 1; b = 0; }
  else if (w < 645) { r = 1; g = -(w - 645) / 65; b = 0; }
  else              { r = 1; g = 0; b = 0; }
  return [Math.round(r * 235), Math.round(g * 205), Math.round(b * 235)];
}

// fringe spacing on screen [mm]
function fringeSpacingMM() {
  return (lam_nm * 1e-9) * D_m / (d_mm * 1e-3) * 1000;
}
// intensity ratio I/(4 I0) at screen height y [mm], small-angle
function intensityRatio(y_mm) {
  const arg = Math.PI * (d_mm * 1e-3) * (y_mm * 1e-3) / ((lam_nm * 1e-9) * D_m);
  const c = Math.cos(arg);
  return c * c;
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  CW = rect.width; CH = rect.height;
  canvas.width = Math.max(1, CW * dpr); canvas.height = Math.max(1, CH * dpr);
  canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function drawTextWithBg(x, y, txt, color, font, align) {
  ctx.font = font || '12px sans-serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width;
  const x0 = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(x0 - 3, y - 9, w + 6, 18);
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
}

function drawArcsFromSlit(sx, sy, lamPx, maxR, rgb, xBarrier, xScreen) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(xBarrier + 4, 0, xScreen - xBarrier - 4, CH);
  ctx.clip();
  const first = ((phase % lamPx) + lamPx) % lamPx;
  for (let r = first; r < maxR; r += lamPx) {
    if (r < 2) continue;
    const alpha = 0.85 * (1 - r / maxR) + 0.12;
    ctx.strokeStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(sx, sy, r, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  if (CW <= 0 || CH <= 0) return;   // iframe not laid out yet
  ctx.clearRect(0, 0, CW, CH);

  const { xBarrier, xScreen, cy, halfH, dPx } = layout();
  const s1y = cy + dPx / 2;   // S1 (bottom)
  const s2y = cy - dPx / 2;   // S2 (top)
  const rgb = wavelengthToRGB(lam_nm);
  const lamPx = 16 + (lam_nm - 400) / 300 * 12;   // schematic wavelength 16..28 px

  // ---- incident plane wave (left of barrier) ----
  const first = ((phase % lamPx) + lamPx) % lamPx;
  for (let x = xBarrier - first; x > 14; x -= lamPx) {
    ctx.strokeStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.55)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(x, cy - halfH * 0.75);
    ctx.lineTo(x, cy + halfH * 0.75);
    ctx.stroke();
  }
  // propagation arrow
  ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(20, cy); ctx.lineTo(52, cy); ctx.stroke();
  ctx.fillStyle = '#6B7280';
  ctx.beginPath(); ctx.moveTo(58, cy); ctx.lineTo(48, cy - 4.5); ctx.lineTo(48, cy + 4.5); ctx.closePath(); ctx.fill();

  // ---- circular waves from the two slits ----
  const maxR = Math.hypot(xScreen - xBarrier, halfH) + 10;
  drawArcsFromSlit(xBarrier + 2, s2y, lamPx, maxR, rgb, xBarrier, xScreen);
  drawArcsFromSlit(xBarrier + 2, s1y, lamPx, maxR, rgb, xBarrier, xScreen);

  // ---- barrier with two slits ----
  const slitHalf = 5;
  ctx.fillStyle = '#374151';
  ctx.fillRect(xBarrier - 3, cy - halfH, 6, (s2y - slitHalf) - (cy - halfH));
  ctx.fillRect(xBarrier - 3, s2y + slitHalf, 6, (s1y - slitHalf) - (s2y + slitHalf));
  ctx.fillRect(xBarrier - 3, s1y + slitHalf, 6, (cy + halfH) - (s1y + slitHalf));
  drawTextWithBg(xBarrier - 10, s2y - 14, 'S₂', '#1a1a1a', 'bold 12px sans-serif', 'right');
  drawTextWithBg(xBarrier - 10, s1y + 14, 'S₁', '#1a1a1a', 'bold 12px sans-serif', 'right');

  // d marker between slits
  ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(xBarrier - 14, s2y); ctx.lineTo(xBarrier - 14, s1y); ctx.stroke();
  drawTextWithBg(xBarrier - 24, cy, 'd', '#6B7280', 'italic 12px sans-serif', 'right');

  // D marker along bottom
  const yDim = cy + halfH + 16;
  if (yDim < CH - 12) {
    ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(xBarrier, yDim); ctx.lineTo(xScreen, yDim); ctx.stroke();
    ctx.setLineDash([]);
    drawTextWithBg((xBarrier + xScreen) / 2, yDim, 'D = ' + D_m.toFixed(1) + ' m', '#6B7280', 'italic 12px sans-serif', 'center');
  }

  // ---- screen bar ----
  ctx.fillStyle = '#6B7280';
  ctx.fillRect(xScreen, cy - halfH, 4, 2 * halfH);

  // ---- fringe strip (physical window ±Y_MAX_MM) ----
  const stripX = xScreen + 8, stripW = 26;
  const pxPerMM = halfH / Y_MAX_MM;
  ctx.fillStyle = '#111827';
  ctx.fillRect(stripX, cy - halfH, stripW, 2 * halfH);
  for (let py = -halfH; py <= halfH; py += 1) {
    const y_mm = py / pxPerMM;
    const I = intensityRatio(y_mm);
    if (I < 0.004) continue;
    ctx.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + I.toFixed(3) + ')';
    ctx.fillRect(stripX, cy + py, stripW, 1.2);
  }

  // ---- intensity graph I(y) ----
  const gX = stripX + stripW + 14, gW = 74;
  ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(gX, cy - halfH); ctx.lineTo(gX, cy + halfH); ctx.stroke();
  ctx.strokeStyle = '#8B0029'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let py = -halfH; py <= halfH; py += 1) {
    const I = intensityRatio(py / pxPerMM);
    const x = gX + I * gW;
    if (py === -halfH) ctx.moveTo(x, cy + py); else ctx.lineTo(x, cy + py);
  }
  ctx.stroke();
  drawTextWithBg(gX + gW / 2, cy - halfH - 12, 'I(y)', '#8B0029', 'italic bold 12px sans-serif', 'center');
  ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(gX + gW, cy - halfH); ctx.lineTo(gX + gW, cy + halfH); ctx.stroke();
  ctx.setLineDash([]);
  drawTextWithBg(gX + gW, cy + halfH + 11, '4I₀', '#6B7280', '11px sans-serif', 'center');

  // ---- bright-fringe positions y_m = m λ D / d ----
  const dy_mm = fringeSpacingMM();
  const dy_px = dy_mm * pxPerMM;
  const mMax = Math.floor(Y_MAX_MM / dy_mm);
  const showLabels = dy_px >= 18;
  for (let m = -mMax; m <= mMax; m++) {
    const py = m * dy_px;
    if (Math.abs(py) > halfH) continue;
    ctx.strokeStyle = 'rgba(107,114,128,0.6)'; ctx.lineWidth = 1;
    ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(stripX - 3, cy + py); ctx.lineTo(stripX + stripW + 3, cy + py); ctx.stroke();
    ctx.setLineDash([]);
    if (showLabels && Math.abs(m) <= 3) {
      drawTextWithBg(gX + gW + 2, cy + py, 'm=' + Math.abs(m), '#1a1a1a', '11px sans-serif', 'left');
    }
  }

  // mm scale on the screen bar
  for (let mm = -10; mm <= 10; mm += 5) {
    const py = -mm * pxPerMM;   // canvas y grows downward; +y is up on the screen
    ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xScreen - 5, cy + py); ctx.lineTo(xScreen, cy + py); ctx.stroke();
    if (mm !== 0) drawTextWithBg(xScreen - 8, cy + py, (mm > 0 ? '+' : '') + mm + ' mm', '#6B7280', '10px sans-serif', 'right');
  }

  positionOverlay(cy, halfH, dy_px, stripX, stripW, gX, gW);
}

function positionOverlay(cy, halfH, dy_px, stripX, stripW, gX, gW) {
  const lbl = document.getElementById('lblDy');
  const dy_mm = fringeSpacingMM();
  lbl.innerHTML = tex('\\Delta y = \\dfrac{\\lambda D}{d} = ' + dy_mm.toFixed(2) + '\\ \\text{mm}');
  // place near top of graph area, clear of moving content
  lbl.style.left = Math.min(gX + gW / 2 + 8, CW - 78) + 'px';
  lbl.style.top = Math.max(36, cy - halfH - 34) + 'px';
}

// ---------- animation ----------
function frame(t) {
  if (CW <= 0 && canvas.parentElement) {
    const rect = canvas.parentElement.getBoundingClientRect();
    if (rect.width > 0) resize();       // lazy init inside iframe
  }
  if (running) {
    if (lastT) phase += Math.min(t - lastT, 50) * 0.045;   // wave speed [px/ms]
    lastT = t;
    draw();
  } else {
    lastT = t;
  }
  requestAnimationFrame(frame);
}

// ---------- UI ----------
function fmt(v, digits) { return Number(v).toFixed(digits); }

function updateInfo() {
  const dy = fringeSpacingMM();
  const box = document.getElementById('infoBox');
  let html = '';
  html += '<span class="label">무늬 간격</span> <span class="val">Δy = ' + dy.toFixed(2) + ' mm</span><br>';
  html += '<span class="label">밝은 무늬 위치</span><br>';
  html += 'y₁ = ' + dy.toFixed(2) + ' mm, y₂ = ' + (2 * dy).toFixed(2) + ' mm<br>';
  html += '<span class="label">첫 어두운 무늬</span> y = ' + (dy / 2).toFixed(2) + ' mm';
  box.innerHTML = html;
}

function renderStatic() {
  document.getElementById('canvasTitle').innerHTML =
    '영의 이중슬릿 간섭 &mdash; 밝은 무늬: ' + tex('d\\sin\\theta = m\\lambda') +
    ', &nbsp;어두운 무늬: ' + tex('d\\sin\\theta = (m+\\tfrac{1}{2})\\lambda');

  document.getElementById('theoremBox').innerHTML =
    '밝은 무늬의 위치<br>' +
    tex('y_m = \\dfrac{m\\lambda D}{d}') + '<br>' +
    '<span style="font-size:11px;font-weight:400">(작은 각 근사 ' + tex('\\sin\\theta \\approx \\tan\\theta = y/D') + ')</span>';

  document.getElementById('formulaBox').innerHTML =
    '<b>스크린 띠:</b> 두 슬릿 파동의 간섭 무늬<br>' +
    '<b>빨간 곡선:</b> 세기 ' + tex('I = 4I_0\\cos^2(\\phi/2)') + '<br>' +
    '<b>위상차:</b> ' + tex('\\phi = \\dfrac{2\\pi d}{\\lambda}\\sin\\theta');
}

function renderRelation() {
  document.getElementById('relationBox').innerHTML =
    '<b>무늬 간격의 경향</b><br>' +
    tex('\\Delta y = \\lambda D / d') + '<br>' +
    'd가 작을수록, λ·D가 클수록 무늬가 <b>넓게</b> 벌어진다';
}

dSlider.addEventListener('input', () => {
  d_mm = parseFloat(dSlider.value);
  document.getElementById('dVal').textContent = fmt(d_mm, 2);
  updateInfo(); draw();
});
lamSlider.addEventListener('input', () => {
  lam_nm = parseFloat(lamSlider.value);
  document.getElementById('lamVal').textContent = fmt(lam_nm, 0);
  updateInfo(); draw();
});
DSlider.addEventListener('input', () => {
  D_m = parseFloat(DSlider.value);
  document.getElementById('DVal').textContent = fmt(D_m, 1);
  updateInfo(); draw();
});

playBtn.addEventListener('click', () => {
  running = !running;
  playBtn.innerHTML = running ? '&#10074;&#10074; 파동 정지' : '&#9654; 파동 재생';
  playBtn.classList.toggle('paused', !running);
});

resetBtn.addEventListener('click', () => {
  d_mm = 0.15; lam_nm = 550; D_m = 1.0;
  dSlider.value = 0.15; lamSlider.value = 550; DSlider.value = 1.0;
  document.getElementById('dVal').textContent = '0.15';
  document.getElementById('lamVal').textContent = '550';
  document.getElementById('DVal').textContent = '1.0';
  updateInfo(); draw();
});

window.addEventListener('resize', resize);

renderStatic();
renderRelation();
updateInfo();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
