<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>표류 속도와 전류</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; overflow: hidden; }
.container { display: flex; height: 100vh; }
.canvas-area { flex: 1; position: relative; background: #fafafa; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.controls { width: 260px; padding: 16px; border-left: 2px solid #eee; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.controls h2 { color: #8B0029; font-size: 15px; margin-bottom: 0; }
.subtitle { color: #888; font-size: 11px; margin-bottom: 4px; }
.control-group { display: flex; flex-direction: column; gap: 3px; }
.control-group label { font-size: 12.5px; font-weight: 600; color: #444; }
.control-group input[type="range"] { width: 100%; accent-color: #8B0029; }
.info-box { background: #f8f0f2; border: 1px solid #e0c0c8; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.9; }
.info-box .label { color: #8B0029; font-weight: 700; }
.info-box .val { font-weight: 700; }
.info-box .katex { font-size: 12px; }
.theorem-box { background: #8B0029; color: #fff; border-radius: 8px; padding: 10px; font-size: 13px; text-align: center; font-weight: 700; line-height: 1.6; }
.theorem-box .katex { color: #fff; font-size: 14px; }
.formula-box { background: #f9f0f2; border: 1px solid rgba(139,0,41,0.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 2.0; color: #555; }
.formula-box b { color: #8B0029; }
.formula-box .katex { font-size: 12px; }
.relation-box { background: #eef3fe; border: 1px solid #c3d4f5; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.8; color: #2b4a8b; }
.relation-box .katex { font-size: 12px; }
.relation-box b { color: #1a3a7a; }
.btn-row { display: flex; gap: 8px; }
button.ctl-btn { flex: 1; background: #8B0029; color: #fff; border: none; border-radius: 6px; padding: 9px; font-size: 13px; cursor: pointer; font-weight: 600; }
button.ctl-btn:hover { background: #a3003a; }
button.ctl-btn.secondary { background: #6B7280; }
button.ctl-btn.secondary:hover { background: #4b5563; }
.canvas-title { position: absolute; top: 8px; left: 16px; right: 16px; pointer-events: none; font-size: 14px; font-weight: 700; color: #8B0029; line-height: 1.4; }
.canvas-title .katex { font-size: 14px; }
.hint { position: absolute; bottom: 8px; left: 16px; pointer-events: none; font-size: 11px; color: #6B7280; }
.canvas-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; overflow: hidden;
}
.canvas-overlay .katex-label {
  position: absolute; white-space: nowrap; font-size: 13px; line-height: 1;
  pointer-events: none; transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.85); padding: 1px 5px; border-radius: 4px;
}
.canvas-overlay .katex-label .katex { font-size: 0.95em; }
@media (max-width: 700px) {
  .container { flex-direction: column; }
  .canvas-area { height: 55vh; }
  .controls { width: 100%; height: 45vh; border-left: none; border-top: 2px solid #eee; }
}
</style>
</head>
<body>
<div class="container">
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="canvas-overlay" id="overlay">
      <div class="katex-label" id="lblE" style="color:#8B0029;font-weight:bold;"></div>
      <div class="katex-label" id="lblI" style="color:#8B0029;font-weight:bold;"></div>
      <div class="katex-label" id="lblVd" style="color:#2563EB;font-weight:bold;"></div>
    </div>
    <div class="canvas-title" id="canvasTitle"></div>
    <div class="hint">전기장 E를 0으로 낮추면 표류가 사라지고 전류가 0이 됩니다 (표류는 크게 과장해서 표시)</div>
  </div>
  <div class="controls">
    <div>
      <h2>표류 속도와 전류</h2>
      <div class="subtitle">Drift Speed &amp; Current (Ch.26)</div>
    </div>

    <div class="theorem-box" id="theoremBox"></div>

    <div class="control-group">
      <label>전기장 E = <span id="EVal">0.040</span> V/m</label>
      <input type="range" id="ESlider" min="0" max="0.10" value="0.04" step="0.005">
    </div>

    <div class="control-group">
      <label>전자 밀도 n = <span id="nVal">8.5</span> ×10²⁸ m⁻³</label>
      <input type="range" id="nSlider" min="1" max="12" value="8.5" step="0.5">
    </div>

    <div class="control-group">
      <label>단면적 A = <span id="AVal">1.0</span> mm²</label>
      <input type="range" id="ASlider" min="0.5" max="3.0" value="1.0" step="0.1">
    </div>

    <div class="info-box" id="infoBox"></div>

    <div class="relation-box" id="relationBox"></div>

    <div class="formula-box" id="formulaBox"></div>

    <div class="btn-row">
      <button class="ctl-btn" id="pauseBtn">&#10074;&#10074; 정지</button>
      <button class="ctl-btn secondary" id="resetBtn">&#8635; 기본값</button>
    </div>
  </div>
</div>

<script>
function tex(expr) { return katex.renderToString(expr, { throwOnError: false, displayMode: false }); }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let CW = 0, CH = 0;

// ---------- physics constants ----------
const e = 1.602e-19;      // C
const m = 9.11e-31;       // kg
const tau = 2.5e-14;      // s  (mean free time, copper)
const VD_MAX = e * 0.10 * tau / m;   // v_d at E max (for arrow scaling)

// ---------- state ----------
const state = { E: 0.04, n: 8.5, A: 1.0, running: true };

// Electrons live in LOGICAL coordinates:
//   x in [0,1) : fraction of canvas width (wraps around)
//   y in [0,1] : fraction of wire interior height
// Pixel mapping happens every frame in draw(), so a canvas that starts
// with zero size (iframe) or gets resized never corrupts positions.
const electrons = [];

function physics() {
  const vd = e * state.E * tau / m;                    // m/s
  const i = state.n * 1e28 * state.A * 1e-6 * e * vd;  // A
  return { vd, i };
}

function targetCount() {
  return Math.max(4, Math.min(90, Math.round(25 * (state.n / 8.5) * state.A)));
}

function makeElectron() {
  const ang = Math.random() * Math.PI * 2;
  return {
    x: Math.random(), y: 0.08 + Math.random() * 0.84,
    ux: Math.cos(ang), uy: Math.sin(ang),      // thermal direction (unit)
    scatterT: 0.2 + Math.random() * 0.6,
  };
}

function syncElectronCount() {
  const N = targetCount();
  while (electrons.length < N) electrons.push(makeElectron());
  while (electrons.length > N) electrons.pop();
}

// ---------- geometry (recomputed every frame from CW/CH) ----------
function wireGeom() {
  const hFrac = 0.22 + 0.38 * (state.A - 0.5) / 2.5;   // 0.22 ~ 0.60
  const wh = CH * hFrac;
  const top = CH * 0.56 - wh / 2;
  return { top, bot: top + wh, h: wh };
}

// ---------- canvas sizing (iframe-safe lazy init) ----------
function syncCanvasSize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  if (w < 2 || h < 2) return false;                    // layout not ready yet
  dpr = window.devicePixelRatio || 1;
  if (Math.abs(w - CW) > 0.5 || Math.abs(h - CH) > 0.5 ||
      canvas.width !== Math.round(w * dpr)) {
    CW = w; CH = h;
    canvas.width = Math.round(CW * dpr);
    canvas.height = Math.round(CH * dpr);
    canvas.style.width = CW + 'px';
    canvas.style.height = CH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  return true;
}

// ---------- simulation step ----------
const THERMAL_PX = 70;        // exaggerated thermal speed, px/s
const DRIFT_PX_MAX = 110;     // screen speed at E = E_max, px/s
let meanVx = 0;               // EMA of screen x-velocity (px/s)

function step(dt) {
  const { vd } = physics();
  const driftPx = -(vd / VD_MAX) * DRIFT_PX_MAX * (state.E > 0 ? 1 : 0); // electrons drift LEFT (E points right)
  const g = wireGeom();
  let sumVx = 0;
  for (const el of electrons) {
    el.scatterT -= dt;
    if (el.scatterT <= 0) {                 // collision: new random direction
      const ang = Math.random() * Math.PI * 2;
      el.ux = Math.cos(ang); el.uy = Math.sin(ang);
      el.scatterT = 0.2 + Math.random() * 0.6;
    }
    const vx = el.ux * THERMAL_PX + driftPx;   // px/s
    const vy = el.uy * THERMAL_PX;
    sumVx += vx;
    el.x += (vx * dt) / CW;
    el.y += (vy * dt) / g.h;
    if (el.x < 0) el.x += 1;
    if (el.x >= 1) el.x -= 1;
    if (el.y < 0.06) { el.y = 0.06; el.uy = Math.abs(el.uy); }
    if (el.y > 0.94) { el.y = 0.94; el.uy = -Math.abs(el.uy); }
  }
  const inst = electrons.length ? sumVx / electrons.length : 0;
  meanVx += (inst - meanVx) * Math.min(1, dt * 2.5);   // smooth
}

// ---------- drawing ----------
function drawArrow(x1, y1, x2, y2, color, lw) {
  const headLen = 11;
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2 - (headLen - 2) * Math.cos(angle), y2 - (headLen - 2) * Math.sin(angle));
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - 0.42), y2 - headLen * Math.sin(angle - 0.42));
  ctx.lineTo(x2 - headLen * Math.cos(angle + 0.42), y2 - headLen * Math.sin(angle + 0.42));
  ctx.closePath(); ctx.fill();
}

function drawTextWithBg(text, x, y, color, font) {
  ctx.font = font || '12px sans-serif';
  const w = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(x - w / 2 - 4, y - 9, w + 8, 18);
  ctx.fillStyle = color;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function draw() {
  ctx.clearRect(0, 0, CW, CH);
  const g = wireGeom();
  const { vd, i } = physics();

  // wire band
  ctx.fillStyle = '#F3F4F6';
  ctx.fillRect(0, g.top, CW, g.h);
  ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, g.top); ctx.lineTo(CW, g.top); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, g.bot); ctx.lineTo(CW, g.bot); ctx.stroke();

  // electrons
  for (const el of electrons) {
    const px = el.x * CW;
    const py = g.top + el.y * g.h;
    ctx.fillStyle = '#2563EB';
    ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(px - 2.6, py); ctx.lineTo(px + 2.6, py); ctx.stroke();
  }

  const lblE = document.getElementById('lblE');
  const lblI = document.getElementById('lblI');
  const lblVd = document.getElementById('lblVd');

  if (state.E > 0) {
    // E field arrow (points right), above wire, left third
    const eLen = 36 + 110 * (state.E / 0.10);
    const ey = g.top - 34;
    drawArrow(CW * 0.18, ey, CW * 0.18 + eLen, ey, '#8B0029', 3);
    lblE.style.display = 'block';
    lblE.style.left = (CW * 0.18 + eLen + 28) + 'px';
    lblE.style.top = ey + 'px';
    lblE.innerHTML = tex('\\vec{E}');

    // current arrow i (same direction as E), above wire, right third
    const iy = g.top - 34;
    const iLen = 36 + 110 * Math.min(1, i / 26);
    drawArrow(CW * 0.62, iy, CW * 0.62 + iLen, iy, '#8B0029', 3);
    lblI.style.display = 'block';
    lblI.style.left = (CW * 0.62 + iLen + 24) + 'px';
    lblI.style.top = iy + 'px';
    lblI.innerHTML = tex('i');

    // drift velocity arrow (electrons drift LEFT), below wire
    const vLen = 30 + 120 * (vd / VD_MAX);
    const vy = g.bot + 34;
    drawArrow(CW * 0.55, vy, CW * 0.55 - vLen, vy, '#2563EB', 3);
    lblVd.style.display = 'block';
    lblVd.style.left = (CW * 0.55 - vLen - 30) + 'px';
    lblVd.style.top = vy + 'px';
    lblVd.innerHTML = tex('\\vec{v}_d');
  } else {
    lblE.style.display = 'none';
    lblI.style.display = 'none';
    lblVd.style.display = 'none';
    drawTextWithBg('전기장 없음 — 무작위 열운동뿐, 알짜 흐름 없음 (i = 0)', CW / 2, g.top - 30, '#6B7280', 'bold 13px sans-serif');
  }
}

// ---------- panel ----------
function fmtSci(v, unit) {
  if (v === 0) return '0 ' + unit;
  const exp = Math.floor(Math.log10(Math.abs(v)));
  if (exp >= -2 && exp < 4) {
    return (exp >= 2 ? v.toFixed(1) : v.toFixed(exp >= 0 ? 2 : 3)) + ' ' + unit;
  }
  const mant = (v / Math.pow(10, exp)).toFixed(2);
  return mant + '×10' + sup(exp) + ' ' + unit;
}
function sup(n) {
  const map = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  return String(n).split('').map(c => map[c] || c).join('');
}

function updateInfo() {
  const { vd, i } = physics();
  let html = '';
  html += '<span class="label">표류 속도</span> <span class="val">v<sub>d</sub> = ' + fmtSci(vd, 'm/s') + '</span><br>';
  html += '<span class="label">전류</span> <span class="val">i = n A e v<sub>d</sub> = ' + fmtSci(i, 'A') + '</span><br>';
  if (vd > 0) {
    const tHour = 1 / vd / 3600;
    html += '<span class="label">1 m 가는 데</span> <span class="val">약 ' + (tHour >= 1 ? tHour.toFixed(1) + '시간' : (1 / vd / 60).toFixed(0) + '분') + '</span><br>';
  }
  html += '<span style="font-size:10.5px;color:#6B7280">화면 전자 평균 속도 ⟨v<sub>x</sub>⟩ ≈ ' + meanVx.toFixed(0) + ' px/s ' +
          (state.E === 0 ? '(0 주위에서 요동)' : '(왼쪽으로 표류)') + '</span>';
  document.getElementById('infoBox').innerHTML = html;
}

function renderStatic() {
  document.getElementById('canvasTitle').innerHTML =
    '전류의 미시적 기원: ' + tex('i = nAev_d') +
    ' — 무작위 열운동에 <span style="color:#2563EB">표류</span>가 더해지면 전류가 흐른다';

  document.getElementById('theoremBox').innerHTML =
    '전류의 미시적 표현<br>' +
    tex('i = nAev_d') + '<br>' +
    '<span style="font-size:11px;font-weight:400">' + tex('v_d = \\dfrac{eE\\tau}{m}') + '</span>';

  document.getElementById('formulaBox').innerHTML =
    '<b>τ (평균 충돌 시간):</b> ' + tex('\\tau \\approx 2.5\\times10^{-14}\\,\\text{s}') + ' (구리)<br>' +
    '<b>미시적 옴 법칙:</b> ' + tex('\\rho = \\dfrac{m}{e^2 n \\tau}') + '<br>' +
    '<span style="font-size:11px">전자(파랑)는 ' + tex('\\vec{E}') + ' 와 반대로 표류, 전류 ' + tex('i') + ' 는 ' + tex('\\vec{E}') + ' 방향</span>';

  document.getElementById('relationBox').innerHTML =
    '<b>확인해 볼 것</b><br>' +
    '· E = 0 : 무작위 운동뿐 → ' + tex('i = 0') + '<br>' +
    '· E 2배 → ' + tex('v_d') + ' 2배 → ' + tex('i') + ' 2배<br>' +
    '· n, A를 키우면 전자 수가 늘어 ' + tex('i') + ' 증가';
}

// ---------- controls ----------
const ESlider = document.getElementById('ESlider');
const nSlider = document.getElementById('nSlider');
const ASlider = document.getElementById('ASlider');

ESlider.addEventListener('input', () => {
  state.E = parseFloat(ESlider.value);
  document.getElementById('EVal').textContent = state.E.toFixed(3);
  updateInfo();
});
nSlider.addEventListener('input', () => {
  state.n = parseFloat(nSlider.value);
  document.getElementById('nVal').textContent = state.n.toFixed(1);
  syncElectronCount();
  updateInfo();
});
ASlider.addEventListener('input', () => {
  state.A = parseFloat(ASlider.value);
  document.getElementById('AVal').textContent = state.A.toFixed(1);
  syncElectronCount();
  updateInfo();
});

const pauseBtn = document.getElementById('pauseBtn');
pauseBtn.addEventListener('click', () => {
  state.running = !state.running;
  pauseBtn.innerHTML = state.running ? '&#10074;&#10074; 정지' : '&#9654; 재생';
});

document.getElementById('resetBtn').addEventListener('click', () => {
  state.E = 0.04; state.n = 8.5; state.A = 1.0;
  ESlider.value = 0.04; nSlider.value = 8.5; ASlider.value = 1.0;
  document.getElementById('EVal').textContent = '0.040';
  document.getElementById('nVal').textContent = '8.5';
  document.getElementById('AVal').textContent = '1.0';
  electrons.length = 0;
  syncElectronCount();
  updateInfo();
});

// ---------- main loop ----------
let lastT = 0;
let infoT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;
  if (!syncCanvasSize()) return;      // iframe: canvas may have zero size at first
  if (state.running) step(dt);
  draw();
  infoT += dt;
  if (infoT > 0.35) { infoT = 0; updateInfo(); }   // throttle DOM updates
}

window.addEventListener('resize', () => { syncCanvasSize(); });

syncElectronCount();
renderStatic();
updateInfo();
requestAnimationFrame(frame);
</script>
</body>
</html>
