<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사이클로트론 운동</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; overflow: hidden; }
.container { display: flex; height: 100vh; }
.canvas-area { flex: 1; position: relative; background: #fafafa; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.controls { width: 260px; padding: 16px; border-left: 2px solid #eee; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.controls h2 { color: #8B0029; font-size: 15px; margin-bottom: 0; }
.subtitle { color: #888; font-size: 11px; margin-bottom: 4px; }
.control-group { display: flex; flex-direction: column; gap: 3px; }
.control-group label { font-size: 12.5px; font-weight: 600; color: #444; }
.control-group input[type="range"] { width: 100%; accent-color: #8B0029; }
.sign-row { display: flex; gap: 6px; }
.sign-btn { flex: 1; padding: 8px 0; font-size: 14px; font-weight: 700; border-radius: 6px; cursor: pointer; border: 2px solid #ddd; background: #fff; color: #666; }
.sign-btn.pos.active { background: #8B0029; border-color: #8B0029; color: #fff; }
.sign-btn.neg.active { background: #2563EB; border-color: #2563EB; color: #fff; }
.info-box { background: #f8f0f2; border: 1px solid #e0c0c8; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 2.0; }
.info-box .label { color: #8B0029; font-weight: 700; }
.info-box .val { font-weight: 700; }
.info-box .katex { font-size: 12px; }
.theorem-box { background: #8B0029; color: #fff; border-radius: 8px; padding: 10px; font-size: 13px; text-align: center; font-weight: 700; line-height: 1.7; }
.theorem-box .katex { color: #fff; font-size: 14px; }
.formula-box { background: #f9f0f2; border: 1px solid rgba(139,0,41,0.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 2.0; color: #555; }
.formula-box b { color: #8B0029; }
.formula-box .katex { font-size: 12px; }
.relation-box { background: #eef3fe; border: 1px solid #c3d4f5; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.8; color: #2b4a8b; }
.relation-box .katex { font-size: 12px; }
.relation-box b { color: #1a3a7a; }
.btn-row { display: flex; gap: 6px; }
button.action-btn { flex: 1; background: #8B0029; color: #fff; border: none; border-radius: 6px; padding: 9px 4px; font-size: 12.5px; cursor: pointer; font-weight: 600; }
button.action-btn:hover { background: #a3003a; }
button.action-btn.secondary { background: #6B7280; }
button.action-btn.secondary:hover { background: #4b5563; }
.canvas-title { position: absolute; top: 8px; left: 16px; right: 16px; pointer-events: none; font-size: 13.5px; font-weight: 700; color: #8B0029; line-height: 1.4; }
.canvas-title .katex { font-size: 13.5px; }
.hint { position: absolute; bottom: 8px; left: 16px; pointer-events: none; font-size: 11px; color: #6B7280; }
.canvas-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; overflow: hidden;
}
.canvas-overlay .katex-label {
  position: absolute; white-space: nowrap; font-size: 13px; line-height: 1;
  pointer-events: none; transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.85); padding: 1px 5px; border-radius: 4px;
}
.canvas-overlay .katex-label .katex { font-size: 0.95em; }
@media (max-width: 700px) {
  .container { flex-direction: column; }
  .canvas-area { height: 55vh; }
  .controls { width: 100%; height: 45vh; border-left: none; border-top: 2px solid #eee; }
}
</style>
</head>
<body>
<div class="container">
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="canvas-overlay" id="overlay">
      <div class="katex-label" id="lblV" style="color:#2563EB;font-weight:bold;"></div>
      <div class="katex-label" id="lblF" style="color:#8B0029;font-weight:bold;"></div>
      <div class="katex-label" id="lblR" style="color:#6B7280;"></div>
    </div>
    <div class="canvas-title" id="canvasTitle"></div>
    <div class="hint">자기장은 균일하고 화면에서 나오는 방향(&#8857;)이다</div>
  </div>
  <div class="controls">
    <div>
      <h2>사이클로트론 운동</h2>
      <div class="subtitle">A Circulating Charged Particle (Ch.28)</div>
    </div>

    <div class="theorem-box" id="theoremBox"></div>

    <div class="control-group">
      <label>전하 부호 (질량은 양성자 질량으로 고정)</label>
      <div class="sign-row">
        <button class="sign-btn pos active" id="btnPos">q = +e</button>
        <button class="sign-btn neg" id="btnNeg">q = &#8722;e</button>
      </div>
    </div>

    <div class="control-group">
      <label>속력 v = <span id="vVal">3.0</span> &#215;10&#8309; m/s</label>
      <input type="range" id="vSlider" min="1" max="5" value="3" step="0.1">
    </div>

    <div class="control-group">
      <label>자기장 세기 |B| = <span id="bVal">2.0</span> mT</label>
      <input type="range" id="bSlider" min="1" max="5" value="2" step="0.1">
    </div>

    <div class="info-box" id="infoBox"></div>

    <div class="relation-box" id="relationBox"></div>

    <div class="formula-box" id="formulaBox"></div>

    <div class="btn-row">
      <button class="action-btn" id="playBtn">&#10074;&#10074; 정지</button>
      <button class="action-btn secondary" id="trailBtn">궤적 지우기</button>
      <button class="action-btn secondary" id="resetBtn">&#8635; 초기화</button>
    </div>
  </div>
</div>

<script>
function tex(expr) {
  if (window.katex) return katex.renderToString(expr, { throwOnError: false, displayMode: false });
  return expr;
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let CW = 0, CH = 0;   // CSS pixel size (may be 0 inside an iframe until layout settles)

// ---------- physics constants ----------
const MP = 1.67e-27;      // particle mass (proton), kg
const E0 = 1.602e-19;     // elementary charge, C
const SIM_RATE = 1e-5;    // simulated seconds per real second (10 us/s)
const WORLD_HALF = 5.9;   // world half-extent in meters (fits max radius 5.21 m)

// ---------- state (logical/world coordinates only; nothing depends on canvas size) ----------
const state = {
  sign: +1,          // +1 or -1 (charge q = sign * e)
  v: 3.0e5,          // speed, m/s
  B: 2.0e-3,         // field magnitude, T (out of the screen)
  alpha: Math.PI / 2, // orbital phase; particle at top of circle initially
  running: true,
};
// trail stored in world coords; null entries break the polyline
let trail = [];

function radius() { return MP * state.v / (E0 * state.B); }         // m
function period() { return 2 * Math.PI * MP / (E0 * state.B); }     // s
function omega()  { return -state.sign * E0 * state.B / MP; }       // signed, rad/s (world y-up)
function forceMag() { return E0 * state.v * state.B; }              // N

// world position of the particle (orbit center fixed at origin)
function particleWorld() {
  const r = radius();
  return { x: r * Math.cos(state.alpha), y: r * Math.sin(state.alpha) };
}
// ---------- canvas mapping (computed fresh every frame: iframe-safe) ----------
function scalePxPerM() { return (Math.min(CW, CH) / 2 - 26) / WORLD_HALF; }
function toScreen(w) {
  const s = scalePxPerM();
  return { x: CW / 2 + w.x * s, y: CH / 2 - w.y * s };
}

function syncCanvasSize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0) { CW = 0; CH = 0; return false; }
  if (rect.width !== CW || rect.height !== CH || (window.devicePixelRatio || 1) !== dpr) {
    dpr = window.devicePixelRatio || 1;
    CW = rect.width; CH = rect.height;
    canvas.width = Math.round(CW * dpr); canvas.height = Math.round(CH * dpr);
    canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  return true;
}

function drawArrow(x1, y1, x2, y2, color, lw) {
  const headLen = 11;
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2 - (headLen - 2) * Math.cos(angle), y2 - (headLen - 2) * Math.sin(angle));
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - 0.42), y2 - headLen * Math.sin(angle - 0.42));
  ctx.lineTo(x2 - headLen * Math.cos(angle + 0.42), y2 - headLen * Math.sin(angle + 0.42));
  ctx.closePath(); ctx.fill();
}

function drawFieldDots() {
  // uniform B out of the screen: circled-dot symbols on a grid
  const gap = 84;
  ctx.strokeStyle = 'rgba(107,114,128,0.45)';
  ctx.fillStyle = 'rgba(107,114,128,0.45)';
  ctx.lineWidth = 1.3;
  for (let x = gap / 2; x < CW; x += gap) {
    for (let y = gap / 2 + 30; y < CH - 20; y += gap) {
      ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 1.7, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, CW, CH);
  drawFieldDots();

  const s = scalePxPerM();
  const r = radius();
  const pw = particleWorld();
  const ps = toScreen(pw);
  const center = toScreen({ x: 0, y: 0 });

  // orbit circle
  ctx.strokeStyle = 'rgba(107,114,128,0.55)';
  ctx.lineWidth = 1.3;
  ctx.setLineDash([6, 5]);
  ctx.beginPath();
  ctx.arc(center.x, center.y, r * s, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // radius line (center -> particle)
  ctx.strokeStyle = 'rgba(107,114,128,0.8)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.moveTo(center.x, center.y);
  ctx.lineTo(ps.x, ps.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // center dot
  ctx.fillStyle = '#6B7280';
  ctx.beginPath(); ctx.arc(center.x, center.y, 3, 0, Math.PI * 2); ctx.fill();

  // trail
  ctx.lineWidth = 2;
  let prev = null;
  for (const pt of trail) {
    if (pt === null) { prev = null; continue; }
    if (prev) {
      const a = toScreen(prev), b = toScreen(pt);
      ctx.strokeStyle = pt.sign > 0 ? 'rgba(139,0,41,0.30)' : 'rgba(37,99,235,0.30)';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    prev = pt;
  }

  // velocity vector (tangent)
  const om = omega();
  const sgn = om >= 0 ? 1 : -1;
  // world velocity direction: alpha' * (-sin a, cos a); sign of alpha' = sign of omega
  const vd = { x: -sgn * Math.sin(state.alpha), y: sgn * Math.cos(state.alpha) };
  const vLen = 30 + 70 * (state.v / 5e5);
  const vTip = { x: ps.x + vd.x * vLen, y: ps.y - vd.y * vLen };
  drawArrow(ps.x + vd.x * 18, ps.y - vd.y * 18, vTip.x, vTip.y, '#2563EB', 3);

  // force vector (toward center)
  const fd = { x: -Math.cos(state.alpha), y: -Math.sin(state.alpha) };
  const fLen = 26 + 70 * (forceMag() / (E0 * 5e5 * 5e-3));
  const fTip = { x: ps.x + fd.x * fLen, y: ps.y - fd.y * fLen };
  drawArrow(ps.x + fd.x * 18, ps.y - fd.y * 18, fTip.x, fTip.y, '#8B0029', 3);

  // particle
  ctx.fillStyle = state.sign > 0 ? '#8B0029' : '#2563EB';
  ctx.beginPath(); ctx.arc(ps.x, ps.y, 14, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(state.sign > 0 ? '+' : '−', ps.x, ps.y + 1);
  ctx.textBaseline = 'alphabetic';

  positionLabels(ps, vTip, fTip, center, r);
}

function clampLabel(x, y) {
  return { x: Math.max(34, Math.min(CW - 34, x)), y: Math.max(40, Math.min(CH - 30, y)) };
}

function positionLabels(ps, vTip, fTip, center, r) {
  const lblV = document.getElementById('lblV');
  const lblF = document.getElementById('lblF');
  const lblR = document.getElementById('lblR');

  // v label: just beyond arrow tip
  let pv = clampLabel(ps.x + (vTip.x - ps.x) * 1.25, ps.y + (vTip.y - ps.y) * 1.25);
  // F label: just beyond arrow tip
  let pf = clampLabel(ps.x + (fTip.x - ps.x) * 1.3, ps.y + (fTip.y - ps.y) * 1.3);
  // overlap check between v and F labels (perpendicular arrows, rarely close)
  if (Math.hypot(pv.x - pf.x, pv.y - pf.y) < 64) {
    pv.y -= 15; pf.y += 15;
  }
  lblV.style.left = pv.x + 'px'; lblV.style.top = pv.y + 'px';
  lblV.innerHTML = tex('\\vec{v}');
  lblF.style.left = pf.x + 'px'; lblF.style.top = pf.y + 'px';
  lblF.innerHTML = tex('\\vec{F}_B = q\\vec{v}\\times\\vec{B}');

  // r label: midpoint of radius line, offset perpendicular
  const mx = (center.x + ps.x) / 2, my = (center.y + ps.y) / 2;
  let nx = -(ps.y - center.y), ny = (ps.x - center.x);
  const nl = Math.hypot(nx, ny) || 1;
  nx /= nl; ny /= nl;
  let pr = clampLabel(mx + nx * 20, my + ny * 20);
  // avoid the particle labels
  if (Math.hypot(pr.x - pf.x, pr.y - pf.y) < 60) { pr.x += nx * 24; pr.y += ny * 24; }
  lblR.style.left = pr.x + 'px'; lblR.style.top = pr.y + 'px';
  lblR.innerHTML = tex('r = ' + r.toFixed(2) + '\\,\\text{m}');
}

// ---------- panel rendering ----------
function fmtMicro(t) { return (t * 1e6).toFixed(1); }

function renderStatic() {
  document.getElementById('canvasTitle').innerHTML =
    '원운동 조건: ' + tex('|q|vB = \\dfrac{mv^2}{r}') +
    ' &nbsp;&mdash;&nbsp; 자기력은 속력을 바꾸지 못하고 <span style="color:#2563EB">방향만</span> 바꾼다';

  document.getElementById('theoremBox').innerHTML =
    '로런츠 힘<br>' + tex('\\vec{F}_B = q\\vec{v}\\times\\vec{B}') + '<br>' +
    '<span style="font-size:11px;font-weight:400">' +
    tex('r = \\dfrac{mv}{|q|B}, \\quad T = \\dfrac{2\\pi m}{|q|B}') + '</span>';

  document.getElementById('formulaBox').innerHTML =
    '<b>유도:</b> 뉴턴 제2법칙(구심력)에서<br>' +
    tex('|q|vB = mv^2/r \\;\\Rightarrow\\; r = \\dfrac{mv}{|q|B}') + '<br>' +
    tex('T = \\dfrac{2\\pi r}{v} = \\dfrac{2\\pi m}{|q|B}') + '<br>' +
    '입자 질량 ' + tex('m = 1.67\\times10^{-27}\\,\\text{kg}') + ' (양성자)';
}

function renderInfo() {
  const r = radius(), T = period(), f = 1 / T;
  const dirTxt = state.sign > 0 ? '시계 방향' : '반시계 방향';
  const dirColor = state.sign > 0 ? '#8B0029' : '#2563EB';
  const box = document.getElementById('infoBox');
  box.innerHTML =
    '<span class="label">반지름</span> ' + tex('r = \\dfrac{mv}{|q|B} = ' + r.toFixed(2) + '\\,\\text{m}') + '<br>' +
    '<span class="label">주기</span> ' + tex('T = \\dfrac{2\\pi m}{|q|B} = ' + fmtMicro(T) + '\\,\\mu\\text{s}') + '<br>' +
    '<span class="label">진동수</span> ' + tex('f = 1/T = ' + (f / 1e3).toFixed(1) + '\\,\\text{kHz}') + '<br>' +
    '<span class="label">회전 방향</span> <span class="val" style="color:' + dirColor + '">' + dirTxt +
    '</span> <span style="font-size:10.5px;color:#6B7280">(B가 화면 밖으로 나올 때)</span>';

  document.getElementById('relationBox').innerHTML =
    '<b>주기는 속력과 무관!</b><br>' +
    'v를 바꾸면 r만 바뀌고 T는 그대로다.<br>' +
    tex('T = \\dfrac{2\\pi m}{|q|B}') + ' &nbsp;&#8592; v 없음<br>' +
    '<span style="font-size:11px">같은 시간에 한 바퀴 &#8594; 사이클로트론 가속기의 원리</span>';
}

// ---------- animation loop (iframe-safe: sizes checked every frame) ----------
let lastTs = null;
function frame(ts) {
  const ok = syncCanvasSize();
  if (ok) {
    if (lastTs !== null && state.running) {
      const dt = Math.min((ts - lastTs) / 1000, 0.1); // real seconds
      state.alpha += omega() * SIM_RATE * dt;
      // keep alpha bounded
      if (state.alpha > 1e4 || state.alpha < -1e4) state.alpha = state.alpha % (2 * Math.PI);
      const pw = particleWorld();
      trail.push({ x: pw.x, y: pw.y, sign: state.sign });
      if (trail.length > 900) trail.splice(0, trail.length - 900);
    }
    draw();
  }
  lastTs = ts;
  requestAnimationFrame(frame);
}

// ---------- controls ----------
const vSlider = document.getElementById('vSlider');
const bSlider = document.getElementById('bSlider');
const btnPos = document.getElementById('btnPos');
const btnNeg = document.getElementById('btnNeg');

function breakTrail() { if (trail.length && trail[trail.length - 1] !== null) trail.push(null); }

vSlider.addEventListener('input', () => {
  state.v = parseFloat(vSlider.value) * 1e5;
  document.getElementById('vVal').textContent = parseFloat(vSlider.value).toFixed(1);
  breakTrail();
  renderInfo();
});
bSlider.addEventListener('input', () => {
  state.B = parseFloat(bSlider.value) * 1e-3;
  document.getElementById('bVal').textContent = parseFloat(bSlider.value).toFixed(1);
  breakTrail();
  renderInfo();
});
btnPos.addEventListener('click', () => {
  state.sign = +1;
  btnPos.classList.add('active'); btnNeg.classList.remove('active');
  breakTrail();
  renderInfo();
});
btnNeg.addEventListener('click', () => {
  state.sign = -1;
  btnNeg.classList.add('active'); btnPos.classList.remove('active');
  breakTrail();
  renderInfo();
});

document.getElementById('playBtn').addEventListener('click', () => {
  state.running = !state.running;
  document.getElementById('playBtn').innerHTML = state.running ? '&#10074;&#10074; 정지' : '&#9654; 시작';
});
document.getElementById('trailBtn').addEventListener('click', () => { trail = []; });
document.getElementById('resetBtn').addEventListener('click', () => {
  state.sign = +1; state.v = 3.0e5; state.B = 2.0e-3; state.alpha = Math.PI / 2;
  state.running = true;
  trail = [];
  vSlider.value = 3; bSlider.value = 2;
  document.getElementById('vVal').textContent = '3.0';
  document.getElementById('bVal').textContent = '2.0';
  btnPos.classList.add('active'); btnNeg.classList.remove('active');
  document.getElementById('playBtn').innerHTML = '&#10074;&#10074; 정지';
  renderInfo();
});

window.addEventListener('resize', () => { syncCanvasSize(); });

renderStatic();
renderInfo();
requestAnimationFrame(frame);
</script>
</body>
</html>
