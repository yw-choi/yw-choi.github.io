<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>광시계와 시간 지연</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; overflow: hidden; }
.container { display: flex; height: 100vh; }
.canvas-area { flex: 1; position: relative; background: #fafafa; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.controls { width: 260px; padding: 16px; border-left: 2px solid #eee; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.controls h2 { color: #8B0029; font-size: 15px; margin-bottom: 0; }
.subtitle { color: #888; font-size: 11px; margin-bottom: 4px; }
.control-group { display: flex; flex-direction: column; gap: 3px; }
.control-group label { font-size: 12.5px; font-weight: 600; color: #444; }
.control-group input[type="range"] { width: 100%; accent-color: #8B0029; }
.info-box { background: #f8f0f2; border: 1px solid #e0c0c8; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.9; }
.info-box .label { color: #8B0029; font-weight: 700; }
.info-box .val { font-weight: 700; }
.info-box .katex { font-size: 12px; }
.theorem-box { background: #8B0029; color: #fff; border-radius: 8px; padding: 10px; font-size: 13px; text-align: center; font-weight: 700; line-height: 1.6; }
.theorem-box .katex { color: #fff; font-size: 14px; }
.formula-box { background: #f9f0f2; border: 1px solid rgba(139,0,41,0.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 2.0; color: #555; }
.formula-box b { color: #8B0029; }
.formula-box .katex { font-size: 12px; }
button.reset-btn, button.run-btn { background: #8B0029; color: #fff; border: none; border-radius: 6px; padding: 9px; font-size: 13px; cursor: pointer; font-weight: 600; }
button.reset-btn:hover, button.run-btn:hover { background: #a3003a; }
button.reset-btn { background: #6B7280; }
button.reset-btn:hover { background: #4b5563; }
.mode-row { display: flex; gap: 6px; }
.mode-btn { flex: 1; border: 1.5px solid #8B0029; background: #fff; color: #8B0029; border-radius: 6px; padding: 7px 4px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.mode-btn.active { background: #8B0029; color: #fff; }
.canvas-title { position: absolute; top: 8px; left: 16px; right: 16px; pointer-events: none; font-size: 14px; font-weight: 700; color: #8B0029; line-height: 1.4; }
.hint { position: absolute; bottom: 8px; left: 16px; pointer-events: none; font-size: 11px; color: #6B7280; }
.canvas-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; overflow: hidden;
}
.canvas-overlay .katex-label {
  position: absolute; white-space: nowrap; font-size: 13px; line-height: 1;
  pointer-events: none; transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.85); padding: 2px 6px; border-radius: 4px;
}
.canvas-overlay .katex-label .katex { font-size: 0.95em; }
@media (max-width: 700px) {
  .container { flex-direction: column; }
  .canvas-area { height: 55vh; }
  .controls { width: 100%; height: 45vh; border-left: none; border-top: 2px solid #eee; }
}
</style>
</head>
<body>
<div class="container">
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="canvas-overlay" id="overlay">
      <div class="katex-label" id="lblTop" style="color:#8B0029;font-weight:bold;"></div>
      <div class="katex-label" id="lblBot" style="color:#8B0029;font-weight:bold;"></div>
      <div class="katex-label" id="lblGamma" style="color:#2563EB;font-weight:bold;"></div>
    </div>
    <div class="canvas-title" id="canvasTitle"></div>
    <div class="hint" id="hint">속도 슬라이더를 올리면 위쪽(우주선) 시계가 느려지는 것을 관찰하세요</div>
  </div>
  <div class="controls">
    <div>
      <h2>광시계와 시간 지연</h2>
      <div class="subtitle">Time Dilation &amp; Length Contraction (Ch.37)</div>
    </div>

    <div class="theorem-box" id="theoremBox"></div>

    <div class="mode-row">
      <button class="mode-btn active" id="modeTime">시간 지연</button>
      <button class="mode-btn" id="modeLen">길이 수축</button>
    </div>

    <div class="control-group">
      <label>우주선 속력 v = <span id="vVal">0.60</span>c</label>
      <input type="range" id="vSlider" min="0" max="0.99" value="0.60" step="0.01">
    </div>

    <button class="run-btn" id="runBtn">&#10074;&#10074; 정지</button>

    <div class="info-box" id="infoBox"></div>

    <div class="formula-box" id="formulaBox"></div>

    <button class="reset-btn" id="resetBtn">&#8635; 시계 리셋</button>
  </div>
</div>

<script>
function tex(expr) {
  if (window.katex) return katex.renderToString(expr, { throwOnError: false, displayMode: false });
  return expr;
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let CW = 0, CH = 0;          // logical canvas size (CSS px)

// ---------- physics state (logical, resolution-independent) ----------
const T0 = 2.0;              // proper period of the light clock (simulated s)
let beta = 0.60;             // v/c
let gamma = 1 / Math.sqrt(1 - beta * beta);
let tGround = 0;             // ground-frame elapsed time (simulated s)
let tauShip = 0;             // ship proper time (simulated s)
let running = true;
let mode = 'time';           // 'time' | 'len'
const L0_METERS = 100;       // proper length of the rod in the LC mode

function setBeta(b) {
  beta = b;
  gamma = 1 / Math.sqrt(1 - beta * beta);
}

// ---------- lazy, iframe-safe sizing ----------
// Nothing is positioned in absolute pixels at load time; every frame we read
// the parent size, and all geometry is derived from fractions of CW/CH.
function syncSize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(1, rect.width), h = Math.max(1, rect.height);
  const d = window.devicePixelRatio || 1;
  if (w !== CW || h !== CH || d !== dpr) {
    CW = w; CH = h; dpr = d;
    canvas.width = Math.round(CW * dpr);
    canvas.height = Math.round(CH * dpr);
    canvas.style.width = CW + 'px';
    canvas.style.height = CH + 'px';
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ---------- helpers ----------
function drawTextWithBg(text, x, y, color, font, align) {
  ctx.font = font || '12px sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width;
  const pad = 3;
  let bx = x - (align === 'left' ? 0 : align === 'right' ? w : w / 2);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(bx - pad, y - 8 - pad, w + 2 * pad, 16 + 2 * pad);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawArrow(x1, y1, x2, y2, color, lw) {
  const headLen = 9;
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2 - (headLen - 2) * Math.cos(angle), y2 - (headLen - 2) * Math.sin(angle));
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - 0.42), y2 - headLen * Math.sin(angle - 0.42));
  ctx.lineTo(x2 - headLen * Math.cos(angle + 0.42), y2 - headLen * Math.sin(angle + 0.42));
  ctx.closePath(); ctx.fill();
}

// triangle-wave phase (0 at bottom, 1 at top) from proper time
function pulseHeightFrac(tau) {
  const p = (tau % T0) / T0;          // 0..1
  return p < 0.5 ? p * 2 : 2 - p * 2; // 0->1->0
}

// ---------- panels ----------
// top panel: y in [0.10, 0.46] of CH ; bottom panel: y in [0.50, 0.97]
function panelRects() {
  return {
    top: { x: 14, y: CH * 0.10, w: CW - 28, h: CH * 0.36 },
    bot: { x: 14, y: CH * 0.50, w: CW - 28, h: CH * 0.47 }
  };
}

function drawPanelFrame(r, title) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = '#8B0029';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(title, r.x + 10, r.y + 16);
}

// ============================================================
// TIME-DILATION MODE
// ============================================================
function drawTimeMode(rects) {
  const { top, bot } = rects;
  drawPanelFrame(top, '우주선 내부에서 본 광시계 (고유 시간 Δt₀)');
  drawPanelFrame(bot, '지상 관찰자가 본 광시계 (시간 Δt) — 빛이 지그재그로 간다');

  // ----- top: rest-frame light clock -----
  {
    const cx = top.x + top.w * 0.5;
    const yBottom = top.y + top.h - 24;
    const D = top.h - 66;                 // mirror distance in px
    const yTop = yBottom - D;

    // mirror
    ctx.fillStyle = '#6B7280';
    ctx.fillRect(cx - 34, yTop - 8, 68, 7);
    // source
    ctx.fillStyle = '#8B0029';
    ctx.fillRect(cx - 26, yBottom + 1, 52, 7);
    // guide line
    ctx.strokeStyle = 'rgba(107,114,128,0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, yBottom); ctx.lineTo(cx, yTop); ctx.stroke();
    ctx.setLineDash([]);

    // light pulse
    const f = pulseHeightFrac(tauShip);
    const py = yBottom - f * D;
    ctx.fillStyle = '#8B0029';
    ctx.beginPath(); ctx.arc(cx, py, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(139,0,41,0.25)';
    ctx.beginPath(); ctx.arc(cx, py, 12, 0, Math.PI * 2); ctx.fill();

    // ship clock readout (top-right corner, away from the clock itself)
    drawTextWithBg('우주선 시계  τ = ' + tauShip.toFixed(1) + ' s   (똑딱 ' + Math.floor(tauShip / T0) + '회)',
      top.x + top.w - 12, top.y + 16, '#1a1a1a', 'bold 13px sans-serif', 'right');

    // D label
    drawTextWithBg('D', cx + 46, yBottom - D / 2, '#6B7280', 'italic 13px sans-serif');
  }

  // ----- bottom: ground-frame zigzag -----
  {
    const margin = 30;
    const usable = bot.w - 2 * margin;
    const yBottom = bot.y + bot.h - 30;
    const D = bot.h - 84;
    const yTop = yBottom - D;
    const cpx = 2 * D / T0;               // light speed in px per sim-s
    const vpx = beta * cpx;               // ship speed in px per sim-s

    const xu = vpx * tGround;             // unwrapped ship x
    const xw = margin + (usable > 0 ? xu % usable : 0);  // wrapped
    const shipX = bot.x + xw;
    const wrapOffset = xu - xw + bot.x;   // unwrapped -> screen: screenX = xuVal - wrapOffset ... careful:
    // screenX(p) = bot.x + margin + (p - (xu - (xw - margin)))  == p - xu + shipX

    // clip to panel
    ctx.save();
    ctx.beginPath();
    ctx.rect(bot.x + 1, bot.y + 1, bot.w - 2, bot.h - 2);
    ctx.clip();

    // ship body (drawn contracted horizontally: a subtle physical touch)
    const shipW = 74 / gamma;
    ctx.fillStyle = '#F3F4F6';
    ctx.strokeStyle = '#6B7280';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(shipX - shipW / 2, yBottom + 4, shipW, 14, 4);
    ctx.fill(); ctx.stroke();

    // mirror & source carried by ship
    ctx.fillStyle = '#6B7280';
    ctx.fillRect(shipX - 26, yTop - 8, 52, 6);
    ctx.fillStyle = '#8B0029';
    ctx.fillRect(shipX - 20, yBottom - 2, 40, 6);

    // zigzag light path: reflection vertices at proper times k*T0/2
    const halfIdx = Math.floor(tauShip / (T0 / 2));
    ctx.strokeStyle = 'rgba(139,0,41,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    let started = false;
    for (let k = Math.max(0, halfIdx - 3); k <= halfIdx; k++) {
      const tauK = k * (T0 / 2);
      const tK = gamma * tauK;                       // ground time of vertex
      const vx = vpx * tK - xu + shipX;              // screen x of vertex
      const vy = (k % 2 === 0) ? yBottom : yTop;     // even: bottom, odd: top
      if (!started) { ctx.moveTo(vx, vy); started = true; }
      else ctx.lineTo(vx, vy);
    }
    // current pulse position
    const f = pulseHeightFrac(tauShip);
    const pxNow = shipX;                              // light shares ship's x (vertical motion in ship frame)
    const pyNow = yBottom - f * D;
    ctx.lineTo(pxNow, pyNow);
    ctx.stroke();

    // pulse dot
    ctx.fillStyle = '#8B0029';
    ctx.beginPath(); ctx.arc(pxNow, pyNow, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(139,0,41,0.25)';
    ctx.beginPath(); ctx.arc(pxNow, pyNow, 12, 0, Math.PI * 2); ctx.fill();

    // velocity arrow on ship
    drawArrow(shipX + 34, yBottom + 11, shipX + 78, yBottom + 11, '#2563EB', 2.5);
    drawTextWithBg('v = ' + beta.toFixed(2) + 'c', shipX + 56, yBottom + 26, '#2563EB', 'bold 12px sans-serif');

    ctx.restore();

    // ground clock readout (bottom-right corner, away from the moving ship)
    drawTextWithBg('지상 시계  t = ' + tGround.toFixed(1) + ' s', bot.x + bot.w - 12, bot.y + bot.h - 14, '#1a1a1a', 'bold 13px sans-serif', 'right');
  }
}

// ============================================================
// LENGTH-CONTRACTION MODE
// ============================================================
function drawLenMode(rects) {
  const { top, bot } = rects;
  drawPanelFrame(top, '막대의 정지 좌표계 — 고유 길이 L₀ = 100 m');
  drawPanelFrame(bot, '지상 관찰자 — 움직이는 막대는 진행 방향으로 수축');

  const L0px = Math.min(top.w, bot.w) * 0.52;

  // ----- top: rod at rest -----
  {
    const cx = top.x + top.w * 0.5;
    const cy = top.y + top.h * 0.52;
    ctx.fillStyle = '#F3F4F6';
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(cx - L0px / 2, cy - 13, L0px, 26, 5);
    ctx.fill(); ctx.stroke();
    // ruler ticks every 10 m
    ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i++) {
      const tx = cx - L0px / 2 + (L0px * i) / 10;
      ctx.beginPath(); ctx.moveTo(tx, cy + 17); ctx.lineTo(tx, cy + 24); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(cx - L0px / 2, cy + 20.5); ctx.lineTo(cx + L0px / 2, cy + 20.5); ctx.stroke();
    drawTextWithBg('L₀ = 100 m', cx, cy + 40, '#1a1a1a', 'bold 13px sans-serif');
  }

  // ----- bottom: moving rod -----
  {
    const margin = 30;
    const usable = bot.w - 2 * margin;
    const cy = bot.y + bot.h * 0.5;
    const Lpx = L0px / gamma;
    const Lm = L0_METERS / gamma;

    const D = 100;                        // reuse light-speed scale: arbitrary here
    const cpx = 160;                      // px per sim-s for motion feel
    const vpx = beta * cpx;
    const xu = vpx * tGround;
    const xw = margin + (usable > 0 ? xu % usable : 0);
    const rodX = bot.x + xw;              // left edge of rod

    ctx.save();
    ctx.beginPath();
    ctx.rect(bot.x + 1, bot.y + 1, bot.w - 2, bot.h - 2);
    ctx.clip();

    // ghost of proper length for comparison
    ctx.strokeStyle = '#6B7280';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(rodX, cy - 13, L0px, 26);
    ctx.setLineDash([]);

    // contracted rod
    ctx.fillStyle = '#F3F4F6';
    ctx.strokeStyle = '#8B0029';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(rodX, cy - 13, Lpx, 26, 5);
    ctx.fill(); ctx.stroke();

    // velocity arrow
    drawArrow(rodX + Lpx + 12, cy, rodX + Lpx + 58, cy, '#2563EB', 2.5);
    drawTextWithBg('v = ' + beta.toFixed(2) + 'c', rodX + Lpx + 40, cy + 18, '#2563EB', 'bold 12px sans-serif');

    // measured length label
    drawTextWithBg('L = L₀/γ = ' + Lm.toFixed(1) + ' m', rodX + Lpx / 2, cy + 40, '#8B0029', 'bold 13px sans-serif');
    drawTextWithBg('점선: 고유 길이 L₀', rodX + L0px - 62, cy - 32, '#6B7280', '12px sans-serif');

    ctx.restore();
  }
}

// ---------- overlay labels (KaTeX) ----------
function positionOverlay(rects) {
  const { top, bot } = rects;
  const lblTop = document.getElementById('lblTop');
  const lblBot = document.getElementById('lblBot');
  const lblGamma = document.getElementById('lblGamma');

  lblGamma.style.display = 'block';
  lblGamma.style.left = (bot.x + bot.w - 92) + 'px';
  lblGamma.style.top = (bot.y + 20) + 'px';
  lblGamma.innerHTML = tex('\\gamma = ' + gamma.toFixed(2));

  if (mode === 'time') {
    lblTop.style.display = 'block';
    lblTop.style.left = (top.x + 92) + 'px';
    lblTop.style.top = (top.y + top.h - 22) + 'px';
    lblTop.innerHTML = tex('\\Delta t_0 = 2D/c');

    lblBot.style.display = 'block';
    lblBot.style.left = (bot.x + 118) + 'px';
    lblBot.style.top = (bot.y + 42) + 'px';
    lblBot.innerHTML = tex('\\Delta t = \\gamma\\,\\Delta t_0 = ' + (gamma * T0).toFixed(2) + '\\,\\text{s}');
  } else {
    lblTop.style.display = 'none';
    lblBot.style.display = 'block';
    lblBot.style.left = (bot.x + 128) + 'px';
    lblBot.style.top = (bot.y + 42) + 'px';
    lblBot.innerHTML = tex('L = L_0\\sqrt{1-\\beta^2} = ' + (L0_METERS / gamma).toFixed(1) + '\\,\\text{m}');
  }
}

// ---------- main loop ----------
let lastWall = null;
function frame(ts) {
  syncSize();
  if (lastWall === null) lastWall = ts;
  let dt = Math.min(0.05, (ts - lastWall) / 1000);
  lastWall = ts;
  if (running) {
    tGround += dt;                 // the movie runs at ground-frame time
    tauShip += dt / gamma;         // moving clock runs slow
  }
  draw();
  requestAnimationFrame(frame);
}

function draw() {
  if (CW < 5 || CH < 5) return;    // not laid out yet (iframe safety)
  ctx.clearRect(0, 0, CW, CH);
  const rects = panelRects();
  if (mode === 'time') drawTimeMode(rects);
  else drawLenMode(rects);
  positionOverlay(rects);
  updateInfo();
}

// ---------- UI ----------
const vSlider = document.getElementById('vSlider');
const runBtn = document.getElementById('runBtn');
const resetBtn = document.getElementById('resetBtn');
const modeTime = document.getElementById('modeTime');
const modeLen = document.getElementById('modeLen');

vSlider.addEventListener('input', () => {
  setBeta(parseFloat(vSlider.value));
  document.getElementById('vVal').textContent = beta.toFixed(2);
  tGround = 0; tauShip = 0;   // restart both clocks so that t/τ = γ exactly
  renderStatic();
});

runBtn.addEventListener('click', () => {
  running = !running;
  runBtn.innerHTML = running ? '&#10074;&#10074; 정지' : '&#9654; 시작';
});

resetBtn.addEventListener('click', () => {
  tGround = 0; tauShip = 0;
});

function setMode(m) {
  mode = m;
  modeTime.classList.toggle('active', m === 'time');
  modeLen.classList.toggle('active', m === 'len');
  tGround = 0; tauShip = 0;
  renderStatic();
}
modeTime.addEventListener('click', () => setMode('time'));
modeLen.addEventListener('click', () => setMode('len'));

function updateInfo() {
  const box = document.getElementById('infoBox');
  let html = '';
  html += '<span class="label">속도 매개변수</span> <span class="val">β = ' + beta.toFixed(2) + '</span><br>';
  html += '<span class="label">로런츠 인자</span> <span class="val">γ = ' + gamma.toFixed(3) + '</span><br>';
  if (mode === 'time') {
    html += '<span class="label">우주선 시계</span> <span class="val">τ = ' + tauShip.toFixed(1) + ' s</span><br>';
    html += '<span class="label">지상 시계</span> <span class="val">t = ' + tGround.toFixed(1) + ' s</span><br>';
    const ratio = tauShip > 0.01 ? (tGround / tauShip) : gamma;
    html += '<span class="label">비율 t/τ</span> <span class="val">' + ratio.toFixed(3) + '</span> (= γ)';
  } else {
    html += '<span class="label">고유 길이</span> <span class="val">L₀ = 100 m</span><br>';
    html += '<span class="label">측정 길이</span> <span class="val">L = ' + (L0_METERS / gamma).toFixed(1) + ' m</span>';
  }
  box.innerHTML = html;
}

function renderStatic() {
  document.getElementById('canvasTitle').innerHTML = (mode === 'time')
    ? '시간 지연: 움직이는 시계는 느리게 간다 — 두 사건(방출·복귀)을 지상에서 재면 더 길다'
    : '길이 수축: 움직이는 물체는 진행 방향으로 짧아진다';

  document.getElementById('theoremBox').innerHTML = (mode === 'time')
    ? '시간 지연 (time dilation)<br>' + tex('\\Delta t = \\gamma\\,\\Delta t_0') + '<br>' +
      '<span style="font-size:11px;font-weight:400">' + tex('\\gamma = \\dfrac{1}{\\sqrt{1-(v/c)^2}}') + '</span>'
    : '길이 수축 (length contraction)<br>' + tex('L = L_0/\\gamma') + '<br>' +
      '<span style="font-size:11px;font-weight:400">' + tex('\\gamma = \\dfrac{1}{\\sqrt{1-(v/c)^2}}') + '</span>';

  document.getElementById('formulaBox').innerHTML = (mode === 'time')
    ? '<b>광시계 원리:</b> 빛이 거울까지 왕복 = 1 똑딱<br>' +
      '우주선 안: 왕복 거리 ' + tex('2D') + ' → ' + tex('\\Delta t_0 = 2D/c') + '<br>' +
      '지상: 지그재그 ' + tex('2L > 2D') + ', 같은 속력 ' + tex('c') + '<br>' +
      '→ <b>더 오래 걸린다</b> ' + tex('\\Delta t = \\gamma\\Delta t_0')
    : '<b>길이 측정:</b> 양 끝을 <b>같은 순간</b>에 표시<br>' +
      tex('L = L_0\\sqrt{1-\\beta^2} = L_0/\\gamma') + '<br>' +
      '수직 방향 크기는 변하지 않는다';

  document.getElementById('hint').textContent = (mode === 'time')
    ? '속도를 올리면 위쪽(우주선) 시계가 느려지는 것을 관찰하세요'
    : '속도를 올리면 막대가 점점 짧아지는 것을 관찰하세요';
}

renderStatic();
requestAnimationFrame(frame);
</script>
