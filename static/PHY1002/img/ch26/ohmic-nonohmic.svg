<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrGray8" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">전류–전압 특성: 옴성 소자와 비옴성 소자</text>

  <!-- ===== panel (a): resistor ===== -->
  <line x1="60" y1="210" x2="334" y2="210" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray8)"/>
  <line x1="190" y1="340" x2="190" y2="76" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray8)"/>
  <text x="344" y="214" font-size="14" font-style="italic" fill="#1a1a1a">V</text>
  <text x="190" y="64" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">i</text>

  <line x1="78" y1="312" x2="302" y2="108" stroke="#8B0029" stroke-width="2.5"/>
  <text x="272" y="146" font-size="12" fill="#6B7280" text-anchor="start">기울기 1/<tspan font-style="italic">R</tspan> 일정</text>

  <text x="190" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">(a) 저항 — 옴의 법칙을 따른다</text>

  <!-- ===== panel (b): pn junction diode ===== -->
  <line x1="430" y1="210" x2="704" y2="210" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray8)"/>
  <line x1="560" y1="340" x2="560" y2="76" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray8)"/>
  <text x="714" y="214" font-size="14" font-style="italic" fill="#1a1a1a">V</text>
  <text x="560" y="64" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">i</text>

  <polyline fill="none" stroke="#8B0029" stroke-width="2.5" points="
    445,212.5 490,212 530,211.5 560,210.5 590,208.5 612,204 628,195 641,178 652,150 660,115 665,90"/>
  <text x="475" y="130" font-size="12" fill="#6B7280"><tspan font-style="italic">R</tspan> = <tspan font-style="italic">V/i</tspan> 가</text>
  <text x="475" y="148" font-size="12" fill="#6B7280"><tspan font-style="italic">V</tspan> 에 따라 변한다</text>
  <text x="622" y="242" text-anchor="middle" font-size="11" fill="#6B7280">약 1.5 V부터 전류가 흐름</text>

  <text x="565" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">(b) pn 접합 다이오드 — 비옴성</text>
</svg>
