<svg viewBox="0 0 740 410" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed6" markerWidth="12" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue6" markerWidth="12" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray6a" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
    <marker id="arrGray6b" markerWidth="10" markerHeight="8" refX="1" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,3 L8,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="370" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">도선의 저항 — 길이 <tspan font-style="italic">L</tspan>, 단면적 <tspan font-style="italic">A</tspan>, 전위차 <tspan font-style="italic">V</tspan></text>

  <!-- L dimension (above) -->
  <line x1="170" y1="132" x2="170" y2="96" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="570" y1="132" x2="570" y2="96" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="176" y1="101" x2="564" y2="101" stroke="#6B7280" stroke-width="1" marker-start="url(#arrGray6b)" marker-end="url(#arrGray6a)"/>
  <text x="370" y="90" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">L</text>

  <!-- cylinder -->
  <rect x="170" y="140" width="400" height="100" fill="#F3F4F6"/>
  <line x1="170" y1="140" x2="570" y2="140" stroke="#6B7280" stroke-width="2"/>
  <line x1="170" y1="240" x2="570" y2="240" stroke="#6B7280" stroke-width="2"/>
  <ellipse cx="570" cy="190" rx="15" ry="50" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <ellipse cx="170" cy="190" rx="15" ry="50" fill="#8B0029" fill-opacity="0.15" stroke="#8B0029" stroke-width="2"/>

  <!-- current in/out -->
  <line x1="66" y1="190" x2="146" y2="190" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed6)"/>
  <text x="100" y="172" font-size="15" font-style="italic" fill="#8B0029">i</text>
  <line x1="592" y1="190" x2="672" y2="190" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed6)"/>
  <text x="630" y="172" font-size="15" font-style="italic" fill="#8B0029">i</text>

  <!-- E and J inside -->
  <line x1="300" y1="172" x2="440" y2="172" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed6)"/>
  <text x="456" y="177" font-size="15" font-style="italic" fill="#8B0029">E</text>
  <line x1="300" y1="215" x2="440" y2="215" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue6)"/>
  <text x="456" y="220" font-size="15" font-style="italic" fill="#2563EB">J</text>

  <!-- A label -->
  <text x="92" y="272" font-size="14" fill="#1a1a1a">단면적 <tspan font-style="italic">A</tspan></text>
  <line x1="120" y1="258" x2="158" y2="225" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- V bracket (below) -->
  <line x1="170" y1="248" x2="170" y2="300" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="570" y1="248" x2="570" y2="300" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="176" y1="295" x2="564" y2="295" stroke="#6B7280" stroke-width="1" marker-start="url(#arrGray6b)" marker-end="url(#arrGray6a)"/>
  <text x="370" y="318" text-anchor="middle" font-size="14" fill="#1a1a1a">전위차 <tspan font-style="italic">V</tspan></text>

  <!-- formulas -->
  <text x="370" y="358" text-anchor="middle" font-size="14" fill="#6B7280"><tspan font-style="italic">E = V/L</tspan>,&#160;&#160;<tspan font-style="italic">J = i/A</tspan>,&#160;&#160;<tspan font-style="italic">ρ = E/J</tspan></text>
  <text x="370" y="390" text-anchor="middle" font-size="16" font-style="italic" fill="#8B0029">R = V/i = ρL/A</text>
</svg>
