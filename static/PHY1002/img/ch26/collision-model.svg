<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed9" markerWidth="12" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue9" markerWidth="12" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">전도 전자의 충돌 모형 — 무작위 운동에 표류가 더해진다</text>

  <!-- random path without field (gray) -->
  <polyline fill="none" stroke="#6B7280" stroke-width="2" points="120,300 255,250 185,165 330,120 265,215 410,235 430,140"/>
  <circle cx="255" cy="250" r="4" fill="#6B7280"/>
  <circle cx="185" cy="165" r="4" fill="#6B7280"/>
  <circle cx="330" cy="120" r="4" fill="#6B7280"/>
  <circle cx="265" cy="215" r="4" fill="#6B7280"/>
  <circle cx="410" cy="235" r="4" fill="#6B7280"/>
  <circle cx="430" cy="140" r="5" fill="#6B7280"/>
  <text x="440" y="128" font-size="14" font-style="italic" fill="#6B7280">B</text>

  <!-- drifted path with field (blue, cumulative shift to the right) -->
  <polyline fill="none" stroke="#2563EB" stroke-width="2" points="120,300 267,250 209,165 366,120 313,215 470,235 502,140"/>
  <circle cx="267" cy="250" r="4" fill="#2563EB"/>
  <circle cx="209" cy="165" r="4" fill="#2563EB"/>
  <circle cx="366" cy="120" r="4" fill="#2563EB"/>
  <circle cx="313" cy="215" r="4" fill="#2563EB"/>
  <circle cx="470" cy="235" r="4" fill="#2563EB"/>
  <circle cx="502" cy="140" r="5" fill="#2563EB"/>
  <text x="516" y="128" font-size="14" font-style="italic" fill="#2563EB">B′</text>

  <!-- start point -->
  <circle cx="120" cy="300" r="5" fill="#1a1a1a"/>
  <text x="104" y="320" font-size="14" font-style="italic" fill="#1a1a1a">A</text>

  <!-- E field and drift arrows -->
  <line x1="640" y1="300" x2="530" y2="300" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed9)"/>
  <text x="590" y="286" text-anchor="middle" font-size="15" font-style="italic" fill="#8B0029">E</text>
  <line x1="530" y1="336" x2="640" y2="336" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue9)"/>
  <text x="586" y="360" text-anchor="middle" font-size="13" fill="#2563EB">전자의 표류 방향 (<tspan font-style="italic">E</tspan> 와 반대)</text>

  <!-- legend -->
  <line x1="80" y1="380" x2="112" y2="380" stroke="#6B7280" stroke-width="2"/>
  <text x="120" y="385" font-size="13" fill="#1a1a1a">전기장 없음: A → B, 여섯 번 충돌 (평균하면 알짜 이동 0)</text>
  <line x1="80" y1="406" x2="112" y2="406" stroke="#2563EB" stroke-width="2"/>
  <text x="120" y="411" font-size="13" fill="#1a1a1a">전기장 있음: A → B′, 같은 충돌 + 오른쪽으로 표류 (그림은 크게 과장)</text>
</svg>
