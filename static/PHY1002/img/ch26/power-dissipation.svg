<svg viewBox="0 0 740 410" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed10" markerWidth="12" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#8B0029"/>
    </marker>
  </defs>

  <text x="370" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">저항에서의 에너지 소모 — 퍼텐셜 에너지가 열로 바뀐다</text>

  <!-- wires -->
  <line x1="140" y1="110" x2="600" y2="110" stroke="#6B7280" stroke-width="2"/>
  <line x1="600" y1="110" x2="600" y2="168" stroke="#6B7280" stroke-width="2"/>
  <line x1="600" y1="252" x2="600" y2="310" stroke="#6B7280" stroke-width="2"/>
  <line x1="600" y1="310" x2="140" y2="310" stroke="#6B7280" stroke-width="2"/>
  <line x1="140" y1="310" x2="140" y2="228" stroke="#6B7280" stroke-width="2"/>
  <line x1="140" y1="192" x2="140" y2="110" stroke="#6B7280" stroke-width="2"/>

  <!-- battery -->
  <line x1="116" y1="192" x2="164" y2="192" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="128" y1="228" x2="152" y2="228" stroke="#1a1a1a" stroke-width="5"/>
  <text x="100" y="197" text-anchor="middle" font-size="16" font-weight="bold" fill="#8B0029">+</text>
  <text x="100" y="234" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563EB">−</text>
  <text x="72" y="166" font-size="13" fill="#1a1a1a">전지 B</text>

  <!-- resistor zigzag -->
  <polyline fill="none" stroke="#8B0029" stroke-width="2.5" points="600,168 600,175 584,182 616,192 584,202 616,212 584,222 616,232 600,242 600,252"/>
  <text x="648" y="214" font-size="14" fill="#1a1a1a">저항 <tspan font-style="italic">R</tspan></text>

  <!-- terminals a, b -->
  <circle cx="600" cy="145" r="4.5" fill="#1a1a1a"/>
  <text x="616" y="150" font-size="14" font-style="italic" fill="#1a1a1a">a</text>
  <text x="656" y="150" font-size="12" fill="#6B7280">(높은 전위)</text>
  <circle cx="600" cy="278" r="4.5" fill="#1a1a1a"/>
  <text x="616" y="283" font-size="14" font-style="italic" fill="#1a1a1a">b</text>
  <text x="656" y="283" font-size="12" fill="#6B7280">(낮은 전위)</text>

  <!-- current arrows -->
  <line x1="290" y1="110" x2="420" y2="110" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed10)"/>
  <text x="355" y="94" text-anchor="middle" font-size="15" font-style="italic" fill="#8B0029">i</text>
  <line x1="420" y1="310" x2="290" y2="310" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed10)"/>
  <text x="355" y="336" text-anchor="middle" font-size="15" font-style="italic" fill="#8B0029">i</text>

  <!-- heat squiggles -->
  <path d="M560,180 q-8,6 0,12 q8,6 0,12" fill="none" stroke="#8B0029" stroke-width="1.5" opacity="0.65"/>
  <path d="M548,198 q-8,6 0,12 q8,6 0,12" fill="none" stroke="#8B0029" stroke-width="1.5" opacity="0.65"/>
  <path d="M560,216 q-8,6 0,12 q8,6 0,12" fill="none" stroke="#8B0029" stroke-width="1.5" opacity="0.65"/>
  <text x="512" y="166" text-anchor="middle" font-size="12" fill="#8B0029">열에너지</text>

  <!-- annotation -->
  <text x="370" y="370" text-anchor="middle" font-size="14" fill="#1a1a1a">전하 <tspan font-style="italic">dq</tspan> 가 a → b 로 이동하며 잃는 에너지: <tspan font-style="italic">dU = dq·V = i&#8202;dt&#8202;V</tspan></text>
  <text x="370" y="398" text-anchor="middle" font-size="16" font-style="italic" fill="#8B0029">P = dU/dt = iV</text>
</svg>
