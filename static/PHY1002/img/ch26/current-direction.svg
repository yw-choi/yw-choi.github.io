<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed2" markerWidth="12" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue2" markerWidth="12" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">전류 방향의 관습 — 양전하가 움직이는 방향</text>

  <!-- conducting loop (band) -->
  <path d="M110,70 H610 V350 H110 Z M140,100 H580 V320 H140 Z" fill="#F3F4F6" fill-rule="evenodd"/>
  <rect x="110" y="70" width="500" height="280" fill="none" stroke="#6B7280" stroke-width="2" rx="4"/>
  <rect x="140" y="100" width="440" height="220" fill="none" stroke="#6B7280" stroke-width="2" rx="4"/>

  <!-- battery in bottom segment -->
  <rect x="300" y="308" width="120" height="54" rx="6" fill="#fff" stroke="#6B7280" stroke-width="2"/>
  <text x="318" y="341" text-anchor="middle" font-size="18" font-weight="bold" fill="#8B0029">+</text>
  <text x="402" y="341" text-anchor="middle" font-size="18" font-weight="bold" fill="#2563EB">−</text>
  <text x="360" y="340" text-anchor="middle" font-size="12" fill="#1a1a1a">전지</text>

  <!-- conventional current arrows (outside the loop), exits + : left along bottom, up, right, down -->
  <line x1="278" y1="382" x2="192" y2="382" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <line x1="88" y1="272" x2="88" y2="162" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <line x1="290" y1="50" x2="430" y2="50" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <line x1="632" y1="162" x2="632" y2="272" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <text x="70" y="222" font-size="15" font-style="italic" fill="#8B0029">i</text>
  <text x="443" y="55" font-size="15" font-style="italic" fill="#8B0029">i</text>
  <text x="643" y="222" font-size="15" font-style="italic" fill="#8B0029">i</text>
  <text x="234" y="404" text-anchor="middle" font-size="15" font-style="italic" fill="#8B0029">i</text>

  <!-- electrons inside band, moving opposite -->
  <g>
    <circle cx="390" cy="85" r="8" fill="#2563EB"/>
    <text x="390" y="89.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">−</text>
    <line x1="378" y1="85" x2="340" y2="85" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue2)"/>
  </g>
  <g>
    <circle cx="125" cy="185" r="8" fill="#2563EB"/>
    <text x="125" y="189.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">−</text>
    <line x1="125" y1="197" x2="125" y2="235" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue2)"/>
  </g>
  <g>
    <circle cx="595" cy="240" r="8" fill="#2563EB"/>
    <text x="595" y="244.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">−</text>
    <line x1="595" y1="228" x2="595" y2="190" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue2)"/>
  </g>
  <g>
    <circle cx="215" cy="335" r="8" fill="#2563EB"/>
    <text x="215" y="339.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">−</text>
    <line x1="227" y1="335" x2="265" y2="335" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue2)"/>
  </g>

  <!-- legend -->
  <line x1="120" y1="420" x2="150" y2="420" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <text x="160" y="425" font-size="13" fill="#1a1a1a">전류 <tspan font-style="italic">i</tspan> 의 방향 (양전하 기준)</text>
  <line x1="420" y1="420" x2="450" y2="420" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue2)"/>
  <text x="460" y="425" font-size="13" fill="#1a1a1a">실제 전자의 이동 방향</text>
</svg>
