<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed3" markerWidth="12" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#8B0029"/>
    </marker>
  </defs>

  <text x="350" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">분기점에서의 전류 — 전하 보존</text>

  <!-- wires -->
  <line x1="60" y1="180" x2="330" y2="180" stroke="#6B7280" stroke-width="5" stroke-linecap="round"/>
  <line x1="330" y1="180" x2="620" y2="90" stroke="#6B7280" stroke-width="5" stroke-linecap="round"/>
  <line x1="330" y1="180" x2="620" y2="270" stroke="#6B7280" stroke-width="5" stroke-linecap="round"/>
  <circle cx="330" cy="180" r="6" fill="#6B7280"/>
  <text x="330" y="207" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">a</text>

  <!-- current arrows -->
  <line x1="130" y1="158" x2="240" y2="158" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed3)"/>
  <text x="185" y="143" text-anchor="middle" font-size="15" font-style="italic" fill="#8B0029">i<tspan font-size="11" dy="3">0</tspan></text>

  <line x1="426.8" y1="133.2" x2="513.8" y2="106.2" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed3)"/>
  <text x="478" y="98" text-anchor="middle" font-size="15" font-style="italic" fill="#8B0029">i<tspan font-size="11" dy="3">1</tspan></text>

  <line x1="426.8" y1="226.8" x2="513.8" y2="253.8" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed3)"/>
  <text x="478" y="282" text-anchor="middle" font-size="15" font-style="italic" fill="#8B0029">i<tspan font-size="11" dy="3">2</tspan></text>

  <!-- note -->
  <text x="350" y="312" text-anchor="middle" font-size="13" fill="#6B7280">분기점으로 들어온 전류의 합 = 나간 전류의 합 (전하는 쌓이지 않는다)</text>
  <text x="350" y="340" text-anchor="middle" font-size="17" font-style="italic" fill="#8B0029">i<tspan font-size="12" dy="3">0</tspan><tspan dy="-3"> = i</tspan><tspan font-size="12" dy="3">1</tspan><tspan dy="-3"> + i</tspan><tspan font-size="12" dy="3">2</tspan></text>
</svg>
