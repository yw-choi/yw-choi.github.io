<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="12" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" markerWidth="12" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="360" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">전류의 정의 — 단면을 지나가는 전하의 흐름</text>

  <!-- wire body -->
  <rect x="80" y="148" width="540" height="84" fill="#F3F4F6"/>
  <line x1="80" y1="148" x2="620" y2="148" stroke="#6B7280" stroke-width="2"/>
  <line x1="80" y1="232" x2="620" y2="232" stroke="#6B7280" stroke-width="2"/>
  <ellipse cx="80" cy="190" rx="13" ry="42" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <ellipse cx="620" cy="190" rx="13" ry="42" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- imaginary cross-section -->
  <ellipse cx="350" cy="190" rx="13" ry="42" fill="none" stroke="#8B0029" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="350" y="136" text-anchor="middle" font-size="13" fill="#8B0029">가상의 단면</text>

  <!-- charges with velocity arrows -->
  <g>
    <circle cx="150" cy="172" r="9" fill="#8B0029"/>
    <text x="150" y="176.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">+</text>
    <line x1="162" y1="172" x2="188" y2="172" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  </g>
  <g>
    <circle cx="210" cy="212" r="9" fill="#8B0029"/>
    <text x="210" y="216.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">+</text>
    <line x1="222" y1="212" x2="248" y2="212" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  </g>
  <g>
    <circle cx="272" cy="188" r="9" fill="#8B0029"/>
    <text x="272" y="192.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">+</text>
    <line x1="284" y1="188" x2="310" y2="188" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  </g>
  <g>
    <circle cx="430" cy="176" r="9" fill="#8B0029"/>
    <text x="430" y="180.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">+</text>
    <line x1="442" y1="176" x2="468" y2="176" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  </g>
  <g>
    <circle cx="490" cy="210" r="9" fill="#8B0029"/>
    <text x="490" y="214.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">+</text>
    <line x1="502" y1="210" x2="528" y2="210" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  </g>

  <!-- current arrow -->
  <line x1="250" y1="102" x2="470" y2="102" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="486" y="107" font-size="16" font-style="italic" fill="#8B0029">i</text>

  <!-- annotation -->
  <text x="360" y="300" text-anchor="middle" font-size="14" fill="#1a1a1a">시간 <tspan font-style="italic">dt</tspan> 동안 이 단면을 지나가는 전하량이 <tspan font-style="italic">dq</tspan>이면</text>
  <text x="360" y="336" text-anchor="middle" font-size="17" font-style="italic" fill="#8B0029">i = dq/dt</text>
</svg>
