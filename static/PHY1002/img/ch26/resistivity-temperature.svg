<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrGray7" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">구리의 저항률 — 온도에 따라 거의 선형으로 증가</text>

  <!-- axes -->
  <line x1="100" y1="370" x2="100" y2="66" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray7)"/>
  <line x1="100" y1="370" x2="656" y2="370" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray7)"/>
  <text x="100" y="54" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan font-style="italic">ρ</tspan> (10⁻⁸ Ω·m)</text>
  <text x="668" y="388" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan font-style="italic">T</tspan> (K)</text>

  <!-- x ticks -->
  <line x1="186" y1="370" x2="186" y2="376" stroke="#6B7280" stroke-width="1"/>
  <text x="186" y="392" text-anchor="middle" font-size="11" fill="#6B7280">200</text>
  <line x1="272" y1="370" x2="272" y2="376" stroke="#6B7280" stroke-width="1"/>
  <text x="272" y="392" text-anchor="middle" font-size="11" fill="#6B7280">400</text>
  <line x1="358" y1="370" x2="358" y2="376" stroke="#6B7280" stroke-width="1"/>
  <text x="358" y="392" text-anchor="middle" font-size="11" fill="#6B7280">600</text>
  <line x1="444" y1="370" x2="444" y2="376" stroke="#6B7280" stroke-width="1"/>
  <text x="444" y="392" text-anchor="middle" font-size="11" fill="#6B7280">800</text>
  <line x1="530" y1="370" x2="530" y2="376" stroke="#6B7280" stroke-width="1"/>
  <text x="530" y="392" text-anchor="middle" font-size="11" fill="#6B7280">1000</text>
  <line x1="616" y1="370" x2="616" y2="376" stroke="#6B7280" stroke-width="1"/>
  <text x="616" y="392" text-anchor="middle" font-size="11" fill="#6B7280">1200</text>
  <text x="94" y="392" text-anchor="middle" font-size="11" fill="#6B7280">0</text>

  <!-- y ticks -->
  <line x1="94" y1="310" x2="100" y2="310" stroke="#6B7280" stroke-width="1"/>
  <text x="86" y="314" text-anchor="end" font-size="11" fill="#6B7280">2</text>
  <line x1="94" y1="250" x2="100" y2="250" stroke="#6B7280" stroke-width="1"/>
  <text x="86" y="254" text-anchor="end" font-size="11" fill="#6B7280">4</text>
  <line x1="94" y1="190" x2="100" y2="190" stroke="#6B7280" stroke-width="1"/>
  <text x="86" y="194" text-anchor="end" font-size="11" fill="#6B7280">6</text>
  <line x1="94" y1="130" x2="100" y2="130" stroke="#6B7280" stroke-width="1"/>
  <text x="86" y="134" text-anchor="end" font-size="11" fill="#6B7280">8</text>
  <line x1="94" y1="70" x2="100" y2="70" stroke="#6B7280" stroke-width="1"/>
  <text x="86" y="74" text-anchor="end" font-size="11" fill="#6B7280">10</text>

  <!-- copper curve -->
  <polyline fill="none" stroke="#8B0029" stroke-width="2.5" points="
    100,367 143,359.5 186,340 226,319.3 272,295 315,274 358,253 401,230.5 444,208 487,185.5 530,163 573,140.5 616,118"/>

  <!-- reference point -->
  <line x1="226" y1="370" x2="226" y2="319.3" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="100" y1="319.3" x2="226" y2="319.3" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="226" cy="319.3" r="5" fill="#2563EB"/>
  <text x="240" y="345" font-size="12" fill="#2563EB">(<tspan font-style="italic">T</tspan><tspan font-size="9" dy="2">0</tspan><tspan dy="-2">, </tspan><tspan font-style="italic">ρ</tspan><tspan font-size="9" dy="2">0</tspan><tspan dy="-2">) = (293 K, 1.69×10⁻⁸ Ω·m)</tspan></text>
  <text x="226" y="410" text-anchor="middle" font-size="11" fill="#2563EB">실온</text>

  <!-- formula -->
  <text x="400" y="95" text-anchor="middle" font-size="15" fill="#8B0029"><tspan font-style="italic">ρ − ρ</tspan><tspan font-size="11" dy="3">0</tspan><tspan dy="-3" font-style="italic"> = ρ</tspan><tspan font-size="11" dy="3">0</tspan><tspan dy="-3" font-style="italic">α(T − T</tspan><tspan font-size="11" dy="3">0</tspan><tspan dy="-3" font-style="italic">)</tspan></text>
  <text x="400" y="118" text-anchor="middle" font-size="12" fill="#6B7280"><tspan font-style="italic">α</tspan> : 저항률의 온도 계수 (구리 4.3×10⁻³ K⁻¹)</text>
</svg>
