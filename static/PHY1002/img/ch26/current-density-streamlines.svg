<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed5" markerWidth="12" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue5" markerWidth="9" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="360" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">전류 밀도 <tspan font-style="italic">J</tspan> — 단면이 좁아지면 <tspan font-style="italic">J</tspan> 는 커진다</text>

  <!-- conductor -->
  <path d="M60,120 L300,120 C380,120 380,162 460,162 L660,162 L660,218 L460,218 C380,218 380,260 300,260 L60,260 Z"
        fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- streamlines -->
  <path d="M60,140 L300,140 C380,140 380,170 460,170 L640,170" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrBlue5)"/>
  <path d="M60,165 L300,165 C380,165 380,180 460,180 L640,180" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrBlue5)"/>
  <path d="M60,190 L300,190 C380,190 380,190 460,190 L640,190" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrBlue5)"/>
  <path d="M60,215 L300,215 C380,215 380,200 460,200 L640,200" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrBlue5)"/>
  <path d="M60,240 L300,240 C380,240 380,210 460,210 L640,210" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrBlue5)"/>

  <!-- current arrows -->
  <line x1="22" y1="190" x2="54" y2="190" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed5)"/>
  <text x="34" y="174" font-size="15" font-style="italic" fill="#8B0029">i</text>
  <line x1="664" y1="190" x2="696" y2="190" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed5)"/>
  <text x="676" y="174" font-size="15" font-style="italic" fill="#8B0029">i</text>

  <!-- labels -->
  <text x="180" y="292" text-anchor="middle" font-size="13" fill="#6B7280">넓은 단면: 유선이 성기다 → <tspan font-style="italic">J</tspan> 작다</text>
  <text x="550" y="292" text-anchor="middle" font-size="13" fill="#6B7280">좁은 단면: 유선이 빽빽하다 → <tspan font-style="italic">J</tspan> 크다</text>
  <text x="360" y="322" text-anchor="middle" font-size="14" fill="#8B0029">전하 보존: 어느 단면에서나 전류 <tspan font-style="italic">i</tspan> 는 같다</text>
</svg>
