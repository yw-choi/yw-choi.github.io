<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="sans-serif">
  <defs>
    <marker id="arrB6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrG6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- ===== Top: rod at rest ===== -->
  <text x="40" y="42" font-size="16" font-weight="bold" fill="#1a1a1a">(a) 막대의 정지 좌표계 — 고유 길이 L₀</text>

  <rect x="140" y="70" width="440" height="36" rx="6" fill="#F3F4F6" stroke="#1a1a1a" stroke-width="2"/>
  <text x="360" y="94" text-anchor="middle" font-size="14" fill="#6B7280">정지한 막대 (천천히 재도 된다)</text>

  <line x1="140" y1="132" x2="580" y2="132" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrG6)" marker-end="url(#arrG6)"/>
  <text x="360" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a"><tspan font-style="italic">L</tspan>₀ (고유 길이, proper length)</text>

  <!-- ===== Bottom: moving rod ===== -->
  <text x="40" y="222" font-size="16" font-weight="bold" fill="#1a1a1a">(b) 막대가 속력 v로 지나갈 때 — 수축된 길이 L</text>

  <!-- velocity arrow -->
  <line x1="500" y1="252" x2="580" y2="252" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB6)"/>
  <text x="540" y="242" text-anchor="middle" font-size="14" font-style="italic" fill="#2563EB">v</text>

  <rect x="205" y="266" width="310" height="36" rx="6" fill="#F3F4F6" stroke="#8B0029" stroke-width="2"/>
  <text x="360" y="290" text-anchor="middle" font-size="14" fill="#8B0029" font-weight="bold">움직이는 막대 (진행 방향으로만 수축)</text>

  <!-- simultaneous measurement marks -->
  <line x1="205" y1="258" x2="205" y2="318" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="515" y1="258" x2="515" y2="318" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="205" y="336" text-anchor="middle" font-size="12.5" fill="#6B7280">뒤끝 위치</text>
  <text x="515" y="336" text-anchor="middle" font-size="12.5" fill="#6B7280">앞끝 위치</text>
  <text x="360" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6B7280">→ 같은 순간에 표시해야 한다</text>

  <line x1="205" y1="356" x2="515" y2="356" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrG6)" marker-end="url(#arrG6)"/>
  <text x="360" y="382" text-anchor="middle" font-size="15" font-weight="bold" fill="#8B0029"><tspan font-style="italic">L</tspan> = <tspan font-style="italic">L</tspan>₀/γ &lt; <tspan font-style="italic">L</tspan>₀</text>

  <!-- ghost outline showing original length for comparison -->
  <rect x="140" y="266" width="440" height="36" rx="6" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="632" y="290" font-size="12.5" fill="#6B7280">L₀ (비교용)</text>
</svg>
