<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="sans-serif">
  <defs>
    <marker id="arrG4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="370" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">로런츠 인자 γ = 1/√(1−β²)</text>

  <!-- gridlines: gamma = 2,4,6,8,10  (y = 380 - (g-1)*340/9) -->
  <line x1="80" y1="342.2" x2="660" y2="342.2" stroke="#F3F4F6" stroke-width="2"/>
  <line x1="80" y1="266.7" x2="660" y2="266.7" stroke="#F3F4F6" stroke-width="2"/>
  <line x1="80" y1="191.1" x2="660" y2="191.1" stroke="#F3F4F6" stroke-width="2"/>
  <line x1="80" y1="115.6" x2="660" y2="115.6" stroke="#F3F4F6" stroke-width="2"/>
  <line x1="80" y1="40" x2="660" y2="40" stroke="#F3F4F6" stroke-width="2"/>

  <!-- axes -->
  <line x1="80" y1="380" x2="672" y2="380" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrG4)"/>
  <line x1="80" y1="380" x2="80" y2="28" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrG4)"/>
  <text x="692" y="426" text-anchor="end" font-size="15" font-style="italic" fill="#1a1a1a">β = v/c</text>
  <text x="58" y="34" text-anchor="middle" font-size="16" font-style="italic" fill="#1a1a1a">γ</text>

  <!-- x ticks -->
  <g font-size="13" fill="#6B7280" text-anchor="middle">
    <line x1="192" y1="380" x2="192" y2="386" stroke="#6B7280" stroke-width="1"/><text x="192" y="402">0.2</text>
    <line x1="304" y1="380" x2="304" y2="386" stroke="#6B7280" stroke-width="1"/><text x="304" y="402">0.4</text>
    <line x1="416" y1="380" x2="416" y2="386" stroke="#6B7280" stroke-width="1"/><text x="416" y="402">0.6</text>
    <line x1="528" y1="380" x2="528" y2="386" stroke="#6B7280" stroke-width="1"/><text x="528" y="402">0.8</text>
    <line x1="640" y1="380" x2="640" y2="386" stroke="#6B7280" stroke-width="1"/><text x="640" y="402">1.0</text>
    <text x="80" y="402">0</text>
  </g>
  <!-- y ticks -->
  <g font-size="13" fill="#6B7280" text-anchor="end">
    <text x="72" y="385">1</text>
    <text x="72" y="347">2</text>
    <text x="72" y="272">4</text>
    <text x="72" y="196">6</text>
    <text x="72" y="121">8</text>
    <text x="72" y="45">10</text>
  </g>

  <!-- asymptote at beta=1 -->
  <line x1="640" y1="380" x2="640" y2="40" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- gamma curve -->
  <polyline fill="none" stroke="#8B0029" stroke-width="2.5"
    points="80,380 136,379.8 192,379.2 248,378.2 304,376.6 360,374.2 416,370.6 472,364.9 500,360.7 528,354.8 556,346.1 584,331.1 595.2,321.4 606.4,307.0 612,296.8 617.6,282.9 623.2,262.4 628.8,228.0 631.6,198.9 634.4,150.0 635.5,118.6 636.6,72.4 637.1,45"/>

  <!-- marked points -->
  <line x1="360" y1="380" x2="360" y2="374.2" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="360" cy="374.2" r="4.5" fill="#2563EB"/>
  <text x="360" y="356" text-anchor="middle" font-size="13" fill="#2563EB">β=0.5, γ≈1.15</text>

  <line x1="584" y1="380" x2="584" y2="331.1" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="584" cy="331.1" r="4.5" fill="#2563EB"/>
  <text x="548" y="314" text-anchor="middle" font-size="13" fill="#2563EB">β=0.9, γ≈2.29</text>

  <circle cx="634.4" cy="150" r="4.5" fill="#2563EB"/>
  <text x="588" y="146" text-anchor="middle" font-size="13" fill="#2563EB">β=0.99, γ≈7.1</text>

  <!-- annotation -->
  <text x="500" y="70" text-anchor="end" font-size="14" font-weight="bold" fill="#8B0029">β → 1 이면 γ → ∞</text>
  <text x="500" y="90" text-anchor="end" font-size="13" fill="#6B7280">(어떤 물체도 c에 도달 불가)</text>
  <text x="250" y="330" font-size="13" fill="#6B7280">v &lt; 0.1c 에서는 γ ≈ 1 (고전역학이 잘 맞는 영역)</text>
</svg>
