<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" font-family="sans-serif">
  <defs>
    <marker id="arrR3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrG3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrB3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="140" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">우주선 안 (고유 좌표계)</text>
  <text x="530" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">지상에서 본 모습</text>

  <!-- ============ Left: rest frame ============ -->
  <!-- mirror -->
  <rect x="90" y="80" width="100" height="10" fill="#6B7280"/>
  <text x="140" y="72" text-anchor="middle" font-size="13" fill="#6B7280">거울</text>
  <!-- source -->
  <rect x="115" y="330" width="50" height="12" rx="3" fill="#8B0029"/>
  <text x="140" y="362" text-anchor="middle" font-size="13" fill="#8B0029">광원·검출기</text>
  <!-- light path up & down -->
  <line x1="132" y1="326" x2="132" y2="96" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR3)"/>
  <line x1="148" y1="96" x2="148" y2="326" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR3)"/>
  <!-- D dimension -->
  <line x1="210" y1="92" x2="210" y2="332" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrG3)" marker-end="url(#arrG3)"/>
  <text x="222" y="216" font-size="15" font-style="italic" fill="#1a1a1a">D</text>
  <!-- formula -->
  <text x="140" y="404" text-anchor="middle" font-size="15" fill="#1a1a1a">왕복 거리 2<tspan font-style="italic">D</tspan></text>
  <text x="140" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#8B0029">Δt₀ = 2D/c  (시계 1개)</text>

  <!-- ============ Right: ground frame ============ -->
  <!-- three source positions -->
  <rect x="335" y="330" width="50" height="12" rx="3" fill="#8B0029"/>
  <rect x="505" y="330" width="50" height="12" rx="3" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <rect x="675" y="330" width="50" height="12" rx="3" fill="#8B0029"/>
  <text x="352" y="362" text-anchor="middle" font-size="13" fill="#8B0029">사건 1 (방출)</text>
  <text x="708" y="362" text-anchor="middle" font-size="13" fill="#8B0029">사건 2 (복귀)</text>
  <!-- mirror at middle position (top) -->
  <rect x="480" y="80" width="100" height="10" fill="#6B7280"/>
  <text x="530" y="72" text-anchor="middle" font-size="13" fill="#6B7280">거울 (이동 중)</text>

  <!-- zigzag light path -->
  <line x1="360" y1="330" x2="527" y2="94" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR3)"/>
  <line x1="533" y1="94" x2="700" y2="330" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR3)"/>
  <text x="425" y="196" font-size="15" font-style="italic" fill="#8B0029">L</text>
  <text x="628" y="196" font-size="15" font-style="italic" fill="#8B0029">L</text>

  <!-- right triangle: vertical D and half base -->
  <line x1="530" y1="94" x2="530" y2="330" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="541" y="230" font-size="15" font-style="italic" fill="#2563EB">D</text>
  <line x1="360" y1="330" x2="530" y2="330" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="447" y="352" text-anchor="middle" font-size="14" fill="#2563EB">½<tspan font-style="italic">v</tspan>Δ<tspan font-style="italic">t</tspan></text>
  <!-- right angle mark -->
  <path d="M530 318 h-12 v12" fill="none" stroke="#2563EB" stroke-width="1"/>

  <!-- full base dimension -->
  <line x1="360" y1="382" x2="700" y2="382" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrG3)" marker-end="url(#arrG3)"/>
  <text x="530" y="374" text-anchor="middle" font-size="14" fill="#6B7280"><tspan font-style="italic">v</tspan>Δ<tspan font-style="italic">t</tspan> (우주선 이동 거리)</text>

  <!-- velocity arrow (top right) -->
  <line x1="620" y1="70" x2="700" y2="70" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB3)"/>
  <text x="660" y="58" text-anchor="middle" font-size="14" font-style="italic" fill="#2563EB">v</text>

  <text x="470" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">경로 2<tspan font-style="italic">L</tspan> &gt; 2<tspan font-style="italic">D</tspan>, 속력은 같은 <tspan font-style="italic" fill="#8B0029">c</tspan> → Δt &gt; Δt₀ (시계 2개 필요)</text>
</svg>
