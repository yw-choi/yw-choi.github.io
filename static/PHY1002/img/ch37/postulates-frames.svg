<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- ================= Left panel: lab frame ================= -->
  <rect x="30" y="52" width="340" height="250" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="200" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">관성계 S — 실험실 (정지)</text>

  <!-- floor -->
  <line x1="60" y1="262" x2="340" y2="262" stroke="#6B7280" stroke-width="2"/>

  <!-- light source (lamp on stand) -->
  <line x1="120" y1="262" x2="120" y2="200" stroke="#6B7280" stroke-width="2"/>
  <circle cx="120" cy="185" r="16" fill="#fff" stroke="#8B0029" stroke-width="2"/>
  <circle cx="120" cy="185" r="6" fill="#8B0029"/>
  <!-- rays -->
  <line x1="120" y1="163" x2="120" y2="151" stroke="#8B0029" stroke-width="1"/>
  <line x1="104" y1="169" x2="96" y2="161" stroke="#8B0029" stroke-width="1"/>
  <line x1="136" y1="169" x2="144" y2="161" stroke="#8B0029" stroke-width="1"/>

  <!-- light beam arrow -->
  <line x1="142" y1="185" x2="310" y2="185" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="226" y="172" text-anchor="middle" font-size="14" fill="#8B0029" font-weight="bold">빛의 속력 = <tspan font-style="italic">c</tspan></text>

  <text x="200" y="288" text-anchor="middle" font-size="13" fill="#6B7280">지면에 고정된 관측자</text>

  <!-- ================= Right panel: moving train frame ================= -->
  <rect x="390" y="52" width="340" height="250" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="560" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">관성계 S′ — 등속으로 달리는 KTX</text>

  <!-- velocity arrow above train -->
  <line x1="520" y1="112" x2="620" y2="112" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="570" y="102" text-anchor="middle" font-size="14" font-style="italic" fill="#2563EB">v<tspan font-style="normal"> (일정)</tspan></text>

  <!-- train body -->
  <path d="M425 135 h230 q42 0 46 42 v18 q0 8 -8 8 h-268 q-8 0 -8 -8 v-52 q0 -8 8 -8 z"
        fill="#fff" stroke="#6B7280" stroke-width="2"/>
  <!-- windows -->
  <rect x="440" y="150" width="30" height="20" rx="3" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <rect x="482" y="150" width="30" height="20" rx="3" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <rect x="524" y="150" width="30" height="20" rx="3" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <rect x="566" y="150" width="30" height="20" rx="3" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <!-- wheels -->
  <circle cx="455" cy="210" r="8" fill="#6B7280"/>
  <circle cx="495" cy="210" r="8" fill="#6B7280"/>
  <circle cx="600" cy="210" r="8" fill="#6B7280"/>
  <circle cx="640" cy="210" r="8" fill="#6B7280"/>
  <!-- rail -->
  <line x1="410" y1="222" x2="710" y2="222" stroke="#6B7280" stroke-width="2"/>

  <!-- light beam inside train -->
  <circle cx="448" cy="248" r="0" fill="none"/>
  <line x1="430" y1="248" x2="620" y2="248" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>
  <circle cx="424" cy="248" r="6" fill="#8B0029"/>
  <text x="524" y="270" text-anchor="middle" font-size="14" fill="#8B0029" font-weight="bold">열차 안에서 잰 빛의 속력 = <tspan font-style="italic">c</tspan> (같다!)</text>

  <!-- ================= Bottom caption ================= -->
  <text x="380" y="336" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">가설 1: 물리 법칙은 모든 관성계에서 같다</text>
  <text x="380" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#8B0029">가설 2: 진공 중 빛의 속력은 모든 관성계에서 같은 값 c</text>
</svg>
