<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="sans-serif">
  <text x="330" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">에너지–운동량 직각삼각형: E² = (pc)² + (mc²)²</text>

  <!-- triangle: right angle at bottom-right -->
  <!-- vertices: A(120,320) bottom-left, B(520,320) bottom-right, C(520,100) top-right -->
  <path d="M120 320 L520 320 L520 100 Z" fill="#F3F4F6" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>

  <!-- right angle mark at B -->
  <path d="M498 320 v-22 h22" fill="none" stroke="#6B7280" stroke-width="1"/>

  <!-- side labels -->
  <text x="320" y="352" text-anchor="middle" font-size="16" fill="#1a1a1a"><tspan font-style="italic">mc</tspan>² (정지 에너지)</text>
  <text x="543" y="215" font-size="16" fill="#2563EB"><tspan font-style="italic">pc</tspan></text>
  <text x="285" y="185" text-anchor="middle" font-size="16" fill="#8B0029" transform="rotate(-28.8 285 185)"><tspan font-style="italic">E</tspan> = γ<tspan font-style="italic">mc</tspan>² (총 에너지)</text>

  <!-- highlight hypotenuse and vertical leg -->
  <line x1="120" y1="320" x2="520" y2="100" stroke="#8B0029" stroke-width="2.5"/>
  <line x1="520" y1="320" x2="520" y2="100" stroke="#2563EB" stroke-width="2.5"/>

  <!-- angle theta at A -->
  <path d="M200 320 A 80 80 0 0 0 190 281" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  <text x="222" y="303" font-size="15" fill="#6B7280">θ</text>

  <!-- theta relations -->
  <text x="140" y="120" font-size="14.5" fill="#6B7280">sin θ = β = v/c</text>
  <text x="140" y="145" font-size="14.5" fill="#6B7280">cos θ = 1/γ</text>

  <!-- K relation note -->
  <text x="330" y="390" text-anchor="middle" font-size="14.5" fill="#1a1a1a">운동 에너지: <tspan font-style="italic">K</tspan> = <tspan font-style="italic">E</tspan> − <tspan font-style="italic">mc</tspan>² = (γ−1)<tspan font-style="italic">mc</tspan>²</text>
</svg>
