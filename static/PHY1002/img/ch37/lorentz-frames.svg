<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="740" height="420" font-family="sans-serif">
  <defs>
    <marker id="arrK7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrB7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrG7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="370" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">두 관성계 S와 S′ — S′은 S에 대해 +x 방향 속도 v로 이동</text>

  <!-- Frame S (black) -->
  <line x1="100" y1="330" x2="700" y2="330" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrK7)"/>
  <line x1="100" y1="330" x2="100" y2="70" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrK7)"/>
  <text x="712" y="335" font-size="15" font-style="italic" fill="#1a1a1a">x</text>
  <text x="92" y="62" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">y</text>
  <text x="72" y="322" font-size="15" font-weight="bold" fill="#1a1a1a">S</text>
  <circle cx="100" cy="330" r="3.5" fill="#1a1a1a"/>

  <!-- Frame S' (blue) -->
  <line x1="340" y1="330" x2="340" y2="70" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB7)"/>
  <text x="332" y="62" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">y′</text>
  <text x="360" y="322" font-size="15" font-weight="bold" fill="#2563EB">S′</text>
  <circle cx="340" cy="330" r="3.5" fill="#2563EB"/>
  <!-- v arrow on S' -->
  <line x1="352" y1="96" x2="432" y2="96" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB7)"/>
  <text x="392" y="86" text-anchor="middle" font-size="14" font-style="italic" fill="#2563EB">v</text>

  <!-- Event -->
  <g fill="#8B0029">
    <path d="M560 140 l5.5 12 13 1.5 -9.6 8.9 2.6 12.8 -11.5 -6.5 -11.5 6.5 2.6 -12.8 -9.6 -8.9 13 -1.5 z"/>
  </g>
  <text x="590" y="150" font-size="14" font-weight="bold" fill="#8B0029">사건 (x, t) / (x′, t′)</text>
  <line x1="560" y1="168" x2="560" y2="326" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- dimension: vt (origin S to origin S') -->
  <line x1="100" y1="358" x2="340" y2="358" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrG7)" marker-end="url(#arrG7)"/>
  <text x="220" y="378" text-anchor="middle" font-size="14" fill="#6B7280"><tspan font-style="italic">vt</tspan> (S′ 원점의 이동)</text>

  <!-- dimension: x' -->
  <line x1="340" y1="358" x2="560" y2="358" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrG7)" marker-end="url(#arrG7)"/>
  <text x="450" y="378" text-anchor="middle" font-size="14" font-style="italic" fill="#2563EB">x′</text>

  <!-- dimension: x -->
  <line x1="100" y1="396" x2="560" y2="396" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrG7)" marker-end="url(#arrG7)"/>
  <text x="330" y="416" text-anchor="middle" font-size="14" fill="#1a1a1a"><tspan font-style="italic">x</tspan> (S에서 잰 사건의 위치)</text>

  <!-- note -->
  <text x="368" y="240" font-size="13.5" fill="#6B7280">갈릴레이: x′ = x − vt</text>
  <text x="368" y="262" font-size="13.5" fill="#8B0029" font-weight="bold">로런츠: x′ = γ(x − vt)</text>
</svg>
