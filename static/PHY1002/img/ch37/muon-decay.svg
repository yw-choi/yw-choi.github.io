<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="sans-serif">
  <defs>
    <marker id="arrR5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrB5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrG5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="200" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">지상 좌표계에서 본 뮤온</text>
  <text x="580" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">뮤온 좌표계에서 본 상황</text>

  <!-- ============ Left panel: ground frame ============ -->
  <!-- atmosphere band -->
  <rect x="60" y="80" width="280" height="300" fill="#F3F4F6" stroke="none"/>
  <line x1="60" y1="80" x2="340" y2="80" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="200" y="72" text-anchor="middle" font-size="13" fill="#6B7280">대기 상층부: 뮤온 생성 (고도 ≈ 15 km)</text>
  <!-- ground -->
  <rect x="60" y="380" width="280" height="14" fill="#6B7280"/>
  <text x="200" y="412" text-anchor="middle" font-size="13" fill="#6B7280">지표면 (검출기)</text>

  <!-- muon particle + velocity down -->
  <circle cx="150" cy="100" r="9" fill="#8B0029"/>
  <text x="172" y="105" font-size="14" fill="#8B0029" font-weight="bold">μ</text>
  <line x1="150" y1="114" x2="150" y2="368" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR5)"/>
  <text x="160" y="245" font-size="14" fill="#8B0029"><tspan font-style="italic">v</tspan> = 0.9994<tspan font-style="italic">c</tspan></text>

  <!-- altitude dimension -->
  <line x1="300" y1="84" x2="300" y2="376" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrG5)" marker-end="url(#arrG5)"/>
  <text x="310" y="230" font-size="13" fill="#1a1a1a">15 km</text>

  <!-- summary -->
  <text x="200" y="440" text-anchor="middle" font-size="14" fill="#1a1a1a">수명이 <tspan font-weight="bold" fill="#8B0029">γΔt₀ = 63.5 μs로 늘어나</tspan> 약 19 km 비행</text>
  <text x="200" y="461" text-anchor="middle" font-size="13" fill="#6B7280">(시간 지연이 없다면 0.66 km밖에 못 간다)</text>

  <!-- ============ Right panel: muon frame ============ -->
  <!-- contracted atmosphere slab -->
  <rect x="440" y="200" width="280" height="60" fill="#F3F4F6" stroke="none"/>
  <line x1="440" y1="200" x2="720" y2="200" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="440" y="260" width="280" height="12" fill="#6B7280"/>
  <text x="580" y="192" text-anchor="middle" font-size="13" fill="#6B7280">대기층 (길이 수축!) — 두께 15 km/γ ≈ 0.52 km</text>
  <text x="580" y="292" text-anchor="middle" font-size="13" fill="#6B7280">지표면</text>

  <!-- muon at rest -->
  <circle cx="520" cy="120" r="9" fill="#8B0029"/>
  <text x="542" y="125" font-size="14" fill="#8B0029" font-weight="bold">μ (정지)</text>

  <!-- earth approaching upward -->
  <line x1="600" y1="330" x2="600" y2="300" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB5)"/>
  <line x1="560" y1="330" x2="560" y2="300" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB5)"/>
  <line x1="640" y1="330" x2="640" y2="300" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB5)"/>
  <text x="600" y="352" text-anchor="middle" font-size="14" fill="#2563EB">지표면이 <tspan font-style="italic">v</tspan> = 0.9994<tspan font-style="italic">c</tspan> 로 접근</text>

  <!-- summary -->
  <text x="580" y="440" text-anchor="middle" font-size="14" fill="#1a1a1a">수명은 고유 시간 <tspan font-weight="bold" fill="#8B0029">Δt₀ = 2.2 μs</tspan> 그대로지만</text>
  <text x="580" y="461" text-anchor="middle" font-size="14" fill="#1a1a1a">거리가 <tspan font-weight="bold" fill="#2563EB">0.52 km로 줄어</tspan> 지표에 도달 — 결론 일치!</text>
</svg>
