<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="sans-serif">
  <defs>
    <marker id="ltR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="ltB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="ltG" markerWidth="9" markerHeight="6.5" refX="7" refY="3.25" orient="auto"><polygon points="0 0, 9 3.25, 0 6.5" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="390" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">전류 고리의 토크 &#8212; 옆에서 본 모습 (변 2 방향에서)</text>

  <!-- B field lines (horizontal, rightward) -->
  <g stroke="#6B7280" stroke-width="1.6">
    <line x1="90" y1="120" x2="680" y2="120" marker-end="url(#ltG)"/>
    <line x1="90" y1="230" x2="680" y2="230" marker-end="url(#ltG)"/>
    <line x1="90" y1="340" x2="680" y2="340" marker-end="url(#ltG)"/>
  </g>
  <text x="700" y="125" font-size="15" fill="#6B7280" font-style="italic" font-weight="bold">B</text>

  <!-- loop edge-on: side1 top (current out), side3 bottom (current in) -->
  <line x1="380" y1="150" x2="460" y2="310" stroke="#1a1a1a" stroke-width="3"/>
  <!-- side 1: current out of page -->
  <circle cx="380" cy="150" r="12" fill="white" stroke="#8B0029" stroke-width="2.5"/>
  <circle cx="380" cy="150" r="3" fill="#8B0029"/>
  <text x="352" y="132" font-size="13" fill="#1a1a1a" text-anchor="end">변 1 (전류 &#8857;)</text>
  <!-- side 3: current into page -->
  <circle cx="460" cy="310" r="12" fill="white" stroke="#8B0029" stroke-width="2.5"/>
  <line x1="453" y1="303" x2="467" y2="317" stroke="#8B0029" stroke-width="2.5"/>
  <line x1="467" y1="303" x2="453" y2="317" stroke="#8B0029" stroke-width="2.5"/>
  <text x="488" y="332" font-size="13" fill="#1a1a1a">변 3 (전류 &#215;)</text>

  <!-- F1 up at side1 -->
  <line x1="380" y1="136" x2="380" y2="66" stroke="#8B0029" stroke-width="2.5" marker-end="url(#ltR)"/>
  <text x="394" y="80" font-size="15" fill="#8B0029" font-style="italic" font-weight="bold">F&#8321; = iaB</text>
  <!-- F3 down at side3 -->
  <line x1="460" y1="324" x2="460" y2="394" stroke="#8B0029" stroke-width="2.5" marker-end="url(#ltR)"/>
  <text x="474" y="390" font-size="15" fill="#8B0029" font-style="italic" font-weight="bold">F&#8323; = iaB</text>

  <!-- normal vector from midpoint -->
  <circle cx="420" cy="230" r="3" fill="#1a1a1a"/>
  <line x1="420" y1="230" x2="530" y2="175" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ltB)"/>
  <text x="543" y="172" font-size="15" fill="#2563EB" font-style="italic" font-weight="bold">n</text>
  <!-- angle theta between n and B -->
  <path d="M 480 230 A 60 60 0 0 0 473 203" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="496" y="218" font-size="14" fill="#6B7280" font-style="italic">&#952;</text>

  <!-- moment arm (b/2)sin(theta): horizontal dashes from side1 down to mid height -->
  <line x1="380" y1="150" x2="380" y2="230" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="380" y1="230" x2="420" y2="230" stroke="#6B7280" stroke-width="1.6"/>
  <text x="372" y="252" font-size="13" fill="#6B7280" text-anchor="end">모멘트 팔 (b/2)sin&#952;</text>

  <!-- rotation arrow (clockwise on screen: n aligns with B) -->
  <path d="M 338.7 311.3 A 115 115 0 0 1 311.9 269.3" fill="none" stroke="#8B0029" stroke-width="2" marker-end="url(#ltR)"/>
  <text x="240" y="365" font-size="13" fill="#8B0029">회전 방향</text>

  <!-- caption -->
  <text x="390" y="440" font-size="14" fill="#1a1a1a" text-anchor="middle">짝힘의 토크 &#964; = iabB sin&#952; &#8212; n 이 B 와 나란해지려는 방향으로 회전</text>
</svg>
