<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="sans-serif">
  <defs>
    <marker id="cmR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="cmB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="cmG" markerWidth="9" markerHeight="6.5" refX="7" refY="3.25" orient="auto"><polygon points="0 0, 9 3.25, 0 6.5" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="330" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">균일 자기장 속의 원운동: 자기력이 구심력</text>

  <!-- B out of page symbols (background, corners) -->
  <g stroke="#6B7280" stroke-width="1.6" fill="none">
    <circle cx="70" cy="90" r="9"/><circle cx="70" cy="265" r="9"/><circle cx="70" cy="430" r="9"/>
    <circle cx="590" cy="90" r="9"/><circle cx="590" cy="265" r="9"/><circle cx="590" cy="430" r="9"/>
    <circle cx="180" cy="430" r="9"/><circle cx="480" cy="430" r="9"/>
  </g>
  <g fill="#6B7280">
    <circle cx="70" cy="90" r="2.2"/><circle cx="70" cy="265" r="2.2"/><circle cx="70" cy="430" r="2.2"/>
    <circle cx="590" cy="90" r="2.2"/><circle cx="590" cy="265" r="2.2"/><circle cx="590" cy="430" r="2.2"/>
    <circle cx="180" cy="430" r="2.2"/><circle cx="480" cy="430" r="2.2"/>
  </g>
  <text x="530" y="63" font-size="14" fill="#6B7280" font-weight="bold">B 지면에서 나옴(&#8857;)</text>

  <!-- orbit -->
  <circle cx="330" cy="280" r="130" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 5"/>
  <!-- center -->
  <circle cx="330" cy="280" r="3.5" fill="#1a1a1a"/>

  <!-- radius line to lower-right point -->
  <line x1="330" y1="280" x2="436" y2="355" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="392" y="310" font-size="15" fill="#6B7280" font-style="italic" font-weight="bold">r</text>

  <!-- particle at top -->
  <circle cx="330" cy="150" r="15" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="330" y="156" font-size="15" fill="white" text-anchor="middle" font-weight="bold">+q</text>

  <!-- v tangent (rightward at top) -->
  <line x1="350" y1="150" x2="455" y2="150" stroke="#2563EB" stroke-width="2.5" marker-end="url(#cmB)"/>
  <text x="468" y="155" font-size="15" fill="#2563EB" font-style="italic" font-weight="bold">v</text>

  <!-- F toward center (downward from particle) -->
  <line x1="330" y1="170" x2="330" y2="248" stroke="#8B0029" stroke-width="2.5" marker-end="url(#cmR)"/>
  <text x="310" y="215" font-size="15" fill="#8B0029" text-anchor="end" font-style="italic" font-weight="bold">F<tspan dy="4" font-size="11">B</tspan></text>

  <!-- rotation direction arc (clockwise), left side of orbit -->
  <path d="M 214 340 A 130 130 0 0 1 205 250" fill="none" stroke="#8B0029" stroke-width="2" marker-end="url(#cmR)"/>
  <text x="150" y="305" font-size="13" fill="#8B0029" text-anchor="middle">시계 방향</text>
  <text x="150" y="322" font-size="13" fill="#8B0029" text-anchor="middle">(q &gt; 0)</text>

  <!-- caption -->
  <text x="330" y="460" font-size="14" fill="#1a1a1a" text-anchor="middle">|q|vB = mv&#178;/r &#8594; r = mv/|q|B &#8212; F<tspan dy="4" font-size="11">B</tspan><tspan dy="-4">는 항상 원 중심을 향한다</tspan></text>
</svg>
