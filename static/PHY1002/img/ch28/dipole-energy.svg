<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="sans-serif">
  <defs>
    <marker id="deR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="deG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">자기 쌍극자의 방향 에너지 U(&#952;) = &#8722;&#956;&#183;B</text>

  <!-- B field reference arrow -->
  <line x1="70" y1="330" x2="70" y2="110" stroke="#6B7280" stroke-width="2.5" marker-end="url(#deG)"/>
  <text x="70" y="95" font-size="15" fill="#6B7280" text-anchor="middle" font-style="italic" font-weight="bold">B</text>

  <!-- ===== state A: mu parallel to B (lowest) ===== -->
  <ellipse cx="200" cy="230" rx="60" ry="18" fill="#F3F4F6" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="200" y1="230" x2="200" y2="140" stroke="#8B0029" stroke-width="2.5" marker-end="url(#deR)"/>
  <text x="216" y="150" font-size="15" fill="#8B0029" font-style="italic" font-weight="bold">&#956;</text>
  <text x="200" y="285" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">U = &#8722;&#956;B (최저)</text>
  <text x="200" y="307" font-size="13" fill="#6B7280" text-anchor="middle">&#952; = 0&#176;, 안정 평형</text>

  <!-- ===== state B: mu antiparallel (highest) ===== -->
  <ellipse cx="410" cy="230" rx="60" ry="18" fill="#F3F4F6" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="410" y1="230" x2="410" y2="320" stroke="#8B0029" stroke-width="2.5" marker-end="url(#deR)"/>
  <text x="426" y="315" font-size="15" fill="#8B0029" font-style="italic" font-weight="bold">&#956;</text>
  <text x="410" y="180" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">U = +&#956;B (최고)</text>
  <text x="410" y="202" font-size="13" fill="#6B7280" text-anchor="middle">&#952; = 180&#176;, 불안정</text>

  <!-- ===== U(theta) graph ===== -->
  <!-- axes -->
  <line x1="570" y1="100" x2="570" y2="320" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="560" y1="210" x2="745" y2="210" stroke="#6B7280" stroke-width="1.4" marker-end="url(#deG)"/>
  <text x="748" y="230" font-size="13" fill="#6B7280" text-anchor="end" font-style="italic">&#952;</text>
  <text x="570" y="90" font-size="13" fill="#6B7280" text-anchor="middle" font-style="italic">U</text>
  <!-- curve U = -uB cos(theta) -->
  <path d="M 570.0 300.0 L 578.9 298.6 L 587.8 294.6 L 596.7 287.9 L 605.6 278.9 L 614.4 267.9 L 623.3 255.0 L 632.2 240.8 L 641.1 225.6 L 650.0 210.0 L 658.9 194.4 L 667.8 179.2 L 676.7 165.0 L 685.6 152.1 L 694.4 141.1 L 703.3 132.1 L 712.2 125.4 L 721.1 121.4 L 730.0 120.0" fill="none" stroke="#8B0029" stroke-width="2"/>
  <!-- reference dashes -->
  <line x1="562" y1="300" x2="578" y2="300" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="562" y1="120" x2="578" y2="120" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="730" y1="120" x2="730" y2="210" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="554" y="305" font-size="13" fill="#1a1a1a" text-anchor="end" font-style="italic">&#8722;&#956;B</text>
  <text x="554" y="125" font-size="13" fill="#1a1a1a" text-anchor="end" font-style="italic">+&#956;B</text>
  <text x="583" y="228" font-size="12.5" fill="#6B7280">0&#176;</text>
  <text x="632" y="200" font-size="12.5" fill="#6B7280" text-anchor="middle">90&#176;</text>
  <text x="730" y="105" font-size="12.5" fill="#6B7280" text-anchor="middle">180&#176;</text>
  <text x="655" y="345" font-size="13.5" fill="#1a1a1a" text-anchor="middle">U(&#952;) = &#8722;&#956;B cos&#952;</text>

  <!-- caption -->
  <text x="380" y="400" font-size="14" fill="#1a1a1a" text-anchor="middle">&#956; 가 B 와 나란할 때 에너지가 가장 낮다 &#8212; 나침반 바늘이 북쪽을 가리키는 이유</text>
</svg>
