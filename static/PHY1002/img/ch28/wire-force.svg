<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="sans-serif">
  <defs>
    <marker id="wfR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="wfB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="350" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">전류가 흐르는 도선이 받는 자기력</text>

  <!-- B out of page symbols -->
  <g stroke="#6B7280" stroke-width="1.6" fill="none">
    <circle cx="130" cy="110" r="9"/><circle cx="230" cy="110" r="9"/><circle cx="460" cy="110" r="9"/><circle cx="560" cy="110" r="9"/>
    <circle cx="130" cy="225" r="9"/><circle cx="230" cy="225" r="9"/><circle cx="460" cy="345" r="9"/><circle cx="560" cy="225" r="9"/>
    <circle cx="130" cy="340" r="9"/><circle cx="230" cy="340" r="9"/><circle cx="560" cy="340" r="9"/>
  </g>
  <g fill="#6B7280">
    <circle cx="130" cy="110" r="2.2"/><circle cx="230" cy="110" r="2.2"/><circle cx="460" cy="110" r="2.2"/><circle cx="560" cy="110" r="2.2"/>
    <circle cx="130" cy="225" r="2.2"/><circle cx="230" cy="225" r="2.2"/><circle cx="460" cy="345" r="2.2"/><circle cx="560" cy="225" r="2.2"/>
    <circle cx="130" cy="340" r="2.2"/><circle cx="230" cy="340" r="2.2"/><circle cx="560" cy="340" r="2.2"/>
  </g>
  <text x="620" y="70" font-size="14" fill="#6B7280" font-weight="bold" text-anchor="end">B 지면에서 나옴(&#8857;)</text>

  <!-- wire -->
  <rect x="338" y="70" width="14" height="310" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- current arrow on wire -->
  <line x1="345" y1="330" x2="345" y2="130" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="345,118 339,134 351,134" fill="#1a1a1a"/>
  <text x="360" y="105" font-size="15" fill="#1a1a1a" font-style="italic" font-weight="bold">i</text>

  <!-- L vector annotation (parallel, left of wire) -->
  <line x1="308" y1="300" x2="308" y2="180" stroke="#2563EB" stroke-width="2.5" marker-end="url(#wfB)"/>
  <text x="296" y="245" font-size="15" fill="#2563EB" text-anchor="end" font-style="italic" font-weight="bold">L</text>
  <text x="285" y="268" font-size="12" fill="#2563EB" text-anchor="end">(전류 방향)</text>

  <!-- force arrow -->
  <line x1="356" y1="225" x2="475" y2="225" stroke="#8B0029" stroke-width="3" marker-end="url(#wfR)"/>
  <text x="430" y="205" font-size="15" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F<tspan dy="4" font-size="11">B</tspan><tspan dy="-4"> = iL&#215;B</tspan></text>

  <!-- caption -->
  <text x="350" y="416" font-size="14" fill="#1a1a1a" text-anchor="middle">i는 위쪽, B 는 지면 밖 &#8594; 힘은 오른쪽, 크기 F = iLB (L&#8869;B)</text>
</svg>
