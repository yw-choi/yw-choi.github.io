<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" font-family="sans-serif">
  <defs>
    <marker id="thR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="thB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="thG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="390" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">톰슨의 실험: 교차하는 전기장과 자기장 (crossed fields)</text>

  <!-- beam line -->
  <line x1="95" y1="170" x2="672" y2="170" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="640,170 626,165 626,175" fill="#2563EB"/>

  <!-- filament -->
  <circle cx="85" cy="170" r="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="85" y="205" font-size="13" fill="#1a1a1a" text-anchor="middle">필라멘트</text>
  <text x="85" y="222" font-size="12" fill="#6B7280" text-anchor="middle">(전자 방출)</text>

  <!-- slit screen C -->
  <line x1="175" y1="105" x2="175" y2="160" stroke="#6B7280" stroke-width="4"/>
  <line x1="175" y1="180" x2="175" y2="235" stroke="#6B7280" stroke-width="4"/>
  <text x="175" y="258" font-size="13" fill="#1a1a1a" text-anchor="middle">슬릿 C</text>

  <!-- plates -->
  <rect x="260" y="103" width="180" height="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <rect x="260" y="225" width="180" height="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="250" y="114" font-size="15" fill="#8B0029" text-anchor="end" font-weight="bold">+</text>
  <text x="250" y="238" font-size="15" fill="#2563EB" text-anchor="end" font-weight="bold">&#8722;</text>

  <!-- E field arrow (downward, between plates, left side) -->
  <line x1="285" y1="128" x2="285" y2="212" stroke="#6B7280" stroke-width="2.5" marker-end="url(#thG)"/>
  <text x="298" y="205" font-size="14" fill="#6B7280" font-style="italic" font-weight="bold">E</text>

  <!-- B into page: x symbols between plates (two rows straddling beam) -->
  <g stroke="#2563EB" stroke-width="2">
    <line x1="334" y1="138" x2="346" y2="150"/><line x1="346" y1="138" x2="334" y2="150"/>
    <line x1="384" y1="138" x2="396" y2="150"/><line x1="396" y1="138" x2="384" y2="150"/>
    <line x1="334" y1="190" x2="346" y2="202"/><line x1="346" y1="190" x2="334" y2="202"/>
    <line x1="384" y1="190" x2="396" y2="202"/><line x1="396" y1="190" x2="384" y2="202"/>
  </g>
  <text x="420" y="200" font-size="14" fill="#2563EB" font-weight="bold" font-style="italic">B (&#215;)</text>

  <!-- screen S -->
  <line x1="672" y1="100" x2="672" y2="240" stroke="#6B7280" stroke-width="5"/>
  <circle cx="666" cy="170" r="6" fill="#8B0029"/>
  <text x="672" y="263" font-size="13" fill="#1a1a1a" text-anchor="middle">형광 스크린 S</text>
  <text x="700" y="174" font-size="12" fill="#8B0029">밝은 점</text>

  <!-- inset: forces on the electron -->
  <rect x="200" y="295" width="380" height="130" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <circle cx="330" cy="360" r="14" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="330" y="366" font-size="14" fill="white" text-anchor="middle" font-weight="bold">&#8722;e</text>
  <line x1="350" y1="360" x2="420" y2="360" stroke="#2563EB" stroke-width="2.5" marker-end="url(#thB)"/>
  <text x="432" y="365" font-size="14" fill="#2563EB" font-style="italic" font-weight="bold">v</text>
  <line x1="330" y1="342" x2="330" y2="305" stroke="#8B0029" stroke-width="2.5" marker-end="url(#thR)"/>
  <text x="345" y="313" font-size="13" fill="#8B0029" font-weight="bold">F<tspan dy="4" font-size="11">E</tspan><tspan dy="-4"> (전기력, 위)</tspan></text>
  <line x1="330" y1="378" x2="330" y2="415" stroke="#8B0029" stroke-width="2.5" marker-end="url(#thR)"/>
  <text x="345" y="415" font-size="13" fill="#8B0029" font-weight="bold">F<tspan dy="4" font-size="11">B</tspan><tspan dy="-4"> (자기력, 아래)</tspan></text>
  <text x="220" y="320" font-size="13" fill="#1a1a1a">두 힘이 상쇄되면</text>
  <text x="220" y="340" font-size="13" fill="#1a1a1a">전자는 직진:</text>
  <text x="220" y="363" font-size="14" fill="#1a1a1a" font-style="italic">|q|E = |q|vB</text>
</svg>
