<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="sans-serif">
  <defs>
    <marker id="bmG" markerWidth="9" markerHeight="6.5" refX="7" refY="3.25" orient="auto"><polygon points="0 0, 9 3.25, 0 6.5" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="350" y="30" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">막대자석의 자기력선 (magnetic field lines)</text>

  <!-- field lines: closed loops from N (right) over/under to S (left) -->
  <g stroke="#6B7280" stroke-width="1.5" fill="none">
    <path d="M 445 196 C 470 130, 230 130, 255 196" marker-mid="url(#bmG)"/>
    <path d="M 450 192 C 520 75, 180 75, 250 192"/>
    <path d="M 455 188 C 590 30, 110 30, 245 188"/>
    <path d="M 445 224 C 470 290, 230 290, 255 224"/>
    <path d="M 450 228 C 520 345, 180 345, 250 228"/>
    <path d="M 455 232 C 590 390, 110 390, 245 232"/>
    <!-- axial lines -->
    <line x1="455" y1="210" x2="640" y2="210"/>
    <line x1="60" y1="210" x2="245" y2="210"/>
  </g>
  <!-- direction arrows on loops (outside: N to S = leftward on top, leftward on bottom) -->
  <g fill="#6B7280">
    <polygon points="350,146 366,141 366,151" />
    <polygon points="350,113 366,108 366,118" />
    <polygon points="350,72 366,67 366,77" />
    <polygon points="350,274 366,269 366,279" />
    <polygon points="350,307 366,302 366,312" />
    <polygon points="350,348 366,343 366,353" />
    <!-- axial arrows: exit N rightward, enter S rightward -->
    <polygon points="580,210 564,205 564,215"/>
    <polygon points="150,210 134,205 134,215"/>
  </g>

  <!-- bar magnet -->
  <rect x="250" y="192" width="100" height="36" fill="#2563EB" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="350" y="192" width="100" height="36" fill="#8B0029" stroke="#1a1a1a" stroke-width="2"/>
  <text x="300" y="217" font-size="17" fill="white" text-anchor="middle" font-weight="bold">S</text>
  <text x="400" y="217" font-size="17" fill="white" text-anchor="middle" font-weight="bold">N</text>
  <!-- internal field: S to N (rightward), between the pole labels -->
  <line x1="322" y1="210" x2="370" y2="210" stroke="white" stroke-width="1.5"/>
  <polygon points="378,210 366,206 366,214" fill="white"/>

  <!-- caption -->
  <text x="350" y="398" font-size="14" fill="#1a1a1a" text-anchor="middle">자기력선은 닫힌 고리: 자석 밖에서는 N &#8594; S, 내부에서는 S &#8594; N</text>
  <text x="350" y="420" font-size="13" fill="#6B7280" text-anchor="middle">선이 빽빽한 곳(양 극 근처)일수록 자기장이 강하다</text>
</svg>
