<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" font-family="sans-serif">
  <defs>
    <marker id="haR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="haB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="haG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="360" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">홀 효과 (Hall effect): B 는 지면 안(&#215;), 전류 i는 아래로</text>

  <!-- ============ (a) just after B on ============ -->
  <!-- width d dimension -->
  <line x1="155" y1="80" x2="245" y2="80" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="155" y1="74" x2="155" y2="86" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="245" y1="74" x2="245" y2="86" stroke="#6B7280" stroke-width="1.4"/>
  <text x="200" y="72" font-size="13" fill="#6B7280" text-anchor="middle" font-style="italic">d</text>

  <!-- current in/out arrows -->
  <line x1="200" y1="96" x2="200" y2="118" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="200,124 195,112 205,112" fill="#1a1a1a"/>
  <text x="215" y="110" font-size="14" fill="#1a1a1a" font-style="italic" font-weight="bold">i</text>
  <line x1="200" y1="392" x2="200" y2="414" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="200,420 195,408 205,408" fill="#1a1a1a"/>

  <!-- strip -->
  <rect x="155" y="124" width="90" height="268" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- B into page inside strip -->
  <g stroke="#6B7280" stroke-width="1.6">
    <line x1="170" y1="140" x2="180" y2="150"/><line x1="180" y1="140" x2="170" y2="150"/>
    <line x1="220" y1="140" x2="230" y2="150"/><line x1="230" y1="140" x2="220" y2="150"/>
    <line x1="170" y1="355" x2="180" y2="365"/><line x1="180" y1="355" x2="170" y2="365"/>
    <line x1="220" y1="355" x2="230" y2="365"/><line x1="230" y1="355" x2="220" y2="365"/>
  </g>

  <!-- electron with vd and FB -->
  <circle cx="190" cy="255" r="13" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="190" y="261" font-size="13" fill="white" text-anchor="middle" font-weight="bold">&#8722;</text>
  <line x1="190" y1="238" x2="190" y2="185" stroke="#2563EB" stroke-width="2.5" marker-end="url(#haB)"/>
  <text x="172" y="192" font-size="14" fill="#2563EB" text-anchor="end" font-style="italic" font-weight="bold">v<tspan dy="4" font-size="11">d</tspan></text>
  <line x1="207" y1="255" x2="260" y2="255" stroke="#8B0029" stroke-width="2.5" marker-end="url(#haR)"/>
  <text x="268" y="260" font-size="14" fill="#8B0029" font-style="italic" font-weight="bold">F<tspan dy="4" font-size="11">B</tspan></text>

  <text x="200" y="446" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">(a) B를 켠 직후</text>
  <text x="200" y="466" font-size="13" fill="#6B7280" text-anchor="middle">자기력이 전자를 오른쪽으로 민다</text>

  <!-- ============ (b) equilibrium ============ -->
  <!-- current arrows -->
  <line x1="520" y1="96" x2="520" y2="118" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="520,124 515,112 525,112" fill="#1a1a1a"/>
  <text x="535" y="110" font-size="14" fill="#1a1a1a" font-style="italic" font-weight="bold">i</text>
  <line x1="520" y1="392" x2="520" y2="414" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="520,420 515,408 525,408" fill="#1a1a1a"/>

  <!-- strip -->
  <rect x="475" y="124" width="90" height="268" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- accumulated charges -->
  <g font-size="14" font-weight="bold">
    <text x="486" y="152" fill="#8B0029">+</text><text x="486" y="192" fill="#8B0029">+</text>
    <text x="486" y="232" fill="#8B0029">+</text><text x="486" y="312" fill="#8B0029">+</text>
    <text x="486" y="352" fill="#8B0029">+</text><text x="486" y="386" fill="#8B0029">+</text>
    <text x="546" y="152" fill="#2563EB">&#8722;</text><text x="546" y="192" fill="#2563EB">&#8722;</text>
    <text x="546" y="232" fill="#2563EB">&#8722;</text><text x="546" y="312" fill="#2563EB">&#8722;</text>
    <text x="546" y="352" fill="#2563EB">&#8722;</text><text x="546" y="386" fill="#2563EB">&#8722;</text>
  </g>

  <!-- E field arrow inside strip (left + to right -) -->
  <line x1="498" y1="168" x2="542" y2="168" stroke="#6B7280" stroke-width="2.5" marker-end="url(#haG)"/>
  <text x="520" y="158" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic" font-weight="bold">E</text>

  <!-- electron in equilibrium: FE left, FB right -->
  <circle cx="520" cy="262" r="13" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="520" y="268" font-size="13" fill="white" text-anchor="middle" font-weight="bold">&#8722;</text>
  <line x1="520" y1="245" x2="520" y2="200" stroke="#2563EB" stroke-width="2.5" marker-end="url(#haB)"/>
  <text x="533" y="208" font-size="14" fill="#2563EB" font-style="italic" font-weight="bold">v<tspan dy="4" font-size="11">d</tspan></text>
  <line x1="537" y1="262" x2="590" y2="262" stroke="#8B0029" stroke-width="2.5" marker-end="url(#haR)"/>
  <text x="598" y="267" font-size="14" fill="#8B0029" font-style="italic" font-weight="bold">F<tspan dy="4" font-size="11">B</tspan></text>
  <line x1="503" y1="262" x2="450" y2="262" stroke="#8B0029" stroke-width="2.5" marker-end="url(#haR)"/>
  <text x="442" y="267" font-size="14" fill="#8B0029" text-anchor="end" font-style="italic" font-weight="bold">F<tspan dy="4" font-size="11">E</tspan></text>

  <!-- potential labels -->
  <text x="435" y="330" font-size="13" fill="#8B0029" text-anchor="end">고전위</text>
  <text x="605" y="330" font-size="13" fill="#2563EB">저전위</text>

  <text x="520" y="446" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">(b) 평형 상태</text>
  <text x="520" y="466" font-size="13" fill="#6B7280" text-anchor="middle">eE = ev<tspan dy="4" font-size="10">d</tspan><tspan dy="-4">B &#8594; 홀 전위차 V = Ed</tspan></text>
</svg>
