    <circle cx="222" cy="230" r="2"/><circle cx="458" cy="230" r="2"/>
  </g>
  <text x="560" y="80" font-size="13.5" fill="#6B7280" font-weight="bold" text-anchor="middle">B 지면에서 나옴(&#8857;)</text>

