  <!-- oscillator connections -->
  <line x1="310" y1="382" x2="310" y2="430" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="370" y1="382" x2="370" y2="430" stroke="#6B7280" stroke-width="1.6"/>
