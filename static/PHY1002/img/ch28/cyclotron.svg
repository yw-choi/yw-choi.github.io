<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="sans-serif">
  <defs>
    <marker id="cyR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="340" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">사이클로트론 (cyclotron) &#8212; 위에서 본 모습</text>

  <!-- left dee (semicircle, flat side on right) -->
  <path d="M 330 80 A 150 150 0 0 0 330 380 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
