  <circle cx="340" cy="430" r="22" fill="white" stroke="#6B7280" stroke-width="2"/>
  <path d="M 328 430 Q 334 420, 340 430 Q 346 440, 352 430" fill="none" stroke="#6B7280" stroke-width="2"/>
  <text x="378" y="452" font-size="13" fill="#1a1a1a">고주파 발진기 (f<tspan dy="4" font-size="10">osc</tspan><tspan dy="-4">)</tspan></text>

  <!-- caption -->
  <text x="340" y="490" font-size="14" fill="#1a1a1a" text-anchor="middle">틈을 지날 때마다 전기장이 가속 &#8594; 반지름이 커지는 나선 &#8594; 가장자리에서 빔으로 방출</text>
</svg>
