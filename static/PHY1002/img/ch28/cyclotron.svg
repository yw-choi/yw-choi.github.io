  <path d="M 350 80 A 150 150 0 0 1 350 380 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="216" y="115" font-size="14" fill="#1a1a1a" font-weight="bold">디(dee)</text>
  <text x="425" y="115" font-size="14" fill="#1a1a1a" font-weight="bold">디(dee)</text>

