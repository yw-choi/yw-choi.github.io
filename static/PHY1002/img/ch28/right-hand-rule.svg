<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="sans-serif">
  <defs>
    <marker id="rhrR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="rhrB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="rhrG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="30" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">오른손 법칙: v &#215; B 의 방향</text>

  <!-- ===== Left: plane containing v and B, force perpendicular ===== -->
  <!-- plane (parallelogram) -->
  <polygon points="70,330 290,380 420,300 200,250" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="105" y="372" font-size="13" fill="#6B7280">v 와 B 가 놓인 평면</text>

  <!-- origin point -->
  <circle cx="235" cy="310" r="4" fill="#1a1a1a"/>

  <!-- v vector (blue), in plane, to lower-right -->
  <line x1="235" y1="310" x2="365" y2="340" stroke="#2563EB" stroke-width="2.5" marker-end="url(#rhrB)"/>
  <text x="378" y="352" font-size="15" fill="#2563EB" font-style="italic" font-weight="bold">v</text>

  <!-- B vector (gray), in plane, to upper-right -->
  <line x1="235" y1="310" x2="380" y2="282" stroke="#6B7280" stroke-width="2.5" marker-end="url(#rhrG)"/>
  <text x="393" y="282" font-size="15" fill="#6B7280" font-style="italic" font-weight="bold">B</text>

  <!-- angle phi between v and B -->
  <path d="M 285 321 A 52 52 0 0 0 286 300" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="302" y="317" font-size="14" fill="#6B7280" font-style="italic">&#966;</text>

  <!-- v x B vector (red), perpendicular, upward -->
  <line x1="235" y1="310" x2="235" y2="90" stroke="#8B0029" stroke-width="2.5" marker-end="url(#rhrR)"/>
  <text x="245" y="85" font-size="15" fill="#8B0029" font-style="italic" font-weight="bold">v &#215; B</text>
  <!-- right angle mark -->
  <path d="M 235 280 L 249 283 L 249 297" fill="none" stroke="#6B7280" stroke-width="1"/>

  <!-- annotation -->
  <text x="60" y="120" font-size="14" fill="#1a1a1a">네 손가락으로 v 를 B 쪽으로</text>
  <text x="60" y="140" font-size="14" fill="#1a1a1a">감으면 엄지가 v &#215; B 방향</text>
  <text x="60" y="166" font-size="14" fill="#6B7280">크기: |v &#215; B| = vB sin&#966;</text>

  <!-- ===== Right: force depends on sign of q ===== -->
  <text x="615" y="70" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">전하 부호에 따른 힘의 방향</text>

  <!-- positive charge -->
  <circle cx="560" cy="180" r="20" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="560" y="187" font-size="18" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <line x1="560" y1="152" x2="560" y2="95" stroke="#8B0029" stroke-width="2.5" marker-end="url(#rhrR)"/>
  <text x="575" y="112" font-size="14" fill="#8B0029" font-weight="bold" font-style="italic">F<tspan dy="4" font-size="11">B</tspan><tspan dy="-4"> = qv&#215;B</tspan></text>
  <text x="560" y="228" font-size="13" fill="#1a1a1a" text-anchor="middle">q &gt; 0 : v &#215; B 방향</text>

  <!-- negative charge -->
  <circle cx="560" cy="310" r="20" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="560" y="316" font-size="18" fill="white" text-anchor="middle" font-weight="bold">&#8722;</text>
  <line x1="560" y1="338" x2="560" y2="395" stroke="#8B0029" stroke-width="2.5" marker-end="url(#rhrR)"/>
  <text x="575" y="385" font-size="14" fill="#8B0029" font-weight="bold" font-style="italic">F<tspan dy="4" font-size="11">B</tspan></text>
  <text x="560" y="425" font-size="13" fill="#1a1a1a" text-anchor="middle">q &lt; 0 : v &#215; B 의 반대 방향</text>
</svg>
