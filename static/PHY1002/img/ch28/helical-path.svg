<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="sans-serif">
  <defs>
    <marker id="hxB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="hxG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="390" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">나선 운동 (helical path): v 가 B 와 비스듬할 때</text>

  <!-- ===== velocity decomposition (top-left) ===== -->
  <circle cx="120" cy="150" r="4" fill="#1a1a1a"/>
  <line x1="120" y1="150" x2="280" y2="150" stroke="#6B7280" stroke-width="2.5" marker-end="url(#hxG)"/>
  <text x="255" y="172" font-size="14" fill="#6B7280" font-style="italic" font-weight="bold">v&#8741; = v cos&#966;</text>
  <line x1="280" y1="150" x2="280" y2="70" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#hxG)"/>
  <text x="292" y="105" font-size="14" fill="#6B7280" font-style="italic" font-weight="bold">v&#8869; = v sin&#966;</text>
  <line x1="120" y1="150" x2="280" y2="70" stroke="#2563EB" stroke-width="2.5" marker-end="url(#hxB)"/>
  <text x="200" y="90" font-size="15" fill="#2563EB" font-style="italic" font-weight="bold">v</text>
  <path d="M 168 150 A 48 48 0 0 0 163 128" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="182" y="140" font-size="14" fill="#6B7280" font-style="italic">&#966;</text>

  <!-- ===== helix along B axis (bottom) ===== -->
  <!-- B axis -->
  <line x1="90" y1="300" x2="720" y2="300" stroke="#6B7280" stroke-width="2" marker-end="url(#hxG)"/>
  <text x="700" y="285" font-size="15" fill="#6B7280" font-style="italic" font-weight="bold">B</text>

  <!-- helix loops (spring seen from the side) -->
  <g stroke="#8B0029" stroke-width="2" fill="none">
    <path d="M 200 300 C 160 300, 160 240, 200 240 C 240 240, 240 360, 280 360 C 300 360, 305 335, 305 300"/>
    <path d="M 305 300 C 305 265, 285 240, 310 240 C 350 240, 350 360, 390 360 C 410 360, 415 335, 415 300"/>
    <path d="M 415 300 C 415 265, 395 240, 420 240 C 460 240, 460 360, 500 360 C 520 360, 525 335, 525 300"/>
    <path d="M 525 300 C 525 265, 505 240, 530 240 C 570 240, 570 360, 610 360 C 630 360, 635 330, 632 302"/>
  </g>

  <!-- pitch dimension between two crest points -->
  <line x1="310" y1="240" x2="310" y2="205" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="420" y1="240" x2="420" y2="205" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="310" y1="212" x2="420" y2="212" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="310" y1="206" x2="310" y2="218" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="420" y1="206" x2="420" y2="218" stroke="#6B7280" stroke-width="1.4"/>
  <text x="365" y="202" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">p (피치)</text>

  <!-- radius annotation -->
  <line x1="666" y1="300" x2="666" y2="360" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="680" y="337" font-size="14" fill="#6B7280" font-style="italic">r</text>

  <!-- caption -->
  <text x="390" y="412" font-size="14" fill="#1a1a1a" text-anchor="middle">v&#8869;가 원운동(반지름 r)을, v&#8741;가 축 방향 이동(피치 p = v&#8741;T)을 만든다</text>
</svg>
