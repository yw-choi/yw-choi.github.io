<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8B0029"/>
    </marker>
  </defs>

  <!-- left plate (positive) -->
  <rect x="206" y="55" width="14" height="270" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="213" y="42" text-anchor="middle" font-size="14" fill="#8B0029" font-weight="bold">+σ</text>
  <!-- right plate (negative) -->
  <rect x="500" y="55" width="14" height="270" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="507" y="42" text-anchor="middle" font-size="14" fill="#2563EB" font-weight="bold">−σ</text>

  <!-- inner-face charges -->
  <g fill="#8B0029" font-size="13" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">
    <text x="220" y="78">+</text>
    <text x="220" y="106">+</text>
    <text x="220" y="134">+</text>
    <text x="220" y="162">+</text>
    <text x="220" y="196">+</text>
    <text x="220" y="224">+</text>
    <text x="220" y="252">+</text>
    <text x="220" y="280">+</text>
    <text x="220" y="308">+</text>
  </g>
  <g fill="#2563EB" font-size="14" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">
    <text x="500" y="78">−</text>
    <text x="500" y="106">−</text>
    <text x="500" y="134">−</text>
    <text x="500" y="162">−</text>
    <text x="500" y="196">−</text>
    <text x="500" y="224">−</text>
    <text x="500" y="252">−</text>
    <text x="500" y="280">−</text>
    <text x="500" y="308">−</text>
  </g>

  <!-- E field between plates -->
  <g stroke="#8B0029" stroke-width="2.5">
    <line x1="242" y1="120" x2="482" y2="120" marker-end="url(#aR)"/>
    <line x1="242" y1="190" x2="482" y2="190" marker-end="url(#aR)"/>
    <line x1="242" y1="260" x2="482" y2="260" marker-end="url(#aR)"/>
  </g>
  <text x="362" y="94" text-anchor="middle" font-size="14.5" fill="#8B0029" font-weight="bold">E = σ/ε₀ (균일)</text>

  <!-- outside: E = 0 -->
  <text x="106" y="196" text-anchor="middle" font-size="15" fill="#6B7280" font-weight="bold">E = 0</text>
  <text x="614" y="196" text-anchor="middle" font-size="15" fill="#6B7280" font-weight="bold">E = 0</text>

  <!-- bottom caption -->
  <text x="360" y="362" text-anchor="middle" font-size="14" fill="#1a1a1a">두 도체 판을 가까이 놓으면 전하는 마주 보는 <tspan font-weight="bold">안쪽 면</tspan>에만 모인다</text>
</svg>
