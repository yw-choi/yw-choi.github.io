<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8B0029"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- ===== Panel (a): theta = 0 ===== -->
  <g>
    <!-- E field arrows piercing the plate -->
    <line x1="48" y1="120" x2="212" y2="120" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
    <line x1="48" y1="200" x2="212" y2="200" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
    <text x="56" y="106" fill="#8B0029" font-size="14" font-style="italic">E</text>
    <!-- plate (vertical) -->
    <rect x="126" y="100" width="8" height="120" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
    <!-- area vector -->
    <line x1="134" y1="160" x2="200" y2="160" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>
    <text x="192" y="148" fill="#2563EB" font-size="14" font-style="italic">A</text>
    <!-- caption -->
    <text x="130" y="262" text-anchor="middle" font-size="14" fill="#1a1a1a"><tspan font-style="italic">θ</tspan> = 0</text>
    <text x="130" y="284" text-anchor="middle" font-size="14" fill="#8B0029" font-weight="bold">Φ = EA (최대)</text>
  </g>

  <!-- ===== Panel (b): 0 < theta < 90 ===== -->
  <g>
    <line x1="308" y1="112" x2="472" y2="112" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
    <line x1="308" y1="208" x2="472" y2="208" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
    <text x="316" y="98" fill="#8B0029" font-size="14" font-style="italic">E</text>
    <!-- plate rotated: normal 35deg above horizontal -->
    <rect x="-4" y="-70" width="8" height="140" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" transform="translate(390,160) rotate(-35)"/>
    <!-- dashed reference along E direction -->
    <line x1="396" y1="160" x2="466" y2="160" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- area vector along normal (35deg up-right) -->
    <line x1="395" y1="157" x2="437" y2="127" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>
    <text x="443" y="122" fill="#2563EB" font-size="14" font-style="italic">A</text>
    <!-- theta arc -->
    <path d="M 434 160 A 44 44 0 0 0 426 135" fill="none" stroke="#6B7280" stroke-width="1"/>
    <text x="444" y="152" fill="#1a1a1a" font-size="13" font-style="italic">θ</text>
    <!-- caption -->
    <text x="390" y="262" text-anchor="middle" font-size="14" fill="#1a1a1a">0 &lt; <tspan font-style="italic">θ</tspan> &lt; 90°</text>
    <text x="390" y="284" text-anchor="middle" font-size="14" fill="#8B0029" font-weight="bold">Φ = EA cos <tspan font-style="italic">θ</tspan></text>
  </g>

  <!-- ===== Panel (c): theta = 90 ===== -->
  <g>
    <line x1="570" y1="136" x2="732" y2="136" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
    <line x1="570" y1="184" x2="732" y2="184" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
    <text x="576" y="122" fill="#8B0029" font-size="14" font-style="italic">E</text>
    <!-- plate horizontal -->
    <rect x="586" y="156" width="128" height="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
    <!-- area vector up -->
    <line x1="650" y1="156" x2="650" y2="96" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>
    <text x="658" y="104" fill="#2563EB" font-size="14" font-style="italic">A</text>
    <!-- theta arc between A(up) and E(right) -->
    <path d="M 686 156 A 36 36 0 0 0 650 120" fill="none" stroke="#6B7280" stroke-width="1"/>
    <text x="684" y="126" fill="#1a1a1a" font-size="13"><tspan font-style="italic">θ</tspan> = 90°</text>
    <!-- caption -->
    <text x="650" y="262" text-anchor="middle" font-size="14" fill="#1a1a1a"><tspan font-style="italic">θ</tspan> = 90° (스침)</text>
    <text x="650" y="284" text-anchor="middle" font-size="14" fill="#8B0029" font-weight="bold">Φ = 0</text>
  </g>
</svg>
