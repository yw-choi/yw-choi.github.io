<svg viewBox="0 0 780 410" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B7280"/>
    </marker>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2" fill="#8B0029" opacity="0.4"/>
      <circle cx="14" cy="13" r="2" fill="#8B0029" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- ===== left: uniformly charged solid sphere ===== -->
  <circle cx="185" cy="215" r="125" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <circle cx="185" cy="215" r="123" fill="url(#dots)" stroke="none"/>

  <!-- Gaussian surface (r < R) -->
  <circle cx="185" cy="215" r="78" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- center dot -->
  <circle cx="185" cy="215" r="3" fill="#1a1a1a"/>

  <!-- r arrow (to Gaussian surface) -->
  <line x1="185" y1="215" x2="250" y2="253" stroke="#6B7280" stroke-width="1.5" marker-end="url(#aG)"/>
  <text x="222" y="248" font-size="14" font-style="italic" fill="#1a1a1a">r</text>

  <!-- R arrow (to sphere edge) -->
  <line x1="185" y1="215" x2="270" y2="127" stroke="#6B7280" stroke-width="1.5" marker-end="url(#aG)"/>
  <text x="238" y="160" font-size="14" font-style="italic" fill="#1a1a1a">R</text>

  <!-- annotations -->
  <text x="42" y="46" font-size="14" fill="#1a1a1a" font-weight="bold">균일하게 대전된 구 (총 전하 <tspan font-style="italic">q</tspan>)</text>
  <text x="42" y="382" font-size="13" fill="#6B7280">가우스면 안의 전하: <tspan font-style="italic">q&#8242;</tspan> = <tspan font-style="italic">q</tspan>&#183;<tspan font-style="italic">r</tspan>&#179;/<tspan font-style="italic">R</tspan>&#179;</text>
  <line x1="120" y1="366" x2="140" y2="284" stroke="#6B7280" stroke-width="1"/>

  <!-- ===== right: E(r) graph ===== -->
  <text x="605" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">전기장 크기 <tspan font-style="italic">E</tspan>(<tspan font-style="italic">r</tspan>)</text>

  <!-- axes -->
  <line x1="470" y1="330" x2="745" y2="330" stroke="#6B7280" stroke-width="1.5" marker-end="url(#aG)"/>
  <line x1="470" y1="330" x2="470" y2="82" stroke="#6B7280" stroke-width="1.5" marker-end="url(#aG)"/>
  <text x="456" y="90" text-anchor="end" font-size="14" font-style="italic" fill="#1a1a1a">E</text>
  <text x="752" y="344" font-size="14" font-style="italic" fill="#1a1a1a">r</text>

  <!-- curve: linear inside, 1/r^2 outside -->
  <path d="M470,330 L590,140 L595,154.9 L600,168.1 L610,190.4 L620,208.4 L630,223.1 L640,235.3 L660,254.2 L680,268 L700,278.3 L720,286 L738,292" fill="none" stroke="#8B0029" stroke-width="2.5"/>

  <!-- R marker -->
  <line x1="590" y1="140" x2="590" y2="330" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="590" y="350" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">R</text>

  <!-- E max marker -->
  <line x1="470" y1="140" x2="590" y2="140" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="462" y="132" text-anchor="end" font-size="12.5" fill="#6B7280"><tspan font-style="italic">q</tspan>/(4&#960;&#949;&#8320;<tspan font-style="italic">R</tspan>&#178;)</text>

  <!-- region labels -->
  <text x="520" y="300" font-size="13.5" fill="#8B0029" font-weight="bold"><tspan font-style="italic">E</tspan> &#8733; <tspan font-style="italic">r</tspan></text>
  <text x="652" y="222" font-size="13.5" fill="#8B0029" font-weight="bold"><tspan font-style="italic">E</tspan> &#8733; 1/<tspan font-style="italic">r</tspan>&#178;</text>
  <text x="521" y="368" text-anchor="middle" font-size="12.5" fill="#6B7280">(내부)</text>
  <text x="672" y="368" text-anchor="middle" font-size="12.5" fill="#6B7280">(외부)</text>
</svg>
