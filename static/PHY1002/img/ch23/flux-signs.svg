<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8B0029"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="aRl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cc8fa0"/>
    </marker>
  </defs>

  <!-- faint background field lines -->
  <line x1="52" y1="195" x2="666" y2="195" stroke="#cc8fa0" stroke-width="1.5" opacity="0.55" marker-end="url(#aRl)"/>
  <line x1="52" y1="300" x2="666" y2="300" stroke="#cc8fa0" stroke-width="1.5" opacity="0.55" marker-end="url(#aRl)"/>

  <!-- closed (Gaussian) surface -->
  <ellipse cx="360" cy="195" rx="170" ry="115" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="36" y="48" font-size="14" fill="#6B7280">닫힌 곡면 (가우스면)</text>
  <line x1="150" y1="56" x2="234" y2="112" stroke="#6B7280" stroke-width="1"/>

  <!-- ===== top patch: skim, flux 0 ===== -->
  <line x1="296" y1="80" x2="424" y2="80" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
  <line x1="360" y1="80" x2="360" y2="38" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="338" y="30" fill="#2563EB" font-size="13" font-style="italic">dA</text>
  <text x="446" y="66" font-size="14" fill="#1a1a1a" font-weight="bold">스침: Φ 기여 0</text>
  <text x="446" y="86" font-size="12.5" fill="#6B7280">(<tspan font-style="italic">E</tspan> ⊥ <tspan font-style="italic">dA</tspan>, cos 90° = 0)</text>

  <!-- ===== right patch: exit, positive ===== -->
  <!-- field line through upper-right patch -->
  <line x1="206" y1="156" x2="510" y2="156" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
  <line x1="530" y1="156" x2="662" y2="156" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
  <!-- dA outward (up-right) -->
  <line x1="520" y1="156" x2="573" y2="128" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="580" y="122" fill="#2563EB" font-size="13" font-style="italic">dA</text>
  <text x="540" y="228" font-size="14" fill="#8B0029" font-weight="bold">바깥으로 나감:</text>
  <text x="540" y="248" font-size="14" fill="#8B0029" font-weight="bold">Φ 기여 양(+)</text>

  <!-- ===== left patch: enter, negative ===== -->
  <line x1="70" y1="234" x2="192" y2="234" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
  <line x1="206" y1="234" x2="508" y2="234" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
  <!-- dA outward (down-left) -->
  <line x1="200" y1="234" x2="147" y2="262" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="120" y="278" fill="#2563EB" font-size="13" font-style="italic">dA</text>
  <text x="40" y="316" font-size="14" fill="#2563EB" font-weight="bold">안으로 들어감:</text>
  <text x="40" y="336" font-size="14" fill="#2563EB" font-weight="bold">Φ 기여 음(−)</text>

  <!-- bottom caption -->
  <text x="360" y="366" text-anchor="middle" font-size="14" fill="#1a1a1a">면적 벡터 <tspan font-style="italic">dA</tspan> 는 항상 닫힌 곡면의 <tspan font-weight="bold">바깥쪽</tspan>을 향한다</text>
</svg>
