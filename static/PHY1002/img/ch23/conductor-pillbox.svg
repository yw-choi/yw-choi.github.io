<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8B0029"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- conductor body -->
  <rect x="40" y="55" width="290" height="290" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="70" y="90" font-size="15" font-weight="bold" fill="#1a1a1a">도체</text>
  <text x="70" y="150" font-size="15" fill="#1a1a1a"><tspan font-style="italic">E</tspan> = 0 (내부)</text>

  <!-- surface charges on the right face -->
  <g fill="#8B0029" font-size="15" font-weight="bold" text-anchor="middle" stroke="#F3F4F6" stroke-width="4" paint-order="stroke">
    <text x="330" y="80">+</text>
    <text x="330" y="106">+</text>
    <text x="330" y="132">+</text>
    <text x="330" y="158">+</text>
    <text x="330" y="190">+</text>
    <text x="330" y="216">+</text>
    <text x="330" y="242">+</text>
    <text x="330" y="272">+</text>
    <text x="330" y="298">+</text>
    <text x="330" y="324">+</text>
  </g>
  <text x="420" y="60" font-size="13.5" fill="#6B7280">표면 전하 밀도 <tspan font-style="italic">σ</tspan></text>
  <line x1="418" y1="66" x2="340" y2="86" stroke="#6B7280" stroke-width="1"/>

  <!-- external field arrows (perpendicular to surface) -->
  <line x1="344" y1="110" x2="416" y2="110" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
  <line x1="344" y1="310" x2="416" y2="310" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>

  <!-- pillbox (Gaussian cylinder), axis y=210, from x=270 to x=440 -->
  <line x1="270" y1="177" x2="440" y2="177" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="270" y1="243" x2="440" y2="243" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 3"/>
  <ellipse cx="270" cy="210" rx="11" ry="33" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 3"/>
  <ellipse cx="440" cy="210" rx="11" ry="33" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- E and A at the external cap -->
  <line x1="454" y1="196" x2="540" y2="196" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
  <text x="548" y="201" fill="#8B0029" font-size="14" font-style="italic">E</text>
  <line x1="454" y1="224" x2="518" y2="224" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="526" y="229" fill="#2563EB" font-size="14" font-style="italic">A</text>

  <!-- annotations -->
  <text x="110" y="290" font-size="12.5" fill="#6B7280">안쪽 캡: <tspan font-style="italic">E</tspan> = 0 → Φ = 0</text>
  <line x1="230" y1="278" x2="262" y2="238" stroke="#6B7280" stroke-width="1"/>
  <text x="474" y="150" font-size="12.5" fill="#6B7280">바깥쪽 캡(면적 <tspan font-style="italic">A</tspan>)만</text>
  <text x="474" y="168" font-size="12.5" fill="#6B7280">플럭스 <tspan font-style="italic">EA</tspan></text>
  <line x1="472" y1="158" x2="448" y2="186" stroke="#6B7280" stroke-width="1"/>

  <!-- bottom formula caption -->
  <text x="360" y="384" text-anchor="middle" font-size="14" fill="#8B0029" font-weight="bold">ε₀EA = σA ⇒ E = σ/ε₀</text>
</svg>
