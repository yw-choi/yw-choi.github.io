<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8B0029"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- charged nonconducting sheet -->
  <rect x="352" y="48" width="12" height="304" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <g fill="#8B0029" font-size="13" font-weight="bold" text-anchor="middle" stroke="#F3F4F6" stroke-width="3" paint-order="stroke">
    <text x="358" y="70">+</text>
    <text x="358" y="96">+</text>
    <text x="358" y="122">+</text>
    <text x="358" y="148">+</text>
    <text x="358" y="192">+</text>
    <text x="358" y="252">+</text>
    <text x="358" y="278">+</text>
    <text x="358" y="304">+</text>
    <text x="358" y="330">+</text>
  </g>
  <text x="358" y="32" text-anchor="middle" font-size="14" fill="#1a1a1a">무한 부도체 판 (면전하 밀도 <tspan font-style="italic">σ</tspan>)</text>

  <!-- pillbox: axis y=200, caps at x=238 and x=478 -->
  <line x1="238" y1="166" x2="478" y2="166" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="238" y1="234" x2="478" y2="234" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 3"/>
  <ellipse cx="238" cy="200" rx="11" ry="34" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 3"/>
  <ellipse cx="478" cy="200" rx="11" ry="34" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- right cap: E and A -->
  <line x1="492" y1="186" x2="566" y2="186" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
  <text x="574" y="191" fill="#8B0029" font-size="14" font-style="italic">E</text>
  <line x1="492" y1="216" x2="546" y2="216" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="554" y="221" fill="#2563EB" font-size="14" font-style="italic">A</text>

  <!-- left cap: E and A (mirror) -->
  <line x1="224" y1="186" x2="150" y2="186" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
  <text x="142" y="191" text-anchor="end" fill="#8B0029" font-size="14" font-style="italic">E</text>
  <line x1="224" y1="216" x2="170" y2="216" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="162" y="221" text-anchor="end" fill="#2563EB" font-size="14" font-style="italic">A</text>

  <!-- side note -->
  <text x="404" y="140" font-size="12.5" fill="#6B7280">옆면: 스침 → Φ = 0</text>
  <line x1="402" y1="146" x2="386" y2="162" stroke="#6B7280" stroke-width="1"/>

  <!-- cap area note -->
  <text x="500" y="262" font-size="12.5" fill="#6B7280">캡 면적 <tspan font-style="italic">A</tspan></text>
  <line x1="498" y1="254" x2="484" y2="230" stroke="#6B7280" stroke-width="1"/>

  <!-- symmetry note -->
  <text x="120" y="90" font-size="12.5" fill="#6B7280">대칭: 양쪽으로 똑같은 크기의 <tspan font-style="italic">E</tspan></text>

  <!-- bottom formula caption -->
  <text x="360" y="384" text-anchor="middle" font-size="14" fill="#8B0029" font-weight="bold">ε₀(EA + EA) = σA ⇒ E = σ/2ε₀</text>
</svg>
