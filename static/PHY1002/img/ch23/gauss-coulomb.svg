<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8B0029"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- field line stubs (8 directions) -->
  <g stroke="#8B0029" stroke-width="1.5" opacity="0.4">
    <line x1="292" y1="210" x2="398" y2="210"/>
    <line x1="285.6" y1="194.4" x2="360.5" y2="119.5"/>
    <line x1="270" y1="188" x2="270" y2="82"/>
    <line x1="254.4" y1="194.4" x2="179.5" y2="119.5"/>
    <line x1="248" y1="210" x2="142" y2="210"/>
    <line x1="254.4" y1="225.6" x2="179.5" y2="300.5"/>
    <line x1="270" y1="232" x2="270" y2="338"/>
    <line x1="285.6" y1="225.6" x2="360.5" y2="300.5"/>
  </g>

  <!-- Gaussian sphere -->
  <circle cx="270" cy="210" r="135" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- E arrows piercing the sphere (radially outward) -->
  <g stroke="#8B0029" stroke-width="2.5">
    <line x1="410" y1="210" x2="455" y2="210" marker-end="url(#aR)"/>
    <line x1="369" y1="111" x2="400.8" y2="79.2" marker-end="url(#aR)"/>
    <line x1="270" y1="70" x2="270" y2="25" marker-end="url(#aR)"/>
    <line x1="171" y1="111" x2="139.2" y2="79.2" marker-end="url(#aR)"/>
    <line x1="130" y1="210" x2="85" y2="210" marker-end="url(#aR)"/>
    <line x1="171" y1="309" x2="139.2" y2="340.8" marker-end="url(#aR)"/>
    <line x1="270" y1="350" x2="270" y2="395" marker-end="url(#aR)"/>
    <line x1="369" y1="309" x2="400.8" y2="340.8" marker-end="url(#aR)"/>
  </g>
  <text x="462" y="215" fill="#8B0029" font-size="14" font-style="italic">E</text>

  <!-- patch + dA (offset above the east E arrow) -->
  <rect x="399" y="199" width="9" height="22" fill="#2563EB" opacity="0.25" stroke="#2563EB" stroke-width="1"/>
  <line x1="408" y1="192" x2="450" y2="192" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="454" y="184" fill="#2563EB" font-size="13" font-style="italic">dA</text>

  <!-- r radius line (angle 115 deg, between field stubs) -->
  <line x1="270" y1="210" x2="212.9" y2="87.7" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="226" y="140" fill="#1a1a1a" font-size="14" font-style="italic">r</text>

  <!-- central charge -->
  <circle cx="270" cy="210" r="15" fill="#8B0029" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>
  <text x="270" y="216" text-anchor="middle" fill="#fff" font-size="19" font-weight="bold">+</text>
  <text x="292" y="238" fill="#1a1a1a" font-size="14" font-style="italic">q</text>

  <!-- Gaussian surface label -->
  <text x="46" y="374" font-size="14" fill="#6B7280">가우스면 (반지름 <tspan font-style="italic">r</tspan>)</text>
  <line x1="120" y1="358" x2="176" y2="307" stroke="#6B7280" stroke-width="1"/>

  <!-- right annotation -->
  <text x="500" y="120" font-size="14" fill="#1a1a1a" font-weight="bold">구면 위 모든 점에서</text>
  <text x="500" y="146" font-size="13.5" fill="#1a1a1a">• <tspan font-style="italic">E</tspan> 크기 동일</text>
  <text x="500" y="172" font-size="13.5" fill="#1a1a1a">• <tspan font-style="italic">E</tspan> ∥ <tspan font-style="italic">dA</tspan> (<tspan font-style="italic">θ</tspan> = 0)</text>
  <text x="500" y="290" font-size="14" fill="#8B0029" font-weight="bold">Φ = E · 4πr²</text>
</svg>
