<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrGray6" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="350" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">균일하게 대전된 막대: 점전하 조각 <tspan font-style="italic">dq</tspan>로 나누어 적분</text>

  <!-- x axis -->
  <line x1="140" y1="273" x2="636" y2="273" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray6)"/>
  <text x="648" y="278" text-anchor="start" font-size="15" font-style="italic" fill="#6B7280">x</text>

  <!-- rod -->
  <rect x="170" y="264" width="380" height="18" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <g fill="#8B0029" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="190" y="278">+</text><text x="218" y="278">+</text><text x="246" y="278">+</text>
    <text x="274" y="278">+</text><text x="302" y="278">+</text><text x="368" y="278">+</text>
    <text x="396" y="278">+</text><text x="424" y="278">+</text><text x="452" y="278">+</text>
    <text x="480" y="278">+</text><text x="508" y="278">+</text><text x="536" y="278">+</text>
  </g>

  <!-- charge element -->
  <rect x="336" y="264" width="14" height="18" fill="#8B0029"/>
  <text x="388" y="256" text-anchor="start" font-size="13" fill="#8B0029"><tspan font-style="italic">dq</tspan> = <tspan font-style="italic">λ dx</tspan></text>

  <!-- rod end labels -->
  <text x="170" y="302" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan font-style="italic">x</tspan> = 0</text>
  <text x="550" y="302" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan font-style="italic">x</tspan> = <tspan font-style="italic">L</tspan></text>
  <text x="343" y="302" text-anchor="middle" font-size="13" font-style="italic" fill="#8B0029">dx</text>

  <!-- x dimension -->
  <line x1="170" y1="324" x2="170" y2="336" stroke="#6B7280" stroke-width="1"/>
  <line x1="336" y1="324" x2="336" y2="336" stroke="#6B7280" stroke-width="1"/>
  <line x1="253" y1="330" x2="176" y2="330" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray6)"/>
  <line x1="253" y1="330" x2="330" y2="330" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray6)"/>
  <text x="253" y="324" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">x</text>

  <!-- P and d -->
  <circle cx="170" cy="110" r="4" fill="#1a1a1a"/>
  <text x="152" y="106" text-anchor="end" font-size="15" font-style="italic" fill="#1a1a1a">P</text>
  <line x1="170" y1="118" x2="170" y2="264" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="158" y="195" text-anchor="end" font-size="14" font-style="italic" fill="#6B7280">d</text>

  <!-- r line -->
  <line x1="343" y1="264" x2="173" y2="113" stroke="#6B7280" stroke-width="1.5"/>
  <text x="262" y="172" text-anchor="start" font-size="13" fill="#1a1a1a"><tspan font-style="italic">r</tspan> = √(<tspan font-style="italic">x</tspan>² + <tspan font-style="italic">d</tspan>²)</text>

  <!-- bottom note -->
  <text x="350" y="362" text-anchor="middle" font-size="14" fill="#6B7280">각 조각을 점전하처럼 취급:  <tspan font-style="italic">dV</tspan> = <tspan font-style="italic">λ dx</tspan> / (4π<tspan font-style="italic">ε</tspan><tspan font-size="10" dy="4">0</tspan><tspan dy="-4"> </tspan><tspan font-style="italic">r</tspan>)   →   전체는 적분으로 합산</text>
</svg>
