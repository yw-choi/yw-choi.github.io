<svg viewBox="0 0 620 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed5" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrGray5" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="310" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">전기 쌍극자가 점 <tspan font-style="italic">P</tspan>에 만드는 퍼텐셜: 기하학</text>

  <!-- z axis -->
  <line x1="200" y1="445" x2="200" y2="58" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray5)"/>
  <text x="214" y="70" text-anchor="start" font-size="15" font-style="italic" fill="#6B7280">z</text>

  <!-- construction lines to P -->
  <line x1="214.2" y1="185.3" x2="492.4" y2="92.5" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="212.5" y1="281.7" x2="493.3" y2="94.4" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="204" y1="238" x2="494" y2="93" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- angle theta at O -->
  <path d="M 200 210 A 30 30 0 0 1 226.8 226.6" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="230" y="206" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">θ</text>

  <!-- d cos(theta) construction -->
  <line x1="208.3" y1="202.5" x2="246" y2="259" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M 239.3 263.4 L 234.9 256.7 L 241.6 252.3" fill="none" stroke="#6B7280" stroke-width="1"/>
  <line x1="212.5" y1="281.7" x2="246" y2="259" stroke="#8B0029" stroke-width="3"/>
  <text x="268" y="277" text-anchor="start" font-size="13" fill="#8B0029"><tspan font-style="italic">d</tspan> cos <tspan font-style="italic">θ</tspan> ≈ <tspan font-style="italic">r</tspan><tspan font-size="10" dy="4">−</tspan><tspan dy="-4"> − </tspan><tspan font-style="italic">r</tspan><tspan font-size="10" dy="4">+</tspan></text>

  <!-- d dimension -->
  <line x1="185" y1="190" x2="110" y2="190" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="185" y1="290" x2="110" y2="290" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="110" y1="240" x2="110" y2="196" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray5)"/>
  <line x1="110" y1="240" x2="110" y2="284" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray5)"/>
  <text x="96" y="245" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">d</text>

  <!-- dipole moment vector -->
  <line x1="150" y1="285" x2="150" y2="197" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed5)"/>
  <text x="130" y="248" text-anchor="middle" font-size="16" font-style="italic" font-weight="bold" fill="#8B0029">p</text>
  <line x1="124" y1="232" x2="134" y2="232" stroke="#8B0029" stroke-width="1.5"/>
  <path d="M 138 232 l -6 -3 v 6 Z" fill="#8B0029"/>

  <!-- charges and O -->
  <circle cx="200" cy="190" r="15" fill="#8B0029" stroke="#5c001b" stroke-width="2"/>
  <text x="200" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">+</text>
  <text x="178" y="176" text-anchor="end" font-size="14" fill="#1a1a1a">+<tspan font-style="italic">q</tspan></text>
  <circle cx="200" cy="290" r="15" fill="#2563EB" stroke="#173e9e" stroke-width="2"/>
  <text x="200" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">−</text>
  <text x="178" y="312" text-anchor="end" font-size="14" fill="#1a1a1a">−<tspan font-style="italic">q</tspan></text>
  <circle cx="200" cy="240" r="3.5" fill="#1a1a1a"/>
  <text x="186" y="250" text-anchor="end" font-size="14" font-style="italic" fill="#1a1a1a">O</text>

  <!-- P -->
  <circle cx="500" cy="90" r="4" fill="#1a1a1a"/>
  <text x="514" y="86" text-anchor="start" font-size="15" font-style="italic" fill="#1a1a1a">P</text>

  <!-- r labels -->
  <text x="282" y="152" text-anchor="middle" font-size="14" fill="#6B7280"><tspan font-style="italic">r</tspan><tspan font-size="10" dy="4">+</tspan></text>
  <text x="285" y="190" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">r</text>
  <text x="283" y="228" text-anchor="middle" font-size="14" fill="#6B7280"><tspan font-style="italic">r</tspan><tspan font-size="10" dy="4">−</tspan></text>

  <!-- bottom note -->
  <text x="310" y="455" text-anchor="middle" font-size="15" fill="#1a1a1a"><tspan font-style="italic">r</tspan> ≫ <tspan font-style="italic">d</tspan> 이면:   <tspan font-style="italic">r</tspan><tspan font-size="11" dy="4">−</tspan><tspan dy="-4"> − </tspan><tspan font-style="italic">r</tspan><tspan font-size="11" dy="4">+</tspan><tspan dy="-4"> ≈ </tspan><tspan font-style="italic">d</tspan> cos <tspan font-style="italic">θ</tspan> ,    <tspan font-style="italic">r</tspan><tspan font-size="11" dy="4">−</tspan><tspan font-style="italic" dy="-4">r</tspan><tspan font-size="11" dy="4">+</tspan><tspan dy="-4"> ≈ </tspan><tspan font-style="italic">r</tspan><tspan>²</tspan></text>
</svg>
