<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrGray4" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="360" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">점전하가 만드는 퍼텐셜 <tspan font-style="italic">V</tspan>(<tspan font-style="italic">r</tspan>) = <tspan font-style="italic">kq</tspan>/<tspan font-style="italic">r</tspan></text>

  <!-- axes -->
  <line x1="100" y1="385" x2="100" y2="58" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray4)"/>
  <line x1="82" y1="220" x2="660" y2="220" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray4)"/>
  <text x="84" y="66" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">V</text>
  <text x="672" y="225" text-anchor="start" font-size="15" font-style="italic" fill="#1a1a1a">r</text>
  <text x="90" y="238" text-anchor="middle" font-size="13" fill="#6B7280">0</text>

  <!-- +q curve : y = 220 - 15000/(x-100) -->
  <polyline fill="none" stroke="#8B0029" stroke-width="2.5" points="
    201,71.5 210,83.6 220,95 232,106.4 246,117.3 262,127.4 280,136.7 300,145 322,152.4
    346,159 372,164.8 400,170 430,174.5 462,178.6 496,182.1 532,185.3 570,188.1 610,190.6 645,192.5"/>
  <!-- -q curve : y = 220 + 15000/(x-100) -->
  <polyline fill="none" stroke="#2563EB" stroke-width="2.5" points="
    201,368.5 210,356.4 220,345 232,333.6 246,322.7 262,312.6 280,303.3 300,295 322,287.6
    346,281 372,275.2 400,270 430,265.5 462,261.4 496,257.9 532,254.7 570,251.9 610,249.4 645,247.5"/>

  <!-- labels -->
  <text x="430" y="130" text-anchor="start" font-size="14" fill="#8B0029"><tspan font-weight="bold">+q</tspan> 일 때: <tspan font-style="italic">V</tspan> &gt; 0</text>
  <text x="430" y="318" text-anchor="start" font-size="14" fill="#2563EB"><tspan font-weight="bold">−q</tspan> 일 때: <tspan font-style="italic">V</tspan> &lt; 0</text>
  <text x="248" y="70" text-anchor="start" font-size="12" fill="#6B7280">r → 0 : V → +∞</text>
  <text x="248" y="378" text-anchor="start" font-size="12" fill="#6B7280">r → 0 : V → −∞</text>
  <text x="560" y="212" text-anchor="middle" font-size="12" fill="#6B7280">r → ∞ : V → 0</text>
</svg>
