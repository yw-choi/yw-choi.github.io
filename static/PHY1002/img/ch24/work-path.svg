<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrBlue" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="350" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">무한대에서 P까지: 전기력이 한 일 <tspan font-style="italic">W</tspan><tspan font-size="11" dy="3">∞</tspan><tspan dy="-3"> 는 경로와 무관하다</tspan></text>

  <!-- source charge field hint (short radial gray lines) -->
  <g stroke="#6B7280" stroke-width="1">
    <line x1="150" y1="172" x2="150" y2="156"/>
    <line x1="150" y1="248" x2="150" y2="264"/>
    <line x1="112" y1="210" x2="96" y2="210"/>
    <line x1="188" y1="210" x2="204" y2="210"/>
    <line x1="123" y1="183" x2="112" y2="172"/>
    <line x1="177" y1="183" x2="188" y2="172"/>
    <line x1="123" y1="237" x2="112" y2="248"/>
    <line x1="177" y1="237" x2="188" y2="248"/>
  </g>

  <!-- source charge -->
  <circle cx="150" cy="210" r="26" fill="#8B0029" stroke="#5c001b" stroke-width="2"/>
  <text x="150" y="219" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">+</text>
  <text x="150" y="292" text-anchor="middle" font-size="14" fill="#1a1a1a">원천 전하 <tspan font-style="italic">+Q</tspan></text>

  <!-- point P -->
  <circle cx="330" cy="210" r="4" fill="#1a1a1a"/>
  <text x="330" y="240" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">P</text>

  <!-- test charge q0 at infinity -->
  <circle cx="620" cy="210" r="12" fill="#8B0029" stroke="#5c001b" stroke-width="2"/>
  <text x="620" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">+</text>
  <text x="620" y="246" text-anchor="middle" font-size="13" fill="#1a1a1a">시험 전하 <tspan font-style="italic">q</tspan><tspan font-size="10" dy="3">0</tspan></text>
  <text x="620" y="266" text-anchor="middle" font-size="12" fill="#6B7280">무한대(∞)에서 출발</text>

  <!-- path 1 : straight -->
  <line x1="602" y1="210" x2="478" y2="210" stroke="#2563EB" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="478" y1="210" x2="344" y2="210" stroke="#2563EB" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="470" y="234" text-anchor="middle" font-size="14" fill="#2563EB">경로 1</text>

  <!-- path 2 : curved -->
  <path d="M 615 196 C 585 100, 430 62, 344 196" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="480" y="82" text-anchor="middle" font-size="14" fill="#2563EB">경로 2</text>

  <!-- bottom equations -->
  <text x="350" y="334" text-anchor="middle" font-size="15" fill="#1a1a1a">어떤 경로로 가져와도 전기력이 한 일은 같다:  <tspan font-style="italic">W</tspan><tspan font-size="11" dy="3">1</tspan><tspan dy="-3"> = </tspan><tspan font-style="italic">W</tspan><tspan font-size="11" dy="3">2</tspan><tspan dy="-3"> = </tspan><tspan font-style="italic">W</tspan><tspan font-size="11" dy="3">∞</tspan></text>
  <text x="350" y="366" text-anchor="middle" font-size="15" fill="#8B0029">퍼텐셜에너지  <tspan font-style="italic">U</tspan> = −<tspan font-style="italic">W</tspan><tspan font-size="11" dy="3">∞</tspan><tspan dy="-3">   (기준: 무한대에서 </tspan><tspan font-style="italic">U</tspan> = 0)</text>
</svg>
