<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="350" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">균일한 전기장에서의 퍼텐셜 차</text>

  <!-- equipotential surfaces (dashed vertical) -->
  <g stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4">
    <line x1="170" y1="70" x2="170" y2="300"/>
    <line x1="340" y1="70" x2="340" y2="300"/>
    <line x1="510" y1="70" x2="510" y2="300"/>
  </g>
  <text x="170" y="320" text-anchor="middle" font-size="13" fill="#1a1a1a">높은 퍼텐셜</text>
  <text x="340" y="320" text-anchor="middle" font-size="13" fill="#2563EB">등퍼텐셜면</text>
  <text x="510" y="320" text-anchor="middle" font-size="13" fill="#1a1a1a">낮은 퍼텐셜</text>

  <!-- field lines -->
  <line x1="120" y1="110" x2="576" y2="110" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line x1="120" y1="260" x2="576" y2="260" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="597" y="118" text-anchor="start" font-size="16" font-style="italic" font-weight="bold" fill="#8B0029">E</text>
  <line x1="596" y1="102" x2="608" y2="102" stroke="#8B0029" stroke-width="1.5"/>
  <path d="M 612 102 l -6 -3 v 6 Z" fill="#8B0029"/>

  <!-- i, f points and path -->
  <circle cx="170" cy="185" r="4" fill="#1a1a1a"/>
  <circle cx="510" cy="185" r="4" fill="#1a1a1a"/>
  <text x="156" y="176" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">i</text>
  <text x="525" y="176" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">f</text>
  <line x1="178" y1="185" x2="498" y2="185" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="340" y="170" text-anchor="middle" font-size="13" fill="#2563EB">이동 경로 (장과 나란히)</text>

  <!-- test charge on path -->
  <circle cx="300" cy="185" r="9" fill="#8B0029" stroke="#5c001b" stroke-width="2"/>
  <text x="300" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">+</text>
  <text x="300" y="212" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan font-style="italic">q</tspan><tspan font-size="10" dy="3">0</tspan></text>

  <!-- delta-x dimension -->
  <line x1="170" y1="338" x2="170" y2="352" stroke="#6B7280" stroke-width="1"/>
  <line x1="510" y1="338" x2="510" y2="352" stroke="#6B7280" stroke-width="1"/>
  <line x1="340" y1="345" x2="176" y2="345" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray)"/>
  <line x1="340" y1="345" x2="504" y2="345" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray)"/>
  <text x="340" y="340" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">Δx</text>

  <!-- equation -->
  <text x="350" y="382" text-anchor="middle" font-size="15" fill="#8B0029">Δ<tspan font-style="italic">V</tspan> = <tspan font-style="italic">V</tspan><tspan font-size="11" dy="3">f</tspan><tspan dy="-3"> − </tspan><tspan font-style="italic">V</tspan><tspan font-size="11" dy="3">i</tspan><tspan dy="-3"> = −</tspan><tspan font-style="italic">E</tspan> Δ<tspan font-style="italic">x</tspan>  <tspan fill="#6B7280">(장 방향으로 이동하면 퍼텐셜은 낮아진다)</tspan></text>
</svg>
