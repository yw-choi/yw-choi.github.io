<svg viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrGray7" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">대전된 원반: 고리(ring) 요소로 적분</text>

  <!-- z axis -->
  <line x1="340" y1="392" x2="340" y2="62" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray7)"/>

  <!-- disk -->
  <ellipse cx="340" cy="320" rx="200" ry="55" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <!-- ring element -->
  <ellipse cx="340" cy="320" rx="110" ry="30.2" fill="none" stroke="#8B0029" stroke-width="2"/>
  <ellipse cx="340" cy="320" rx="128" ry="35.2" fill="none" stroke="#8B0029" stroke-width="2"/>

  <!-- R' radius -->
  <line x1="340" y1="320" x2="243" y2="310.5" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrGray7)"/>
  <text x="288" y="304" text-anchor="middle" font-size="14" fill="#1a1a1a"><tspan font-style="italic">R</tspan>′</text>

  <!-- R radius (dashed, to left edge) -->
  <line x1="340" y1="320" x2="146" y2="320" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="182" y="338" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">R</text>

  <!-- dR' leader -->
  <line x1="459" y1="322" x2="494" y2="352" stroke="#6B7280" stroke-width="1"/>
  <text x="498" y="362" text-anchor="start" font-size="13" fill="#8B0029"><tspan font-style="italic">dR</tspan>′ (고리의 폭)</text>

  <!-- sigma label -->
  <line x1="176" y1="270" x2="196" y2="288" stroke="#6B7280" stroke-width="1"/>
  <text x="168" y="262" text-anchor="middle" font-size="13" fill="#6B7280">표면 전하 밀도 <tspan font-style="italic">σ</tspan></text>

  <!-- P -->
  <circle cx="340" cy="105" r="4" fill="#1a1a1a"/>
  <text x="356" y="100" text-anchor="start" font-size="15" font-style="italic" fill="#1a1a1a">P</text>

  <!-- z dimension -->
  <line x1="340" y1="320" x2="306" y2="320" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="340" y1="105" x2="306" y2="105" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="306" y1="213" x2="306" y2="111" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray7)"/>
  <line x1="306" y1="213" x2="306" y2="314" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray7)"/>
  <text x="292" y="218" text-anchor="end" font-size="14" font-style="italic" fill="#6B7280">z</text>

  <!-- r line from ring to P -->
  <circle cx="443.4" cy="330.3" r="3.5" fill="#8B0029"/>
  <line x1="443.4" y1="330.3" x2="342" y2="109" stroke="#6B7280" stroke-width="1.5"/>
  <text x="404" y="216" text-anchor="start" font-size="14" fill="#1a1a1a"><tspan font-style="italic">r</tspan> = √(<tspan font-style="italic">z</tspan>² + <tspan font-style="italic">R</tspan>′²)</text>

  <!-- bottom note -->
  <text x="340" y="420" text-anchor="middle" font-size="14" fill="#6B7280">고리 위의 모든 전하는 <tspan font-style="italic">P</tspan>에서 같은 거리 <tspan font-style="italic">r</tspan>에 있다 → 1차원 적분으로 충분</text>
</svg>
