<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed3" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8B0029"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">전기력선(빨강)은 등퍼텐셜면(파랑 점선)과 항상 수직이다</text>

  <!-- ===== panel A : uniform field ===== -->
  <g stroke="#8B0029" stroke-width="2">
    <line x1="50" y1="95"  x2="222" y2="95"  marker-end="url(#arrRed3)"/>
    <line x1="50" y1="145" x2="222" y2="145" marker-end="url(#arrRed3)"/>
    <line x1="50" y1="195" x2="222" y2="195" marker-end="url(#arrRed3)"/>
    <line x1="50" y1="245" x2="222" y2="245" marker-end="url(#arrRed3)"/>
  </g>
  <g stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4">
    <line x1="95"  y1="78" x2="95"  y2="262"/>
    <line x1="145" y1="78" x2="145" y2="262"/>
    <line x1="195" y1="78" x2="195" y2="262"/>
  </g>
  <path d="M 195 237 h 9 v 8" fill="none" stroke="#6B7280" stroke-width="1.2"/>
  <text x="140" y="298" text-anchor="middle" font-size="14" fill="#1a1a1a">균일한 장</text>

  <!-- ===== panel B : point charge ===== -->
  <g stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <circle cx="400" cy="170" r="40"/>
    <circle cx="400" cy="170" r="68"/>
    <circle cx="400" cy="170" r="96"/>
  </g>
  <g stroke="#8B0029" stroke-width="2">
    <line x1="420" y1="170" x2="514" y2="170" marker-end="url(#arrRed3)"/>
    <line x1="380" y1="170" x2="286" y2="170" marker-end="url(#arrRed3)"/>
    <line x1="400" y1="150" x2="400" y2="56"  marker-end="url(#arrRed3)"/>
    <line x1="400" y1="190" x2="400" y2="284" marker-end="url(#arrRed3)"/>
    <line x1="414" y1="156" x2="480" y2="90"  marker-end="url(#arrRed3)"/>
    <line x1="386" y1="156" x2="320" y2="90"  marker-end="url(#arrRed3)"/>
    <line x1="414" y1="184" x2="480" y2="250" marker-end="url(#arrRed3)"/>
    <line x1="386" y1="184" x2="320" y2="250" marker-end="url(#arrRed3)"/>
  </g>
  <circle cx="400" cy="170" r="14" fill="#8B0029" stroke="#5c001b" stroke-width="2"/>
  <text x="400" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">+</text>
  <text x="400" y="313" text-anchor="middle" font-size="14" fill="#1a1a1a">점전하 (동심 구면)</text>

  <!-- ===== panel C : dipole ===== -->
  <!-- equipotentials around each charge -->
  <g stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <circle cx="600" cy="170" r="26"/>
    <circle cx="600" cy="170" r="46"/>
    <circle cx="720" cy="170" r="26"/>
    <circle cx="720" cy="170" r="46"/>
  </g>
  <!-- V=0 plane -->
  <line x1="660" y1="78" x2="660" y2="268" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="660" y="68" text-anchor="middle" font-size="12" fill="#6B7280"><tspan font-style="italic">V</tspan> = 0</text>
  <!-- field lines from + to - -->
  <g stroke="#8B0029" stroke-width="2" fill="none">
    <line x1="615" y1="170" x2="700" y2="170" marker-end="url(#arrRed3)"/>
    <path d="M 610 158 C 630 92, 690 92, 712 158" marker-end="url(#arrRed3)"/>
    <path d="M 610 182 C 630 248, 690 248, 712 182" marker-end="url(#arrRed3)"/>
  </g>
  <circle cx="600" cy="170" r="13" fill="#8B0029" stroke="#5c001b" stroke-width="2"/>
  <text x="600" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">+</text>
  <circle cx="720" cy="170" r="13" fill="#2563EB" stroke="#173e9e" stroke-width="2"/>
  <text x="720" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">−</text>
  <text x="660" y="298" text-anchor="middle" font-size="14" fill="#1a1a1a">전기 쌍극자</text>
</svg>
