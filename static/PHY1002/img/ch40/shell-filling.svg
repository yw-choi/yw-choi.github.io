<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
  </defs>

  <!-- column headers: subshell capacities -->
  <text x="185" y="55" font-size="13" fill="#6B7280" text-anchor="middle">s (2개)</text>
  <text x="310" y="55" font-size="13" fill="#6B7280" text-anchor="middle">p (6개)</text>
  <text x="435" y="55" font-size="13" fill="#6B7280" text-anchor="middle">d (10개)</text>
  <text x="560" y="55" font-size="13" fill="#6B7280" text-anchor="middle">f (14개)</text>

  <!-- diagonal order arrows (drawn first: hidden under opaque cells, visible in gaps) -->
  <line x1="256.6" y1="59.5" x2="118" y2="128.2" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <line x1="256.6" y1="121.5" x2="118" y2="190.2" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <line x1="372.7" y1="125.9" x2="122.3" y2="250.1" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <line x1="372.7" y1="187.9" x2="122.3" y2="312.1" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <line x1="497.7" y1="187.9" x2="122.3" y2="374.1" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <line x1="497.7" y1="249.9" x2="136" y2="429.3" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <line x1="622.6" y1="249.9" x2="261" y2="429.3" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>

  <!-- subshell cells: x = 150 + l*125, y = 75 + (n-1)*62, cell 70x40 -->
  <!-- n=1 -->
  <rect x="150" y="75" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="185" y="101" font-size="15" fill="#1a1a1a" text-anchor="middle">1s</text>
  <!-- n=2 -->
  <rect x="150" y="137" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="185" y="163" font-size="15" fill="#1a1a1a" text-anchor="middle">2s</text>
  <rect x="275" y="137" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="310" y="163" font-size="15" fill="#1a1a1a" text-anchor="middle">2p</text>
  <!-- n=3 -->
  <rect x="150" y="199" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="185" y="225" font-size="15" fill="#1a1a1a" text-anchor="middle">3s</text>
  <rect x="275" y="199" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="310" y="225" font-size="15" fill="#1a1a1a" text-anchor="middle">3p</text>
  <rect x="400" y="199" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="435" y="225" font-size="15" fill="#1a1a1a" text-anchor="middle">3d</text>
  <!-- n=4 -->
  <rect x="150" y="261" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="185" y="287" font-size="15" fill="#1a1a1a" text-anchor="middle">4s</text>
  <rect x="275" y="261" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="310" y="287" font-size="15" fill="#1a1a1a" text-anchor="middle">4p</text>
  <rect x="400" y="261" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="435" y="287" font-size="15" fill="#1a1a1a" text-anchor="middle">4d</text>
  <rect x="525" y="261" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="560" y="287" font-size="15" fill="#1a1a1a" text-anchor="middle">4f</text>
  <!-- n=5 -->
  <rect x="150" y="323" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="185" y="349" font-size="15" fill="#1a1a1a" text-anchor="middle">5s</text>
  <rect x="275" y="323" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="310" y="349" font-size="15" fill="#1a1a1a" text-anchor="middle">5p</text>
  <rect x="400" y="323" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="435" y="349" font-size="15" fill="#1a1a1a" text-anchor="middle">5d</text>
  <!-- n=6 -->
  <rect x="150" y="385" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="185" y="411" font-size="15" fill="#1a1a1a" text-anchor="middle">6s</text>
  <rect x="275" y="385" width="70" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="310" y="411" font-size="15" fill="#1a1a1a" text-anchor="middle">6p</text>

  <!-- n labels on the left -->
  <text x="112" y="101" font-size="13" fill="#6B7280" text-anchor="end">n = 1</text>
  <text x="112" y="163" font-size="13" fill="#6B7280" text-anchor="end">n = 2</text>
  <text x="112" y="225" font-size="13" fill="#6B7280" text-anchor="end">n = 3</text>
  <text x="112" y="287" font-size="13" fill="#6B7280" text-anchor="end">n = 4</text>
  <text x="112" y="349" font-size="13" fill="#6B7280" text-anchor="end">n = 5</text>
  <text x="112" y="411" font-size="13" fill="#6B7280" text-anchor="end">n = 6</text>

  <!-- order caption -->
  <text x="350" y="465" font-size="14" fill="#8B0029" text-anchor="middle" font-weight="bold">채움 순서: 1s &#8594; 2s &#8594; 2p &#8594; 3s &#8594; 3p &#8594; 4s &#8594; 3d &#8594; 4p &#8594; 5s &#8594; 4d &#8594; 5p &#8594; 6s &#8594; 4f &#8594; 5d &#8594; 6p</text>
  <text x="350" y="488" font-size="12.5" fill="#6B7280" text-anchor="middle">화살표(대각선)를 위에서부터 차례로 따라가면 에너지가 낮은 버금껍질 순서가 된다</text>
</svg>
