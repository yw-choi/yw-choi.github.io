<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- z axis -->
  <line x1="45" y1="120" x2="45" y2="55" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray)"/>
  <text x="55" y="65" font-size="14" font-style="italic" fill="#6B7280">z</text>

  <!-- oven -->
  <rect x="30" y="175" width="85" height="60" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="72" y="260" font-size="13" fill="#1a1a1a" text-anchor="middle">오븐</text>
  <text x="72" y="278" font-size="12" fill="#6B7280" text-anchor="middle">(은 증기)</text>

  <!-- collimator slits -->
  <rect x="150" y="140" width="10" height="52" fill="#6B7280"/>
  <rect x="150" y="218" width="10" height="52" fill="#6B7280"/>
  <text x="155" y="128" font-size="13" fill="#1a1a1a" text-anchor="middle">시준기</text>

  <!-- beam before magnet -->
  <line x1="115" y1="205" x2="255" y2="205" stroke="#8B0029" stroke-width="2"/>

  <!-- magnet N pole (top, knife edge) -->
  <polygon points="265,60 470,60 470,120 367,165 265,120" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="367" y="100" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">N</text>

  <!-- magnet S pole (bottom) -->
  <polygon points="265,245 470,245 470,330 265,330" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="367" y="295" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">S</text>
  <text x="367" y="352" font-size="13" fill="#6B7280" text-anchor="middle">전자석: 비균일 자기장 (큰 dB/dz)</text>

  <!-- split beams -->
  <path d="M 255 205 Q 400 205 470 185 L 640 158" fill="none" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <path d="M 255 205 Q 400 205 470 225 L 640 252" fill="none" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>

  <!-- detector plate -->
  <rect x="650" y="100" width="16" height="210" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="658" y="88" font-size="13" fill="#1a1a1a" text-anchor="middle">유리 검출판</text>

  <!-- classical expectation band -->
  <rect x="653" y="152" width="10" height="106" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="676" y="200" font-size="12.5" fill="#2563EB">고전 예측:</text>
  <text x="676" y="217" font-size="12.5" fill="#2563EB">연속 띠</text>

  <!-- two spots -->
  <circle cx="658" cy="155" r="5" fill="#8B0029"/>
  <circle cx="658" cy="255" r="5" fill="#8B0029"/>
  <text x="676" y="145" font-size="13" fill="#8B0029">스핀 업 (&#8722;&#956;<tspan font-size="10" baseline-shift="sub">B</tspan>)</text>
  <text x="676" y="278" font-size="13" fill="#8B0029">스핀 다운 (+&#956;<tspan font-size="10" baseline-shift="sub">B</tspan>)</text>

  <!-- result note -->
  <text x="390" y="398" font-size="14" fill="#8B0029" text-anchor="middle" font-weight="bold">실제 결과: 두 개의 점 &#8594; &#956;<tspan font-size="11" baseline-shift="sub">z</tspan>의 양자화 (공간 양자화)</text>
</svg>
