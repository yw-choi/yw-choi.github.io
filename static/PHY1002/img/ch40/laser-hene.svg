<svg viewBox="0 0 780 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrGray7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text x="210" y="55" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">헬륨</text>
  <text x="550" y="55" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">네온</text>

  <!-- energy axis: 0 eV at y=420, 16px/eV -->
  <line x1="80" y1="430" x2="80" y2="70" stroke="#6B7280" stroke-width="2" marker-end="url(#arrGray7)"/>
  <text x="44" y="250" font-size="13" fill="#6B7280" transform="rotate(-90 44 250)" text-anchor="middle">에너지 (eV)</text>
  <line x1="74" y1="420" x2="80" y2="420" stroke="#6B7280" stroke-width="1"/>
  <text x="68" y="425" font-size="12" fill="#6B7280" text-anchor="end">0</text>
  <line x1="74" y1="340" x2="80" y2="340" stroke="#6B7280" stroke-width="1"/>
  <text x="68" y="345" font-size="12" fill="#6B7280" text-anchor="end">5</text>
  <line x1="74" y1="260" x2="80" y2="260" stroke="#6B7280" stroke-width="1"/>
  <text x="68" y="265" font-size="12" fill="#6B7280" text-anchor="end">10</text>
  <line x1="74" y1="180" x2="80" y2="180" stroke="#6B7280" stroke-width="1"/>
  <text x="68" y="185" font-size="12" fill="#6B7280" text-anchor="end">15</text>
  <line x1="74" y1="100" x2="80" y2="100" stroke="#6B7280" stroke-width="1"/>
  <text x="68" y="105" font-size="12" fill="#6B7280" text-anchor="end">20</text>

  <!-- He levels -->
  <line x1="130" y1="420" x2="300" y2="420" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="130" y1="90" x2="300" y2="90" stroke="#8B0029" stroke-width="2.5"/>
  <text x="130" y="78" font-size="13" fill="#8B0029">E&#8323; = 20.61 eV (준안정, &#8805;1 &#956;s)</text>

  <!-- Ne levels -->
  <line x1="440" y1="420" x2="640" y2="420" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="440" y1="89" x2="640" y2="89" stroke="#8B0029" stroke-width="2.5"/>
  <text x="644" y="84" font-size="13" fill="#8B0029">E&#8322; = 20.66 eV</text>
  <text x="644" y="101" font-size="11.5" fill="#6B7280">(수명 170 ns)</text>
  <line x1="440" y1="121" x2="640" y2="121" stroke="#1a1a1a" stroke-width="2"/>
  <text x="644" y="130" font-size="13" fill="#1a1a1a">E&#8321;</text>
  <text x="644" y="146" font-size="11.5" fill="#6B7280">(수명 10 ns)</text>

  <!-- ground labels -->
  <text x="215" y="442" font-size="12.5" fill="#6B7280" text-anchor="middle">바닥상태 E&#8320;</text>
  <text x="540" y="442" font-size="12.5" fill="#6B7280" text-anchor="middle">바닥상태 E&#8320;</text>

  <!-- pumping arrow: He ground -> E3 -->
  <line x1="200" y1="415" x2="200" y2="98" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed7)"/>
  <text x="212" y="230" font-size="13" fill="#8B0029">방전 전자와의</text>
  <text x="212" y="248" font-size="13" fill="#8B0029">충돌로 들뜸</text>

  <!-- transfer arrow: He E3 -> Ne E2 -->
  <line x1="305" y1="90" x2="432" y2="89" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed7)"/>
  <text x="370" y="115" font-size="13" fill="#8B0029" text-anchor="middle">He&#8211;Ne 충돌</text>
  <text x="370" y="132" font-size="12" fill="#6B7280" text-anchor="middle">(들뜸 전달)</text>

  <!-- lasing transition: Ne E2 -> E1 -->
  <line x1="500" y1="94" x2="500" y2="114" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed7)"/>
  <!-- laser photon wavy -->
  <path d="M 508 105 q 8 -9 16 0 q 8 9 16 0 q 8 -9 16 0 q 8 9 16 0 q 8 -9 16 0 q 8 9 16 0" fill="none" stroke="#8B0029" stroke-width="2" marker-end="url(#arrRed7)"/>
  <text x="510" y="160" font-size="14" font-weight="bold" fill="#8B0029">유도 방출: 레이저 빛 632.8 nm</text>
  <text x="510" y="178" font-size="12" fill="#6B7280">E&#8322; &#8722; E&#8321; = 1.96 eV</text>

  <!-- rapid decay: Ne E1 -> ground -->
  <line x1="600" y1="126" x2="600" y2="413" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrGray7)"/>
  <text x="560" y="270" font-size="12.5" fill="#6B7280">빠른 붕괴</text>
  <text x="560" y="287" font-size="12.5" fill="#6B7280">(E&#8321; 비우기)</text>

  <!-- population inversion note -->
  <text x="130" y="330" font-size="13.5" fill="#1a1a1a">반전 분포의 비결:</text>
  <text x="130" y="352" font-size="12.5" fill="#6B7280">&#183; E&#8322;는 계속 채워지고 (He가 공급)</text>
  <text x="130" y="371" font-size="12.5" fill="#6B7280">&#183; E&#8321;는 계속 비워진다 (빠른 붕괴)</text>
  <text x="130" y="390" font-size="12.5" fill="#8B0029">&#8594; 항상 N(E&#8322;) &gt; N(E&#8321;)</text>
</svg>
