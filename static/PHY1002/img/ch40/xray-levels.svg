<svg viewBox="0 0 700 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="380" y="40" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">구멍(hole)이 있는 원자의 에너지 준위 &#8212; 몰리브데넘</text>

  <!-- energy axis: 0 keV at y=400, 20 keV at y=80 (16px/keV) -->
  <line x1="80" y1="410" x2="80" y2="65" stroke="#6B7280" stroke-width="2" marker-end="url(#arrGray4)"/>
  <text x="45" y="245" font-size="13" fill="#6B7280" transform="rotate(-90 45 245)" text-anchor="middle">에너지 (keV)</text>
  <line x1="74" y1="400" x2="80" y2="400" stroke="#6B7280" stroke-width="1"/>
  <text x="68" y="405" font-size="12" fill="#6B7280" text-anchor="end">0</text>
  <line x1="74" y1="320" x2="80" y2="320" stroke="#6B7280" stroke-width="1"/>
  <text x="68" y="325" font-size="12" fill="#6B7280" text-anchor="end">5</text>
  <line x1="74" y1="240" x2="80" y2="240" stroke="#6B7280" stroke-width="1"/>
  <text x="68" y="245" font-size="12" fill="#6B7280" text-anchor="end">10</text>
  <line x1="74" y1="160" x2="80" y2="160" stroke="#6B7280" stroke-width="1"/>
  <text x="68" y="165" font-size="12" fill="#6B7280" text-anchor="end">15</text>
  <line x1="74" y1="80" x2="80" y2="80" stroke="#6B7280" stroke-width="1"/>
  <text x="68" y="85" font-size="12" fill="#6B7280" text-anchor="end">20</text>

  <!-- zero baseline -->
  <line x1="80" y1="400" x2="620" y2="400" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="615" y="418" font-size="12" fill="#6B7280" text-anchor="end">E = 0 : 구멍 없는 중성 바닥상태</text>

  <!-- levels -->
  <!-- K: 20 keV -->
  <line x1="140" y1="80" x2="560" y2="80" stroke="#8B0029" stroke-width="2.5"/>
  <text x="572" y="85" font-size="14" fill="#1a1a1a"><tspan font-style="italic">K</tspan> (n=1)</text>
  <!-- L: 2.7 keV -> y = 400-43.2 = 356.8 -->
  <line x1="140" y1="357" x2="560" y2="357" stroke="#8B0029" stroke-width="2"/>
  <text x="572" y="356" font-size="14" fill="#1a1a1a"><tspan font-style="italic">L</tspan> (n=2)</text>
  <!-- M: ~0.5 keV -> y=392 -->
  <line x1="140" y1="392" x2="560" y2="392" stroke="#8B0029" stroke-width="2"/>
  <text x="572" y="381" font-size="14" fill="#1a1a1a"><tspan font-style="italic">M</tspan> (n=3)</text>

  <!-- Kalpha transition: hole K -> L -->
  <line x1="250" y1="80" x2="250" y2="349" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed4)"/>
  <text x="238" y="220" font-size="15" font-style="italic" fill="#8B0029" text-anchor="end">K<tspan font-size="12" baseline-shift="sub">&#945;</tspan></text>

  <!-- Kbeta transition: hole K -> M -->
  <line x1="350" y1="80" x2="350" y2="384" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed4)"/>
  <text x="362" y="220" font-size="15" font-style="italic" fill="#8B0029">K<tspan font-size="12" baseline-shift="sub">&#946;</tspan></text>

  <!-- L-alpha transition: hole L -> M -->
  <line x1="470" y1="357" x2="470" y2="384" stroke="#2563EB" stroke-width="2" marker-end="url(#arrBlue4)"/>
  <text x="482" y="377" font-size="13" font-style="italic" fill="#2563EB">L<tspan font-size="11" baseline-shift="sub">&#945;</tspan></text>

  <!-- explanation -->
  <text x="380" y="448" font-size="13.5" fill="#6B7280" text-anchor="middle">화살표는 구멍의 이동: 구멍이 K &#8594; L로 가면 (전자는 L &#8594; K) K<tspan font-size="11" baseline-shift="sub">&#945;</tspan> 광자가 나온다</text>
</svg>
