<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- ===== left: proton orientations in B ===== -->
  <text x="165" y="45" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">자기장 속 양성자의 두 배향</text>

  <rect x="40" y="65" width="250" height="290" fill="#F3F4F6" stroke="none"/>

  <!-- B field arrow -->
  <line x1="70" y1="330" x2="70" y2="95" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrGray)"/>
  <text x="82" y="105" font-size="15" font-weight="bold" font-style="italic" fill="#6B7280">B</text>

  <!-- spin-up proton -->
  <circle cx="180" cy="160" r="8" fill="#8B0029"/>
  <line x1="180" y1="150" x2="180" y2="100" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="198" y="120" font-size="13" fill="#8B0029">&#956;<tspan font-size="10" baseline-shift="sub">z</tspan> (나란히)</text>
  <text x="198" y="160" font-size="13" fill="#1a1a1a">스핀 업</text>
  <text x="198" y="178" font-size="12.5" fill="#6B7280">낮은 에너지 &#8722;&#956;<tspan font-size="10" baseline-shift="sub">z</tspan>B</text>

  <!-- spin-down proton -->
  <circle cx="180" cy="265" r="8" fill="#8B0029"/>
  <line x1="180" y1="275" x2="180" y2="325" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="198" y="320" font-size="13" fill="#8B0029">&#956;<tspan font-size="10" baseline-shift="sub">z</tspan> (반대로)</text>
  <text x="198" y="265" font-size="13" fill="#1a1a1a">스핀 다운</text>
  <text x="198" y="283" font-size="12.5" fill="#6B7280">높은 에너지 +&#956;<tspan font-size="10" baseline-shift="sub">z</tspan>B</text>

  <!-- ===== right: energy level diagram ===== -->
  <text x="555" y="45" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">에너지 준위와 스핀 뒤집기</text>

  <!-- levels -->
  <line x1="420" y1="130" x2="700" y2="130" stroke="#1a1a1a" stroke-width="2"/>
  <text x="420" y="118" font-size="13" fill="#1a1a1a">스핀 다운 (+&#956;<tspan font-size="10" baseline-shift="sub">z</tspan>B)</text>
  <line x1="420" y1="300" x2="700" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <text x="420" y="325" font-size="13" fill="#1a1a1a">스핀 업 (&#8722;&#956;<tspan font-size="10" baseline-shift="sub">z</tspan>B)</text>

  <!-- transition arrow -->
  <line x1="490" y1="295" x2="490" y2="137" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="502" y="222" font-size="13" fill="#8B0029">흡수 &#8594; 스핀 뒤집기</text>

  <!-- photon wavy arrow -->
  <path d="M 335 260 q 10 -12 20 0 q 10 12 20 0 q 10 -12 20 0 q 10 12 20 0 q 10 -12 20 0" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="360" y="240" font-size="13" fill="#2563EB">광자 <tspan font-style="italic">hf</tspan> (RF)</text>

  <!-- energy gap dimension -->
  <line x1="660" y1="137" x2="660" y2="293" stroke="#6B7280" stroke-width="1" marker-start="url(#arrGray)" marker-end="url(#arrGray)"/>
  <text x="672" y="212" font-size="14" fill="#1a1a1a">&#916;E = 2&#956;<tspan font-size="11" baseline-shift="sub">z</tspan>B</text>

  <!-- resonance condition -->
  <text x="555" y="390" font-size="15" font-weight="bold" fill="#8B0029" text-anchor="middle">공명 조건: <tspan font-style="italic">hf</tspan> = 2&#956;<tspan font-size="11" baseline-shift="sub">z</tspan>B</text>
</svg>
