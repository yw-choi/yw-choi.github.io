<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- z axis (dashed extension of L) -->
  <line x1="350" y1="240" x2="350" y2="45" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="338" y="40" font-size="14" font-style="italic" fill="#6B7280">z</text>

  <!-- orbit ellipse -->
  <ellipse cx="350" cy="240" rx="180" ry="60" fill="none" stroke="#6B7280" stroke-width="2"/>

  <!-- center dot -->
  <circle cx="350" cy="240" r="3" fill="#6B7280"/>

  <!-- r vector -->
  <line x1="350" y1="240" x2="518" y2="240" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray)"/>
  <text x="430" y="230" font-size="14" font-style="italic" fill="#6B7280">r</text>

  <!-- electron -->
  <circle cx="530" cy="240" r="9" fill="#2563EB"/>
  <text x="548" y="228" font-size="14" fill="#2563EB">전자 (전하 <tspan font-style="italic">&#8722;e</tspan>, 질량 <tspan font-style="italic">m</tspan>)</text>

  <!-- velocity vector (tangent, downward at right edge) -->
  <line x1="530" y1="256" x2="530" y2="320" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="542" y="300" font-size="14" font-style="italic" fill="#2563EB">v</text>

  <!-- L vector (up) -->
  <line x1="350" y1="240" x2="350" y2="80" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="364" y="95" font-size="16" font-style="italic" font-weight="bold" fill="#8B0029">L</text>
  <text x="364" y="115" font-size="13" fill="#8B0029">각운동량</text>

  <!-- mu vector (down) -->
  <line x1="350" y1="240" x2="350" y2="400" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="364" y="392" font-size="16" font-style="italic" font-weight="bold" fill="#2563EB">&#956;<tspan font-size="12" baseline-shift="sub">orb</tspan></text>
  <text x="364" y="412" font-size="13" fill="#2563EB">자기 모멘트</text>

  <!-- caption -->
  <text x="40" y="60" font-size="14" fill="#1a1a1a">음전하가 돌면 전류 고리와 같다:</text>
  <text x="40" y="82" font-size="14" fill="#8B0029">&#956;와 L은 서로 반대 방향</text>
</svg>
