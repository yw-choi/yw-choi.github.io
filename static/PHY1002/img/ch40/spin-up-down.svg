<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- panel titles -->
  <text x="180" y="45" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">스핀 업 (<tspan font-style="italic">m</tspan><tspan font-size="11" baseline-shift="sub">s</tspan> = +&#189;)</text>
  <text x="520" y="45" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">스핀 다운 (<tspan font-style="italic">m</tspan><tspan font-size="11" baseline-shift="sub">s</tspan> = &#8722;&#189;)</text>

  <!-- ===== left panel: spin up ===== -->
  <line x1="180" y1="390" x2="180" y2="70" stroke="#6B7280" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="190" y="78" font-size="14" font-style="italic" fill="#6B7280">z</text>

  <!-- S_z dashed level -->
  <line x1="180" y1="143" x2="315" y2="143" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="150" y="138" font-size="13" fill="#1a1a1a" text-anchor="end"><tspan font-style="italic">S</tspan><tspan font-size="10" baseline-shift="sub">z</tspan> = +&#8463;/2</text>

  <!-- mu_z dashed level -->
  <line x1="83" y1="294" x2="180" y2="294" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="150" y="316" font-size="13" fill="#2563EB" text-anchor="end"><tspan font-style="italic">&#956;</tspan><tspan font-size="10" baseline-shift="sub">s,z</tspan> = &#8722;&#956;<tspan font-size="10" baseline-shift="sub">B</tspan></text>

  <!-- S vector -->
  <line x1="180" y1="230" x2="302" y2="143" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="285" y="130" font-size="16" font-style="italic" font-weight="bold" fill="#8B0029">S</text>

  <!-- mu_s vector (opposite) -->
  <line x1="180" y1="230" x2="90" y2="294" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="60" y="290" font-size="16" font-style="italic" font-weight="bold" fill="#2563EB">&#956;<tspan font-size="11" baseline-shift="sub">s</tspan></text>

  <!-- ===== right panel: spin down ===== -->
  <line x1="520" y1="390" x2="520" y2="70" stroke="#6B7280" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="530" y="78" font-size="14" font-style="italic" fill="#6B7280">z</text>

  <!-- S_z dashed level -->
  <line x1="520" y1="317" x2="655" y2="317" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="490" y="339" font-size="13" fill="#1a1a1a" text-anchor="end"><tspan font-style="italic">S</tspan><tspan font-size="10" baseline-shift="sub">z</tspan> = &#8722;&#8463;/2</text>

  <!-- mu_z dashed level -->
  <line x1="423" y1="166" x2="520" y2="166" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="490" y="160" font-size="13" fill="#2563EB" text-anchor="end"><tspan font-style="italic">&#956;</tspan><tspan font-size="10" baseline-shift="sub">s,z</tspan> = +&#956;<tspan font-size="10" baseline-shift="sub">B</tspan></text>

  <!-- S vector (down-right) -->
  <line x1="520" y1="230" x2="642" y2="317" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="625" y="345" font-size="16" font-style="italic" font-weight="bold" fill="#8B0029">S</text>

  <!-- mu_s vector (up-left) -->
  <line x1="520" y1="230" x2="430" y2="166" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="400" y="160" font-size="16" font-style="italic" font-weight="bold" fill="#2563EB">&#956;<tspan font-size="11" baseline-shift="sub">s</tspan></text>

  <!-- bottom caption -->
  <text x="350" y="425" font-size="14" fill="#6B7280" text-anchor="middle">|S| = (&#8730;3/2)&#8463; &#8776; 0.866&#8463; &#8212; 축과 나란해질 수 없다 (&#952; &#8776; 54.7&#176;)</text>
</svg>
