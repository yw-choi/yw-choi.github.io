<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text x="165" y="40" font-size="14" fill="#6B7280" text-anchor="middle">이전</text>
  <text x="390" y="40" font-size="14" fill="#6B7280" text-anchor="middle">과정</text>
  <text x="615" y="40" font-size="14" fill="#6B7280" text-anchor="middle">이후</text>

  <!-- ============ row 1: absorption (center y=115) ============ -->
  <!-- before -->
  <line x1="150" y1="85" x2="250" y2="85" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="150" y1="145" x2="250" y2="145" stroke="#1a1a1a" stroke-width="2"/>
  <text x="142" y="90" font-size="13" font-style="italic" fill="#6B7280" text-anchor="end">E<tspan font-size="10" baseline-shift="sub">x</tspan></text>
  <text x="142" y="150" font-size="13" font-style="italic" fill="#6B7280" text-anchor="end">E<tspan font-size="10" baseline-shift="sub">0</tspan></text>
  <circle cx="200" cy="145" r="6" fill="#8B0029"/>
  <path d="M 30 115 q 7 -9 14 0 q 7 9 14 0 q 7 -9 14 0 q 7 9 14 0 q 7 -9 14 0" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrBlue6)"/>
  <text x="55" y="98" font-size="12.5" font-style="italic" fill="#2563EB">hf</text>
  <!-- process -->
  <line x1="300" y1="115" x2="470" y2="115" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed6)"/>
  <text x="390" y="103" font-size="15" font-weight="bold" fill="#8B0029" text-anchor="middle">흡수</text>
  <!-- after -->
  <line x1="530" y1="85" x2="630" y2="85" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="530" y1="145" x2="630" y2="145" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="580" cy="85" r="6" fill="#8B0029"/>
  <text x="660" y="120" font-size="12.5" fill="#6B7280">광자 없음</text>

  <!-- ============ row 2: spontaneous emission (center y=250) ============ -->
  <!-- before -->
  <line x1="150" y1="220" x2="250" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="150" y1="280" x2="250" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="200" cy="220" r="6" fill="#8B0029"/>
  <text x="90" y="255" font-size="12.5" fill="#6B7280">광자 없음</text>
  <!-- process -->
  <line x1="300" y1="250" x2="470" y2="250" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed6)"/>
  <text x="390" y="238" font-size="15" font-weight="bold" fill="#8B0029" text-anchor="middle">자발 방출</text>
  <!-- after -->
  <line x1="530" y1="220" x2="630" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="530" y1="280" x2="630" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="580" cy="280" r="6" fill="#8B0029"/>
  <path d="M 645 250 q 7 -9 14 0 q 7 9 14 0 q 7 -9 14 0 q 7 9 14 0 q 7 -9 14 0" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrBlue6)"/>
  <text x="670" y="233" font-size="12.5" font-style="italic" fill="#2563EB">hf</text>
  <text x="700" y="292" font-size="12" fill="#6B7280">무작위 방향·시점</text>

  <!-- ============ row 3: stimulated emission (center y=385) ============ -->
  <!-- before -->
  <line x1="150" y1="355" x2="250" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="150" y1="415" x2="250" y2="415" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="200" cy="355" r="6" fill="#8B0029"/>
  <path d="M 30 385 q 7 -9 14 0 q 7 9 14 0 q 7 -9 14 0 q 7 9 14 0 q 7 -9 14 0" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrBlue6)"/>
  <text x="55" y="368" font-size="12.5" font-style="italic" fill="#2563EB">hf</text>
  <!-- process -->
  <line x1="300" y1="385" x2="470" y2="385" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed6)"/>
  <text x="390" y="373" font-size="15" font-weight="bold" fill="#8B0029" text-anchor="middle">유도 방출</text>
  <!-- after -->
  <line x1="530" y1="355" x2="630" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="530" y1="415" x2="630" y2="415" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="580" cy="415" r="6" fill="#8B0029"/>
  <path d="M 645 372 q 7 -9 14 0 q 7 9 14 0 q 7 -9 14 0 q 7 9 14 0 q 7 -9 14 0" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrBlue6)"/>
  <path d="M 645 398 q 7 -9 14 0 q 7 9 14 0 q 7 -9 14 0 q 7 9 14 0 q 7 -9 14 0" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrBlue6)"/>
  <text x="670" y="355" font-size="12.5" font-style="italic" fill="#2563EB">hf, hf</text>
  <text x="700" y="430" font-size="12" fill="#6B7280">같은 위상·방향!</text>
</svg>
