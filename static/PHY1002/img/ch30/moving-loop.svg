<svg viewBox="0 0 740 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed4" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue4" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2563EB"/>
    </marker>
    <marker id="arrDark4" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="dimA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- magnetic field region (B into page) -->
  <rect x="40" y="60" width="360" height="300" fill="#F3F4F6" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <g fill="#6B7280" font-size="14" text-anchor="middle">
    <text x="70" y="90">×</text><text x="130" y="90">×</text><text x="190" y="90">×</text><text x="250" y="90">×</text><text x="310" y="90">×</text><text x="370" y="90">×</text>
    <text x="70" y="150">×</text><text x="130" y="150">×</text><text x="190" y="150">×</text><text x="310" y="150">×</text><text x="370" y="150">×</text>
    <text x="70" y="210">×</text><text x="130" y="210">×</text><text x="190" y="210">×</text><text x="250" y="210">×</text><text x="310" y="210">×</text><text x="370" y="210">×</text>
    <text x="70" y="270">×</text><text x="130" y="270">×</text><text x="190" y="270">×</text><text x="310" y="270">×</text><text x="370" y="270">×</text>
    <text x="70" y="330">×</text><text x="130" y="330">×</text><text x="190" y="330">×</text><text x="250" y="330">×</text><text x="310" y="330">×</text><text x="370" y="330">×</text>
  </g>
  <text x="60" y="46" font-size="14" fill="#6B7280">자기장 <tspan font-style="italic">B</tspan> (지면 안쪽)</text>

  <!-- conducting loop, partially in field -->
  <rect x="240" y="120" width="320" height="180" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- induced current (clockwise) -->
  <line x1="330" y1="120" x2="380" y2="120" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrDark4)"/>
  <line x1="560" y1="185" x2="560" y2="235" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrDark4)"/>
  <line x1="470" y1="300" x2="420" y2="300" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrDark4)"/>
  <line x1="240" y1="235" x2="240" y2="185" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrDark4)"/>
  <text x="415" y="112" font-size="14" font-style="italic" fill="#1a1a1a">i</text>

  <!-- pulling velocity -->
  <line x1="565" y1="210" x2="632" y2="210" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue4)"/>
  <text x="600" y="196" font-size="14" font-style="italic" fill="#2563EB" text-anchor="middle">v</text>

  <!-- forces -->
  <line x1="236" y1="210" x2="150" y2="210" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed4)"/>
  <text x="185" y="196" font-size="14" font-style="italic" fill="#8B0029" text-anchor="middle">F₁</text>

  <line x1="320" y1="116" x2="320" y2="66" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed4)"/>
  <text x="336" y="82" font-size="14" font-style="italic" fill="#8B0029">F₂</text>

  <line x1="320" y1="304" x2="320" y2="354" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed4)"/>
  <text x="336" y="348" font-size="14" font-style="italic" fill="#8B0029">F₃</text>

  <!-- dimension: x (length of loop still in field) -->
  <line x1="240" y1="385" x2="400" y2="385" stroke="#6B7280" stroke-width="1" marker-start="url(#dimA)" marker-end="url(#dimA)"/>
  <line x1="240" y1="305" x2="240" y2="390" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="400" y1="360" x2="400" y2="390" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="320" y="408" font-size="14" font-style="italic" fill="#6B7280" text-anchor="middle">x</text>

  <!-- dimension: L (loop height) -->
  <line x1="662" y1="120" x2="662" y2="300" stroke="#6B7280" stroke-width="1" marker-start="url(#dimA)" marker-end="url(#dimA)"/>
  <line x1="562" y1="120" x2="668" y2="120" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="562" y1="300" x2="668" y2="300" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="682" y="215" font-size="14" font-style="italic" fill="#6B7280">L</text>

  <!-- note -->
  <text x="640" y="66" font-size="13" fill="#6B7280" text-anchor="middle">F₂ 와 F₃ 는 서로 상쇄</text>
</svg>
