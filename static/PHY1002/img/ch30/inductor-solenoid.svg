<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed6" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="dim6" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="300" y="36" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">긴 솔레노이드의 단면 (축을 따라 자른 모습)</text>

  <!-- interior region -->
  <rect x="80" y="130" width="440" height="120" fill="#F3F4F6" stroke="none"/>

  <!-- top winding cross-sections: current into page -->
  <g stroke="#1a1a1a" stroke-width="2" fill="#fff">
    <circle cx="100" cy="130" r="11"/><circle cx="140" cy="130" r="11"/><circle cx="180" cy="130" r="11"/>
    <circle cx="220" cy="130" r="11"/><circle cx="260" cy="130" r="11"/><circle cx="300" cy="130" r="11"/>
    <circle cx="340" cy="130" r="11"/><circle cx="380" cy="130" r="11"/><circle cx="420" cy="130" r="11"/>
    <circle cx="460" cy="130" r="11"/><circle cx="500" cy="130" r="11"/>
  </g>
  <g fill="#1a1a1a" font-size="13" text-anchor="middle">
    <text x="100" y="135">×</text><text x="140" y="135">×</text><text x="180" y="135">×</text>
    <text x="220" y="135">×</text><text x="260" y="135">×</text><text x="300" y="135">×</text>
    <text x="340" y="135">×</text><text x="380" y="135">×</text><text x="420" y="135">×</text>
    <text x="460" y="135">×</text><text x="500" y="135">×</text>
  </g>

  <!-- bottom winding cross-sections: current out of page -->
  <g stroke="#1a1a1a" stroke-width="2" fill="#fff">
    <circle cx="100" cy="250" r="11"/><circle cx="140" cy="250" r="11"/><circle cx="180" cy="250" r="11"/>
    <circle cx="220" cy="250" r="11"/><circle cx="260" cy="250" r="11"/><circle cx="300" cy="250" r="11"/>
    <circle cx="340" cy="250" r="11"/><circle cx="380" cy="250" r="11"/><circle cx="420" cy="250" r="11"/>
    <circle cx="460" cy="250" r="11"/><circle cx="500" cy="250" r="11"/>
  </g>
  <g fill="#1a1a1a">
    <circle cx="100" cy="250" r="3"/><circle cx="140" cy="250" r="3"/><circle cx="180" cy="250" r="3"/>
    <circle cx="220" cy="250" r="3"/><circle cx="260" cy="250" r="3"/><circle cx="300" cy="250" r="3"/>
    <circle cx="340" cy="250" r="3"/><circle cx="380" cy="250" r="3"/><circle cx="420" cy="250" r="3"/>
    <circle cx="460" cy="250" r="3"/><circle cx="500" cy="250" r="3"/>
  </g>

  <!-- B field arrows inside -->
  <line x1="130" y1="165" x2="330" y2="165" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed6)"/>
  <line x1="130" y1="190" x2="330" y2="190" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed6)"/>
  <line x1="130" y1="215" x2="330" y2="215" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed6)"/>
  <text x="352" y="195" font-size="15" font-style="italic" fill="#8B0029">B = μ₀in</text>

  <!-- cross-section area at right end -->
  <ellipse cx="520" cy="190" rx="16" ry="60" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="560" y="185" font-size="14" fill="#2563EB">단면적</text>
  <text x="560" y="205" font-size="14" font-style="italic" fill="#2563EB">A</text>

  <!-- current labels -->
  <text x="100" y="104" font-size="13" fill="#6B7280" text-anchor="middle">× : 전류가 들어감</text>
  <text x="100" y="292" font-size="13" fill="#6B7280" text-anchor="middle">• : 전류가 나옴</text>
  <text x="248" y="104" font-size="14" font-style="italic" fill="#1a1a1a">i</text>

  <!-- length dimension -->
  <line x1="80" y1="330" x2="520" y2="330" stroke="#6B7280" stroke-width="1" marker-start="url(#dim6)" marker-end="url(#dim6)"/>
  <line x1="80" y1="268" x2="80" y2="336" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="520" y1="268" x2="520" y2="336" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="300" y="352" font-size="14" fill="#6B7280" text-anchor="middle">길이 <tspan font-style="italic">l</tspan> (단위 길이당 감김 수 <tspan font-style="italic">n</tspan>, 총 감김 수 <tspan font-style="italic">N = nl</tspan>)</text>

  <!-- circuit symbol -->
  <g transform="translate(590,120)">
    <text x="60" y="-14" font-size="13" fill="#6B7280" text-anchor="middle">인덕터 회로 기호</text>
    <line x1="0" y1="10" x2="20" y2="10" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M20,10 A10,12 0 0 1 40,10 A10,12 0 0 1 60,10 A10,12 0 0 1 80,10 A10,12 0 0 1 100,10" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="100" y1="10" x2="120" y2="10" stroke="#1a1a1a" stroke-width="2"/>
    <text x="60" y="46" font-size="14" font-style="italic" fill="#1a1a1a" text-anchor="middle">L</text>
  </g>

  <!-- bottom formula note -->
  <text x="300" y="386" font-size="14" fill="#1a1a1a" text-anchor="middle">균일한 내부 자기장 → 자속 결합 <tspan font-style="italic">NΦ = (nl)(BA)</tspan></text>
</svg>
