<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- ================= Panel (a): approaching ================= -->
  <text x="190" y="36" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">(a) N극이 다가올 때</text>

  <!-- velocity arrow toward loop -->
  <line x1="90" y1="120" x2="165" y2="120" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue3)"/>
  <text x="127" y="108" font-size="14" font-style="italic" fill="#2563EB" text-anchor="middle">v</text>

  <!-- magnet: S left, N right -->
  <rect x="40" y="150" width="55" height="44" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <rect x="95" y="150" width="55" height="44" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="67" y="178" font-size="16" font-weight="bold" fill="#6B7280" text-anchor="middle">S</text>
  <text x="122" y="178" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">N</text>

  <!-- loop -->
  <ellipse cx="270" cy="172" rx="14" ry="52" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- B_ind arrow pointing left (opposing) -->
  <line x1="262" y1="172" x2="192" y2="172" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed3)"/>
  <text x="222" y="156" font-size="14" font-style="italic" fill="#8B0029" text-anchor="middle">B<tspan font-size="10" dy="3">ind</tspan></text>

  <!-- induced current arrow on loop -->
  <path d="M285,196 Q290,172 285,148" fill="none" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed3)"/>
  <text x="300" y="120" font-size="13" fill="#8B0029" text-anchor="middle">유도 전류</text>

  <!-- effective pole of loop -->
  <text x="270" y="250" font-size="15" font-weight="bold" fill="#8B0029" text-anchor="middle">N</text>
  <text x="270" y="270" font-size="13" fill="#6B7280" text-anchor="middle">고리의 앞면이 N극</text>

  <text x="190" y="316" font-size="14" fill="#1a1a1a" text-anchor="middle">자속이 늘어난다 → 유도 전류의 자기장은</text>
  <text x="190" y="338" font-size="14" fill="#1a1a1a" text-anchor="middle">자석 쪽을 향해 접근을 <tspan font-weight="bold" fill="#8B0029">밀어낸다</tspan></text>
  <text x="190" y="366" font-size="13" fill="#6B7280" text-anchor="middle">(자석에서 보면 반시계 방향 전류)</text>

  <!-- ================= Panel (b): receding ================= -->
  <text x="570" y="36" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">(b) N극이 멀어질 때</text>

  <!-- velocity arrow away from loop -->
  <line x1="545" y1="120" x2="470" y2="120" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue3)"/>
  <text x="507" y="108" font-size="14" font-style="italic" fill="#2563EB" text-anchor="middle">v</text>

  <!-- magnet -->
  <rect x="420" y="150" width="55" height="44" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <rect x="475" y="150" width="55" height="44" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="447" y="178" font-size="16" font-weight="bold" fill="#6B7280" text-anchor="middle">S</text>
  <text x="502" y="178" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">N</text>

  <!-- loop -->
  <ellipse cx="650" cy="172" rx="14" ry="52" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- B_ind arrow pointing right (maintaining flux) -->
  <line x1="658" y1="172" x2="728" y2="172" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed3)"/>
  <text x="698" y="156" font-size="14" font-style="italic" fill="#8B0029" text-anchor="middle">B<tspan font-size="10" dy="3">ind</tspan></text>

  <!-- induced current arrow on loop (reversed) -->
  <path d="M637,148 Q632,172 637,196" fill="none" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed3)"/>
  <text x="665" y="120" font-size="13" fill="#8B0029" text-anchor="middle">유도 전류 (반대)</text>

  <!-- effective pole of loop -->
  <text x="650" y="250" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">S</text>
  <text x="650" y="270" font-size="13" fill="#6B7280" text-anchor="middle">고리의 앞면이 S극</text>

  <text x="570" y="316" font-size="14" fill="#1a1a1a" text-anchor="middle">자속이 줄어든다 → 유도 전류의 자기장은</text>
  <text x="570" y="338" font-size="14" fill="#1a1a1a" text-anchor="middle">자속을 유지하려 하며 자석을 <tspan font-weight="bold" fill="#2563EB">끌어당긴다</tspan></text>
  <text x="570" y="366" font-size="13" fill="#6B7280" text-anchor="middle">(자석에서 보면 시계 방향 전류)</text>

  <!-- bottom note -->
  <text x="380" y="404" font-size="14" font-weight="bold" fill="#8B0029" text-anchor="middle">어느 쪽이든 유도 전류는 변화를 "방해"하는 방향이다</text>
</svg>
