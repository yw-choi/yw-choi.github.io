<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed10" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="arrGray10" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
    <marker id="arrDark10" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="380" y="34" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">상호 유도: 코일 1의 전류 변화가 코일 2에 기전력을 만든다</text>

  <!-- B1 field lines from coil 1 passing through coil 2 -->
  <path d="M250,170 C330,120 430,120 500,168" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray10)"/>
  <path d="M250,190 C330,160 430,160 498,186" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray10)"/>
  <path d="M250,210 C330,240 430,240 498,212" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray10)"/>
  <text x="375" y="110" font-size="14" font-style="italic" fill="#6B7280" text-anchor="middle">B₁</text>

  <!-- coil 1: three turns (bigger) -->
  <g fill="none" stroke="#8B0029" stroke-width="2.5">
    <ellipse cx="216" cy="190" rx="15" ry="72"/>
    <ellipse cx="238" cy="190" rx="15" ry="72"/>
    <ellipse cx="260" cy="190" rx="15" ry="72"/>
  </g>
  <text x="238" y="94" font-size="14" fill="#8B0029" text-anchor="middle">코일 1 (<tspan font-style="italic">N₁</tspan>회)</text>

  <!-- coil 2: two turns (smaller) -->
  <g fill="none" stroke="#2563EB" stroke-width="2.5">
    <ellipse cx="512" cy="190" rx="13" ry="50"/>
    <ellipse cx="534" cy="190" rx="13" ry="50"/>
  </g>
  <text x="523" y="114" font-size="14" fill="#2563EB" text-anchor="middle">코일 2 (<tspan font-style="italic">N₂</tspan>회)</text>
  <text x="620" y="168" font-size="14" font-style="italic" fill="#2563EB">Φ₂₁</text>
  <line x1="612" y1="176" x2="556" y2="188" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- circuit of coil 1: battery + variable resistor -->
  <line x1="216" y1="262" x2="216" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="260" y1="262" x2="260" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <!-- battery -->
  <line x1="196" y1="330" x2="236" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="204" y1="344" x2="228" y2="344" stroke="#1a1a1a" stroke-width="5"/>
  <line x1="216" y1="344" x2="216" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="216" y1="360" x2="120" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="360" x2="120" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <!-- variable resistor R between (120,300) and (260,300) -->
  <path d="M120,300 L136,300 L144,284 L160,316 L176,284 L192,316 L208,284 L220,300 L260,300" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="144" y1="316" x2="196" y2="282" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrDark10)"/>
  <text x="168" y="340" font-size="14" font-style="italic" fill="#1a1a1a" text-anchor="middle">R (가변)</text>
  <!-- current arrow (on the clean right-side wire of coil 1) -->
  <line x1="260" y1="296" x2="260" y2="272" stroke="#8B0029" stroke-width="2" marker-end="url(#arrRed10)"/>
  <text x="250" y="290" font-size="14" font-style="italic" fill="#8B0029" text-anchor="end">i₁</text>

  <!-- circuit of coil 2: meter -->
  <line x1="512" y1="240" x2="512" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="534" y1="240" x2="534" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="534" y1="300" x2="630" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="630" y1="300" x2="630" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="512" y1="330" x2="542" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="630" y1="330" x2="600" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="571" cy="352" r="26" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="571" y1="358" x2="556" y2="338" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="571" cy="358" r="3" fill="#1a1a1a"/>
  <text x="622" y="386" font-size="13" fill="#6B7280">검류계</text>

  <!-- annotation -->
  <text x="380" y="272" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan font-style="italic">i₁</tspan>이 변하면 →</text>
  <text x="380" y="294" font-size="14" fill="#1a1a1a" text-anchor="middle">코일 2를 지나는 자속 <tspan font-style="italic">Φ₂₁</tspan>이 변하고</text>
  <text x="380" y="316" font-size="14" fill="#8B0029" text-anchor="middle" font-weight="bold">ℰ₂ = −M di₁/dt</text>

  <text x="380" y="410" font-size="14" fill="#6B7280" text-anchor="middle">역할을 바꿔도 상수는 같다: M₂₁ = M₁₂ = M</text>
</svg>
