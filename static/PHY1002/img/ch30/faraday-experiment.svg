<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- ================= Panel (a) ================= -->
  <text x="190" y="38" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">(a) 자석이 움직이면 → 전류가 흐른다</text>

  <!-- velocity arrow -->
  <line x1="70" y1="120" x2="150" y2="120" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="110" y="108" font-size="14" font-style="italic" fill="#2563EB" text-anchor="middle">v</text>

  <!-- bar magnet: S left (gray), N right (red) -->
  <rect x="40" y="150" width="55" height="44" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <rect x="95" y="150" width="55" height="44" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="67" y="178" font-size="16" font-weight="bold" fill="#6B7280" text-anchor="middle">S</text>
  <text x="122" y="178" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">N</text>

  <!-- field lines from N pole -->
  <path d="M152,160 Q190,150 222,158" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrGray)"/>
  <path d="M152,172 Q190,172 220,172" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrGray)"/>
  <path d="M152,184 Q190,194 222,186" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrGray)"/>

  <!-- conducting loop -->
  <ellipse cx="252" cy="172" rx="13" ry="48" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="252" y="112" font-size="14" fill="#1a1a1a" text-anchor="middle">도선 고리</text>

  <!-- induced current arrow on loop -->
  <path d="M231,192 Q227,172 231,152" fill="none" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="216" y="148" font-size="14" font-style="italic" fill="#8B0029" text-anchor="middle">i</text>

  <!-- wires to galvanometer -->
  <path d="M252,220 L252,250 L210,250 L210,290" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M262,214 L290,250 L290,290" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- galvanometer -->
  <circle cx="250" cy="316" r="30" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M210,290 L222,296" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M290,290 L278,296" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="250" y1="322" x2="230" y2="300" stroke="#8B0029" stroke-width="2.5"/>
  <circle cx="250" cy="322" r="3" fill="#1a1a1a"/>
  <text x="250" y="378" font-size="14" fill="#1a1a1a" text-anchor="middle">검류계: 바늘이 움직인다</text>

  <!-- ================= Panel (b) ================= -->
  <text x="570" y="38" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">(b) 자석이 멈추면 → 전류 없음</text>

  <text x="490" y="115" font-size="14" font-style="italic" fill="#6B7280" text-anchor="middle">v = 0</text>

  <!-- bar magnet -->
  <rect x="420" y="150" width="55" height="44" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <rect x="475" y="150" width="55" height="44" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="447" y="178" font-size="16" font-weight="bold" fill="#6B7280" text-anchor="middle">S</text>
  <text x="502" y="178" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">N</text>

  <!-- conducting loop -->
  <ellipse cx="632" cy="172" rx="13" ry="48" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="632" y="112" font-size="14" fill="#1a1a1a" text-anchor="middle">도선 고리</text>

  <!-- wires to galvanometer -->
  <path d="M632,220 L632,250 L590,250 L590,290" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M642,214 L670,250 L670,290" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- galvanometer (needle centered) -->
  <circle cx="630" cy="316" r="30" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M590,290 L602,296" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M670,290 L658,296" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="630" y1="322" x2="630" y2="294" stroke="#6B7280" stroke-width="2.5"/>
  <circle cx="630" cy="322" r="3" fill="#1a1a1a"/>
  <text x="630" y="378" font-size="14" fill="#1a1a1a" text-anchor="middle">바늘이 움직이지 않는다</text>
</svg>
