<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- ============ Panel 1: change B ============ -->
  <text x="140" y="40" font-size="15" font-weight="bold" fill="#8B0029" text-anchor="middle">① 자기장 크기 변화</text>

  <rect x="80" y="90" width="120" height="120" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- B arrows through loop (upward, growing lengths) -->
  <line x1="105" y1="190" x2="105" y2="120" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <line x1="140" y1="195" x2="140" y2="108" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <line x1="175" y1="190" x2="175" y2="120" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <text x="158" y="102" font-size="14" font-style="italic" fill="#8B0029">B</text>

  <text x="140" y="250" font-size="14" fill="#1a1a1a" text-anchor="middle">B의 세기를 키우거나 줄인다</text>
  <text x="140" y="274" font-size="14" font-style="italic" fill="#6B7280" text-anchor="middle">dB/dt ≠ 0</text>

  <!-- ============ Panel 2: change area in field ============ -->
  <text x="390" y="40" font-size="15" font-weight="bold" fill="#8B0029" text-anchor="middle">② 장 속 면적 변화</text>

  <!-- field region -->
  <rect x="290" y="80" width="130" height="140" fill="#F3F4F6" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="305" y="102" font-size="13" fill="#6B7280">×</text>
  <text x="340" y="102" font-size="13" fill="#6B7280">×</text>
  <text x="375" y="102" font-size="13" fill="#6B7280">×</text>
  <text x="305" y="145" font-size="13" fill="#6B7280">×</text>
  <text x="375" y="145" font-size="13" fill="#6B7280">×</text>
  <text x="305" y="188" font-size="13" fill="#6B7280">×</text>
  <text x="340" y="188" font-size="13" fill="#6B7280">×</text>
  <text x="375" y="188" font-size="13" fill="#6B7280">×</text>
  <text x="410" y="215" font-size="13" font-style="italic" fill="#6B7280">B</text>

  <!-- loop partially inside -->
  <rect x="350" y="110" width="110" height="80" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="465" y1="150" x2="510" y2="150" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue2)"/>
  <text x="488" y="138" font-size="14" font-style="italic" fill="#2563EB" text-anchor="middle">v</text>

  <text x="390" y="250" font-size="14" fill="#1a1a1a" text-anchor="middle">고리를 장 밖으로 빼거나</text>
  <text x="390" y="274" font-size="14" fill="#1a1a1a" text-anchor="middle">안으로 넣는다</text>

  <!-- ============ Panel 3: change angle ============ -->
  <text x="650" y="40" font-size="15" font-weight="bold" fill="#8B0029" text-anchor="middle">③ 각도 변화</text>

  <!-- B arrows (upward) -->
  <line x1="585" y1="205" x2="585" y2="95" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <line x1="725" y1="205" x2="725" y2="95" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed2)"/>
  <text x="742" y="110" font-size="14" font-style="italic" fill="#8B0029">B</text>

  <!-- tilted loop (viewed edge-on as a tilted line-ellipse) -->
  <ellipse cx="655" cy="150" rx="55" ry="16" fill="none" stroke="#1a1a1a" stroke-width="2" transform="rotate(-24 655 150)"/>
  <!-- normal vector -->
  <line x1="655" y1="150" x2="683" y2="88" stroke="#6B7280" stroke-width="2" marker-end="url(#arrGray2)"/>
  <text x="697" y="90" font-size="14" font-style="italic" fill="#6B7280">n̂</text>
  <!-- angle theta between normal and B -->
  <path d="M655,118 A32,32 0 0 1 669,120" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="668" y="110" font-size="13" font-style="italic" fill="#6B7280">θ</text>
  <!-- rotation arrow -->
  <path d="M710,168 A60,26 0 0 1 665,180" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrBlue2)"/>

  <text x="650" y="250" font-size="14" fill="#1a1a1a" text-anchor="middle">고리를 회전시켜</text>
  <text x="650" y="274" font-size="14" fill="#1a1a1a" text-anchor="middle">B와 면의 각도를 바꾼다</text>

  <!-- bottom note -->
  <text x="390" y="318" font-size="14" fill="#6B7280" text-anchor="middle">세 경우 모두 자속 Φ가 변한다 → 기전력이 유도된다</text>
</svg>
