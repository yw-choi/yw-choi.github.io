<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed11" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="arrDark11" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- ============ (a) current increasing ============ -->
  <text x="190" y="40" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">(a) 전류가 증가할 때</text>

  <!-- incoming wire + current arrow -->
  <line x1="50" y1="150" x2="130" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="60" y1="150" x2="110" y2="150" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrDark11)"/>
  <text x="85" y="132" font-size="14" font-style="italic" fill="#1a1a1a" text-anchor="middle">i (증가)</text>

  <!-- coil -->
  <path d="M130,150 A14,16 0 0 1 158,150 A14,16 0 0 1 186,150 A14,16 0 0 1 214,150 A14,16 0 0 1 242,150 A14,16 0 0 1 270,150" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="270" y1="150" x2="340" y2="150" stroke="#1a1a1a" stroke-width="2"/>

  <!-- self-induced emf arrow: opposes increase => points against current -->
  <line x1="262" y1="196" x2="150" y2="196" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed11)"/>
  <text x="206" y="226" font-size="14" font-style="italic" fill="#8B0029" text-anchor="middle">ℰ<tspan font-size="10" dy="3">L</tspan></text>

  <text x="190" y="272" font-size="14" fill="#1a1a1a" text-anchor="middle">자체 유도 기전력이 전류와 <tspan font-weight="bold" fill="#8B0029">반대 방향</tspan></text>
  <text x="190" y="296" font-size="13" fill="#6B7280" text-anchor="middle">→ 전류 증가를 방해 (원래 상태 유지 시도)</text>

  <!-- divider -->
  <line x1="380" y1="60" x2="380" y2="300" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ============ (b) current decreasing ============ -->
  <text x="570" y="40" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">(b) 전류가 감소할 때</text>

  <line x1="430" y1="150" x2="510" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="440" y1="150" x2="490" y2="150" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrDark11)"/>
  <text x="465" y="132" font-size="14" font-style="italic" fill="#1a1a1a" text-anchor="middle">i (감소)</text>

  <path d="M510,150 A14,16 0 0 1 538,150 A14,16 0 0 1 566,150 A14,16 0 0 1 594,150 A14,16 0 0 1 622,150 A14,16 0 0 1 650,150" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="650" y1="150" x2="720" y2="150" stroke="#1a1a1a" stroke-width="2"/>

  <!-- self-induced emf arrow: opposes decrease => points along current -->
  <line x1="528" y1="196" x2="640" y2="196" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed11)"/>
  <text x="584" y="226" font-size="14" font-style="italic" fill="#8B0029" text-anchor="middle">ℰ<tspan font-size="10" dy="3">L</tspan></text>

  <text x="570" y="272" font-size="14" fill="#1a1a1a" text-anchor="middle">자체 유도 기전력이 전류와 <tspan font-weight="bold" fill="#8B0029">같은 방향</tspan></text>
  <text x="570" y="296" font-size="13" fill="#6B7280" text-anchor="middle">→ 전류 감소를 방해 (전류를 유지하려 함)</text>

  <text x="380" y="330" font-size="14" font-weight="bold" fill="#8B0029" text-anchor="middle">렌츠 법칙: ℰ<tspan font-size="10" dy="3">L</tspan><tspan dy="-3"> 은 언제나 전류의 "변화"를 방해한다</tspan></text>
</svg>
