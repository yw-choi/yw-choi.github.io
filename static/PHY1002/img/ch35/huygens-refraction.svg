<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
  </defs>

  <!-- glass region -->
  <rect x="60" y="250" width="640" height="160" fill="#F3F4F6"/>
  <line x1="60" y1="250" x2="700" y2="250" stroke="#6B7280" stroke-width="2"/>
  <text x="80" y="90" font-size="15" fill="#6B7280">공기 n₁</text>
  <text x="80" y="400" font-size="15" fill="#6B7280">유리 n₂ &gt; n₁</text>

  <!-- incident rays -->
  <line x1="122.7" y1="122.7" x2="250" y2="250" stroke="#8B0029" stroke-width="2.5"/>
  <line x1="278.6" y1="108.6" x2="420" y2="250" stroke="#8B0029" stroke-width="2.5"/>
  <text x="60" y="160" font-size="13" fill="#8B0029">광선 1</text>
  <text x="296" y="100" font-size="13" fill="#8B0029">광선 2</text>

  <!-- refracted rays -->
  <line x1="250" y1="250" x2="311" y2="364.7" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>
  <line x1="420" y1="250" x2="471.8" y2="347" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>

  <!-- wavefront at t=0 : a -> b -->
  <line x1="250" y1="250" x2="335" y2="165" stroke="#2563EB" stroke-width="2.5"/>
  <text x="368" y="138" font-size="13.5" fill="#2563EB">입사 파면 (t = 0)</text>

  <!-- wavelet from a, radius lambda2 -->
  <path d="M169.9,250 A 80.1 80.1 0 0 0 330.1,250" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="85" y="318" font-size="13" fill="#6B7280">잔파 (반지름 λ₂)</text>

  <!-- refracted wavefront at t=dt : c -> d -->
  <line x1="420" y1="250" x2="287.7" y2="320.7" stroke="#2563EB" stroke-width="2.5"/>
  <text x="130" y="358" font-size="13.5" fill="#2563EB">굴절 파면 (t = Δt)</text>

  <!-- right angle marks -->
  <path d="M327.9,172.1 L335,179.1 L342.1,172.1" fill="none" stroke="#6B7280" stroke-width="1"/>
  <path d="M283,311.9 L291.8,307.2 L296.5,316" fill="none" stroke="#6B7280" stroke-width="1"/>

  <!-- point labels -->
  <text x="236" y="240" font-size="14" font-style="italic" fill="#1a1a1a">a</text>
  <text x="344" y="160" font-size="14" font-style="italic" fill="#1a1a1a">b</text>
  <text x="428" y="242" font-size="14" font-style="italic" fill="#1a1a1a">c</text>
  <text x="272" y="340" font-size="14" font-style="italic" fill="#1a1a1a">d</text>

  <!-- lambda labels -->
  <text x="392" y="196" font-size="15" font-style="italic" fill="#1a1a1a">λ₁</text>
  <text x="244" y="299" font-size="15" font-style="italic" fill="#1a1a1a">λ₂</text>

  <!-- theta1 arc at a (between interface a->c and wavefront a->b) -->
  <path d="M305,250 A 55 55 0 0 0 288.9,211.1" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="315" y="228" font-size="15" font-style="italic" fill="#1a1a1a">θ₁</text>

  <!-- theta2 arc at c (between interface c->a and wavefront c->d) -->
  <path d="M360,250 A 60 60 0 0 0 367.1,278.2" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="337" y="274" font-size="15" font-style="italic" fill="#1a1a1a">θ₂</text>

  <!-- bottom relation -->
  <text x="380" y="450" font-size="14.5" fill="#1a1a1a" text-anchor="middle" font-style="italic">sin θ₁ = λ₁ / ac,   sin θ₂ = λ₂ / ac   →   sin θ₁ / sin θ₂ = λ₁ / λ₂ = v₁ / v₂</text>
</svg>
