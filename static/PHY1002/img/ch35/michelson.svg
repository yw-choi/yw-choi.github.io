<svg viewBox="0 0 720 490" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- source -->
  <circle cx="90" cy="270" r="15" fill="#8B0029"/>
  <text x="90" y="305" font-size="14" fill="#1a1a1a" text-anchor="middle">광원 S</text>

  <!-- source -> beam splitter -->
  <line x1="105" y1="270" x2="326" y2="270" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>

  <!-- beam splitter (45 deg) -->
  <line x1="315" y1="295" x2="365" y2="245" stroke="#6B7280" stroke-width="4"/>
  <text x="358" y="322" font-size="13.5" fill="#1a1a1a">빔 분할기 M</text>
  <text x="358" y="340" font-size="12" fill="#6B7280">(절반 투과 + 절반 반사)</text>

  <!-- arm 1: to fixed mirror M1 (right) -->
  <line x1="345" y1="266" x2="592" y2="266" stroke="#8B0029" stroke-width="2" marker-end="url(#arrR)"/>
  <line x1="596" y1="274" x2="349" y2="274" stroke="#8B0029" stroke-width="2" marker-end="url(#arrR)"/>
  <rect x="600" y="230" width="8" height="80" fill="#6B7280"/>
  <text x="604" y="336" font-size="13.5" fill="#1a1a1a" text-anchor="middle">거울 M₁ (고정)</text>
  <text x="470" y="294" font-size="12.5" fill="#6B7280">팔 1</text>

  <!-- arm 2: to movable mirror M2 (top) -->
  <line x1="336" y1="250" x2="336" y2="76" stroke="#8B0029" stroke-width="2" marker-end="url(#arrR)"/>
  <line x1="344" y1="72" x2="344" y2="246" stroke="#8B0029" stroke-width="2" marker-end="url(#arrR)"/>
  <rect x="300" y="60" width="80" height="8" fill="#6B7280"/>
  <text x="340" y="44" font-size="13.5" fill="#1a1a1a" text-anchor="middle">이동 거울 M₂</text>
  <text x="308" y="160" font-size="12.5" fill="#6B7280" text-anchor="end">팔 2</text>

  <!-- movable double arrow -->
  <line x1="272" y1="46" x2="272" y2="86" stroke="#6B7280" stroke-width="1.5" marker-start="url(#arrG)" marker-end="url(#arrG)"/>

  <!-- d1 dimension -->
  <line x1="368" y1="228" x2="600" y2="228" stroke="#6B7280" stroke-width="1" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="484" y="218" font-size="14" font-style="italic" fill="#6B7280" text-anchor="middle">d₁</text>

  <!-- d2 dimension -->
  <line x1="396" y1="68" x2="396" y2="242" stroke="#6B7280" stroke-width="1" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="410" y="158" font-size="14" font-style="italic" fill="#6B7280">d₂</text>

  <!-- recombined beam -> detector -->
  <line x1="340" y1="290" x2="340" y2="416" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>
  <rect x="322" y="420" width="36" height="26" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" rx="4"/>
  <text x="340" y="470" font-size="13.5" fill="#1a1a1a" text-anchor="middle">망원경 T (관측자)</text>

  <!-- notes -->
  <text x="40" y="392" font-size="14" fill="#1a1a1a">두 팔을 왕복한 빛이 다시 만나</text>
  <text x="40" y="413" font-size="14" fill="#1a1a1a">간섭무늬를 만든다. 경로차 = 2d₂ − 2d₁</text>
  <text x="40" y="440" font-size="14" fill="#8B0029" font-weight="bold">M₂를 λ/2만 옮겨도 경로차가 λ 변해</text>
  <text x="40" y="461" font-size="14" fill="#8B0029" font-weight="bold">무늬가 정확히 1개 이동한다</text>
</svg>
