<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- film -->
  <rect x="400" y="70" width="70" height="320" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="330" y="55" font-size="14" fill="#1a1a1a" text-anchor="end">n₁ = 1.0 (공기)</text>
  <text x="435" y="55" font-size="14" fill="#1a1a1a" text-anchor="middle">막 n₂</text>
  <text x="540" y="55" font-size="14" fill="#1a1a1a">n₃ = 1.0 (공기)</text>

  <!-- incident ray -->
  <line x1="170" y1="320" x2="400" y2="258" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="150" y="342" font-size="14" fill="#8B0029">입사광 i</text>

  <!-- r1: front-surface reflection -->
  <line x1="400" y1="258" x2="170" y2="196" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="158" y="190" font-size="14" font-style="italic" fill="#8B0029" text-anchor="end">r₁</text>

  <!-- refracted inside film: a -> b -->
  <line x1="400" y1="258" x2="470" y2="244" stroke="#8B0029" stroke-width="2.5"/>
  <!-- back-surface reflection: b -> c -->
  <line x1="470" y1="244" x2="400" y2="230" stroke="#8B0029" stroke-width="2.5"/>
  <!-- exit: c -> observer -->
  <line x1="400" y1="230" x2="170" y2="168" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="158" y="162" font-size="14" font-style="italic" fill="#8B0029" text-anchor="end">r₂</text>

  <!-- point labels -->
  <text x="388" y="278" font-size="14" font-style="italic" fill="#1a1a1a">a</text>
  <text x="478" y="248" font-size="14" font-style="italic" fill="#1a1a1a">b</text>
  <text x="386" y="222" font-size="14" font-style="italic" fill="#1a1a1a" text-anchor="end">c</text>

  <!-- callout 1 -->
  <text x="60" y="100" font-size="14" fill="#8B0029" font-weight="bold">반사 ① (점 a): 공기 → 막, 낮 → 높</text>
  <text x="60" y="121" font-size="14" fill="#8B0029" font-weight="bold">→ 위상 변화 0.5λ</text>
  <line x1="255" y1="128" x2="392" y2="248" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- callout 2 -->
  <text x="500" y="140" font-size="14" fill="#2563EB" font-weight="bold">반사 ② (점 b): 막 → 공기, 높 → 낮</text>
  <text x="500" y="161" font-size="14" fill="#2563EB" font-weight="bold">→ 위상 변화 없음</text>
  <line x1="530" y1="170" x2="474" y2="238" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- L dimension -->
  <line x1="400" y1="390" x2="400" y2="420" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="470" y1="390" x2="470" y2="420" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="400" y1="414" x2="470" y2="414" stroke="#6B7280" stroke-width="1" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="435" y="440" font-size="15" font-style="italic" fill="#1a1a1a" text-anchor="middle">L</text>

  <!-- path note -->
  <text x="60" y="380" font-size="14" fill="#1a1a1a" font-weight="bold">r₂의 추가 왕복 경로 ≈ 2L</text>
  <text x="60" y="402" font-size="14" fill="#1a1a1a">(막 내부이므로 파장은 λ가 아니라 λ/n₂!)</text>

  <!-- note: rays nearly perpendicular -->
  <text x="500" y="380" font-size="12.5" fill="#6B7280">실제로는 거의 수직 입사(θ ≈ 0),</text>
  <text x="500" y="398" font-size="12.5" fill="#6B7280">그림은 구분을 위해 기울여 그림</text>
</svg>
