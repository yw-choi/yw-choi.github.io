<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
  </defs>

  <!-- horizontal axis -->
  <line x1="90" y1="300" x2="480" y2="300" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- phasor E1 from origin at angle wt = 20deg -->
  <line x1="140" y1="300" x2="309.2" y2="238.4" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>
  <!-- phasor E2 from tip of E1, at additional angle phi = 60deg -->
  <line x1="309.2" y1="238.4" x2="340.5" y2="61.2" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>
  <!-- dashed extension of E1 direction -->
  <line x1="309.2" y1="238.4" x2="412.6" y2="200.8" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- resultant -->
  <line x1="140" y1="300" x2="340.5" y2="61.2" stroke="#8B0029" stroke-width="3" marker-end="url(#arrR)"/>

  <!-- phi arc at joint -->
  <path d="M360.9,219.6 A 55 55 0 0 0 318.8,184.2" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="356" y="186" font-size="15" font-style="italic" fill="#1a1a1a">φ</text>

  <!-- beta arc at origin (between E1 and resultant) -->
  <path d="M205.8,276.1 A 70 70 0 0 0 185,246.4" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="210" y="252" font-size="14" font-style="italic" fill="#1a1a1a">β = φ/2</text>

  <!-- wt arc at origin (between axis and E1) -->
  <path d="M185,300 A 45 45 0 0 0 182.3,284.6" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="192" y="296" font-size="12.5" font-style="italic" fill="#6B7280">ωt</text>

  <!-- labels -->
  <text x="232" y="289" font-size="14" font-style="italic" fill="#2563EB">E₀</text>
  <text x="344" y="155" font-size="14" font-style="italic" fill="#2563EB">E₀</text>
  <text x="222" y="172" font-size="15" font-style="italic" fill="#8B0029" font-weight="bold" text-anchor="end">E</text>

  <!-- formulas -->
  <text x="60" y="60" font-size="16" fill="#8B0029" font-weight="bold" font-style="italic">E = 2E₀ cos(φ/2)</text>
  <text x="60" y="86" font-size="13.5" fill="#6B7280">두 위상자의 크기가 같으므로</text>
  <text x="60" y="108" font-size="13.5" fill="#6B7280">이등변 삼각형 → β = φ/2</text>
  <text x="60" y="134" font-size="13.5" fill="#1a1a1a" font-style="italic">I ∝ E² = 4E₀² cos²(φ/2)</text>

  <!-- caption -->
  <text x="350" y="392" font-size="14" fill="#6B7280" text-anchor="middle">두 위상자(파랑, 크기 E₀, 사잇각 φ)를 벡터처럼 이으면 합성 위상자(빨강)를 얻는다</text>
</svg>
