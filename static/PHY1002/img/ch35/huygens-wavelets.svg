<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- wavefront at t=0 -->
  <line x1="180" y1="70" x2="180" y2="280" stroke="#8B0029" stroke-width="2.5"/>
  <!-- point sources -->
  <circle cx="180" cy="95" r="4.5" fill="#8B0029"/>
  <circle cx="180" cy="150" r="4.5" fill="#8B0029"/>
  <circle cx="180" cy="205" r="4.5" fill="#8B0029"/>
  <circle cx="180" cy="260" r="4.5" fill="#8B0029"/>

  <!-- secondary wavelets (radius c dt) -->
  <path d="M180,25 A 70 70 0 0 1 180,165" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M180,80 A 70 70 0 0 1 180,220" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M180,135 A 70 70 0 0 1 180,275" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M180,190 A 70 70 0 0 1 180,330" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- new wavefront at t = dt (tangent to wavelets) -->
  <line x1="250" y1="70" x2="250" y2="280" stroke="#2563EB" stroke-width="2.5"/>

  <!-- c dt dimension -->
  <line x1="180" y1="48" x2="250" y2="48" stroke="#6B7280" stroke-width="1" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="215" y="38" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">cΔt</text>

  <!-- propagation arrow -->
  <line x1="295" y1="175" x2="360" y2="175" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="327" y="163" font-size="13" fill="#6B7280" text-anchor="middle">전파 방향</text>

  <!-- labels -->
  <text x="180" y="305" font-size="14" fill="#8B0029" text-anchor="middle">파면 (t = 0)</text>
  <text x="280" y="345" font-size="14" fill="#2563EB" text-anchor="middle">새 파면 (t = Δt)</text>
  <line x1="252" y1="333" x2="250" y2="288" stroke="#6B7280" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- explanation -->
  <text x="400" y="130" font-size="15" fill="#8B0029" font-weight="bold">하위헌스 원리:</text>
  <text x="400" y="158" font-size="14" fill="#1a1a1a">파면 위의 모든 점은 구면</text>
  <text x="400" y="180" font-size="14" fill="#1a1a1a">잔파(wavelet)의 점광원이고,</text>
  <text x="400" y="202" font-size="14" fill="#1a1a1a">시간 Δt 후의 새 파면은</text>
  <text x="400" y="224" font-size="14" fill="#1a1a1a">이 잔파들에 접하는 면이다.</text>
</svg>
