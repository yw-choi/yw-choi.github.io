<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- barrier with two slits -->
  <rect x="147" y="40" width="7" height="156" fill="#6B7280"/>
  <rect x="147" y="204" width="7" height="52" fill="#6B7280"/>
  <rect x="147" y="264" width="7" height="16" fill="#6B7280"/>
  <text x="163" y="190" font-size="14" font-style="italic" fill="#1a1a1a">S₂</text>
  <text x="163" y="278" font-size="14" font-style="italic" fill="#1a1a1a">S₁</text>

  <!-- screen -->
  <rect x="636" y="40" width="7" height="240" fill="#6B7280"/>
  <text x="639" y="300" font-size="13.5" fill="#6B7280" text-anchor="middle">스크린</text>

  <!-- central axis -->
  <line x1="154" y1="230" x2="636" y2="230" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="560" y="248" font-size="12.5" fill="#6B7280">중앙축</text>

  <!-- rays to P -->
  <line x1="154" y1="200" x2="632" y2="81" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>
  <line x1="154" y1="260" x2="632" y2="81" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="380" y="135" font-size="14" font-style="italic" fill="#8B0029">r₂</text>
  <text x="400" y="212" font-size="14" font-style="italic" fill="#8B0029">r₁</text>

  <!-- center line to P (theta reference) -->
  <line x1="154" y1="230" x2="636" y2="80" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- P -->
  <circle cx="639" cy="80" r="5" fill="#8B0029"/>
  <text x="652" y="76" font-size="14" font-style="italic" fill="#1a1a1a">P</text>

  <!-- theta arc -->
  <path d="M224,230 A 70 70 0 0 0 221.4,208.6" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="238" y="222" font-size="14" font-style="italic" fill="#1a1a1a">θ</text>

  <!-- d dimension -->
  <line x1="122" y1="200" x2="145" y2="200" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="122" y1="260" x2="145" y2="260" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="126" y1="200" x2="126" y2="260" stroke="#6B7280" stroke-width="1" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="112" y="235" font-size="14" font-style="italic" fill="#1a1a1a" text-anchor="end">d</text>

  <!-- D dimension -->
  <line x1="154" y1="55" x2="636" y2="55" stroke="#6B7280" stroke-width="1" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="390" y="45" font-size="14" font-style="italic" fill="#1a1a1a" text-anchor="middle">D</text>

  <!-- y dimension -->
  <line x1="646" y1="230" x2="668" y2="230" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="646" y1="80" x2="668" y2="80" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="660" y1="80" x2="660" y2="230" stroke="#6B7280" stroke-width="1" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="674" y="160" font-size="14" font-style="italic" fill="#1a1a1a">y</text>

  <!-- ================= inset: path difference ================= -->
  <rect x="180" y="292" width="420" height="152" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5" rx="6"/>
  <text x="455" y="330" font-size="13" fill="#6B7280">확대: D ≫ d 이면</text>
  <text x="455" y="352" font-size="13" fill="#6B7280">두 광선은 거의 평행</text>

  <!-- slits -->
  <circle cx="250" cy="335" r="3.5" fill="#1a1a1a"/>
  <circle cx="250" cy="425" r="3.5" fill="#1a1a1a"/>
  <text x="240" y="330" font-size="13" font-style="italic" fill="#1a1a1a" text-anchor="end">S₂</text>
  <text x="240" y="437" font-size="13" font-style="italic" fill="#1a1a1a" text-anchor="end">S₁</text>
  <line x1="250" y1="335" x2="250" y2="425" stroke="#6B7280" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- parallel rays at angle theta (20 deg up-right) -->
  <line x1="250" y1="335" x2="353.4" y2="297.4" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>
  <line x1="250" y1="425" x2="438" y2="356.6" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR)"/>

  <!-- wavefront from S2 perpendicular to rays -->
  <line x1="250" y1="335" x2="278.9" y2="414.5" stroke="#2563EB" stroke-width="2"/>
  <!-- right angle mark at b -->
  <path d="M275.5,405.1 L266.1,408.5 L269.5,418" fill="none" stroke="#6B7280" stroke-width="1"/>

  <!-- Delta L thick segment S1 -> b -->
  <line x1="250" y1="425" x2="278.9" y2="414.5" stroke="#8B0029" stroke-width="4.5"/>

  <!-- theta between slit line and wavefront at S2 -->
  <path d="M250,377 A 42 42 0 0 0 264.4,374.5" fill="none" stroke="#6B7280" stroke-width="1"/>
  <line x1="284" y1="383" x2="262" y2="377" stroke="#6B7280" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="288" y="389" font-size="13" font-style="italic" fill="#1a1a1a">θ</text>

  <!-- labels -->
  <text x="296" y="437" font-size="14" fill="#8B0029" font-weight="bold">ΔL = d sin θ  (경로차)</text>
</svg>
