<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="mray5" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B0029"/>
    </marker>
  </defs>

  <!-- ===== Panel (a): concave, p < f ===== -->
  <text x="30" y="32" font-size="14" font-weight="bold" fill="#1a1a1a">(a) 오목거울, 물체가 F 안쪽 (p &lt; f) → 정립·확대 허상 (화장 거울)</text>

  <line x1="310" y1="150" x2="700" y2="150" stroke="#6B7280" stroke-width="1"/>
  <path d="M 466 55 Q 494 150 466 245" fill="none" stroke="#6B7280" stroke-width="2"/>
  <g stroke="#6B7280" stroke-width="1">
    <line x1="470" y1="75"  x2="482" y2="69"/>
    <line x1="475" y1="105" x2="487" y2="99"/>
    <line x1="479" y1="135" x2="491" y2="130"/>
    <line x1="479" y1="165" x2="491" y2="161"/>
    <line x1="475" y1="195" x2="487" y2="191"/>
    <line x1="469" y1="225" x2="481" y2="221"/>
  </g>

  <!-- Ray 1 -->
  <polyline points="440,120 460,120 480,120" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray5)"/>
  <polyline points="480,120 410,155 340,190" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray5)"/>
  <line x1="480" y1="120" x2="600" y2="60" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Ray 2 -->
  <polyline points="440,120 460,90 480,60" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray5)"/>
  <polyline points="480,60 405,60 330,60" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray5)"/>
  <line x1="480" y1="60" x2="600" y2="60" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Ray 4 -->
  <polyline points="440,120 460,135 480,150" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray5)"/>
  <polyline points="480,150 440,180 400,210" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray5)"/>
  <line x1="480" y1="150" x2="600" y2="60" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- points -->
  <circle cx="420" cy="150" r="4" fill="#8B0029"/>
  <text x="413" y="172" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F</text>
  <circle cx="360" cy="150" r="4" fill="#1a1a1a"/>
  <text x="360" y="172" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">C</text>

  <!-- object -->
  <line x1="440" y1="150" x2="440" y2="128" stroke="#2563EB" stroke-width="3"/>
  <polygon points="440,120 434,132 446,132" fill="#2563EB"/>
  <text x="437" y="108" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#2563EB">O</text>

  <!-- virtual image (dashed) -->
  <line x1="600" y1="150" x2="600" y2="70" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="600,60 594,73 606,73" fill="#2563EB" fill-opacity="0.55"/>
  <text x="648" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">허상 <tspan font-style="italic">I</tspan></text>
  <text x="648" y="111" text-anchor="middle" font-size="13" fill="#2563EB">(정립·확대)</text>
  <text x="620" y="222" font-size="12.5" fill="#6B7280">거울 뒤 — 빛이 실제로는</text>
  <text x="620" y="240" font-size="12.5" fill="#6B7280">가지 않는 영역 (i &lt; 0)</text>

  <!-- ===== Panel (b): convex ===== -->
  <text x="30" y="284" font-size="14" font-weight="bold" fill="#1a1a1a">(b) 볼록거울: 물체가 어디에 있든 → 정립·축소 허상 (자동차 사이드미러)</text>

  <line x1="310" y1="390" x2="700" y2="390" stroke="#6B7280" stroke-width="1"/>
  <path d="M 494 300 Q 466 390 494 478" fill="none" stroke="#6B7280" stroke-width="2"/>
  <g stroke="#6B7280" stroke-width="1">
    <line x1="490" y1="318" x2="502" y2="312"/>
    <line x1="484" y1="348" x2="496" y2="342"/>
    <line x1="481" y1="378" x2="493" y2="373"/>
    <line x1="481" y1="408" x2="493" y2="404"/>
    <line x1="486" y1="438" x2="498" y2="434"/>
    <line x1="491" y1="466" x2="503" y2="462"/>
  </g>

  <!-- Ray 1 -->
  <polyline points="390,340 435,340 480,340" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray5)"/>
  <polyline points="480,340 453,317.5 426,295" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray5)"/>
  <line x1="480" y1="340" x2="552" y2="400" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Ray 2 -->
  <polyline points="390,340 435,355 480,370" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray5)"/>
  <polyline points="480,370 405,370 330,370" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray5)"/>
  <line x1="480" y1="370" x2="560" y2="370" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Ray 4 -->
  <polyline points="390,340 435,365 480,390" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray5)"/>
  <polyline points="480,390 440,412 400,434" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray5)"/>
  <line x1="480" y1="390" x2="552" y2="350" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- points behind mirror -->
  <circle cx="540" cy="390" r="4" fill="#8B0029"/>
  <text x="540" y="412" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F</text>
  <circle cx="600" cy="390" r="4" fill="#1a1a1a"/>
  <text x="600" y="412" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">C</text>

  <!-- object -->
  <line x1="390" y1="390" x2="390" y2="348" stroke="#2563EB" stroke-width="3"/>
  <polygon points="390,340 384,352 396,352" fill="#2563EB"/>
  <text x="390" y="326" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#2563EB">O</text>

  <!-- virtual image (dashed) -->
  <line x1="516" y1="390" x2="516" y2="378" stroke="#2563EB" stroke-width="3" stroke-dasharray="5 3"/>
  <polygon points="516,370 510,381 522,381" fill="#2563EB" fill-opacity="0.55"/>
  <text x="641" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">허상 <tspan font-style="italic">I</tspan> (정립·축소)</text>

  <text x="620" y="450" font-size="12.5" fill="#6B7280">시야가 넓어지는 대신 상이 작다</text>
  <text x="620" y="468" font-size="12.5" fill="#6B7280">— "사물이 보이는 것보다 가까이 있음"</text>
</svg>
