<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="mray" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="mdim" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="380" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">평면거울: 반사 광선의 연장선이 만나는 곳에 허상이 생긴다</text>

  <!-- mirror -->
  <line x1="430" y1="60" x2="430" y2="360" stroke="#6B7280" stroke-width="2"/>
  <!-- hatching behind mirror -->
  <g stroke="#6B7280" stroke-width="1">
    <line x1="430" y1="75"  x2="442" y2="63"/>
    <line x1="430" y1="105" x2="442" y2="93"/>
    <line x1="430" y1="135" x2="442" y2="123"/>
    <line x1="430" y1="165" x2="442" y2="153"/>
    <line x1="430" y1="195" x2="442" y2="183"/>
    <line x1="430" y1="225" x2="442" y2="213"/>
    <line x1="430" y1="255" x2="442" y2="243"/>
    <line x1="430" y1="285" x2="442" y2="273"/>
    <line x1="430" y1="315" x2="442" y2="303"/>
    <line x1="430" y1="345" x2="442" y2="333"/>
  </g>
  <text x="430" y="380" text-anchor="middle" font-size="14" fill="#6B7280">거울</text>

  <!-- central axis O - I -->
  <line x1="150" y1="210" x2="710" y2="210" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- rays: upper -->
  <polyline points="150,210 290,175 430,140" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray)"/>
  <polyline points="430,140 340,95 250,50" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray)"/>
  <line x1="430" y1="140" x2="710" y2="210" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- rays: perpendicular (drawn slightly above axis for clarity of arrows) -->
  <polyline points="150,210 290,210 428,210" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray)"/>
  <polyline points="428,214 330,214 232,214" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray)"/>

  <!-- rays: lower -->
  <polyline points="150,210 290,245 430,280" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray)"/>
  <polyline points="430,280 392,299 354,318" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray)"/>
  <line x1="430" y1="280" x2="710" y2="210" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- object and image points -->
  <circle cx="150" cy="210" r="5" fill="#2563EB"/>
  <text x="132" y="215" text-anchor="end" font-size="14" font-weight="bold" fill="#2563EB" font-style="italic">O</text>
  <text x="98" y="236" text-anchor="start" font-size="13" fill="#2563EB">물체(점광원)</text>

  <circle cx="710" cy="210" r="5" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="728" y="215" text-anchor="start" font-size="14" font-weight="bold" fill="#2563EB" font-style="italic">I</text>
  <text x="668" y="236" text-anchor="start" font-size="13" fill="#2563EB">허상</text>

  <!-- dimension lines -->
  <line x1="150" y1="330" x2="430" y2="330" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim)" marker-end="url(#mdim)"/>
  <text x="290" y="352" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">p</text>
  <line x1="430" y1="330" x2="710" y2="330" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim)" marker-end="url(#mdim)"/>
  <text x="570" y="352" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">i</text>
  <line x1="150" y1="218" x2="150" y2="336" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="710" y1="218" x2="710" y2="336" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- note -->
  <text x="592" y="120" text-anchor="middle" font-size="13" fill="#6B7280">반사 광선의 뒤쪽 연장선이</text>
  <text x="592" y="139" text-anchor="middle" font-size="13" fill="#6B7280">한 점 I 에서 만난다</text>
</svg>
