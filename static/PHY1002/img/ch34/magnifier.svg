<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="mray11" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="mdim11" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- ===== Panel (a): naked eye at near point ===== -->
  <text x="30" y="32" font-size="14" font-weight="bold" fill="#1a1a1a">(a) 맨눈: 물체를 근점(25 cm)까지 당겨 볼 때 시야각 θ가 최대</text>

  <line x1="380" y1="140" x2="740" y2="140" stroke="#6B7280" stroke-width="1"/>

  <!-- eye -->
  <circle cx="716" cy="140" r="20" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <circle cx="698" cy="140" r="5" fill="#6B7280"/>

  <!-- object -->
  <line x1="430" y1="140" x2="430" y2="103" stroke="#2563EB" stroke-width="3"/>
  <polygon points="430,95 424,107 436,107" fill="#2563EB"/>
  <text x="430" y="80" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#2563EB">O</text>
  <text x="413" y="122" text-anchor="middle" font-size="13" font-style="italic" fill="#2563EB">h</text>

  <!-- ray from tip to eye -->
  <polyline points="430,95 563,116 696,137" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray11)"/>

  <!-- angle -->
  <path d="M 638 140 A 60 60 0 0 1 638.8 130.1" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="620" y="128" font-size="14" font-style="italic" fill="#2563EB">θ</text>

  <!-- dimension -->
  <line x1="430" y1="180" x2="698" y2="180" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim11)" marker-end="url(#mdim11)"/>
  <text x="564" y="174" text-anchor="middle" font-size="13" fill="#6B7280">25 cm (근점 거리)</text>
  <line x1="430" y1="146" x2="430" y2="186" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="698" y1="150" x2="698" y2="186" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== Panel (b): magnifying lens ===== -->
  <text x="30" y="232" font-size="14" font-weight="bold" fill="#1a1a1a">(b) 확대경: 물체를 초점 안쪽(p ≲ f)에 두면 멀리 있는 큰 허상을 본다</text>

  <line x1="380" y1="360" x2="740" y2="360" stroke="#6B7280" stroke-width="1"/>

  <!-- eye -->
  <circle cx="716" cy="360" r="20" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <circle cx="698" cy="360" r="5" fill="#6B7280"/>

  <!-- lens -->
  <path d="M 560 302 C 576 340 576 380 560 418 C 544 380 544 340 560 302 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- object -->
  <line x1="515" y1="360" x2="515" y2="338" stroke="#2563EB" stroke-width="3"/>
  <polygon points="515,330 509,342 521,342" fill="#2563EB"/>
  <text x="515" y="384" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#2563EB">O</text>

  <!-- rays -->
  <polyline points="515,330 537.5,322 560,314" fill="none" stroke="#8B0029" stroke-width="2.5"/>
  <polyline points="560,314 630,330 700,346" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray11)"/>
  <line x1="457" y1="291" x2="560" y2="314" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polyline points="515,330 537.5,328.5 560,327" fill="none" stroke="#8B0029" stroke-width="2.5"/>
  <polyline points="560,327 630,351.5 700,376" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray11)"/>
  <line x1="457" y1="291" x2="560" y2="327" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- virtual image -->
  <line x1="457" y1="360" x2="457" y2="301" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="457,291 451,304 463,304" fill="#2563EB" fill-opacity="0.55"/>
  <text x="430" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">확대 허상 <tspan font-style="italic">I</tspan></text>

  <!-- angle -->
  <path d="M 643 360 A 55 55 0 0 1 645.1 344.9" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="622" y="342" font-size="14" font-style="italic" fill="#2563EB">θ′</text>
  <text x="640" y="304" font-size="13" fill="#6B7280">θ′ &gt; θ → 더 크게 보인다</text>

  <!-- focus -->
  <circle cx="480" cy="360" r="4" fill="#8B0029"/>
  <text x="480" y="382" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F₁</text>

  <!-- dimension -->
  <line x1="480" y1="430" x2="560" y2="430" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim11)" marker-end="url(#mdim11)"/>
  <text x="520" y="424" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">f</text>
  <line x1="480" y1="388" x2="480" y2="436" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="560" y1="422" x2="560" y2="436" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
