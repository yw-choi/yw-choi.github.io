<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="mdim10" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="15" font-weight="bold" fill="#1a1a1a">두 렌즈 조합: 렌즈 1의 상 I₁이 렌즈 2의 물체가 된다</text>
  <text x="30" y="62" font-size="13" fill="#1a1a1a">① 렌즈 2를 가리고 렌즈 1만 계산 → 상 I₁ (여기서는 허상)</text>
  <text x="30" y="84" font-size="13" fill="#1a1a1a">② 렌즈 1을 가리고, I₁을 물체 삼아 렌즈 2를 계산 → 최종 상 I₂,  전체 배율 M = m₁m₂</text>

  <!-- axis -->
  <line x1="60" y1="230" x2="730" y2="230" stroke="#6B7280" stroke-width="1"/>

  <!-- lenses -->
  <path d="M 230 160 C 248 205 248 255 230 300 C 212 255 212 205 230 160 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="222" y="146" text-anchor="middle" font-size="13.5" fill="#1a1a1a">렌즈 1 (<tspan font-style="italic">f</tspan>₁ = +24 cm)</text>
  <path d="M 380 150 C 400 203 400 257 380 310 C 360 257 360 203 380 150 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="404" y="136" text-anchor="middle" font-size="13.5" fill="#1a1a1a">렌즈 2 (<tspan font-style="italic">f</tspan>₂ = +9.0 cm)</text>

  <!-- object -->
  <line x1="140" y1="230" x2="140" y2="208" stroke="#2563EB" stroke-width="3"/>
  <polygon points="140,200 134,212 146,212" fill="#2563EB"/>
  <text x="152" y="182" font-size="14" font-weight="bold" fill="#2563EB">물체 <tspan font-style="italic">O</tspan></text>

  <!-- virtual image I1 -->
  <line x1="110" y1="230" x2="110" y2="200" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="110,190 104,203 116,203" fill="#2563EB" fill-opacity="0.55"/>
  <text x="90" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB"><tspan font-style="italic">I</tspan>₁ (허상)</text>

  <!-- final image I2 (real, inverted) -->
  <line x1="650" y1="230" x2="650" y2="262" stroke="#2563EB" stroke-width="3"/>
  <polygon points="650,270 644,258 656,258" fill="#2563EB"/>
  <text x="650" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB"><tspan font-style="italic">I</tspan>₂ (실상·도립)</text>

  <!-- dimensions row 1 -->
  <line x1="140" y1="340" x2="230" y2="340" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim10)" marker-end="url(#mdim10)"/>
  <text x="185" y="334" text-anchor="middle" font-size="13" fill="#6B7280"><tspan font-style="italic">p</tspan>₁</text>
  <line x1="230" y1="340" x2="380" y2="340" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim10)" marker-end="url(#mdim10)"/>
  <text x="305" y="334" text-anchor="middle" font-size="13" fill="#6B7280"><tspan font-style="italic">L</tspan></text>
  <line x1="380" y1="340" x2="650" y2="340" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim10)" marker-end="url(#mdim10)"/>
  <text x="515" y="334" text-anchor="middle" font-size="13" fill="#6B7280"><tspan font-style="italic">i</tspan>₂</text>

  <!-- dimensions row 2 -->
  <line x1="110" y1="368" x2="230" y2="368" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim10)" marker-end="url(#mdim10)"/>
  <text x="170" y="362" text-anchor="middle" font-size="13" fill="#6B7280">|<tspan font-style="italic">i</tspan>₁|</text>

  <!-- dimensions row 3 -->
  <line x1="110" y1="396" x2="380" y2="396" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim10)" marker-end="url(#mdim10)"/>
  <text x="250" y="390" text-anchor="middle" font-size="13" fill="#6B7280"><tspan font-style="italic">p</tspan>₂ = <tspan font-style="italic">L</tspan> + |<tspan font-style="italic">i</tspan>₁|</text>

  <!-- drop lines -->
  <line x1="140" y1="236" x2="140" y2="346" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="110" y1="236" x2="110" y2="402" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="230" y1="306" x2="230" y2="402" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="380" y1="316" x2="380" y2="402" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="650" y1="276" x2="650" y2="346" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
