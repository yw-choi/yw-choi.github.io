<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="mray7" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="mdim7" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- ===== Panel A: converging lens ===== -->
  <text x="200" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">수렴 렌즈 (f &gt; 0)</text>

  <line x1="40" y1="190" x2="380" y2="190" stroke="#6B7280" stroke-width="1"/>
  <path d="M 210 70 C 232 130 232 250 210 310 C 188 250 188 130 210 70 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- parallel rays -->
  <polyline points="48,120 129,120 210,120" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray7)"/>
  <polyline points="48,260 129,260 210,260" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray7)"/>
  <line x1="48" y1="190" x2="370" y2="190" stroke="#8B0029" stroke-width="1.5" opacity="0.5"/>
  <!-- refracted through F2 -->
  <polyline points="210,120 255,155 300,190 370,244.4" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray7)"/>
  <polyline points="210,260 255,225 300,190 370,135.6" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray7)"/>

  <!-- foci -->
  <circle cx="120" cy="190" r="4" fill="#8B0029"/>
  <text x="120" y="213" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F₁</text>
  <circle cx="300" cy="190" r="4" fill="#8B0029"/>
  <text x="315" y="213" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F₂</text>
  <text x="300" y="94" text-anchor="middle" font-size="13" fill="#6B7280">굴절 광선이 F₂에</text>
  <text x="300" y="112" text-anchor="middle" font-size="13" fill="#6B7280">실제로 모인다 (실초점)</text>

  <!-- dimension -->
  <line x1="210" y1="340" x2="300" y2="340" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim7)" marker-end="url(#mdim7)"/>
  <text x="255" y="334" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">f</text>
  <line x1="210" y1="316" x2="210" y2="346" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="300" y1="196" x2="300" y2="346" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== Panel B: diverging lens ===== -->
  <text x="600" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">발산 렌즈 (f &lt; 0)</text>

  <line x1="430" y1="190" x2="770" y2="190" stroke="#6B7280" stroke-width="1"/>
  <path d="M 576 70 L 604 70 Q 584 190 604 310 L 576 310 Q 596 190 576 70 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- parallel rays -->
  <polyline points="430,120 510,120 590,120" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray7)"/>
  <polyline points="430,260 510,260 590,260" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray7)"/>
  <line x1="430" y1="190" x2="760" y2="190" stroke="#8B0029" stroke-width="1.5" opacity="0.5"/>
  <!-- refracted: diverging -->
  <polyline points="590,120 633,86.5 676,53" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray7)"/>
  <polyline points="590,260 633,293.5 676,327" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray7)"/>
  <!-- backward extensions -->
  <line x1="590" y1="120" x2="500" y2="190" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="590" y1="260" x2="500" y2="190" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- foci -->
  <circle cx="500" cy="190" r="4" fill="#8B0029"/>
  <text x="486" y="213" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F₂</text>
  <circle cx="680" cy="190" r="4" fill="#8B0029"/>
  <text x="680" y="213" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F₁</text>
  <text x="486" y="94" text-anchor="middle" font-size="13" fill="#6B7280">연장선이 F₂에서 나온</text>
  <text x="486" y="112" text-anchor="middle" font-size="13" fill="#6B7280">것처럼 보인다 (허초점)</text>

  <!-- dimension -->
  <line x1="500" y1="340" x2="590" y2="340" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim7)" marker-end="url(#mdim7)"/>
  <text x="545" y="334" text-anchor="middle" font-size="13" fill="#6B7280">|<tspan font-style="italic">f</tspan>|</text>
  <line x1="500" y1="196" x2="500" y2="346" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="590" y1="316" x2="590" y2="346" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
