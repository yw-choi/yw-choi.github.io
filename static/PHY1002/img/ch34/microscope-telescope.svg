<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="mray12" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="mdim12" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- ===== Panel (a): compound microscope ===== -->
  <text x="30" y="32" font-size="14" font-weight="bold" fill="#1a1a1a">(a) 복합 현미경: 대물렌즈의 확대 실상을 접안렌즈(확대경)로 다시 확대</text>

  <line x1="100" y1="155" x2="762" y2="155" stroke="#6B7280" stroke-width="1"/>

  <!-- objective -->
  <path d="M 200 120 C 212 145 212 165 200 190 C 188 165 188 145 200 120 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="185" y="108" text-anchor="middle" font-size="13" fill="#1a1a1a">대물렌즈</text>

  <!-- eyepiece -->
  <path d="M 560 97 C 575 135 575 175 560 213 C 545 175 545 135 560 97 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="566" y="88" text-anchor="middle" font-size="13" fill="#1a1a1a">접안렌즈</text>

  <!-- eye -->
  <circle cx="740" cy="155" r="18" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <circle cx="723" cy="155" r="4.5" fill="#6B7280"/>

  <!-- object -->
  <line x1="160" y1="155" x2="160" y2="146" stroke="#2563EB" stroke-width="3"/>
  <polygon points="160,141 155,150 165,150" fill="#2563EB"/>
  <text x="148" y="130" text-anchor="middle" font-size="13" fill="#2563EB">물체</text>

  <!-- rays object -> objective -> intermediate image -->
  <polyline points="160,143 180,135.5 200,128" fill="none" stroke="#8B0029" stroke-width="2.5"/>
  <polyline points="200,128 350,161.5 500,195" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray12)"/>
  <polyline points="160,143 180,156.5 200,170" fill="none" stroke="#8B0029" stroke-width="2.5"/>
  <polyline points="200,170 350,182.5 500,195" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray12)"/>

  <!-- rays through eyepiece, exiting parallel -->
  <polyline points="500,195 530,201.5 560,208" fill="none" stroke="#8B0029" stroke-width="2.5"/>
  <polyline points="560,208 640,185.5 720,163" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray12)"/>
  <polyline points="500,195 530,197.5 560,200" fill="none" stroke="#8B0029" stroke-width="2.5"/>
  <polyline points="560,200 638,178 716,156" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray12)"/>
  <!-- backward extension toward distant virtual image -->
  <line x1="560" y1="204" x2="436" y2="239" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="330" y="243" text-anchor="middle" font-size="12.5" fill="#6B7280">최종 허상 I′은 먼 곳에 (도립)</text>

  <!-- intermediate image -->
  <line x1="500" y1="155" x2="500" y2="187" stroke="#2563EB" stroke-width="3"/>
  <polygon points="500,195 494,183 506,183" fill="#2563EB"/>
  <text x="468" y="216" text-anchor="middle" font-size="13" fill="#2563EB">중간 실상 <tspan font-style="italic">I</tspan></text>

  <!-- focal points -->
  <circle cx="240" cy="155" r="3.5" fill="#8B0029"/>
  <text x="240" y="192" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8B0029">F₂</text>
  <circle cx="495" cy="155" r="3.5" fill="#8B0029"/>
  <text x="486" y="147" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8B0029">F₁′</text>

  <!-- tube length -->
  <line x1="240" y1="70" x2="495" y2="70" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim12)" marker-end="url(#mdim12)"/>
  <text x="368" y="62" text-anchor="middle" font-size="13" fill="#6B7280">경통 길이 <tspan font-style="italic">s</tspan></text>
  <line x1="240" y1="76" x2="240" y2="148" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="495" y1="76" x2="495" y2="148" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== Panel (b): refracting telescope ===== -->
  <text x="30" y="278" font-size="14" font-weight="bold" fill="#1a1a1a">(b) 굴절 망원경: 대물렌즈의 초점과 접안렌즈의 초점이 겹친다 (경통 간격 = f_ob + f_ey)</text>

  <line x1="60" y1="400" x2="762" y2="400" stroke="#6B7280" stroke-width="1"/>

  <!-- objective -->
  <path d="M 180 338 C 196 380 196 420 180 462 C 164 420 164 380 180 338 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="180" y="328" text-anchor="middle" font-size="13" fill="#1a1a1a">대물렌즈</text>

  <!-- eyepiece -->
  <path d="M 560 345 C 572 382 572 418 560 455 C 548 418 548 382 560 345 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="560" y="336" text-anchor="middle" font-size="13" fill="#1a1a1a">접안렌즈</text>

  <!-- eye -->
  <circle cx="745" cy="422" r="18" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <circle cx="728" cy="422" r="4.5" fill="#6B7280"/>

  <!-- incoming parallel rays -->
  <text x="110" y="298" text-anchor="middle" font-size="12.5" fill="#6B7280">먼 물체에서 온 평행 광선</text>
  <polyline points="40,343 110,347.5 180,352" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray12)"/>
  <polyline points="40,365 110,369.5 180,374" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray12)"/>

  <!-- converge to common focal plane -->
  <polyline points="180,352 305,384 430,416" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray12)"/>
  <polyline points="180,374 305,395 430,416" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray12)"/>

  <!-- diverge to eyepiece, exit parallel -->
  <polyline points="430,416 495,433.5 560,451" fill="none" stroke="#8B0029" stroke-width="2.5"/>
  <polyline points="560,451 650,440 740,429" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray12)"/>
  <polyline points="430,416 495,427 560,438" fill="none" stroke="#8B0029" stroke-width="2.5"/>
  <polyline points="560,438 650,427 740,416" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray12)"/>

  <!-- common focal plane -->
  <line x1="430" y1="375" x2="430" y2="435" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="430" cy="400" r="3.5" fill="#8B0029"/>
  <text x="430" y="366" text-anchor="middle" font-size="12.5" fill="#8B0029">F₂ = F₁′ (공통 초점)</text>
  <line x1="430" y1="400" x2="430" y2="411" stroke="#2563EB" stroke-width="3"/>
  <polygon points="430,417 425,408 435,408" fill="#2563EB"/>
  <text x="404" y="438" text-anchor="middle" font-size="13" fill="#2563EB">실상 <tspan font-style="italic">I</tspan></text>

  <!-- dimensions -->
  <line x1="180" y1="474" x2="430" y2="474" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim12)" marker-end="url(#mdim12)"/>
  <text x="305" y="468" text-anchor="middle" font-size="13" fill="#6B7280"><tspan font-style="italic">f</tspan><tspan font-size="10">ob</tspan></text>
  <line x1="430" y1="474" x2="560" y2="474" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim12)" marker-end="url(#mdim12)"/>
  <text x="497" y="468" text-anchor="middle" font-size="13" fill="#6B7280"><tspan font-style="italic">f</tspan><tspan font-size="10">ey</tspan></text>
  <line x1="180" y1="466" x2="180" y2="480" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="430" y1="440" x2="430" y2="480" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="560" y1="459" x2="560" y2="480" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
