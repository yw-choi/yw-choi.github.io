<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="mray4" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="mdim4" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="380" y="35" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">오목거울: 물체가 초점 밖 (p &gt; f) → 도립 실상</text>

  <!-- axis -->
  <line x1="30" y1="240" x2="640" y2="240" stroke="#6B7280" stroke-width="1"/>

  <!-- mirror arc, vertex ~(600,240) -->
  <path d="M 586 100 Q 614 240 586 380" fill="none" stroke="#6B7280" stroke-width="2"/>
  <g stroke="#6B7280" stroke-width="1">
    <line x1="591" y1="120" x2="603" y2="113"/>
    <line x1="596" y1="155" x2="608" y2="148"/>
    <line x1="599" y1="190" x2="611" y2="184"/>
    <line x1="600" y1="225" x2="612" y2="220"/>
    <line x1="600" y1="260" x2="612" y2="256"/>
    <line x1="598" y1="295" x2="610" y2="291"/>
    <line x1="594" y1="330" x2="606" y2="326"/>
    <line x1="589" y1="365" x2="601" y2="361"/>
  </g>

  <!-- Ray 1: parallel in, reflect through F -->
  <polyline points="450,180 525,180 600,180" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray4)"/>
  <polyline points="600,180 530,250 460,320" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray4)"/>
  <text x="572" y="168" font-size="13" font-weight="bold" fill="#8B0029">1</text>

  <!-- Ray 2: through F, reflect parallel -->
  <polyline points="450,180 525,230 600,280" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray4)"/>
  <polyline points="600,280 515,280 430,280" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray4)"/>
  <text x="436" y="272" font-size="13" font-weight="bold" fill="#8B0029">2</text>

  <!-- Ray 4: to vertex, symmetric reflection -->
  <polyline points="450,180 525,210 600,240" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray4)"/>
  <polyline points="600,240 530,268 460,296" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray4)"/>
  <text x="466" y="310" font-size="13" font-weight="bold" fill="#8B0029">4</text>

  <!-- C and F -->
  <circle cx="480" cy="240" r="4" fill="#1a1a1a"/>
  <text x="480" y="262" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">C</text>
  <circle cx="540" cy="240" r="4" fill="#8B0029"/>
  <text x="552" y="231" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">F</text>

  <!-- object arrow -->
  <line x1="450" y1="240" x2="450" y2="188" stroke="#2563EB" stroke-width="3"/>
  <polygon points="450,180 444,192 456,192" fill="#2563EB"/>
  <text x="450" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB"><tspan font-style="italic">O</tspan> 물체</text>

  <!-- image arrow (inverted, real) -->
  <line x1="500" y1="240" x2="500" y2="272" stroke="#2563EB" stroke-width="3"/>
  <polygon points="500,280 494,268 506,268" fill="#2563EB"/>
  <text x="536" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB"><tspan font-style="italic">I</tspan> 실상 (도립)</text>

  <!-- dimensions -->
  <line x1="450" y1="350" x2="600" y2="350" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim4)" marker-end="url(#mdim4)"/>
  <text x="518" y="344" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">p</text>
  <line x1="500" y1="382" x2="600" y2="382" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim4)" marker-end="url(#mdim4)"/>
  <text x="544" y="376" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">i</text>
  <line x1="450" y1="246" x2="450" y2="356" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="500" y1="286" x2="500" y2="388" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="600" y1="246" x2="600" y2="388" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- note -->
  <text x="130" y="120" font-size="13" fill="#6B7280">반사 광선이 실제로 한 점에</text>
  <text x="130" y="139" font-size="13" fill="#6B7280">모인다 → 스크린에 맺을 수</text>
  <text x="130" y="158" font-size="13" fill="#6B7280">있는 실상 (i &gt; 0)</text>
</svg>
