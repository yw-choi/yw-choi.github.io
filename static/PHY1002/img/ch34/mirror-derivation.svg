<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="mray3" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="mdim3" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- ===== Panel (a): mirror formula geometry ===== -->
  <text x="30" y="34" font-size="14" font-weight="bold" fill="#1a1a1a">(a) 거울 공식의 유도: 점물체 O의 상 I</text>

  <!-- axis -->
  <line x1="230" y1="120" x2="660" y2="120" stroke="#6B7280" stroke-width="1"/>
  <!-- mirror arc, vertex c ~ (620,120) -->
  <path d="M 600 35 Q 640 120 600 205" fill="none" stroke="#6B7280" stroke-width="2"/>
  <text x="634" y="140" font-size="13" font-style="italic" fill="#6B7280">c</text>

  <!-- incident ray O -> a -->
  <polyline points="260,120 435,90 610,60" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray3)"/>
  <!-- reflected ray a -> I, extended -->
  <polyline points="610,60 525,90 440,120 400,135" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray3)"/>
  <!-- axial ray O -> c -->
  <polyline points="260,120 440,120 618,120" fill="none" stroke="#8B0029" stroke-width="1.5" opacity="0.55"/>

  <!-- normal line a - C (dashed) -->
  <line x1="610" y1="60" x2="380" y2="120" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- angle arcs -->
  <path d="M 302 120 A 42 42 0 0 0 301.4 112.9" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="316" y="111" font-size="14" font-style="italic" fill="#2563EB">α</text>
  <path d="M 420 120 A 40 40 0 0 0 418.7 109.9" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="431" y="105" font-size="14" font-style="italic" fill="#2563EB">β</text>
  <path d="M 474 120 A 34 34 0 0 0 472.1 108.7" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="487" y="102" font-size="14" font-style="italic" fill="#2563EB">γ</text>

  <!-- points -->
  <circle cx="260" cy="120" r="4.5" fill="#2563EB"/>
  <text x="256" y="143" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#2563EB">O</text>
  <circle cx="380" cy="120" r="4" fill="#1a1a1a"/>
  <text x="378" y="143" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">C</text>
  <circle cx="440" cy="120" r="4.5" fill="#2563EB"/>
  <text x="447" y="143" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#2563EB">I</text>
  <text x="618" y="52" text-anchor="middle" font-size="14" font-style="italic" fill="#8B0029">a</text>

  <!-- dimensions -->
  <line x1="260" y1="185" x2="620" y2="185" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim3)" marker-end="url(#mdim3)"/>
  <text x="330" y="180" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">p</text>
  <line x1="440" y1="209" x2="620" y2="209" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim3)" marker-end="url(#mdim3)"/>
  <text x="500" y="204" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">i</text>
  <line x1="380" y1="233" x2="620" y2="233" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim3)" marker-end="url(#mdim3)"/>
  <text x="420" y="228" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">r</text>
  <line x1="260" y1="126" x2="260" y2="191" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="440" y1="126" x2="440" y2="215" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="380" y1="126" x2="380" y2="239" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="620" y1="126" x2="620" y2="239" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== Panel (b): magnification geometry ===== -->
  <text x="30" y="292" font-size="14" font-weight="bold" fill="#1a1a1a">(b) 배율의 유도: 꼭짓점 c에 부딪히는 광선 (입사각 = 반사각)</text>

  <!-- axis -->
  <line x1="240" y1="380" x2="660" y2="380" stroke="#6B7280" stroke-width="1"/>
  <!-- mirror arc, vertex c ~ (620,380) -->
  <path d="M 604 310 Q 640 380 604 450" fill="none" stroke="#6B7280" stroke-width="2"/>

  <!-- object arrow a->b -->
  <line x1="300" y1="380" x2="300" y2="328" stroke="#2563EB" stroke-width="3"/>
  <polygon points="300,320 294,332 306,332" fill="#2563EB"/>
  <text x="300" y="311" text-anchor="middle" font-size="14" font-style="italic" fill="#2563EB">b</text>
  <text x="288" y="399" text-anchor="middle" font-size="14" font-style="italic" fill="#2563EB">a</text>
  <text x="270" y="356" text-anchor="middle" font-size="13" font-style="italic" fill="#2563EB">h</text>

  <!-- image arrow d->e (inverted) -->
  <line x1="428" y1="380" x2="428" y2="408" stroke="#2563EB" stroke-width="3"/>
  <polygon points="428,416 422,404 434,404" fill="#2563EB"/>
  <text x="428" y="371" text-anchor="middle" font-size="14" font-style="italic" fill="#2563EB">d</text>
  <text x="446" y="424" text-anchor="middle" font-size="14" font-style="italic" fill="#2563EB">e</text>
  <text x="410" y="404" text-anchor="middle" font-size="13" font-style="italic" fill="#2563EB">h′</text>

  <!-- ray b -> c -->
  <polyline points="300,320 460,350 620,380" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray3)"/>
  <!-- reflected c -> e, extended -->
  <polyline points="620,380 524,398 380,425" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray3)"/>

  <!-- equal angle labels at c -->
  <text x="566" y="372" font-size="13" font-style="italic" fill="#2563EB">θ</text>
  <text x="566" y="412" font-size="13" font-style="italic" fill="#2563EB">θ</text>
  <text x="622" y="402" font-size="13" font-style="italic" fill="#6B7280">c</text>

  <!-- dimensions -->
  <line x1="428" y1="438" x2="620" y2="438" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim3)" marker-end="url(#mdim3)"/>
  <text x="540" y="432" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">i</text>
  <line x1="300" y1="464" x2="620" y2="464" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim3)" marker-end="url(#mdim3)"/>
  <text x="350" y="458" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">p</text>
  <line x1="300" y1="386" x2="300" y2="470" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="428" y1="422" x2="428" y2="444" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="620" y1="386" x2="620" y2="470" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
