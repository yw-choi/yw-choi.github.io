<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="mray2" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="mdim2" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- ===== Panel A: concave ===== -->
  <text x="200" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">오목거울: 실초점 (f &gt; 0)</text>

  <!-- axis -->
  <line x1="40" y1="180" x2="360" y2="180" stroke="#6B7280" stroke-width="1"/>
  <!-- mirror arc (vertex ~x=325) -->
  <path d="M 305 60 Q 345 180 305 300" fill="none" stroke="#6B7280" stroke-width="2"/>
  <g stroke="#6B7280" stroke-width="1">
    <line x1="308" y1="80"  x2="320" y2="72"/>
    <line x1="315" y1="110" x2="327" y2="102"/>
    <line x1="320" y1="140" x2="332" y2="132"/>
    <line x1="322" y1="170" x2="334" y2="164"/>
    <line x1="322" y1="200" x2="334" y2="196"/>
    <line x1="318" y1="230" x2="330" y2="224"/>
    <line x1="312" y1="260" x2="324" y2="254"/>
    <line x1="306" y1="290" x2="318" y2="284"/>
  </g>

  <!-- parallel rays in -->
  <polyline points="48,120 182,120 317,120" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray2)"/>
  <polyline points="48,240 182,240 317,240" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray2)"/>
  <!-- reflected through F -->
  <polyline points="317,120 288.5,150 260,180 200,243" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray2)"/>
  <polyline points="317,240 288.5,210 260,180 200,117" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray2)"/>

  <!-- C and F -->
  <circle cx="190" cy="180" r="4" fill="#1a1a1a"/>
  <text x="190" y="204" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">C</text>
  <circle cx="260" cy="180" r="4" fill="#8B0029"/>
  <text x="263" y="204" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F</text>
  <text x="240" y="98" text-anchor="middle" font-size="13" fill="#8B0029">반사광이 실제로 모인다</text>

  <!-- dimensions -->
  <line x1="260" y1="322" x2="325" y2="322" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim2)" marker-end="url(#mdim2)"/>
  <text x="292" y="340" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">f</text>
  <line x1="190" y1="352" x2="325" y2="352" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim2)" marker-end="url(#mdim2)"/>
  <text x="258" y="370" text-anchor="middle" font-size="13" fill="#6B7280"><tspan font-style="italic">r</tspan> = 2<tspan font-style="italic">f</tspan></text>
  <line x1="260" y1="186" x2="260" y2="328" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="190" y1="186" x2="190" y2="358" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="325" y1="186" x2="325" y2="358" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== Panel B: convex ===== -->
  <text x="600" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">볼록거울: 허초점 (f &lt; 0)</text>

  <!-- axis -->
  <line x1="440" y1="180" x2="770" y2="180" stroke="#6B7280" stroke-width="1"/>
  <!-- mirror arc (vertex ~x=485) -->
  <path d="M 505 60 Q 465 180 505 300" fill="none" stroke="#6B7280" stroke-width="2"/>
  <g stroke="#6B7280" stroke-width="1">
    <line x1="502" y1="80"  x2="514" y2="74"/>
    <line x1="495" y1="110" x2="507" y2="104"/>
    <line x1="490" y1="140" x2="502" y2="134"/>
    <line x1="488" y1="170" x2="500" y2="164"/>
    <line x1="488" y1="200" x2="500" y2="196"/>
    <line x1="492" y1="230" x2="504" y2="226"/>
    <line x1="497" y1="260" x2="509" y2="256"/>
    <line x1="504" y1="290" x2="516" y2="286"/>
  </g>

  <!-- parallel rays in -->
  <polyline points="440,120 468.5,120 497,120" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray2)"/>
  <polyline points="440,240 468.5,240 497,240" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray2)"/>
  <!-- reflected: diverging, as if from F behind -->
  <polyline points="497,120 468.5,90.5 440,61" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray2)"/>
  <polyline points="497,240 468.5,269.5 440,299" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray2)"/>
  <!-- backward extensions to virtual focus -->
  <line x1="497" y1="120" x2="555" y2="180" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="497" y1="240" x2="555" y2="180" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- F and C (behind mirror) -->
  <circle cx="555" cy="180" r="4" fill="#8B0029"/>
  <text x="558" y="204" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F</text>
  <circle cx="625" cy="180" r="4" fill="#1a1a1a"/>
  <text x="625" y="204" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">C</text>
  <text x="648" y="98" text-anchor="middle" font-size="13" fill="#6B7280">연장선이 만나는 점처럼</text>
  <text x="648" y="117" text-anchor="middle" font-size="13" fill="#6B7280">보일 뿐 — 빛은 안 모인다</text>

  <!-- dimensions -->
  <line x1="485" y1="322" x2="555" y2="322" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim2)" marker-end="url(#mdim2)"/>
  <text x="520" y="340" text-anchor="middle" font-size="13" fill="#6B7280">|<tspan font-style="italic">f</tspan>|</text>
  <line x1="485" y1="352" x2="625" y2="352" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim2)" marker-end="url(#mdim2)"/>
  <text x="555" y="370" text-anchor="middle" font-size="13" fill="#6B7280">|<tspan font-style="italic">r</tspan>|</text>
  <line x1="555" y1="186" x2="555" y2="328" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="625" y1="186" x2="625" y2="358" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="485" y1="186" x2="485" y2="358" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
