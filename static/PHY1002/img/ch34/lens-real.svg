<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="mray8" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="mdim8" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="380" y="35" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">수렴 렌즈: 물체가 F₁ 밖 (p &gt; f) → 반대쪽에 도립 실상</text>

  <!-- axis -->
  <line x1="40" y1="250" x2="700" y2="250" stroke="#6B7280" stroke-width="1"/>

  <!-- lens -->
  <path d="M 300 155 C 322 215 322 285 300 345 C 278 285 278 215 300 155 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- Ray 1: parallel then through F2 -->
  <polyline points="210,210 255,210 300,210" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray8)"/>
  <polyline points="300,210 408,282 516,354" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray8)"/>
  <text x="286" y="200" font-size="13" font-weight="bold" fill="#8B0029">1</text>

  <!-- Ray 2: through F1 then parallel -->
  <polyline points="210,210 255,270 300,330" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray8)"/>
  <polyline points="300,330 408,330 516,330" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray8)"/>
  <text x="282" y="324" font-size="13" font-weight="bold" fill="#8B0029">2</text>

  <!-- Ray 3: through center -->
  <polyline points="210,210 363,278 516,346" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray8)"/>
  <text x="338" y="290" font-size="13" font-weight="bold" fill="#8B0029">3</text>

  <!-- foci -->
  <circle cx="240" cy="250" r="4" fill="#8B0029"/>
  <text x="240" y="272" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F₁</text>
  <circle cx="360" cy="250" r="4" fill="#8B0029"/>
  <text x="372" y="236" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F₂</text>

  <!-- object -->
  <line x1="210" y1="250" x2="210" y2="218" stroke="#2563EB" stroke-width="3"/>
  <polygon points="210,210 204,222 216,222" fill="#2563EB"/>
  <text x="210" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB"><tspan font-style="italic">O</tspan> 물체</text>

  <!-- image (real, inverted) -->
  <line x1="480" y1="250" x2="480" y2="322" stroke="#2563EB" stroke-width="3"/>
  <polygon points="480,330 474,318 486,318" fill="#2563EB"/>
  <text x="528" y="308" font-size="14" font-weight="bold" fill="#2563EB"><tspan font-style="italic">I</tspan> 실상 (도립)</text>

  <!-- dimensions -->
  <line x1="210" y1="390" x2="300" y2="390" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim8)" marker-end="url(#mdim8)"/>
  <text x="255" y="410" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">p</text>
  <line x1="300" y1="390" x2="480" y2="390" stroke="#6B7280" stroke-width="1" marker-start="url(#mdim8)" marker-end="url(#mdim8)"/>
  <text x="390" y="410" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">i</text>
  <line x1="210" y1="256" x2="210" y2="396" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="300" y1="351" x2="300" y2="396" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="480" y1="336" x2="480" y2="396" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- note -->
  <text x="120" y="120" font-size="13" fill="#6B7280">렌즈의 실상은 물체의</text>
  <text x="120" y="139" font-size="13" fill="#6B7280">반대쪽에 생긴다 (i &gt; 0)</text>
  <text x="120" y="158" font-size="13" fill="#6B7280">— 거울과 반대!</text>
</svg>
