<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="mray9" markerWidth="10" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B0029"/>
    </marker>
  </defs>

  <!-- ===== Panel (a): converging, p < f ===== -->
  <text x="30" y="32" font-size="14" font-weight="bold" fill="#1a1a1a">(a) 수렴 렌즈, 물체가 F₁ 안쪽 (p &lt; f) → 정립·확대 허상 (돋보기)</text>

  <line x1="310" y1="160" x2="700" y2="160" stroke="#6B7280" stroke-width="1"/>
  <path d="M 460 80 C 480 135 480 185 460 240 C 440 185 440 135 460 80 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- Ray 1 -->
  <polyline points="420,135 440,135 460,135" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray9)"/>
  <polyline points="460,135 520,160 580,185" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray9)"/>
  <line x1="340" y1="85" x2="460" y2="135" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Ray 2 -->
  <polyline points="420,135 440,110 460,85" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray9)"/>
  <polyline points="460,85 520,85 580,85" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray9)"/>
  <line x1="340" y1="85" x2="460" y2="85" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Ray 3 -->
  <polyline points="420,135 440,147.5 460,160" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray9)"/>
  <polyline points="460,160 520,197.5 580,235" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray9)"/>
  <line x1="340" y1="85" x2="460" y2="160" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- foci -->
  <circle cx="400" cy="160" r="4" fill="#8B0029"/>
  <text x="396" y="182" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F₁</text>
  <circle cx="520" cy="160" r="4" fill="#8B0029"/>
  <text x="534" y="182" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F₂</text>

  <!-- object -->
  <line x1="420" y1="160" x2="420" y2="143" stroke="#2563EB" stroke-width="3"/>
  <polygon points="420,135 414,146 426,146" fill="#2563EB"/>
  <text x="430" y="178" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#2563EB">O</text>

  <!-- virtual image -->
  <line x1="340" y1="160" x2="340" y2="95" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="340,85 334,98 346,98" fill="#2563EB" fill-opacity="0.55"/>
  <text x="326" y="72" text-anchor="end" font-size="14" font-weight="bold" fill="#2563EB">허상 <tspan font-style="italic">I</tspan> (정립·확대)</text>

  <!-- ===== Panel (b): diverging ===== -->
  <text x="30" y="282" font-size="14" font-weight="bold" fill="#1a1a1a">(b) 발산 렌즈: 물체가 어디에 있든 → 정립·축소 허상</text>

  <line x1="300" y1="400" x2="700" y2="400" stroke="#6B7280" stroke-width="1"/>
  <path d="M 446 325 L 474 325 Q 454 400 474 475 L 446 475 Q 466 400 446 325 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- Ray 1 -->
  <polyline points="370,350 415,350 460,350" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray9)"/>
  <polyline points="460,350 496,320 532,290" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray9)"/>
  <line x1="400" y1="400" x2="460" y2="350" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Ray 2 -->
  <polyline points="370,350 415,365 460,380" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray9)"/>
  <polyline points="460,380 510,380 560,380" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray9)"/>
  <line x1="410" y1="380" x2="460" y2="380" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Ray 3 -->
  <polyline points="370,350 415,375 460,400" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray9)"/>
  <polyline points="460,400 505,425 550,450" fill="none" stroke="#8B0029" stroke-width="2.5" marker-mid="url(#mray9)"/>

  <!-- foci -->
  <circle cx="400" cy="400" r="4" fill="#8B0029"/>
  <text x="390" y="422" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F₂</text>
  <circle cx="520" cy="400" r="4" fill="#8B0029"/>
  <text x="520" y="422" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#8B0029">F₁</text>

  <!-- object -->
  <line x1="370" y1="400" x2="370" y2="358" stroke="#2563EB" stroke-width="3"/>
  <polygon points="370,350 364,362 376,362" fill="#2563EB"/>
  <text x="370" y="336" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#2563EB">O</text>

  <!-- virtual image -->
  <line x1="424" y1="400" x2="424" y2="388" stroke="#2563EB" stroke-width="3" stroke-dasharray="5 3"/>
  <polygon points="424,380 418,391 430,391" fill="#2563EB" fill-opacity="0.55"/>
  <text x="605" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">허상 <tspan font-style="italic">I</tspan> (정립·축소)</text>
  <line x1="436" y1="376" x2="540" y2="352" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 3"/>

  <text x="620" y="450" font-size="12.5" fill="#6B7280">근시 교정용 안경이 발산 렌즈다</text>
</svg>
