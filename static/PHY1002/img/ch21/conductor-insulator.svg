<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="sans-serif">
  <defs>
    <marker id="ciR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="ciB" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill="#2563EB"/></marker>
    <marker id="ciG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">도체 vs 절연체</text>

  <!-- LEFT panel: conductor -->
  <rect x="30" y="55" width="340" height="320" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="200" y="82" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">도체 (conductor)</text>

  <!-- fixed + ions in a lattice -->
  <g font-weight="bold">
    <circle cx="90" cy="130" r="11" fill="#8B0029"/><text x="90" y="135" font-size="13" fill="white" text-anchor="middle">+</text>
    <circle cx="200" cy="130" r="11" fill="#8B0029"/><text x="200" y="135" font-size="13" fill="white" text-anchor="middle">+</text>
    <circle cx="310" cy="130" r="11" fill="#8B0029"/><text x="310" y="135" font-size="13" fill="white" text-anchor="middle">+</text>
    <circle cx="90" cy="225" r="11" fill="#8B0029"/><text x="90" y="230" font-size="13" fill="white" text-anchor="middle">+</text>
    <circle cx="200" cy="225" r="11" fill="#8B0029"/><text x="200" y="230" font-size="13" fill="white" text-anchor="middle">+</text>
    <circle cx="310" cy="225" r="11" fill="#8B0029"/><text x="310" y="230" font-size="13" fill="white" text-anchor="middle">+</text>
    <circle cx="90" cy="320" r="11" fill="#8B0029"/><text x="90" y="325" font-size="13" fill="white" text-anchor="middle">+</text>
    <circle cx="200" cy="320" r="11" fill="#8B0029"/><text x="200" y="325" font-size="13" fill="white" text-anchor="middle">+</text>
    <circle cx="310" cy="320" r="11" fill="#8B0029"/><text x="310" y="325" font-size="13" fill="white" text-anchor="middle">+</text>
  </g>

  <!-- free electrons with motion arrows -->
  <g font-weight="bold">
    <circle cx="145" cy="175" r="9" fill="#2563EB"/><text x="145" y="180" font-size="12" fill="white" text-anchor="middle">−</text>
    <line x1="156" y1="170" x2="182" y2="160" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ciB)"/>
    <circle cx="255" cy="180" r="9" fill="#2563EB"/><text x="255" y="185" font-size="12" fill="white" text-anchor="middle">−</text>
    <line x1="266" y1="182" x2="292" y2="192" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ciB)"/>
    <circle cx="145" cy="272" r="9" fill="#2563EB"/><text x="145" y="277" font-size="12" fill="white" text-anchor="middle">−</text>
    <line x1="143" y1="262" x2="138" y2="236" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ciB)"/>
    <circle cx="255" cy="270" r="9" fill="#2563EB"/><text x="255" y="275" font-size="12" fill="white" text-anchor="middle">−</text>
    <line x1="263" y1="263" x2="285" y2="246" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ciB)"/>
  </g>
  <text x="200" y="362" font-size="13" fill="#2563EB" text-anchor="middle">자유 전자가 자유롭게 이동</text>

  <!-- RIGHT panel: insulator -->
  <rect x="390" y="55" width="340" height="320" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="560" y="82" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">절연체 (insulator)</text>

  <!-- neutral atoms: + core with bound electrons close around -->
  <g>
    <g>
      <circle cx="470" cy="150" r="22" fill="none" stroke="#6B7280" stroke-width="1.5"/>
      <circle cx="470" cy="150" r="11" fill="#8B0029"/><text x="470" y="155" font-size="13" fill="white" text-anchor="middle" font-weight="bold">+</text>
      <circle cx="470" cy="128" r="6" fill="#2563EB"/><text x="470" y="132" font-size="9" fill="white" text-anchor="middle" font-weight="bold">−</text>
      <circle cx="492" cy="150" r="6" fill="#2563EB"/><text x="492" y="154" font-size="9" fill="white" text-anchor="middle" font-weight="bold">−</text>
    </g>
    <g>
      <circle cx="560" cy="150" r="22" fill="none" stroke="#6B7280" stroke-width="1.5"/>
      <circle cx="560" cy="150" r="11" fill="#8B0029"/><text x="560" y="155" font-size="13" fill="white" text-anchor="middle" font-weight="bold">+</text>
      <circle cx="560" cy="172" r="6" fill="#2563EB"/><text x="560" y="176" font-size="9" fill="white" text-anchor="middle" font-weight="bold">−</text>
      <circle cx="538" cy="150" r="6" fill="#2563EB"/><text x="538" y="154" font-size="9" fill="white" text-anchor="middle" font-weight="bold">−</text>
    </g>
    <g>
      <circle cx="650" cy="150" r="22" fill="none" stroke="#6B7280" stroke-width="1.5"/>
      <circle cx="650" cy="150" r="11" fill="#8B0029"/><text x="650" y="155" font-size="13" fill="white" text-anchor="middle" font-weight="bold">+</text>
      <circle cx="650" cy="128" r="6" fill="#2563EB"/><text x="650" y="132" font-size="9" fill="white" text-anchor="middle" font-weight="bold">−</text>
      <circle cx="672" cy="150" r="6" fill="#2563EB"/><text x="672" y="154" font-size="9" fill="white" text-anchor="middle" font-weight="bold">−</text>
    </g>
    <g>
      <circle cx="510" cy="245" r="22" fill="none" stroke="#6B7280" stroke-width="1.5"/>
      <circle cx="510" cy="245" r="11" fill="#8B0029"/><text x="510" y="250" font-size="13" fill="white" text-anchor="middle" font-weight="bold">+</text>
      <circle cx="510" cy="223" r="6" fill="#2563EB"/><text x="510" y="227" font-size="9" fill="white" text-anchor="middle" font-weight="bold">−</text>
      <circle cx="532" cy="245" r="6" fill="#2563EB"/><text x="532" y="249" font-size="9" fill="white" text-anchor="middle" font-weight="bold">−</text>
    </g>
    <g>
      <circle cx="610" cy="245" r="22" fill="none" stroke="#6B7280" stroke-width="1.5"/>
      <circle cx="610" cy="245" r="11" fill="#8B0029"/><text x="610" y="250" font-size="13" fill="white" text-anchor="middle" font-weight="bold">+</text>
      <circle cx="610" cy="267" r="6" fill="#2563EB"/><text x="610" y="271" font-size="9" fill="white" text-anchor="middle" font-weight="bold">−</text>
      <circle cx="588" cy="245" r="6" fill="#2563EB"/><text x="588" y="249" font-size="9" fill="white" text-anchor="middle" font-weight="bold">−</text>
    </g>
  </g>
  <text x="560" y="320" font-size="13" fill="#1a1a1a" text-anchor="middle">전자가 원자에 속박됨</text>
  <text x="560" y="362" font-size="12" fill="#6B7280" text-anchor="middle">(자유 이동 없음)</text>
</svg>
