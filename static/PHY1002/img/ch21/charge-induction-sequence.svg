<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Charging a conductor by induction</title>
  <desc id="desc">Four separate stages: approach a positive rod, connect ground so electrons enter, disconnect ground, and remove the rod.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#2563EB"/></marker></defs>
  <rect width="800" height="420" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <g font-size="18" font-weight="700" text-anchor="middle"><text x="100" y="34">1 approach</text><text x="300" y="34">2 ground</text><text x="500" y="34">3 disconnect</text><text x="700" y="34">4 remove</text></g>
    <g stroke="#D1D5DB"><line x1="200" y1="20" x2="200" y2="390"/><line x1="400" y1="20" x2="400" y2="390"/><line x1="600" y1="20" x2="600" y2="390"/></g>
    <g id="rod1"><rect x="32" y="80" width="34" height="190" rx="6" fill="#F3F4F6" stroke="#8B0029" stroke-width="2"/><g fill="#8B0029" font-size="20" font-weight="700" text-anchor="middle"><text x="49" y="120">+</text><text x="49" y="180">+</text><text x="49" y="240">+</text></g></g>
    <use href="#rod1" x="200"/><use href="#rod1" x="400"/>
    <g id="sphere"><circle cx="132" cy="176" r="60" fill="#F3F4F6" stroke="#111" stroke-width="2"/></g>
    <use href="#sphere"/><use href="#sphere" x="200"/><use href="#sphere" x="400"/><use href="#sphere" x="568"/>
    <!-- 1: polarized but neutral -->
    <g font-size="18" font-weight="700" text-anchor="middle"><g fill="#2563EB"><text x="95" y="145">−</text><text x="88" y="181">−</text><text x="99" y="218">−</text></g><g fill="#8B0029"><text x="164" y="145">+</text><text x="171" y="181">+</text><text x="162" y="218">+</text></g></g>
    <text x="100" y="300" font-size="17" text-anchor="middle">Q = 0</text>
    <!-- 2: grounded, electrons enter, net negative -->
    <g fill="#2563EB" font-size="18" font-weight="700" text-anchor="middle"><text x="294" y="142">−</text><text x="287" y="176">−</text><text x="299" y="212">−</text><text x="328" y="158">−</text></g>
    <path d="M332 236V280H360" fill="none" stroke="#6B7280" stroke-width="2"/><path d="M338 292H386M347 302H377M356 312H368" stroke="#6B7280" stroke-width="2"/>
    <path d="M380 278C360 260 348 246 330 230" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a)"/><text x="375" y="252" fill="#2563EB" font-size="18" font-weight="700">e⁻</text>
    <text x="300" y="340" font-size="17" text-anchor="middle">Q &lt; 0</text>
    <!-- 3: ground visibly open, rod remains -->
    <g fill="#2563EB" font-size="18" font-weight="700" text-anchor="middle"><text x="494" y="142">−</text><text x="487" y="176">−</text><text x="499" y="212">−</text><text x="528" y="158">−</text></g>
    <path d="M532 236V263" stroke="#6B7280" stroke-width="2"/><path d="M532 279V296H564" stroke="#6B7280" stroke-width="2"/><path d="M540 308H588M549 318H579M558 328H570" stroke="#6B7280" stroke-width="2"/><path d="M519 271H545" stroke="#8B0029" stroke-width="3"/>
    <text x="500" y="354" font-size="17" text-anchor="middle">Q &lt; 0</text>
    <!-- 4: negative charge distributed -->
    <g fill="#2563EB" font-size="18" font-weight="700" text-anchor="middle"><text x="700" y="127">−</text><text x="664" y="153">−</text><text x="736" y="153">−</text><text x="660" y="204">−</text><text x="740" y="204">−</text><text x="700" y="234">−</text></g>
    <text x="700" y="300" font-size="17" text-anchor="middle">Q &lt; 0</text>
    <text x="100" y="386" fill="#6B7280" font-size="16" text-anchor="middle">polarized</text><text x="300" y="386" fill="#6B7280" font-size="16" text-anchor="middle">e⁻ enters</text><text x="500" y="386" fill="#6B7280" font-size="16" text-anchor="middle">charge trapped</text><text x="700" y="386" fill="#6B7280" font-size="16" text-anchor="middle">redistributed</text>
  </g>
</svg>
