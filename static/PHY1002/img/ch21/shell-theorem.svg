<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="sans-serif">
  <defs>
    <marker id="stR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="stG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">균일한 구형 껍질 정리 (shell theorem)</text>

  <!-- ===== LEFT panel: external charge ===== -->
  <text x="195" y="70" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">정리 1: 외부 전하</text>
  <circle cx="150" cy="200" r="80" fill="#F3F4F6" stroke="#8B0029" stroke-width="2"/>
  <!-- + marks around shell -->
  <g fill="#8B0029" font-weight="bold" text-anchor="middle">
    <text x="150" y="128" font-size="15">+</text>
    <text x="207" y="152" font-size="15">+</text>
    <text x="230" y="205" font-size="15">+</text>
    <text x="207" y="258" font-size="15">+</text>
    <text x="150" y="282" font-size="15">+</text>
    <text x="93" y="258" font-size="15">+</text>
    <text x="70" y="205" font-size="15">+</text>
    <text x="93" y="152" font-size="15">+</text>
  </g>
  <!-- center mark -->
  <circle cx="150" cy="200" r="3" fill="#6B7280"/>
  <!-- external point charge — negative, so it is attracted toward the + shell (force points to center) -->
  <circle cx="335" cy="200" r="14" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="335" y="205" font-size="14" fill="white" text-anchor="middle" font-weight="bold">−</text>
  <!-- dashed line to center -->
  <line x1="321" y1="200" x2="153" y2="200" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- force arrow on external charge toward center -->
  <line x1="321" y1="180" x2="251" y2="180" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#stR)"/>
  <text x="286" y="170" font-size="14" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F</text>
  <text x="195" y="345" font-size="12.5" fill="#1a1a1a" text-anchor="middle">껍질이 외부 전하에 주는 힘은</text>
  <text x="195" y="365" font-size="12.5" fill="#1a1a1a" text-anchor="middle">전체 전하가 중심에 있을 때와 같음</text>

  <!-- divider -->
  <line x1="400" y1="60" x2="400" y2="390" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== RIGHT panel: internal charge ===== -->
  <text x="585" y="70" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">정리 2: 내부 전하</text>
  <circle cx="585" cy="200" r="80" fill="#F3F4F6" stroke="#8B0029" stroke-width="2"/>
  <g fill="#8B0029" font-weight="bold" text-anchor="middle">
    <text x="585" y="128" font-size="15">+</text>
    <text x="642" y="152" font-size="15">+</text>
    <text x="665" y="205" font-size="15">+</text>
    <text x="642" y="258" font-size="15">+</text>
    <text x="585" y="282" font-size="15">+</text>
    <text x="528" y="258" font-size="15">+</text>
    <text x="505" y="205" font-size="15">+</text>
    <text x="528" y="152" font-size="15">+</text>
  </g>
  <!-- off-center internal test charge: the theorem is not limited to the center -->
  <circle cx="620" cy="218" r="13" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="620" y="223" font-size="13" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <circle cx="585" cy="200" r="3" fill="#6B7280"/>
  <line x1="585" y1="200" x2="620" y2="218" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="585" y="305" font-size="13" fill="#8B0029" text-anchor="middle" font-weight="bold">모든 내부점: F<tspan baseline-shift="sub" font-size="10">shell</tspan> = 0</text>
  <text x="585" y="345" font-size="12.5" fill="#1a1a1a" text-anchor="middle">껍질이 내부 전하에 주는</text>
  <text x="585" y="365" font-size="12.5" fill="#1a1a1a" text-anchor="middle">알짜힘은 0임</text>
</svg>
