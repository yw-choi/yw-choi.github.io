<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="sans-serif">
  <defs>
    <marker id="clR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="clG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="350" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">쿨롱 법칙 (Coulomb's law)</text>

  <!-- baseline (gray reference) -->
  <line x1="80" y1="190" x2="620" y2="190" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- charges -->
  <circle cx="200" cy="190" r="26" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="200" y="198" font-size="22" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <text x="200" y="240" font-size="15" fill="#1a1a1a" text-anchor="middle" font-style="italic" font-weight="bold">q₁</text>
  <circle cx="500" cy="190" r="26" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="500" y="198" font-size="22" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <text x="500" y="240" font-size="15" fill="#1a1a1a" text-anchor="middle" font-style="italic" font-weight="bold">q₂</text>

  <!-- force on q1 (from q2): F12 pointing LEFT (away) -->
  <line x1="174" y1="160" x2="104" y2="160" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#clR)"/>
  <text x="138" y="148" font-size="15" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F₁₂</text>
  <!-- force on q2 (from q1): F21 pointing RIGHT (away) -->
  <line x1="526" y1="160" x2="596" y2="160" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#clR)"/>
  <text x="562" y="148" font-size="15" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F₂₁</text>

  <!-- distance r dimension line with end ticks -->
  <line x1="200" y1="290" x2="500" y2="290" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="200" y1="282" x2="200" y2="298" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="500" y1="282" x2="500" y2="298" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="200" y1="226" x2="200" y2="290" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="500" y1="226" x2="500" y2="290" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="350" y="282" font-size="15" fill="#6B7280" text-anchor="middle" font-style="italic">r</text>

  <!-- caption -->
  <text x="350" y="345" font-size="14" fill="#1a1a1a" text-anchor="middle">크기 F = k|q₁||q₂|/r², 방향은 두 전하를 잇는 직선</text>
</svg>
