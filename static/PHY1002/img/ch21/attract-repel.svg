<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="sans-serif">
  <defs>
    <marker id="arR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="arB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="350" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">같은 부호는 밀치고, 반대 부호는 끌어당긴다</text>

  <!-- Pair A: + +  repulsion -->
  <text x="60" y="115" font-size="14" fill="#1a1a1a" font-weight="bold">척력 (repulsion)</text>
  <line x1="280" y1="110" x2="210" y2="110" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#arR)"/>
  <line x1="420" y1="110" x2="490" y2="110" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#arR)"/>
  <text x="245" y="92" font-size="14" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F</text>
  <text x="455" y="92" font-size="14" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F</text>
  <circle cx="300" cy="110" r="24" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="300" y="117" font-size="22" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <circle cx="400" cy="110" r="24" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="400" y="117" font-size="22" fill="white" text-anchor="middle" font-weight="bold">+</text>

  <!-- Pair B: - -  repulsion -->
  <text x="60" y="255" font-size="14" fill="#1a1a1a" font-weight="bold">척력 (repulsion)</text>
  <line x1="280" y1="250" x2="210" y2="250" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#arR)"/>
  <line x1="420" y1="250" x2="490" y2="250" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#arR)"/>
  <text x="245" y="232" font-size="14" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F</text>
  <text x="455" y="232" font-size="14" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F</text>
  <circle cx="300" cy="250" r="24" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="300" y="258" font-size="24" fill="white" text-anchor="middle" font-weight="bold">−</text>
  <circle cx="400" cy="250" r="24" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="258" font-size="24" fill="white" text-anchor="middle" font-weight="bold">−</text>

  <!-- Pair C: + -  attraction -->
  <text x="60" y="395" font-size="14" fill="#1a1a1a" font-weight="bold">인력 (attraction)</text>
  <line x1="335" y1="390" x2="372" y2="390" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#arR)"/>
  <line x1="465" y1="390" x2="428" y2="390" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#arR)"/>
  <text x="353" y="372" font-size="14" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F</text>
  <text x="447" y="372" font-size="14" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F</text>
  <circle cx="300" cy="390" r="24" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="300" y="397" font-size="22" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <circle cx="400" cy="390" r="24" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="398" font-size="24" fill="white" text-anchor="middle" font-weight="bold">−</text>

</svg>
