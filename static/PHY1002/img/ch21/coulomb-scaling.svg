<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Coulomb-force inverse-square scaling</title>
  <desc id="desc">Log-log plot of normalized Coulomb force versus normalized distance, with slope minus two.</desc>
  <rect width="760" height="430" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <line x1="100" y1="350" x2="700" y2="350" stroke="#111" stroke-width="1.5"/>
    <line x1="100" y1="350" x2="100" y2="45" stroke="#111" stroke-width="1.5"/>
    <g font-size="17" text-anchor="middle">
      <line x1="100" y1="350" x2="100" y2="357" stroke="#111"/>
      <text x="100" y="382">0.5</text>
      <line x1="250" y1="350" x2="250" y2="357" stroke="#111"/>
      <text x="250" y="382">1</text>
      <line x1="400" y1="350" x2="400" y2="357" stroke="#111"/>
      <text x="400" y="382">2</text>
      <line x1="550" y1="350" x2="550" y2="357" stroke="#111"/>
      <text x="550" y="382">4</text>
      <line x1="700" y1="350" x2="700" y2="357" stroke="#111"/>
      <text x="700" y="382">8</text>
      <text x="400" y="405" font-size="19" font-style="italic">r/r₀</text>
    </g>
    <g font-size="17" text-anchor="end">
      <line x1="93" y1="350" x2="100" y2="350" stroke="#111"/><text x="84" y="356">1/64</text>
      <line x1="93" y1="274" x2="100" y2="274" stroke="#111"/><text x="84" y="280">1/16</text>
      <line x1="93" y1="198" x2="100" y2="198" stroke="#111"/><text x="84" y="204">1/4</text>
      <line x1="93" y1="121" x2="100" y2="121" stroke="#111"/><text x="84" y="127">1</text>
      <line x1="93" y1="45" x2="100" y2="45" stroke="#111"/><text x="84" y="51">4</text>
    </g>
    <text x="22" y="205" font-size="19" font-style="italic" text-anchor="middle" transform="rotate(-90 22 205)">F/F₀</text>
    <path d="M100 45 L700 350" fill="none" stroke="#8B0029" stroke-width="3"/>
    <g fill="#8B0029" stroke="#fff" stroke-width="2">
      <circle cx="250" cy="121" r="6"/><circle cx="400" cy="198" r="6"/>
    </g>
    <line x1="250" y1="121" x2="400" y2="121" stroke="#6B7280" stroke-width="1" stroke-dasharray="5 5"/>
    <line x1="400" y1="121" x2="400" y2="198" stroke="#6B7280" stroke-width="1" stroke-dasharray="5 5"/>
    <text x="495" y="180" fill="#8B0029" font-size="22" font-weight="700">F ∝ r⁻²</text>
    <text x="326" y="105" fill="#6B7280" font-size="16">r × 2</text>
    <text x="420" y="165" fill="#6B7280" font-size="16">F × 1/4</text>
  </g>
</svg>
