<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="sans-serif">
  <defs>
    <marker id="spR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="spD" markerWidth="9" markerHeight="6.3" refX="9" refY="3.15" orient="auto"><polygon points="0 0, 9 3.15, 0 6.3" fill="#5a001b"/></marker>
    <marker id="spG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="350" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">여러 전하에 의한 알짜힘 = 벡터 합</text>

  <!-- Particle 1 at center (300,260); F12 -> right (toward q2), F13 -> up-left (toward q3) -->
  <!-- F12 vector: (130, 0) -> tip (430,260) -->
  <!-- F13 vector: (-110,-95) -> tip (190,165) -->
  <!-- resultant: (20,-95) -> tip (320,165) -->

  <!-- dashed parallelogram construction lines -->
  <line x1="430" y1="260" x2="320" y2="165" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="190" y1="165" x2="320" y2="165" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- resultant net force (dark thick red diagonal) -->
  <line x1="300" y1="260" x2="320" y2="165" stroke="#5a001b" stroke-width="4" fill="none" marker-end="url(#spD)"/>
  <text x="356" y="160" font-size="15" fill="#5a001b" text-anchor="middle" font-style="italic" font-weight="bold">F₁,net</text>

  <!-- F12 (red, to the right) -->
  <line x1="300" y1="260" x2="426" y2="260" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#spR)"/>
  <text x="380" y="282" font-size="15" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F₁₂</text>

  <!-- F13 (red, up-left) -->
  <line x1="300" y1="260" x2="194" y2="168" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#spR)"/>
  <text x="208" y="232" font-size="15" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F₁₃</text>

  <!-- particle 2 (to the right of 1) — negative, so q1(+) is attracted toward it -->
  <circle cx="500" cy="260" r="22" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="500" y="267" font-size="20" fill="white" text-anchor="middle" font-weight="bold">−</text>
  <text x="500" y="305" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">입자 2</text>

  <!-- particle 3 (above-left) — negative, so q1(+) is attracted toward it -->
  <circle cx="150" cy="125" r="22" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="132" font-size="20" fill="white" text-anchor="middle" font-weight="bold">−</text>
  <text x="150" y="98" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">입자 3</text>

  <!-- particle 1 (central) drawn last so vectors emanate cleanly -->
  <circle cx="300" cy="260" r="22" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="300" y="267" font-size="20" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <text x="270" y="300" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">입자 1</text>

  <!-- caption -->
  <text x="350" y="420" font-size="14" fill="#1a1a1a" text-anchor="middle">F₁,net = F₁₂ + F₁₃ (벡터 합)</text>
</svg>
