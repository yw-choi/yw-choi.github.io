<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="sans-serif">
  <defs>
    <marker id="ciaR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="ciaB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="ciaG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">유도 전하 (induction)</text>

  <!-- charged rod (red) on the left -->
  <rect x="60" y="150" width="150" height="60" rx="10" fill="#F3F4F6" stroke="#8B0029" stroke-width="2"/>
  <text x="90" y="187" font-size="22" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="135" y="187" font-size="22" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="180" y="187" font-size="22" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="135" y="135" font-size="14" fill="#8B0029" text-anchor="middle" font-weight="bold">대전 막대 (+)</text>

  <!-- neutral conductor (sphere) on the right -->
  <circle cx="470" cy="200" r="95" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="470" y="92" font-size="13" fill="#6B7280" text-anchor="middle">도체 전체는 여전히 중성</text>

  <!-- near side (left): induced - electrons -->
  <g font-weight="bold">
    <circle cx="395" cy="165" r="11" fill="#2563EB"/><text x="395" y="170" font-size="13" fill="white" text-anchor="middle">−</text>
    <circle cx="388" cy="200" r="11" fill="#2563EB"/><text x="388" y="205" font-size="13" fill="white" text-anchor="middle">−</text>
    <circle cx="395" cy="235" r="11" fill="#2563EB"/><text x="395" y="240" font-size="13" fill="white" text-anchor="middle">−</text>
  </g>
  <!-- far side (right): net + bare ions -->
  <g font-weight="bold">
    <circle cx="545" cy="165" r="11" fill="#8B0029"/><text x="545" y="170" font-size="13" fill="white" text-anchor="middle">+</text>
    <circle cx="552" cy="200" r="11" fill="#8B0029"/><text x="552" y="205" font-size="13" fill="white" text-anchor="middle">+</text>
    <circle cx="545" cy="235" r="11" fill="#8B0029"/><text x="545" y="240" font-size="13" fill="white" text-anchor="middle">+</text>
  </g>

  <text x="380" y="330" font-size="13" fill="#2563EB" text-anchor="middle">가까운 면: 유도된 − 전하</text>
  <text x="560" y="330" font-size="13" fill="#8B0029" text-anchor="middle">먼 면: + 전하</text>

  <!-- grounding wire to ground symbol -->
  <line x1="470" y1="295" x2="470" y2="365" stroke="#6B7280" stroke-width="2" fill="none"/>
  <line x1="445" y1="365" x2="495" y2="365" stroke="#6B7280" stroke-width="2"/>
  <line x1="452" y1="373" x2="488" y2="373" stroke="#6B7280" stroke-width="2"/>
  <line x1="459" y1="381" x2="481" y2="381" stroke="#6B7280" stroke-width="2"/>
  <text x="470" y="405" font-size="12" fill="#6B7280" text-anchor="middle">접지하면 알짜 전하를 띤다</text>
</svg>
