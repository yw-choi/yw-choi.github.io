<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="sans-serif">
  <defs>
    <marker id="cvR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="cvG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">쿨롱 법칙 vs 만유인력: 같은 역제곱 구조</text>

  <!-- ===== LEFT: electric ===== -->
  <text x="195" y="80" font-size="15" fill="#8B0029" text-anchor="middle" font-weight="bold">전기력 (electric)</text>
  <circle cx="110" cy="180" r="24" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="110" y="187" font-size="20" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <text x="110" y="228" font-size="14" fill="#1a1a1a" text-anchor="middle" font-style="italic" font-weight="bold">q₁</text>
  <circle cx="280" cy="180" r="24" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="280" y="187" font-size="20" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <text x="280" y="228" font-size="14" fill="#1a1a1a" text-anchor="middle" font-style="italic" font-weight="bold">q₂</text>
  <!-- repulsive force arrows -->
  <line x1="84" y1="150" x2="44" y2="150" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#cvR)"/>
  <line x1="306" y1="150" x2="346" y2="150" stroke="#8B0029" stroke-width="2.5" fill="none" marker-end="url(#cvR)"/>
  <!-- distance r -->
  <line x1="110" y1="260" x2="280" y2="260" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="110" y1="252" x2="110" y2="268" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="280" y1="252" x2="280" y2="268" stroke="#6B7280" stroke-width="1.6"/>
  <text x="195" y="252" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">r</text>
  <text x="195" y="300" font-size="15" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F_e = k q₁q₂ / r²</text>

  <!-- divider -->
  <line x1="400" y1="60" x2="400" y2="320" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== RIGHT: gravity ===== -->
  <text x="585" y="80" font-size="15" fill="#6B7280" text-anchor="middle" font-weight="bold">중력 (gravity)</text>
  <circle cx="500" cy="180" r="24" fill="#6B7280" stroke="#6B7280" stroke-width="2"/>
  <text x="500" y="228" font-size="14" fill="#1a1a1a" text-anchor="middle" font-style="italic" font-weight="bold">m₁</text>
  <circle cx="670" cy="180" r="24" fill="#6B7280" stroke="#6B7280" stroke-width="2"/>
  <text x="670" y="228" font-size="14" fill="#1a1a1a" text-anchor="middle" font-style="italic" font-weight="bold">m₂</text>
  <!-- attractive force arrows (toward each other) -->
  <line x1="535" y1="150" x2="575" y2="150" stroke="#6B7280" stroke-width="2.5" fill="none" marker-end="url(#cvG)"/>
  <line x1="635" y1="150" x2="595" y2="150" stroke="#6B7280" stroke-width="2.5" fill="none" marker-end="url(#cvG)"/>
  <!-- distance r -->
  <line x1="500" y1="260" x2="670" y2="260" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="500" y1="252" x2="500" y2="268" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="670" y1="252" x2="670" y2="268" stroke="#6B7280" stroke-width="1.6"/>
  <text x="585" y="252" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">r</text>
  <text x="585" y="300" font-size="15" fill="#6B7280" text-anchor="middle" font-style="italic" font-weight="bold">F_g = G m₁m₂ / r²</text>

  <!-- bottom caption spanning both -->
  <text x="380" y="365" font-size="14" fill="#1a1a1a" text-anchor="middle">둘 다 거리의 제곱에 반비례 (1/r²),</text>
  <text x="380" y="388" font-size="14" fill="#1a1a1a" text-anchor="middle">단 전기력은 인력·척력 모두 가능</text>
</svg>
