<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">내부 저항이 있는 실제 전지</text>

  <!-- real battery dashed box -->
  <rect x="150" y="115" width="100" height="170" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- wires -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="200" y1="70" x2="540" y2="70"/>
    <line x1="540" y1="70" x2="540" y2="160"/>
    <line x1="540" y1="220" x2="540" y2="330"/>
    <line x1="540" y1="330" x2="200" y2="330"/>
    <line x1="200" y1="330" x2="200" y2="239"/>
    <line x1="200" y1="225" x2="200" y2="195"/>
    <line x1="200" y1="135" x2="200" y2="70"/>
  </g>

  <!-- internal resistance r -->
  <path d="M 200 135 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="226" y="170" text-anchor="start" font-size="16" font-style="italic" fill="#1a1a1a">r</text>

  <!-- ideal emf symbol (+ top) -->
  <line x1="180" y1="225" x2="220" y2="225" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="189" y1="239" x2="211" y2="239" stroke="#1a1a1a" stroke-width="4.5"/>
  <text x="230" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="230" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">−</text>

  <!-- emf arrow -->
  <circle cx="166" cy="252" r="3" fill="none" stroke="#8B0029" stroke-width="1.5"/>
  <line x1="166" y1="246" x2="166" y2="212" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="166" y="203" text-anchor="middle" font-size="16" font-style="italic" fill="#8B0029">ℰ</text>

  <!-- terminal labels -->
  <circle cx="200" cy="115" r="4" fill="#1a1a1a"/>
  <circle cx="200" cy="285" r="4" fill="#1a1a1a"/>
  <text x="178" y="112" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">b</text>
  <text x="178" y="298" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">a</text>
  <text x="150" y="312" text-anchor="middle" font-size="12.5" fill="#6B7280">실제 전지</text>

  <!-- external resistor R -->
  <path d="M 540 160 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="566" y="195" text-anchor="start" font-size="16" font-style="italic" fill="#1a1a1a">R</text>

  <!-- current arrows -->
  <g stroke="#2563EB" stroke-width="2.5">
    <line x1="330" y1="70" x2="395" y2="70" marker-end="url(#arrBlue)"/>
    <line x1="540" y1="100" x2="540" y2="140" marker-end="url(#arrBlue)"/>
    <line x1="395" y1="330" x2="330" y2="330" marker-end="url(#arrBlue)"/>
  </g>
  <text x="362" y="55" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>
  <text x="558" y="124" text-anchor="start" font-size="15" font-style="italic" fill="#2563EB">i</text>
  <text x="362" y="354" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>

  <!-- equation -->
  <text x="360" y="384" text-anchor="middle" font-size="15" fill="#8B0029">루프 법칙:  <tspan font-style="italic">ℰ</tspan> − <tspan font-style="italic">ir</tspan> − <tspan font-style="italic">iR</tspan> = 0   →   <tspan font-style="italic">i</tspan> = <tspan font-style="italic">ℰ</tspan>/(<tspan font-style="italic">R</tspan> + <tspan font-style="italic">r</tspan>)</text>
</svg>
