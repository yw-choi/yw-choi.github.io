<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrBlue" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="350" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">접점 법칙: 들어온 전류 = 나간 전류</text>

  <!-- wires -->
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="80" y1="170" x2="330" y2="170"/>
    <line x1="330" y1="170" x2="600" y2="90"/>
    <line x1="330" y1="170" x2="600" y2="250"/>
  </g>

  <!-- junction node -->
  <circle cx="330" cy="170" r="6" fill="#1a1a1a"/>
  <text x="295" y="200" text-anchor="middle" font-size="13" fill="#6B7280">접점 (junction)</text>

  <!-- current arrows -->
  <line x1="170" y1="170" x2="240" y2="170" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="205" y="152" text-anchor="middle" font-size="15" fill="#2563EB"><tspan font-style="italic">i</tspan><tspan font-size="11" dy="3">1</tspan></text>
  <line x1="464" y1="130" x2="531" y2="110" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="497" y="94" text-anchor="middle" font-size="15" fill="#2563EB"><tspan font-style="italic">i</tspan><tspan font-size="11" dy="3">2</tspan></text>
  <line x1="464" y1="210" x2="531" y2="230" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="497" y="262" text-anchor="middle" font-size="15" fill="#2563EB"><tspan font-style="italic">i</tspan><tspan font-size="11" dy="3">3</tspan></text>

  <!-- equation -->
  <text x="350" y="290" text-anchor="middle" font-size="16" fill="#8B0029"><tspan font-style="italic">i</tspan><tspan font-size="12" dy="3">1</tspan><tspan dy="-3"> = </tspan><tspan font-style="italic">i</tspan><tspan font-size="12" dy="3">2</tspan><tspan dy="-3"> + </tspan><tspan font-style="italic">i</tspan><tspan font-size="12" dy="3">3</tspan><tspan dy="-3">  </tspan><tspan font-size="13" fill="#6B7280">— 접점에 전하가 쌓이지 않는다 (전하 보존)</tspan></text>
</svg>
