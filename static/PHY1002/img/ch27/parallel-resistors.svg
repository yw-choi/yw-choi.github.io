<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">병렬 연결: 같은 전위차, 전류는 나뉜다</text>

  <!-- ===== left circuit ===== -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="90" y1="90" x2="390" y2="90"/>
    <line x1="90" y1="330" x2="390" y2="330"/>
    <line x1="90" y1="90" x2="90" y2="200"/>
    <line x1="90" y1="214" x2="90" y2="330"/>
    <line x1="210" y1="90" x2="210" y2="180"/>
    <line x1="210" y1="240" x2="210" y2="330"/>
    <line x1="300" y1="90" x2="300" y2="180"/>
    <line x1="300" y1="240" x2="300" y2="330"/>
    <line x1="390" y1="90" x2="390" y2="180"/>
    <line x1="390" y1="240" x2="390" y2="330"/>
  </g>

  <!-- battery -->
  <line x1="70" y1="200" x2="110" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="79" y1="214" x2="101" y2="214" stroke="#1a1a1a" stroke-width="4.5"/>
  <circle cx="54" cy="228" r="3" fill="none" stroke="#8B0029" stroke-width="1.5"/>
  <line x1="54" y1="222" x2="54" y2="188" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="54" y="178" text-anchor="middle" font-size="16" font-style="italic" fill="#8B0029">ℰ</text>

  <!-- three parallel resistors -->
  <path d="M 210 180 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 300 180 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 390 180 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="186" y="215" text-anchor="end" font-size="15" fill="#1a1a1a"><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">1</tspan></text>
  <text x="276" y="215" text-anchor="end" font-size="15" fill="#1a1a1a"><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">2</tspan></text>
  <text x="366" y="215" text-anchor="end" font-size="15" fill="#1a1a1a"><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">3</tspan></text>

  <!-- junction dots -->
  <circle cx="210" cy="90" r="4" fill="#1a1a1a"/>
  <circle cx="300" cy="90" r="4" fill="#1a1a1a"/>
  <circle cx="210" cy="330" r="4" fill="#1a1a1a"/>
  <circle cx="300" cy="330" r="4" fill="#1a1a1a"/>
  <text x="255" y="74" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">a</text>
  <text x="255" y="352" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">b</text>

  <!-- branch current arrows -->
  <g stroke="#2563EB" stroke-width="2.5">
    <line x1="120" y1="90" x2="165" y2="90" marker-end="url(#arrBlue)"/>
    <line x1="210" y1="112" x2="210" y2="150" marker-end="url(#arrBlue)"/>
    <line x1="300" y1="112" x2="300" y2="150" marker-end="url(#arrBlue)"/>
    <line x1="390" y1="112" x2="390" y2="150" marker-end="url(#arrBlue)"/>
  </g>
  <text x="142" y="75" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>
  <text x="226" y="136" text-anchor="start" font-size="14" fill="#2563EB"><tspan font-style="italic">i</tspan><tspan font-size="10" dy="3">1</tspan></text>
  <text x="316" y="136" text-anchor="start" font-size="14" fill="#2563EB"><tspan font-style="italic">i</tspan><tspan font-size="10" dy="3">2</tspan></text>
  <text x="406" y="136" text-anchor="start" font-size="14" fill="#2563EB"><tspan font-style="italic">i</tspan><tspan font-size="10" dy="3">3</tspan></text>

  <!-- equivalence arrow -->
  <line x1="430" y1="210" x2="480" y2="210" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrGray)"/>
  <text x="455" y="195" text-anchor="middle" font-size="13" fill="#6B7280">등가</text>

  <!-- ===== right circuit ===== -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="540" y1="90" x2="700" y2="90"/>
    <line x1="700" y1="90" x2="700" y2="180"/>
    <line x1="700" y1="240" x2="700" y2="330"/>
    <line x1="700" y1="330" x2="540" y2="330"/>
    <line x1="540" y1="330" x2="540" y2="214"/>
    <line x1="540" y1="200" x2="540" y2="90"/>
  </g>
  <line x1="520" y1="200" x2="560" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="529" y1="214" x2="551" y2="214" stroke="#1a1a1a" stroke-width="4.5"/>
  <circle cx="504" cy="228" r="3" fill="none" stroke="#8B0029" stroke-width="1.5"/>
  <line x1="504" y1="222" x2="504" y2="188" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="504" y="178" text-anchor="middle" font-size="16" font-style="italic" fill="#8B0029">ℰ</text>

  <path d="M 700 180 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="724" y="215" text-anchor="start" font-size="15" fill="#1a1a1a"><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">eq</tspan></text>

  <line x1="590" y1="90" x2="645" y2="90" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="617" y="75" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>

  <!-- equation -->
  <text x="390" y="398" text-anchor="middle" font-size="15" fill="#8B0029">1/<tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">eq</tspan><tspan dy="-3"> = 1/</tspan><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">1</tspan><tspan dy="-3"> + 1/</tspan><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">2</tspan><tspan dy="-3"> + 1/</tspan><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">3</tspan><tspan dy="-3">  </tspan><tspan fill="#6B7280">(병렬: 저항이 작아진다)</tspan></text>
</svg>
