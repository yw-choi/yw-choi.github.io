<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">직렬 연결: 같은 전류, 전위차는 나뉜다</text>

  <!-- ===== left circuit ===== -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="100" y1="70" x2="320" y2="70"/>
    <line x1="320" y1="70" x2="320" y2="90"/>
    <line x1="320" y1="150" x2="320" y2="175"/>
    <line x1="320" y1="235" x2="320" y2="260"/>
    <line x1="320" y1="320" x2="320" y2="340"/>
    <line x1="320" y1="340" x2="100" y2="340"/>
    <line x1="100" y1="340" x2="100" y2="209"/>
    <line x1="100" y1="195" x2="100" y2="70"/>
  </g>

  <!-- battery -->
  <line x1="80" y1="195" x2="120" y2="195" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="89" y1="209" x2="111" y2="209" stroke="#1a1a1a" stroke-width="4.5"/>
  <circle cx="62" cy="222" r="3" fill="none" stroke="#8B0029" stroke-width="1.5"/>
  <line x1="62" y1="216" x2="62" y2="182" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="62" y="172" text-anchor="middle" font-size="16" font-style="italic" fill="#8B0029">ℰ</text>

  <!-- three series resistors -->
  <path d="M 320 90 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 320 175 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 320 260 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="346" y="125" text-anchor="start" font-size="15" fill="#1a1a1a"><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">1</tspan></text>
  <text x="346" y="210" text-anchor="start" font-size="15" fill="#1a1a1a"><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">2</tspan></text>
  <text x="346" y="295" text-anchor="start" font-size="15" fill="#1a1a1a"><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">3</tspan></text>

  <!-- nodes -->
  <circle cx="320" cy="70" r="4" fill="#1a1a1a"/>
  <circle cx="320" cy="340" r="4" fill="#1a1a1a"/>
  <text x="338" y="66" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">b</text>
  <text x="338" y="356" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">a</text>

  <!-- current arrows -->
  <line x1="180" y1="70" x2="240" y2="70" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="210" y="55" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>
  <line x1="240" y1="340" x2="180" y2="340" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="210" y="362" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>

  <!-- equivalence arrow -->
  <line x1="374" y1="205" x2="428" y2="205" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrGray)"/>
  <text x="401" y="190" text-anchor="middle" font-size="13" fill="#6B7280">등가</text>

  <!-- ===== right circuit ===== -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="490" y1="70" x2="690" y2="70"/>
    <line x1="690" y1="70" x2="690" y2="175"/>
    <line x1="690" y1="235" x2="690" y2="340"/>
    <line x1="690" y1="340" x2="490" y2="340"/>
    <line x1="490" y1="340" x2="490" y2="209"/>
    <line x1="490" y1="195" x2="490" y2="70"/>
  </g>
  <line x1="470" y1="195" x2="510" y2="195" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="479" y1="209" x2="501" y2="209" stroke="#1a1a1a" stroke-width="4.5"/>
  <circle cx="452" cy="222" r="3" fill="none" stroke="#8B0029" stroke-width="1.5"/>
  <line x1="452" y1="216" x2="452" y2="182" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="452" y="172" text-anchor="middle" font-size="16" font-style="italic" fill="#8B0029">ℰ</text>

  <path d="M 690 175 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="714" y="210" text-anchor="start" font-size="15" fill="#1a1a1a"><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">eq</tspan></text>

  <line x1="560" y1="70" x2="620" y2="70" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="590" y="55" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>

  <!-- equation -->
  <text x="390" y="386" text-anchor="middle" font-size="15" fill="#8B0029"><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">eq</tspan><tspan dy="-3"> = </tspan><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">1</tspan><tspan dy="-3"> + </tspan><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">2</tspan><tspan dy="-3"> + </tspan><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">3</tspan><tspan dy="-3">  </tspan><tspan fill="#6B7280">(직렬: 저항이 커진다)</tspan></text>
</svg>
