<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrBlue" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">다중 루프 회로: 접점 2개, 가지 3개, 루프 2개</text>

  <!-- wires -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="140" y1="90" x2="640" y2="90"/>
    <line x1="140" y1="350" x2="640" y2="350"/>
    <line x1="140" y1="90" x2="140" y2="130"/>
    <line x1="140" y1="190" x2="140" y2="240"/>
    <line x1="140" y1="254" x2="140" y2="350"/>
    <line x1="390" y1="90" x2="390" y2="190"/>
    <line x1="390" y1="250" x2="390" y2="350"/>
    <line x1="640" y1="90" x2="640" y2="130"/>
    <line x1="640" y1="190" x2="640" y2="240"/>
    <line x1="640" y1="254" x2="640" y2="350"/>
  </g>

  <!-- left branch: R1 + battery E1 -->
  <path d="M 140 130 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="240" x2="160" y2="240" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="129" y1="254" x2="151" y2="254" stroke="#1a1a1a" stroke-width="4.5"/>
  <text x="170" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="170" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">−</text>
  <text x="112" y="165" text-anchor="end" font-size="14" fill="#1a1a1a"><tspan font-style="italic">R</tspan><tspan font-size="10" dy="3">1</tspan><tspan dy="-3"> = 4.0 Ω</tspan></text>
  <text x="112" y="252" text-anchor="end" font-size="14" fill="#1a1a1a"><tspan font-style="italic">ℰ</tspan><tspan font-size="10" dy="3">1</tspan><tspan dy="-3"> = 12 V</tspan></text>

  <!-- middle branch: R3 -->
  <path d="M 390 190 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="412" y="224" text-anchor="start" font-size="14" fill="#1a1a1a"><tspan font-style="italic">R</tspan><tspan font-size="10" dy="3">3</tspan><tspan dy="-3"> = 4.0 Ω</tspan></text>

  <!-- right branch: R2 + battery E2 -->
  <path d="M 640 130 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="620" y1="240" x2="660" y2="240" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="629" y1="254" x2="651" y2="254" stroke="#1a1a1a" stroke-width="4.5"/>
  <text x="610" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="610" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">−</text>
  <text x="668" y="165" text-anchor="start" font-size="14" fill="#1a1a1a"><tspan font-style="italic">R</tspan><tspan font-size="10" dy="3">2</tspan><tspan dy="-3"> = 2.0 Ω</tspan></text>
  <text x="668" y="252" text-anchor="start" font-size="14" fill="#1a1a1a"><tspan font-style="italic">ℰ</tspan><tspan font-size="10" dy="3">2</tspan><tspan dy="-3"> = 10 V</tspan></text>

  <!-- junction nodes -->
  <circle cx="390" cy="90" r="5" fill="#1a1a1a"/>
  <circle cx="390" cy="350" r="5" fill="#1a1a1a"/>
  <text x="390" y="72" text-anchor="middle" font-size="16" font-style="italic" fill="#1a1a1a">a</text>
  <text x="390" y="376" text-anchor="middle" font-size="16" font-style="italic" fill="#1a1a1a">b</text>

  <!-- assumed current arrows -->
  <g stroke="#2563EB" stroke-width="2.5">
    <line x1="140" y1="322" x2="140" y2="288" marker-end="url(#arrBlue)"/>
    <line x1="390" y1="120" x2="390" y2="158" marker-end="url(#arrBlue)"/>
    <line x1="640" y1="290" x2="640" y2="325" marker-end="url(#arrBlue)"/>
  </g>
  <text x="118" y="310" text-anchor="end" font-size="14" fill="#2563EB"><tspan font-style="italic">i</tspan><tspan font-size="10" dy="3">1</tspan></text>
  <text x="408" y="144" text-anchor="start" font-size="14" fill="#2563EB"><tspan font-style="italic">i</tspan><tspan font-size="10" dy="3">3</tspan></text>
  <text x="662" y="312" text-anchor="start" font-size="14" fill="#2563EB"><tspan font-style="italic">i</tspan><tspan font-size="10" dy="3">2</tspan></text>

  <!-- loop traversal arcs -->
  <path d="M 232 201 A 38 38 0 1 1 232 239" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <text x="265" y="224" text-anchor="middle" font-size="12" fill="#6B7280">루프 1</text>
  <path d="M 482 201 A 38 38 0 1 1 482 239" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <text x="515" y="224" text-anchor="middle" font-size="12" fill="#6B7280">루프 2</text>

  <!-- junction equation -->
  <text x="380" y="416" text-anchor="middle" font-size="14.5" fill="#8B0029">접점 a:  <tspan font-style="italic">i</tspan><tspan font-size="11" dy="3">1</tspan><tspan dy="-3"> = </tspan><tspan font-style="italic">i</tspan><tspan font-size="11" dy="3">2</tspan><tspan dy="-3"> + </tspan><tspan font-style="italic">i</tspan><tspan font-size="11" dy="3">3</tspan><tspan dy="-3">  </tspan><tspan fill="#6B7280">(화살표는 가정한 방향 — 답이 음수면 반대 방향)</tspan></text>
</svg>
