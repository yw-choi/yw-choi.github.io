<svg viewBox="0 0 740 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="370" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">RC 회로: 스위치로 충전(a)과 방전(b)을 전환</text>

  <!-- wires -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <polyline points="150,235 150,120 246,120"/>
    <line x1="340" y1="80" x2="400" y2="80"/>
    <line x1="460" y1="80" x2="560" y2="80"/>
    <line x1="560" y1="80" x2="560" y2="200"/>
    <line x1="560" y1="216" x2="560" y2="340"/>
    <line x1="560" y1="340" x2="150" y2="340"/>
    <line x1="150" y1="340" x2="150" y2="249"/>
    <polyline points="256,180 290,180 290,340"/>
  </g>
  <circle cx="290" cy="340" r="4" fill="#1a1a1a"/>

  <!-- battery -->
  <line x1="130" y1="235" x2="170" y2="235" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="139" y1="249" x2="161" y2="249" stroke="#1a1a1a" stroke-width="4.5"/>
  <circle cx="112" cy="262" r="3" fill="none" stroke="#8B0029" stroke-width="1.5"/>
  <line x1="112" y1="256" x2="112" y2="222" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="112" y="212" text-anchor="middle" font-size="16" font-style="italic" fill="#8B0029">ℰ</text>
  <text x="182" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="182" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">−</text>

  <!-- switch: pivot, contacts a & b -->
  <circle cx="340" cy="80" r="4" fill="#1a1a1a"/>
  <line x1="340" y1="80" x2="258" y2="116" stroke="#8B0029" stroke-width="2.5"/>
  <line x1="340" y1="80" x2="262" y2="176" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="252" cy="120" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="252" cy="180" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="348" y="62" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">S</text>
  <text x="236" y="116" text-anchor="middle" font-size="14" font-style="italic" fill="#8B0029">a</text>
  <text x="236" y="186" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">b</text>

  <!-- resistor R (top) -->
  <path d="M 400 80 l 5 -9 l 10 18 l 10 -18 l 10 18 l 10 -18 l 10 18 l 5 -9" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="430" y="52" text-anchor="middle" font-size="16" font-style="italic" fill="#1a1a1a">R</text>

  <!-- capacitor C -->
  <line x1="532" y1="200" x2="588" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="532" y1="216" x2="588" y2="216" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="606" y="214" text-anchor="start" font-size="16" font-style="italic" fill="#1a1a1a">C</text>

  <!-- plate charges -->
  <g font-size="13" font-weight="bold" fill="#8B0029" text-anchor="middle">
    <text x="538" y="196">+</text>
    <text x="551" y="196">+</text>
    <text x="569" y="196">+</text>
    <text x="582" y="196">+</text>
  </g>
  <g font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">
    <text x="538" y="231">−</text>
    <text x="551" y="231">−</text>
    <text x="569" y="231">−</text>
    <text x="582" y="231">−</text>
  </g>
  <text x="516" y="204" text-anchor="end" font-size="14" fill="#8B0029">+<tspan font-style="italic">q</tspan></text>
  <text x="516" y="234" text-anchor="end" font-size="14" fill="#2563EB">−<tspan font-style="italic">q</tspan></text>

  <!-- current arrows (charging) -->
  <g stroke="#2563EB" stroke-width="2.5">
    <line x1="480" y1="80" x2="520" y2="80" marker-end="url(#arrBlue)"/>
    <line x1="400" y1="340" x2="360" y2="340" marker-end="url(#arrBlue)"/>
    <line x1="150" y1="320" x2="150" y2="285" marker-end="url(#arrBlue)"/>
  </g>
  <text x="500" y="64" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>
  <text x="380" y="364" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>
  <text x="132" y="306" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>

  <!-- annotation -->
  <text x="370" y="398" text-anchor="middle" font-size="13" fill="#6B7280"><tspan fill="#8B0029" font-weight="bold">S → a</tspan>: 충전 (ℰ–R–C 루프)&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#1a1a1a" font-weight="bold">S → b</tspan>: 방전 (전지를 빼고 R–C 루프)</text>
</svg>
