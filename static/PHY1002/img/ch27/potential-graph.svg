<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">회로를 한 바퀴 도는 동안의 전위 변화 (실제 전지 + 저항)</text>

  <!-- axes -->
  <line x1="80" y1="330" x2="80" y2="64" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <line x1="80" y1="330" x2="740" y2="330" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="72" y="52" text-anchor="middle" font-size="13" fill="#6B7280">전위</text>
  <text x="738" y="352" text-anchor="end" font-size="13" fill="#6B7280">회로 위치</text>

  <!-- dashed guides -->
  <g stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3">
    <line x1="80" y1="130" x2="168" y2="130"/>
    <line x1="168" y1="130" x2="310" y2="130"/>
    <line x1="258" y1="190" x2="310" y2="190"/>
    <line x1="430" y1="190" x2="700" y2="190"/>
  </g>

  <!-- potential profile -->
  <polyline points="100,330 130,330 168,130 258,190 430,190 560,330 660,330"
            fill="none" stroke="#8B0029" stroke-width="2.5"/>

  <!-- marker dots -->
  <circle cx="100" cy="330" r="4" fill="#1a1a1a"/>
  <circle cx="258" cy="190" r="4" fill="#1a1a1a"/>
  <circle cx="660" cy="330" r="4" fill="#1a1a1a"/>
  <text x="100" y="348" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">a</text>
  <text x="258" y="174" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">b</text>
  <text x="660" y="348" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">a</text>

  <!-- emf dimension (left) -->
  <line x1="112" y1="230" x2="112" y2="136" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray)"/>
  <line x1="112" y1="230" x2="112" y2="324" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray)"/>
  <text x="99" y="235" text-anchor="middle" font-size="16" font-style="italic" fill="#8B0029">ℰ</text>
  <text x="150" y="108" text-anchor="start" font-size="12.5" fill="#8B0029">기전력 상승 +ℰ</text>

  <!-- ir dimension -->
  <line x1="300" y1="160" x2="300" y2="136" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray)"/>
  <line x1="300" y1="160" x2="300" y2="184" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray)"/>
  <text x="316" y="158" text-anchor="start" font-size="14" font-style="italic" fill="#1a1a1a">ir</text>
  <text x="316" y="176" text-anchor="start" font-size="11" fill="#6B7280">(내부 저항)</text>

  <!-- iR drop label -->
  <text x="500" y="282" text-anchor="end" font-size="12.5" fill="#6B7280"><tspan font-style="italic">iR</tspan> 하강</text>

  <!-- terminal voltage dimension (right) -->
  <line x1="690" y1="260" x2="690" y2="196" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray)"/>
  <line x1="690" y1="260" x2="690" y2="324" stroke="#6B7280" stroke-width="1" marker-end="url(#arrGray)"/>
  <text x="676" y="268" text-anchor="end" font-size="14" fill="#8B0029"><tspan font-style="italic">V</tspan> = <tspan font-style="italic">ℰ</tspan> − <tspan font-style="italic">ir</tspan></text>

  <!-- region bands -->
  <rect x="130" y="352" width="128" height="26" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="194" y="369" text-anchor="middle" font-size="12" fill="#6B7280">기전력 장치 (ℰ, r)</text>
  <rect x="430" y="352" width="130" height="26" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="495" y="369" text-anchor="middle" font-size="12" fill="#6B7280">저항 R</text>

  <!-- equation -->
  <text x="390" y="424" text-anchor="middle" font-size="15" fill="#8B0029">한 바퀴 돌아 제자리로:  +<tspan font-style="italic">ℰ</tspan> − <tspan font-style="italic">ir</tspan> − <tspan font-style="italic">iR</tspan> = 0  <tspan fill="#6B7280">(전위 변화의 합 = 0)</tspan></text>
</svg>
