<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">전류계와 전압계의 연결</text>

  <!-- main loop wires -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="140" y1="80" x2="520" y2="80"/>
    <line x1="520" y1="80" x2="520" y2="150"/>
    <line x1="520" y1="210" x2="520" y2="340"/>
    <line x1="520" y1="340" x2="344" y2="340"/>
    <line x1="296" y1="340" x2="140" y2="340"/>
    <line x1="140" y1="340" x2="140" y2="199"/>
    <line x1="140" y1="185" x2="140" y2="80"/>
  </g>

  <!-- battery -->
  <line x1="120" y1="185" x2="160" y2="185" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="129" y1="199" x2="151" y2="199" stroke="#1a1a1a" stroke-width="4.5"/>
  <circle cx="102" cy="212" r="3" fill="none" stroke="#8B0029" stroke-width="1.5"/>
  <line x1="102" y1="206" x2="102" y2="172" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="102" y="162" text-anchor="middle" font-size="16" font-style="italic" fill="#8B0029">ℰ</text>

  <!-- resistor R -->
  <path d="M 520 150 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="496" y="185" text-anchor="end" font-size="16" font-style="italic" fill="#1a1a1a">R</text>

  <!-- voltmeter tap nodes and wires -->
  <circle cx="520" cy="130" r="4" fill="#1a1a1a"/>
  <circle cx="520" cy="230" r="4" fill="#1a1a1a"/>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <polyline points="520,130 655,130 655,156"/>
    <polyline points="520,230 655,230 655,204"/>
  </g>
  <circle cx="655" cy="180" r="24" fill="#F3F4F6" stroke="#2563EB" stroke-width="2.5"/>
  <text x="655" y="187" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563EB">V</text>

  <!-- ammeter in bottom wire -->
  <circle cx="320" cy="340" r="24" fill="#F3F4F6" stroke="#8B0029" stroke-width="2.5"/>
  <text x="320" y="347" text-anchor="middle" font-size="17" font-weight="bold" fill="#8B0029">A</text>

  <!-- current arrows -->
  <line x1="300" y1="80" x2="360" y2="80" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="330" y="65" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>
  <line x1="470" y1="340" x2="410" y2="340" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="440" y="364" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>

  <!-- annotations -->
  <text x="240" y="390" text-anchor="middle" font-size="12.5" fill="#6B7280">전류계(A): 회로를 끊고 <tspan fill="#8B0029" font-weight="bold">직렬</tspan>로 삽입,</text>
  <text x="240" y="408" text-anchor="middle" font-size="12.5" fill="#6B7280">저항이 매우 작아야 한다 (<tspan font-style="italic">R</tspan><tspan font-size="9.5" dy="3">A</tspan><tspan dy="-3"> ≈ 0)</tspan></text>
  <text x="635" y="290" text-anchor="middle" font-size="12.5" fill="#6B7280">전압계(V): 두 점 사이에 <tspan fill="#2563EB" font-weight="bold">병렬</tspan>로,</text>
  <text x="635" y="308" text-anchor="middle" font-size="12.5" fill="#6B7280">저항이 매우 커야 한다 (<tspan font-style="italic">R</tspan><tspan font-size="9.5" dy="3">V</tspan><tspan dy="-3"> ≈ ∞)</tspan></text>
</svg>
