<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">단일 루프 회로: 이상적인 전지와 저항</text>

  <!-- wires -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="180" y1="70" x2="540" y2="70"/>
    <line x1="540" y1="70" x2="540" y2="160"/>
    <line x1="540" y1="220" x2="540" y2="320"/>
    <line x1="540" y1="320" x2="180" y2="320"/>
    <line x1="180" y1="320" x2="180" y2="189"/>
    <line x1="180" y1="175" x2="180" y2="70"/>
  </g>

  <!-- battery symbol (+ top) -->
  <line x1="160" y1="175" x2="200" y2="175" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="169" y1="189" x2="191" y2="189" stroke="#1a1a1a" stroke-width="4.5"/>
  <text x="212" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="212" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">−</text>

  <!-- emf arrow -->
  <circle cx="142" cy="206" r="3" fill="none" stroke="#8B0029" stroke-width="1.5"/>
  <line x1="142" y1="200" x2="142" y2="162" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="142" y="150" text-anchor="middle" font-size="17" font-style="italic" fill="#8B0029">ℰ</text>

  <!-- resistor -->
  <path d="M 540 160 l -9 5 l 18 10 l -18 10 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="566" y="195" text-anchor="start" font-size="16" font-style="italic" fill="#1a1a1a">R</text>

  <!-- current arrows -->
  <g stroke="#2563EB" stroke-width="2.5">
    <line x1="320" y1="70" x2="390" y2="70" marker-end="url(#arrBlue)"/>
    <line x1="540" y1="100" x2="540" y2="138" marker-end="url(#arrBlue)"/>
    <line x1="390" y1="320" x2="320" y2="320" marker-end="url(#arrBlue)"/>
    <line x1="180" y1="290" x2="180" y2="252" marker-end="url(#arrBlue)"/>
  </g>
  <text x="355" y="55" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>
  <text x="558" y="122" text-anchor="start" font-size="15" font-style="italic" fill="#2563EB">i</text>
  <text x="355" y="345" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>
  <text x="162" y="275" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">i</text>

  <!-- start point a -->
  <circle cx="180" cy="320" r="4" fill="#1a1a1a"/>
  <text x="163" y="338" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">a</text>

  <!-- traversal arc -->
  <path d="M 308 165 A 60 60 0 1 1 308 225" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <text x="360" y="200" text-anchor="middle" font-size="12.5" fill="#6B7280">순회 방향</text>

  <!-- equation -->
  <text x="360" y="368" text-anchor="middle" font-size="15" fill="#8B0029">루프 법칙:  +<tspan font-style="italic">ℰ</tspan> − <tspan font-style="italic">iR</tspan> = 0   →   <tspan font-style="italic">i</tspan> = <tspan font-style="italic">ℰ</tspan>/<tspan font-style="italic">R</tspan></text>
</svg>
