<svg viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="215" y="52" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">충전: 전하 <tspan font-style="italic">q</tspan>(<tspan font-style="italic">t</tspan>)</text>
  <text x="595" y="52" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">충전: 전류 <tspan font-style="italic">i</tspan>(<tspan font-style="italic">t</tspan>)</text>

  <!-- ===== left panel: q(t) ===== -->
  <line x1="90" y1="360" x2="90" y2="88" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <line x1="90" y1="360" x2="384" y2="360" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="90" y="76" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">q</text>
  <text x="396" y="365" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">t</text>

  <line x1="90" y1="130" x2="370" y2="130" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="84" y="134" text-anchor="end" font-size="13" fill="#1a1a1a"><tspan font-style="italic">Cℰ</tspan></text>

  <polyline points="90,360 100,324.7 110,294.8 120,269.5 130,248.1 140,230.0 150,214.6 165,195.9 180,181.3 195,170.0 210,161.1 230,152.3 250,146.0 270,141.4 290,138.2 310,135.9 330,134.2 350,133.0 370,132.2"
            fill="none" stroke="#8B0029" stroke-width="2.5"/>

  <line x1="150" y1="360" x2="150" y2="214.6" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="90" y1="214.6" x2="150" y2="214.6" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="150" cy="214.6" r="4.5" fill="#2563EB"/>
  <text x="150" y="382" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">τ</text>
  <text x="84" y="219" text-anchor="end" font-size="12.5" fill="#2563EB">0.63<tspan font-style="italic">Cℰ</tspan></text>

  <text x="225" y="416" text-anchor="middle" font-size="14.5" fill="#8B0029"><tspan font-style="italic">q</tspan>(<tspan font-style="italic">t</tspan>) = <tspan font-style="italic">Cℰ</tspan>(1 − <tspan font-style="italic">e</tspan><tspan font-size="11" dy="-6" font-style="italic">−t/RC</tspan><tspan dy="6">)</tspan></text>

  <!-- ===== right panel: i(t) ===== -->
  <line x1="470" y1="360" x2="470" y2="88" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <line x1="470" y1="360" x2="744" y2="360" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="470" y="76" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">i</text>
  <text x="756" y="365" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">t</text>

  <line x1="470" y1="130" x2="730" y2="130" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="464" y="134" text-anchor="end" font-size="13" fill="#1a1a1a"><tspan font-style="italic">ℰ</tspan>/<tspan font-style="italic">R</tspan></text>

  <polyline points="470,130 480,165.3 490,195.2 500,220.5 510,241.9 520,260.0 530,275.4 545,294.1 560,308.7 575,320.0 590,328.9 610,337.7 630,344.0 650,348.5 680,353.0 705,355.2 730,357.0"
            fill="none" stroke="#2563EB" stroke-width="2.5"/>

  <line x1="530" y1="360" x2="530" y2="275.4" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="470" y1="275.4" x2="530" y2="275.4" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="530" cy="275.4" r="4.5" fill="#8B0029"/>
  <text x="530" y="382" text-anchor="middle" font-size="15" font-style="italic" fill="#1a1a1a">τ</text>
  <text x="464" y="280" text-anchor="end" font-size="12.5" fill="#8B0029">0.37<tspan font-style="italic">ℰ</tspan>/<tspan font-style="italic">R</tspan></text>

  <text x="605" y="416" text-anchor="middle" font-size="14.5" fill="#2563EB"><tspan font-style="italic">i</tspan>(<tspan font-style="italic">t</tspan>) = (<tspan font-style="italic">ℰ</tspan>/<tspan font-style="italic">R</tspan>)<tspan font-style="italic">e</tspan><tspan font-size="11" dy="-6" font-style="italic">−t/RC</tspan></text>
</svg>
