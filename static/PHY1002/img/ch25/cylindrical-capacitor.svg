<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="sans-serif">
  <defs>
    <marker id="cyB" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="cyG" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="360" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">원통형 축전기 (축에 수직인 단면)</text>

  <!-- outer shell (annulus) -->
  <circle cx="250" cy="240" r="155" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <circle cx="250" cy="240" r="130" fill="white" stroke="#6B7280" stroke-width="2"/>
  <!-- minus charges on inner surface of outer shell -->
  <text x="250" y="127" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="335" y="163" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="372" y="245" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="335" y="327" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="250" y="363" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="165" y="327" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="128" y="245" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="165" y="163" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>

  <!-- Gaussian circle -->
  <circle cx="250" cy="240" r="95" fill="none" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- inner conductor -->
  <circle cx="250" cy="240" r="50" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <!-- plus charges on surface of inner conductor -->
  <text x="250" y="208" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="279" y="228" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="279" y="262" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="250" y="282" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="221" y="262" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="221" y="228" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>

  <!-- E field arrows (radial, outward) between inner and gaussian -->
  <line x1="250" y1="182" x2="250" y2="150" stroke="#2563EB" stroke-width="2.5" marker-end="url(#cyB)"/>
  <line x1="308" y1="240" x2="340" y2="240" stroke="#2563EB" stroke-width="2.5" marker-end="url(#cyB)"/>
  <line x1="250" y1="298" x2="250" y2="330" stroke="#2563EB" stroke-width="2.5" marker-end="url(#cyB)"/>
  <line x1="192" y1="240" x2="160" y2="240" stroke="#2563EB" stroke-width="2.5" marker-end="url(#cyB)"/>
  <text x="264" y="146" font-size="14" fill="#2563EB" font-style="italic" font-weight="bold">E</text>

  <!-- radius arrows -->
  <line x1="250" y1="240" x2="284" y2="203" stroke="#6B7280" stroke-width="1.5" marker-end="url(#cyG)"/>
  <text x="278" y="196" font-size="14" fill="#6B7280" font-style="italic">a</text>
  <line x1="250" y1="240" x2="316" y2="174" stroke="#8B0029" stroke-width="1.5"/>
  <circle cx="317" cy="173" r="3" fill="#8B0029"/>
  <text x="330" y="168" font-size="14" fill="#8B0029" font-style="italic" font-weight="bold">r</text>
  <line x1="250" y1="240" x2="152" y2="130" stroke="#6B7280" stroke-width="1.5" marker-end="url(#cyG)"/>
  <text x="140" y="122" font-size="14" fill="#6B7280" font-style="italic">b</text>

  <!-- legend on right -->
  <text x="460" y="150" font-size="14" fill="#1a1a1a">길이 <tspan font-style="italic">L</tspan> (지면에 수직, <tspan font-style="italic">L</tspan> ≫ <tspan font-style="italic">b</tspan>)</text>
  <text x="460" y="182" font-size="14" fill="#8B0029">안쪽 도체(반지름 a): 전하 +q</text>
  <text x="460" y="214" font-size="14" fill="#2563EB">바깥 도체(반지름 b): 전하 −q</text>
  <text x="460" y="246" font-size="14" fill="#8B0029">빨강 점선: 반지름 r인 원통형</text>
  <text x="460" y="266" font-size="14" fill="#8B0029">가우스면 (a &lt; r &lt; b)</text>
  <text x="460" y="298" font-size="14" fill="#2563EB">파랑 화살표: 지름 방향 전기장</text>

  <!-- caption -->
  <text x="360" y="422" font-size="14" fill="#1a1a1a" text-anchor="middle">가우스 법칙: q = ε₀E(2πrL)  →  E = q / (2πε₀Lr)</text>
</svg>
