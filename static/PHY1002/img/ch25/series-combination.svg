<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="sans-serif">
  <defs>
    <marker id="seG" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="30" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">직렬 연결: 모든 축전기에 같은 전하 q ("seri-q")</text>

  <!-- left circuit -->
  <line x1="110" y1="90" x2="340" y2="90" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="110" y1="90" x2="110" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="110" y1="217" x2="110" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="110" y1="330" x2="340" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <!-- battery -->
  <line x1="82" y1="175" x2="138" y2="175" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="95" y1="195" x2="125" y2="195" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="110" y1="195" x2="110" y2="217" stroke="#1a1a1a" stroke-width="2"/>
  <text x="68" y="172" font-size="14" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="68" y="204" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="84" y="242" font-size="15" fill="#1a1a1a" text-anchor="middle" font-style="italic" font-weight="bold">V</text>

  <!-- series branch -->
  <line x1="340" y1="90" x2="340" y2="130" stroke="#1a1a1a" stroke-width="2"/>
  <!-- cap 1 -->
  <line x1="316" y1="130" x2="364" y2="130" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="316" y1="146" x2="364" y2="146" stroke="#1a1a1a" stroke-width="3"/>
  <text x="385" y="143" font-size="14" fill="#1a1a1a" font-style="italic">C₁</text>
  <text x="308" y="128" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="end" font-style="italic">+q</text>
  <text x="308" y="160" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="end" font-style="italic">−q</text>
  <text x="440" y="143" font-size="13" fill="#6B7280" font-style="italic">V₁ = q/C₁</text>
  <line x1="340" y1="146" x2="340" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <!-- cap 2 -->
  <line x1="316" y1="195" x2="364" y2="195" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="316" y1="211" x2="364" y2="211" stroke="#1a1a1a" stroke-width="3"/>
  <text x="385" y="208" font-size="14" fill="#1a1a1a" font-style="italic">C₂</text>
  <text x="308" y="193" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="end" font-style="italic">+q</text>
  <text x="308" y="225" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="end" font-style="italic">−q</text>
  <text x="440" y="208" font-size="13" fill="#6B7280" font-style="italic">V₂ = q/C₂</text>
  <line x1="340" y1="211" x2="340" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <!-- cap 3 -->
  <line x1="316" y1="260" x2="364" y2="260" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="316" y1="276" x2="364" y2="276" stroke="#1a1a1a" stroke-width="3"/>
  <text x="385" y="273" font-size="14" fill="#1a1a1a" font-style="italic">C₃</text>
  <text x="308" y="258" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="end" font-style="italic">+q</text>
  <text x="308" y="290" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="end" font-style="italic">−q</text>
  <text x="440" y="273" font-size="13" fill="#6B7280" font-style="italic">V₃ = q/C₃</text>
  <line x1="340" y1="276" x2="340" y2="330" stroke="#1a1a1a" stroke-width="2"/>

  <!-- isolated section highlight -->
  <rect x="256" y="140" width="118" height="62" rx="8" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="244" y="120" font-size="12.5" fill="#6B7280" text-anchor="end">고립 구간 (알짜 전하 0)</text>
  <line x1="248" y1="124" x2="268" y2="140" stroke="#6B7280" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- equivalence arrow -->
  <line x1="500" y1="210" x2="555" y2="210" stroke="#6B7280" stroke-width="2" marker-end="url(#seG)"/>
  <text x="527" y="195" font-size="13" fill="#6B7280" text-anchor="middle">등가</text>

  <!-- right equivalent circuit -->
  <line x1="590" y1="90" x2="700" y2="90" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="330" x2="700" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="90" x2="590" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="217" x2="590" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="562" y1="175" x2="618" y2="175" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="575" y1="195" x2="605" y2="195" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="590" y1="195" x2="590" y2="217" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="700" y1="90" x2="700" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="676" y1="195" x2="724" y2="195" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="676" y1="211" x2="724" y2="211" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="700" y1="211" x2="700" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <text x="700" y="243" font-size="14" fill="#1a1a1a" text-anchor="middle" font-style="italic">C<tspan dy="4" font-size="11">eq</tspan></text>
  <text x="668" y="192" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="end" font-style="italic">+q</text>
  <text x="668" y="225" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="end" font-style="italic">−q</text>

  <!-- caption -->
  <text x="380" y="372" font-size="14" fill="#1a1a1a" text-anchor="middle">배터리는 양 끝 판만 직접 대전시키고, 중간 판들은 유도로 대전된다 → 전하가 모두 q로 같다</text>
  <text x="380" y="400" font-size="14" fill="#8B0029" text-anchor="middle" font-weight="bold">V = V₁ + V₂ + V₃  →  1/C<tspan dy="4" font-size="11">eq</tspan><tspan dy="-4"> = 1/C₁ + 1/C₂ + 1/C₃</tspan></text>
</svg>
