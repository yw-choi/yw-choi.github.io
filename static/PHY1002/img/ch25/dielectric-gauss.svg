<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="sans-serif">
  <defs>
    <marker id="dgB" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="350" y="30" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">유전체가 있을 때의 가우스 법칙</text>

  <!-- Gaussian surface (encloses +q on plate and -q' on dielectric face) -->
  <rect x="185" y="98" width="330" height="84" fill="none" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="185" y="88" font-size="14" fill="#8B0029" font-weight="bold">가우스면</text>

  <!-- top plate -->
  <rect x="170" y="108" width="360" height="22" fill="white" stroke="#6B7280" stroke-width="2"/>
  <!-- +q on bottom face -->
  <text x="215" y="147" font-size="14" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="270" y="147" font-size="14" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="325" y="147" font-size="14" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="380" y="147" font-size="14" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="435" y="147" font-size="14" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="490" y="147" font-size="14" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="548" y="124" font-size="14" fill="#8B0029" font-weight="bold" font-style="italic">+q</text>
  <text x="548" y="141" font-size="12" fill="#6B7280">(자유 전하)</text>

  <!-- dielectric slab -->
  <rect x="170" y="155" width="360" height="150" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="196" y="238" font-size="22" fill="#6B7280" font-style="italic">κ</text>
  <!-- induced -q' on top face of dielectric -->
  <text x="240" y="174" font-size="13" fill="#2563EB" text-anchor="middle">−</text>
  <text x="295" y="174" font-size="13" fill="#2563EB" text-anchor="middle">−</text>
  <text x="350" y="174" font-size="13" fill="#2563EB" text-anchor="middle">−</text>
  <text x="405" y="174" font-size="13" fill="#2563EB" text-anchor="middle">−</text>
  <text x="460" y="174" font-size="13" fill="#2563EB" text-anchor="middle">−</text>
  <text x="548" y="176" font-size="14" fill="#2563EB" font-weight="bold" font-style="italic">−q′</text>
  <text x="548" y="193" font-size="12" fill="#6B7280">(유도 전하)</text>
  <!-- induced +q' on bottom face -->
  <text x="240" y="298" font-size="13" fill="#8B0029" text-anchor="middle">+</text>
  <text x="295" y="298" font-size="13" fill="#8B0029" text-anchor="middle">+</text>
  <text x="350" y="298" font-size="13" fill="#8B0029" text-anchor="middle">+</text>
  <text x="405" y="298" font-size="13" fill="#8B0029" text-anchor="middle">+</text>
  <text x="460" y="298" font-size="13" fill="#8B0029" text-anchor="middle">+</text>
  <text x="548" y="300" font-size="14" fill="#8B0029" font-weight="bold" font-style="italic">+q′</text>

  <!-- E arrow inside dielectric -->
  <line x1="350" y1="195" x2="350" y2="278" stroke="#2563EB" stroke-width="2.5" marker-end="url(#dgB)"/>
  <text x="368" y="240" font-size="14" fill="#2563EB" font-weight="bold" font-style="italic">E = E₀/κ</text>

  <!-- bottom plate -->
  <text x="215" y="325" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="270" y="325" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="325" y="325" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="380" y="325" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="435" y="325" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="490" y="325" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <rect x="170" y="332" width="360" height="22" fill="white" stroke="#6B7280" stroke-width="2"/>
  <text x="548" y="349" font-size="14" fill="#2563EB" font-weight="bold" font-style="italic">−q</text>

  <!-- caption -->
  <text x="350" y="392" font-size="14" fill="#1a1a1a" text-anchor="middle">가우스면이 둘러싼 알짜 전하는 q − q′ (자유 전하 + 유도 전하)</text>
  <text x="350" y="418" font-size="14" fill="#8B0029" text-anchor="middle" font-weight="bold">ε₀ ∮ κE·dA = q  (우변에는 자유 전하만 쓴다)</text>
</svg>
