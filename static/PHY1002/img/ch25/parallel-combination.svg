<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="sans-serif">
  <defs>
    <marker id="paG" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="30" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">병렬 연결: 모든 축전기에 같은 전위차 V ("par-V")</text>

  <!-- left circuit -->
  <line x1="100" y1="120" x2="440" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="100" y1="310" x2="440" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="100" y1="120" x2="100" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="100" y1="237" x2="100" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <!-- battery -->
  <line x1="72" y1="195" x2="128" y2="195" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="85" y1="215" x2="115" y2="215" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="100" y1="215" x2="100" y2="237" stroke="#1a1a1a" stroke-width="2"/>
  <text x="58" y="192" font-size="14" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="58" y="224" font-size="14" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="74" y="262" font-size="15" fill="#1a1a1a" text-anchor="middle" font-style="italic" font-weight="bold">V</text>

  <!-- branch 1 -->
  <line x1="200" y1="120" x2="200" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="176" y1="200" x2="224" y2="200" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="176" y1="216" x2="224" y2="216" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="200" y1="216" x2="200" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <text x="232" y="213" font-size="14" fill="#1a1a1a" font-style="italic">C₁</text>
  <text x="168" y="197" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="end" font-style="italic">+q₁</text>
  <text x="168" y="230" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="end" font-style="italic">−q₁</text>

  <!-- branch 2 -->
  <line x1="320" y1="120" x2="320" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="296" y1="200" x2="344" y2="200" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="296" y1="216" x2="344" y2="216" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="320" y1="216" x2="320" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <text x="352" y="213" font-size="14" fill="#1a1a1a" font-style="italic">C₂</text>
  <text x="288" y="197" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="end" font-style="italic">+q₂</text>
  <text x="288" y="230" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="end" font-style="italic">−q₂</text>

  <!-- branch 3 -->
  <line x1="440" y1="120" x2="440" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="416" y1="200" x2="464" y2="200" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="416" y1="216" x2="464" y2="216" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="440" y1="216" x2="440" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <text x="472" y="213" font-size="14" fill="#1a1a1a" font-style="italic">C₃</text>
  <text x="408" y="197" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="end" font-style="italic">+q₃</text>
  <text x="408" y="230" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="end" font-style="italic">−q₃</text>

  <!-- equivalence arrow -->
  <line x1="500" y1="215" x2="555" y2="215" stroke="#6B7280" stroke-width="2" marker-end="url(#paG)"/>
  <text x="527" y="200" font-size="13" fill="#6B7280" text-anchor="middle">등가</text>

  <!-- right equivalent circuit -->
  <line x1="590" y1="120" x2="700" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="310" x2="700" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="120" x2="590" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="237" x2="590" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="562" y1="195" x2="618" y2="195" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="575" y1="215" x2="605" y2="215" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="590" y1="215" x2="590" y2="237" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="700" y1="120" x2="700" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="676" y1="200" x2="724" y2="200" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="676" y1="216" x2="724" y2="216" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="700" y1="216" x2="700" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <text x="700" y="248" font-size="14" fill="#1a1a1a" text-anchor="middle" font-style="italic">C<tspan dy="4" font-size="11">eq</tspan></text>

  <!-- caption -->
  <text x="380" y="360" font-size="14" fill="#1a1a1a" text-anchor="middle">위 판들은 모두 + 단자에, 아래 판들은 모두 − 단자에 직접 연결 → 전위차가 모두 V로 같다</text>
  <text x="380" y="388" font-size="14" fill="#8B0029" text-anchor="middle" font-weight="bold">총 전하 q = q₁ + q₂ + q₃  →  C<tspan dy="4" font-size="11">eq</tspan><tspan dy="-4"> = C₁ + C₂ + C₃</tspan></text>
</svg>
