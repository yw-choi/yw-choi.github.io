<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="sans-serif">
  <defs>
    <marker id="chB" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="350" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">축전기 충전 회로: 배터리 B + 스위치 S + 축전기 C</text>

  <!-- circuit wires -->
  <!-- top wire: from battery top to switch, switch to capacitor top -->
  <line x1="180" y1="110" x2="320" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="382" y1="110" x2="540" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <!-- right wire down to capacitor top plate -->
  <line x1="540" y1="110" x2="540" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <!-- capacitor plates -->
  <line x1="500" y1="185" x2="580" y2="185" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="500" y1="213" x2="580" y2="213" stroke="#1a1a1a" stroke-width="3"/>
  <!-- right wire from bottom plate down -->
  <line x1="540" y1="213" x2="540" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <!-- bottom wire -->
  <line x1="180" y1="300" x2="540" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <!-- left wires to battery -->
  <line x1="180" y1="110" x2="180" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="180" y1="228" x2="180" y2="300" stroke="#1a1a1a" stroke-width="2"/>

  <!-- battery symbol -->
  <line x1="148" y1="185" x2="212" y2="185" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="163" y1="205" x2="197" y2="205" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="180" y1="205" x2="180" y2="228" stroke="#1a1a1a" stroke-width="2"/>
  <text x="132" y="182" font-size="15" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="132" y="215" font-size="15" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="93" y="200" font-size="14" fill="#1a1a1a" text-anchor="middle">배터리 B</text>
  <text x="93" y="220" font-size="13" fill="#6B7280" text-anchor="middle" font-style="italic">V</text>

  <!-- switch (open) -->
  <circle cx="320" cy="110" r="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="382" cy="110" r="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="324" y1="108" x2="376" y2="82" stroke="#1a1a1a" stroke-width="2"/>
  <text x="351" y="66" font-size="14" fill="#1a1a1a" text-anchor="middle">스위치 S</text>

  <!-- capacitor labels -->
  <text x="596" y="182" font-size="14" fill="#1a1a1a">h 판</text>
  <text x="596" y="226" font-size="14" fill="#1a1a1a">l 판</text>
  <text x="640" y="204" font-size="15" fill="#1a1a1a" font-style="italic" font-weight="bold">C</text>
  <text x="478" y="180" font-size="15" fill="#8B0029" font-weight="bold" text-anchor="middle" font-style="italic">+q</text>
  <text x="478" y="228" font-size="15" fill="#2563EB" font-weight="bold" text-anchor="middle" font-style="italic">−q</text>

  <!-- electron flow arrows (blue, dashed leaders) -->
  <line x1="470" y1="88" x2="410" y2="88" stroke="#2563EB" stroke-width="2.5" marker-end="url(#chB)"/>
  <text x="440" y="76" font-size="13" fill="#2563EB" text-anchor="middle">전자 e⁻</text>
  <line x1="250" y1="322" x2="310" y2="322" stroke="#2563EB" stroke-width="2.5" marker-end="url(#chB)"/>
  <text x="280" y="342" font-size="13" fill="#2563EB" text-anchor="middle">전자 e⁻</text>

  <!-- caption -->
  <text x="350" y="378" font-size="14" fill="#1a1a1a" text-anchor="middle">스위치를 닫으면 전자가 h판 → +단자, −단자 → l판으로 이동. 판의 전위차가 V가 되면 멈춘다</text>
</svg>
