<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="sans-serif">
  <defs>
    <marker id="dpB" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="dpR" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8B0029"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="30" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">유전체의 분극(polarization): 내부 전기장이 약해지는 이유</text>

  <!-- left plate (+) -->
  <rect x="110" y="95" width="26" height="260" fill="white" stroke="#6B7280" stroke-width="2"/>
  <text x="123" y="120" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="123" y="153" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="123" y="186" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="123" y="219" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="123" y="252" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="123" y="285" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="123" y="318" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="123" y="348" font-size="13" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="123" y="380" font-size="13" fill="#1a1a1a" text-anchor="middle">+판</text>

  <!-- right plate (-) -->
  <rect x="624" y="95" width="26" height="260" fill="white" stroke="#6B7280" stroke-width="2"/>
  <text x="637" y="120" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="637" y="153" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="637" y="186" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="637" y="219" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="637" y="252" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="637" y="285" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="637" y="318" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="637" y="348" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="637" y="380" font-size="13" fill="#1a1a1a" text-anchor="middle">−판</text>

  <!-- dielectric slab -->
  <rect x="168" y="105" width="424" height="240" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>

  <!-- induced surface charges -->
  <text x="181" y="132" font-size="13" fill="#2563EB" text-anchor="middle">−</text>
  <text x="181" y="172" font-size="13" fill="#2563EB" text-anchor="middle">−</text>
  <text x="181" y="212" font-size="13" fill="#2563EB" text-anchor="middle">−</text>
  <text x="181" y="252" font-size="13" fill="#2563EB" text-anchor="middle">−</text>
  <text x="181" y="292" font-size="13" fill="#2563EB" text-anchor="middle">−</text>
  <text x="181" y="332" font-size="13" fill="#2563EB" text-anchor="middle">−</text>
  <text x="579" y="132" font-size="13" fill="#8B0029" text-anchor="middle">+</text>
  <text x="579" y="172" font-size="13" fill="#8B0029" text-anchor="middle">+</text>
  <text x="579" y="212" font-size="13" fill="#8B0029" text-anchor="middle">+</text>
  <text x="579" y="252" font-size="13" fill="#8B0029" text-anchor="middle">+</text>
  <text x="579" y="292" font-size="13" fill="#8B0029" text-anchor="middle">+</text>
  <text x="579" y="332" font-size="13" fill="#8B0029" text-anchor="middle">+</text>
  <text x="181" y="96" font-size="13" fill="#2563EB" text-anchor="middle" font-style="italic">−q′</text>
  <text x="579" y="96" font-size="13" fill="#8B0029" text-anchor="middle" font-style="italic">+q′</text>

  <!-- aligned dipole molecules (top and bottom rows) -->
  <g stroke="#6B7280" stroke-width="1" fill="white">
    <ellipse cx="250" cy="150" rx="21" ry="11"/>
    <ellipse cx="330" cy="150" rx="21" ry="11"/>
    <ellipse cx="410" cy="150" rx="21" ry="11"/>
    <ellipse cx="490" cy="150" rx="21" ry="11"/>
    <ellipse cx="250" cy="305" rx="21" ry="11"/>
    <ellipse cx="330" cy="305" rx="21" ry="11"/>
    <ellipse cx="410" cy="305" rx="21" ry="11"/>
    <ellipse cx="490" cy="305" rx="21" ry="11"/>
  </g>
  <g font-size="11" font-weight="bold">
    <text x="241" y="154" fill="#2563EB" text-anchor="middle">−</text><text x="259" y="154" fill="#8B0029" text-anchor="middle">+</text>
    <text x="321" y="154" fill="#2563EB" text-anchor="middle">−</text><text x="339" y="154" fill="#8B0029" text-anchor="middle">+</text>
    <text x="401" y="154" fill="#2563EB" text-anchor="middle">−</text><text x="419" y="154" fill="#8B0029" text-anchor="middle">+</text>
    <text x="481" y="154" fill="#2563EB" text-anchor="middle">−</text><text x="499" y="154" fill="#8B0029" text-anchor="middle">+</text>
    <text x="241" y="309" fill="#2563EB" text-anchor="middle">−</text><text x="259" y="309" fill="#8B0029" text-anchor="middle">+</text>
    <text x="321" y="309" fill="#2563EB" text-anchor="middle">−</text><text x="339" y="309" fill="#8B0029" text-anchor="middle">+</text>
    <text x="401" y="309" fill="#2563EB" text-anchor="middle">−</text><text x="419" y="309" fill="#8B0029" text-anchor="middle">+</text>
    <text x="481" y="309" fill="#2563EB" text-anchor="middle">−</text><text x="499" y="309" fill="#8B0029" text-anchor="middle">+</text>
  </g>
  <text x="370" y="181" font-size="12" fill="#6B7280" text-anchor="middle">정렬된 쌍극자 분자들</text>

  <!-- field arrows in the middle band -->
  <line x1="240" y1="200" x2="380" y2="200" stroke="#2563EB" stroke-width="2.5" marker-end="url(#dpB)"/>
  <text x="398" y="204" font-size="13" fill="#2563EB">E₀ : 판의 전하가 만드는 장</text>
  <line x1="310" y1="235" x2="240" y2="235" stroke="#8B0029" stroke-width="2.5" marker-end="url(#dpR)"/>
  <text x="398" y="239" font-size="13" fill="#8B0029">E′ : 유도 전하가 만드는 반대 방향 장</text>
  <line x1="240" y1="270" x2="310" y2="270" stroke="#2563EB" stroke-width="3.5" marker-end="url(#dpB)"/>
  <text x="398" y="274" font-size="13" fill="#1a1a1a" font-weight="bold">알짜 장 E = E₀/κ (약해짐)</text>

  <!-- caption -->
  <text x="380" y="410" font-size="14" fill="#1a1a1a" text-anchor="middle">극성 유전체는 쌍극자가 정렬하고, 비극성 유전체는 장이 분자를 늘여 쌍극자를 유도한다</text>
  <text x="380" y="432" font-size="13" fill="#6B7280" text-anchor="middle">두 경우 모두 표면 유도 전하 ±q′가 생겨 내부 장을 약하게 만든다</text>
</svg>
