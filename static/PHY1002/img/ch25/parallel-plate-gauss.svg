<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="sans-serif">
  <defs>
    <marker id="ppB" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="ppR" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8B0029"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="350" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">평행판 축전기: 가우스면과 적분 경로</text>

  <!-- Gaussian surface (dashed red box around top plate) -->
  <rect x="185" y="125" width="330" height="60" fill="none" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="185" y="115" font-size="14" fill="#8B0029" font-weight="bold">가우스면</text>

  <!-- top plate -->
  <rect x="170" y="135" width="360" height="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="350" y="151" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">면적 A</text>
  <!-- + charges on bottom face of top plate -->
  <text x="210" y="176" font-size="15" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="260" y="176" font-size="15" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="310" y="176" font-size="15" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="360" y="176" font-size="15" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="410" y="176" font-size="15" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="460" y="176" font-size="15" fill="#8B0029" font-weight="bold" text-anchor="middle">+</text>
  <text x="555" y="152" font-size="15" fill="#8B0029" font-weight="bold" font-style="italic">+q</text>

  <!-- E field arrows -->
  <line x1="230" y1="192" x2="230" y2="283" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ppB)"/>
  <line x1="300" y1="192" x2="300" y2="283" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ppB)"/>
  <line x1="370" y1="192" x2="370" y2="283" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ppB)"/>
  <line x1="440" y1="192" x2="440" y2="283" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ppB)"/>
  <text x="404" y="242" font-size="15" fill="#2563EB" font-style="italic" font-weight="bold">E</text>

  <!-- - charges on top face of bottom plate -->
  <text x="210" y="297" font-size="15" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="260" y="297" font-size="15" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="310" y="297" font-size="15" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="360" y="297" font-size="15" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="410" y="297" font-size="15" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>
  <text x="460" y="297" font-size="15" fill="#2563EB" font-weight="bold" text-anchor="middle">−</text>

  <!-- bottom plate -->
  <rect x="170" y="303" width="360" height="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="555" y="320" font-size="15" fill="#2563EB" font-weight="bold" font-style="italic">−q</text>

  <!-- d dimension on left -->
  <line x1="145" y1="157" x2="145" y2="303" stroke="#6B7280" stroke-width="1"/>
  <line x1="138" y1="157" x2="152" y2="157" stroke="#6B7280" stroke-width="1"/>
  <line x1="138" y1="303" x2="152" y2="303" stroke="#6B7280" stroke-width="1"/>
  <text x="126" y="235" font-size="15" fill="#6B7280" font-style="italic" text-anchor="middle">d</text>

  <!-- integration path (red, from - plate to + plate) -->
  <line x1="600" y1="303" x2="600" y2="165" stroke="#8B0029" stroke-width="2.5" marker-end="url(#ppR)"/>
  <text x="640" y="228" font-size="13" fill="#8B0029" text-anchor="middle">적분 경로</text>
  <text x="640" y="246" font-size="13" fill="#8B0029" text-anchor="middle">(− → +)</text>

  <!-- caption -->
  <text x="350" y="368" font-size="14" fill="#1a1a1a" text-anchor="middle">가우스면(빨강 점선): q = ε₀EA,&#160;&#160;적분 경로(빨강 화살표): V = ∫E ds = Ed</text>
  <text x="350" y="394" font-size="13" fill="#6B7280" text-anchor="middle">판이 충분히 크고 가까우면 가장자리 휘어짐(fringing)은 무시할 수 있다</text>
</svg>
