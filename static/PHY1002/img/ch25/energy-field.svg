<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="sans-serif">
  <defs>
    <marker id="enB" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="350" y="30" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">에너지는 판 사이의 전기장에 저장된다</text>

  <!-- field volume (shaded) -->
  <rect x="150" y="132" width="320" height="146" fill="#F3F4F6"/>

  <!-- top plate -->
  <rect x="150" y="110" width="320" height="22" fill="white" stroke="#6B7280" stroke-width="2"/>
  <text x="310" y="126" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">면적 A</text>
  <text x="486" y="127" font-size="14" fill="#8B0029" font-weight="bold" font-style="italic">+q</text>

  <!-- E field arrows -->
  <line x1="195" y1="145" x2="195" y2="262" stroke="#2563EB" stroke-width="2.5" marker-end="url(#enB)"/>
  <line x1="265" y1="145" x2="265" y2="262" stroke="#2563EB" stroke-width="2.5" marker-end="url(#enB)"/>
  <line x1="335" y1="145" x2="335" y2="262" stroke="#2563EB" stroke-width="2.5" marker-end="url(#enB)"/>
  <line x1="405" y1="145" x2="405" y2="262" stroke="#2563EB" stroke-width="2.5" marker-end="url(#enB)"/>
  <text x="370" y="210" font-size="15" fill="#2563EB" font-style="italic" font-weight="bold">E</text>

  <!-- bottom plate -->
  <rect x="150" y="278" width="320" height="22" fill="white" stroke="#6B7280" stroke-width="2"/>
  <text x="486" y="296" font-size="14" fill="#2563EB" font-weight="bold" font-style="italic">−q</text>

  <!-- d dimension -->
  <line x1="125" y1="132" x2="125" y2="278" stroke="#6B7280" stroke-width="1"/>
  <line x1="118" y1="132" x2="132" y2="132" stroke="#6B7280" stroke-width="1"/>
  <line x1="118" y1="278" x2="132" y2="278" stroke="#6B7280" stroke-width="1"/>
  <text x="106" y="210" font-size="15" fill="#6B7280" font-style="italic" text-anchor="middle">d</text>

  <!-- annotations right -->
  <text x="545" y="170" font-size="14" fill="#1a1a1a">장이 차지하는 부피:</text>
  <text x="545" y="192" font-size="14" fill="#1a1a1a" font-style="italic">Ad</text>
  <text x="545" y="228" font-size="14" fill="#1a1a1a">에너지 밀도:</text>
  <text x="545" y="252" font-size="14" fill="#8B0029" font-weight="bold">u = U/(Ad) = ½ε₀E²</text>

  <!-- caption -->
  <text x="350" y="345" font-size="14" fill="#1a1a1a" text-anchor="middle">회색 영역(부피 Ad)에 균일한 전기장 E가 있고, 총 에너지 U = ½CV²가 이 장에 담겨 있다</text>
  <text x="350" y="372" font-size="13" fill="#6B7280" text-anchor="middle">u = ½ε₀E² 는 평행판에서 유도했지만, 모든 전기장에 대해 성립한다</text>
</svg>
