<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="sans-serif">
  <defs>
    <marker id="ccG" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="350" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">축전기: 절연된 두 도체 (판, plates)</text>

  <!-- field lines (gray, + -> -) drawn first so conductors sit on top -->
  <path d="M 235 165 C 300 75, 400 75, 465 165" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ccG)"/>
  <path d="M 255 175 C 310 130, 390 130, 445 175" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ccG)"/>
  <path d="M 275 200 L 425 200" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ccG)"/>
  <path d="M 255 225 C 310 270, 390 270, 445 225" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ccG)"/>
  <path d="M 235 235 C 300 325, 400 325, 465 235" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ccG)"/>

  <!-- conductors -->
  <ellipse cx="220" cy="200" rx="56" ry="42" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="220" y="208" font-size="20" fill="white" text-anchor="middle" font-weight="bold" font-style="italic">+q</text>
  <ellipse cx="480" cy="200" rx="56" ry="42" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="480" y="208" font-size="20" fill="white" text-anchor="middle" font-weight="bold" font-style="italic">−q</text>

  <!-- E label on middle field line -->
  <text x="350" y="188" font-size="15" fill="#6B7280" text-anchor="middle" font-style="italic" font-weight="bold">E</text>

  <!-- potential difference dimension -->
  <line x1="220" y1="252" x2="220" y2="330" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="480" y1="252" x2="480" y2="330" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="220" y1="330" x2="480" y2="330" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="220" y1="322" x2="220" y2="338" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="480" y1="322" x2="480" y2="338" stroke="#6B7280" stroke-width="1.6"/>
  <text x="350" y="352" font-size="15" fill="#1a1a1a" text-anchor="middle">전위차 <tspan font-style="italic">V</tspan></text>

  <!-- caption -->
  <text x="350" y="384" font-size="14" fill="#1a1a1a" text-anchor="middle">두 판의 전하는 크기가 같고 부호가 반대 — "축전기의 전하"는 한 판의 크기 q를 뜻한다</text>
</svg>
