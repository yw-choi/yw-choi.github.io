<svg viewBox="0 0 800 360" width="800" height="360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="rR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="rRf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029" opacity="0.55"/>
    </marker>
    <marker id="rD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <line x1="400" y1="30" x2="400" y2="330" stroke="#6B7280" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- ===== left: total absorption ===== -->
  <text x="200" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">완전 흡수 (total absorption)</text>

  <rect x="270" y="80" width="30" height="190" fill="#F3F4F6" stroke="#1a1a1a" stroke-width="2"/>
  <g stroke="#8B0029" stroke-width="2.5">
    <line x1="70" y1="120" x2="262" y2="120" marker-end="url(#rR)"/>
    <line x1="70" y1="165" x2="262" y2="165" marker-end="url(#rR)"/>
    <line x1="70" y1="210" x2="262" y2="210" marker-end="url(#rR)"/>
  </g>
  <text x="150" y="100" text-anchor="middle" font-size="12.5" fill="#8B0029">입사 복사 (세기 <tspan font-style="italic">I</tspan>)</text>

  <line x1="308" y1="175" x2="346" y2="175" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#rD)"/>
  <text x="330" y="160" text-anchor="middle" font-size="14" font-style="italic" font-weight="bold" fill="#1a1a1a">F</text>

  <text x="185" y="302" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">Δp = ΔU/c</text>
  <text x="185" y="330" text-anchor="middle" font-size="14" font-style="italic" fill="#8B0029" font-weight="bold">F = IA/c,&#160;&#160;p<tspan font-size="10" baseline-shift="sub">r</tspan> = I/c</text>

  <!-- ===== right: total reflection ===== -->
  <text x="600" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">완전 반사 (total reflection)</text>

  <rect x="670" y="80" width="30" height="190" fill="#F3F4F6" stroke="#1a1a1a" stroke-width="2"/>
  <g stroke="#8B0029" stroke-width="2.5">
    <line x1="470" y1="127" x2="662" y2="127" marker-end="url(#rR)"/>
    <line x1="470" y1="172" x2="662" y2="172" marker-end="url(#rR)"/>
    <line x1="470" y1="217" x2="662" y2="217" marker-end="url(#rR)"/>
  </g>
  <g stroke="#8B0029" stroke-width="2.5" opacity="0.55">
    <line x1="662" y1="111" x2="470" y2="111" marker-end="url(#rRf)"/>
    <line x1="662" y1="156" x2="470" y2="156" marker-end="url(#rRf)"/>
    <line x1="662" y1="201" x2="470" y2="201" marker-end="url(#rRf)"/>
  </g>
  <text x="530" y="95" text-anchor="middle" font-size="12.5" fill="#8B0029">입사 + 되반사</text>

  <line x1="708" y1="175" x2="784" y2="175" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#rD)"/>
  <text x="746" y="160" text-anchor="middle" font-size="14" font-style="italic" font-weight="bold" fill="#1a1a1a">F</text>

  <text x="575" y="302" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">Δp = 2ΔU/c</text>
  <text x="575" y="330" text-anchor="middle" font-size="14" font-style="italic" fill="#8B0029" font-weight="bold">F = 2IA/c,&#160;&#160;p<tspan font-size="10" baseline-shift="sub">r</tspan> = 2I/c</text>

  <text x="400" y="352" text-anchor="middle" font-size="12" fill="#6B7280">반사되면 운동량 변화가 두 배 → 힘과 복사 압력도 두 배</text>
</svg>
