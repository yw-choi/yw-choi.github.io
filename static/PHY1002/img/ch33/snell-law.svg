<svg viewBox="0 0 700 420" width="700" height="420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="sR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
  </defs>

  <!-- media -->
  <rect x="40" y="230" width="620" height="170" fill="#F3F4F6"/>
  <line x1="40" y1="230" x2="660" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="60" y="105" font-size="13" fill="#1a1a1a">매질 1 (공기, <tspan font-style="italic">n</tspan>₁)</text>
  <text x="60" y="262" font-size="13" fill="#1a1a1a">매질 2 (물·유리, <tspan font-style="italic">n</tspan>₂ &gt; <tspan font-style="italic">n</tspan>₁)</text>

  <!-- normal -->
  <line x1="350" y1="50" x2="350" y2="400" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="358" y="60" font-size="12" fill="#6B7280">법선 (normal)</text>

  <!-- incident ray -->
  <line x1="148" y1="60" x2="347" y2="227.5" stroke="#8B0029" stroke-width="2.5" marker-end="url(#sR)"/>
  <text x="222" y="128" text-anchor="end" font-size="13" fill="#8B0029">입사 광선</text>

  <!-- reflected ray -->
  <line x1="353" y1="227.5" x2="552" y2="60" stroke="#8B0029" stroke-width="2.5" marker-end="url(#sR)"/>
  <text x="500" y="100" font-size="13" fill="#8B0029">반사 광선</text>

  <!-- undeflected direction (dotted continuation) -->
  <line x1="350" y1="230" x2="528" y2="380" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="482" y="396" font-size="11" fill="#6B7280">꺾이지 않았을 경우의 방향</text>

  <!-- refracted ray -->
  <line x1="351" y1="232.5" x2="439" y2="380" stroke="#8B0029" stroke-width="2.5" marker-end="url(#sR)"/>
  <text x="420" y="330" font-size="13" fill="#8B0029">굴절 광선</text>

  <!-- angle arcs -->
  <path d="M350,175 A55 55 0 0 0 307.9,194.6" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="318" y="172" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">θ₁</text>
  <path d="M350,175 A55 55 0 0 1 392.1,194.6" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="386" y="172" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">θ′₁</text>
  <path d="M350,285 A55 55 0 0 0 378.1,277.3" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="368" y="304" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">θ₂</text>

  <text x="185" y="372" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8B0029"><tspan font-style="italic">n</tspan>₁ sin <tspan font-style="italic">θ</tspan>₁ = <tspan font-style="italic">n</tspan>₂ sin <tspan font-style="italic">θ</tspan>₂ (스넬 법칙)</text>
  <text x="185" y="394" text-anchor="middle" font-size="12" fill="#6B7280">굴절률이 큰 매질로 들어가면 법선 쪽으로 꺾인다</text>
</svg>
