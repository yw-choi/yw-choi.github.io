<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="zR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="zB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="380" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#8B0029">절반 규칙 (one-half rule): 편광되지 않은 빛 → 편광판 → 세기가 절반</text>

  <!-- light ray -->
  <line x1="40" y1="210" x2="300" y2="210" stroke="#8B0029" stroke-width="2"/>
  <line x1="460" y1="210" x2="700" y2="210" stroke="#8B0029" stroke-width="2" marker-end="url(#zR)"/>

  <!-- unpolarized light symbol (head-on) -->
  <g stroke="#2563EB" stroke-width="2">
    <line x1="150" y1="155" x2="150" y2="265" marker-start="url(#zB)" marker-end="url(#zB)"/>
    <line x1="95" y1="210" x2="205" y2="210" marker-start="url(#zB)" marker-end="url(#zB)"/>
    <line x1="111.1" y1="171.1" x2="188.9" y2="248.9" marker-start="url(#zB)" marker-end="url(#zB)"/>
    <line x1="111.1" y1="248.9" x2="188.9" y2="171.1" marker-start="url(#zB)" marker-end="url(#zB)"/>
  </g>
  <text x="150" y="296" text-anchor="middle" font-size="13" fill="#1a1a1a">편광되지 않은 빛</text>
  <text x="150" y="316" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">세기 I₀</text>

  <!-- polarizing sheet -->
  <circle cx="380" cy="210" r="68" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <g stroke="#6B7280" stroke-width="1">
    <line x1="320" y1="178" x2="320" y2="242"/>
    <line x1="335" y1="159.6" x2="335" y2="260.4"/>
    <line x1="350" y1="149.4" x2="350" y2="270.6"/>
    <line x1="365" y1="143.7" x2="365" y2="276.3"/>
    <line x1="380" y1="142" x2="380" y2="278"/>
    <line x1="395" y1="143.7" x2="395" y2="276.3"/>
    <line x1="410" y1="149.4" x2="410" y2="270.6"/>
    <line x1="425" y1="159.6" x2="425" y2="260.4"/>
    <line x1="440" y1="178" x2="440" y2="242"/>
  </g>
  <text x="380" y="300" text-anchor="middle" font-size="13" fill="#1a1a1a">편광판 (polarizing sheet)</text>
  <text x="380" y="318" text-anchor="middle" font-size="12" fill="#6B7280">편광 방향: 세로</text>

  <!-- transmitted polarized light -->
  <line x1="580" y1="150" x2="580" y2="270" stroke="#2563EB" stroke-width="2.5" marker-start="url(#zB)" marker-end="url(#zB)"/>
  <text x="580" y="300" text-anchor="middle" font-size="13" fill="#1a1a1a">세로로 편광된 빛</text>
  <text x="580" y="320" text-anchor="middle" font-size="13.5" font-style="italic" font-weight="bold" fill="#8B0029">I = ½ I₀</text>

  <text x="380" y="370" text-anchor="middle" font-size="12.5" fill="#6B7280">편광 방향과 나란한 E 성분만 통과, 수직한 성분은 흡수 — 입사광이 비편광일 때만 사용</text>
</svg>
