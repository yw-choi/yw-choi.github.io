<svg viewBox="0 0 700 420" width="700" height="420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="bR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="bRs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
  </defs>

  <text x="350" y="30" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8B0029">브루스터 각: tan θ<tspan font-size="10" baseline-shift="sub">B</tspan> = n₂/n₁ — 반사 광선과 굴절 광선이 서로 수직</text>

  <!-- media -->
  <rect x="40" y="250" width="620" height="150" fill="#F3F4F6"/>
  <line x1="40" y1="250" x2="660" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <text x="60" y="238" font-size="13" fill="#1a1a1a">공기 <tspan font-style="italic">n</tspan>₁</text>
  <text x="60" y="278" font-size="13" fill="#1a1a1a">유리 <tspan font-style="italic">n</tspan>₂</text>

  <!-- normal -->
  <line x1="350" y1="55" x2="350" y2="395" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- incident ray with mixed polarization -->
  <line x1="95" y1="80" x2="346" y2="247" stroke="#8B0029" stroke-width="2.5" marker-end="url(#bR)"/>
  <!-- perpendicular component: dots -->
  <circle cx="171.5" cy="131" r="3.5" fill="#2563EB"/>
  <circle cx="235.3" cy="173.5" r="3.5" fill="#2563EB"/>
  <circle cx="299" cy="216" r="3.5" fill="#2563EB"/>
  <!-- parallel component: short double arrows perpendicular to ray -->
  <g stroke="#8B0029" stroke-width="1.8">
    <line x1="196.9" y1="157.3" x2="209.1" y2="139" marker-start="url(#bRs)" marker-end="url(#bRs)"/>
    <line x1="260.6" y1="199.8" x2="272.8" y2="181.5" marker-start="url(#bRs)" marker-end="url(#bRs)"/>
    <line x1="132.9" y1="114.8" x2="145.1" y2="96.5" marker-start="url(#bRs)" marker-end="url(#bRs)"/>
  </g>
  <text x="150" y="64" text-anchor="middle" font-size="13" fill="#1a1a1a">입사광 (비편광)</text>

  <!-- reflected ray: fully perpendicular-polarized (dots only) -->
  <line x1="354" y1="247" x2="605" y2="80" stroke="#8B0029" stroke-width="2.5" marker-end="url(#bR)"/>
  <circle cx="426.5" cy="199" r="3.5" fill="#2563EB"/>
  <circle cx="477.5" cy="165" r="3.5" fill="#2563EB"/>
  <circle cx="528.5" cy="131" r="3.5" fill="#2563EB"/>
  <circle cx="579.5" cy="97" r="3.5" fill="#2563EB"/>
  <text x="545" y="64" text-anchor="middle" font-size="13" fill="#1a1a1a">반사광: 완전 편광</text>
  <text x="512" y="82" text-anchor="middle" font-size="11" fill="#6B7280">(지면에 수직한 성분만)</text>

  <!-- refracted ray: partially polarized -->
  <line x1="352" y1="253" x2="438.7" y2="383" stroke="#8B0029" stroke-width="2.5" marker-end="url(#bR)"/>
  <g stroke="#8B0029" stroke-width="1.8">
    <line x1="373.2" y1="290.7" x2="391.4" y2="278.5" marker-start="url(#bRs)" marker-end="url(#bRs)"/>
    <line x1="399.2" y1="329.7" x2="417.4" y2="317.5" marker-start="url(#bRs)" marker-end="url(#bRs)"/>
  </g>
  <circle cx="395.3" cy="318" r="2.6" fill="#2563EB" opacity="0.55"/>
  <text x="458" y="360" font-size="13" fill="#1a1a1a">굴절광: 부분 편광</text>

  <!-- Brewster angle arcs -->
  <path d="M350,200 A50 50 0 0 0 308.4,222.3" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="322" y="196" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">θ<tspan font-size="10" baseline-shift="sub">B</tspan></text>
  <path d="M350,200 A50 50 0 0 1 391.6,222.3" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="382" y="196" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">θ<tspan font-size="10" baseline-shift="sub">B</tspan></text>
  <path d="M350,300 A50 50 0 0 0 377.8,291.6" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="366" y="320" text-anchor="middle" font-size="14" font-style="italic" fill="#1a1a1a">θ<tspan font-size="10" baseline-shift="sub">r</tspan></text>

  <!-- right angle between reflected and refracted -->
  <path d="M366.6,238.9 L377.7,255.5 L361.1,266.6" fill="none" stroke="#6B7280" stroke-width="1.2"/>
  <text x="398" y="264" font-size="12" fill="#6B7280">90°</text>

  <!-- legend -->
  <circle cx="60" cy="370" r="3.5" fill="#2563EB"/>
  <text x="72" y="374" font-size="11.5" fill="#6B7280">지면에 수직한 E 성분 (반사광에 남는 성분)</text>
  <line x1="52" y1="390" x2="70" y2="390" stroke="#8B0029" stroke-width="1.8" marker-start="url(#bRs)" marker-end="url(#bRs)"/>
  <text x="80" y="394" font-size="11.5" fill="#6B7280">지면에 평행한 E 성분</text>
</svg>
