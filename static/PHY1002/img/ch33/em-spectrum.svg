<svg viewBox="0 0 800 420" width="800" height="420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <linearGradient id="vis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c40000"/>
      <stop offset="20%" stop-color="#ff6a00"/>
      <stop offset="40%" stop-color="#ffd400"/>
      <stop offset="57%" stop-color="#17b026"/>
      <stop offset="73%" stop-color="#00a0dd"/>
      <stop offset="86%" stop-color="#2a2ad4"/>
      <stop offset="100%" stop-color="#7a00b8"/>
    </linearGradient>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- enlarged visible spectrum bar -->
  <text x="400" y="42" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">가시광선 (visible light) — 파장 (nm)</text>
  <rect x="180" y="64" width="440" height="40" fill="url(#vis)" stroke="#6B7280" stroke-width="1"/>
  <g font-size="11" fill="#6B7280" text-anchor="middle">
    <line x1="180" y1="58" x2="180" y2="64" stroke="#6B7280" stroke-width="1"/>
    <line x1="326.7" y1="58" x2="326.7" y2="64" stroke="#6B7280" stroke-width="1"/>
    <line x1="473.3" y1="58" x2="473.3" y2="64" stroke="#6B7280" stroke-width="1"/>
    <line x1="620" y1="58" x2="620" y2="64" stroke="#6B7280" stroke-width="1"/>
    <text x="180" y="55">700</text>
    <text x="326.7" y="55">600</text>
    <text x="473.3" y="55">500</text>
    <text x="620" y="55">400</text>
  </g>
  <!-- 555 nm marker -->
  <line x1="392.7" y1="104" x2="392.7" y2="118" stroke="#6B7280" stroke-width="1"/>
  <text x="392.7" y="132" text-anchor="middle" font-size="11" fill="#6B7280">555 nm (눈의 최대 감도)</text>

  <!-- fan lines from bar to sliver -->
  <line x1="180" y1="104" x2="476.5" y2="250" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="620" y1="104" x2="484" y2="250" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- wavelength axis (above band) -->
  <line x1="780" y1="222" x2="44" y2="222" stroke="#6B7280" stroke-width="1" marker-end="url(#aG)"/>
  <text x="40" y="212" font-size="12" fill="#6B7280">← 파장 (m) 증가</text>
  <g font-size="10.5" fill="#6B7280" text-anchor="middle">
    <line x1="101.7" y1="222" x2="101.7" y2="228" stroke="#6B7280" stroke-width="1"/><text x="101.7" y="241">10⁶</text>
    <line x1="194.2" y1="222" x2="194.2" y2="228" stroke="#6B7280" stroke-width="1"/><text x="194.2" y="241">10³</text>
    <line x1="286.7" y1="222" x2="286.7" y2="228" stroke="#6B7280" stroke-width="1"/><text x="286.7" y="241">1</text>
    <line x1="379.2" y1="222" x2="379.2" y2="228" stroke="#6B7280" stroke-width="1"/><text x="379.2" y="241">10⁻³</text>
    <line x1="471.7" y1="222" x2="471.7" y2="228" stroke="#6B7280" stroke-width="1"/><text x="471.7" y="241">10⁻⁶</text>
    <line x1="564.2" y1="222" x2="564.2" y2="228" stroke="#6B7280" stroke-width="1"/><text x="564.2" y="241">10⁻⁹</text>
    <line x1="656.7" y1="222" x2="656.7" y2="228" stroke="#6B7280" stroke-width="1"/><text x="656.7" y="241">10⁻¹²</text>
    <line x1="749.2" y1="222" x2="749.2" y2="228" stroke="#6B7280" stroke-width="1"/><text x="749.2" y="241">10⁻¹⁵</text>
  </g>

  <!-- main spectrum band -->
  <g stroke="#6B7280" stroke-width="1">
    <rect x="40" y="250" width="92.5" height="52" fill="#F3F4F6"/>
    <rect x="132.5" y="250" width="246.7" height="52" fill="#ffffff"/>
    <rect x="379.2" y="250" width="97.3" height="52" fill="#F3F4F6"/>
    <rect x="476.5" y="250" width="7.5" height="52" fill="url(#vis)"/>
    <rect x="484" y="250" width="49.3" height="52" fill="#ffffff"/>
    <rect x="533.3" y="250" width="92.5" height="52" fill="#F3F4F6"/>
    <rect x="625.8" y="250" width="154.2" height="52" fill="#ffffff"/>
  </g>
  <g font-size="13" fill="#1a1a1a" text-anchor="middle">
    <text x="86" y="281">장파</text>
    <text x="255.8" y="281">라디오파</text>
    <text x="427.8" y="281">적외선</text>
    <text x="508.6" y="281">자외선</text>
    <text x="579.5" y="281">X선</text>
    <text x="702.9" y="281">감마선</text>
  </g>

  <!-- frequency axis (below band) -->
  <line x1="40" y1="330" x2="776" y2="330" stroke="#6B7280" stroke-width="1" marker-end="url(#aG)"/>
  <text x="40" y="372" font-size="12" fill="#6B7280">진동수 (Hz) 증가 →</text>
  <g font-size="10.5" fill="#6B7280" text-anchor="middle">
    <line x1="148.6" y1="330" x2="148.6" y2="336" stroke="#6B7280" stroke-width="1"/><text x="148.6" y="350">10⁴</text>
    <line x1="271.9" y1="330" x2="271.9" y2="336" stroke="#6B7280" stroke-width="1"/><text x="271.9" y="350">10⁸</text>
    <line x1="395.3" y1="330" x2="395.3" y2="336" stroke="#6B7280" stroke-width="1"/><text x="395.3" y="350">10¹²</text>
    <line x1="518.6" y1="330" x2="518.6" y2="336" stroke="#6B7280" stroke-width="1"/><text x="518.6" y="350">10¹⁶</text>
    <line x1="641.9" y1="330" x2="641.9" y2="336" stroke="#6B7280" stroke-width="1"/><text x="641.9" y="350">10²⁰</text>
    <line x1="765.2" y1="330" x2="765.2" y2="336" stroke="#6B7280" stroke-width="1"/><text x="765.2" y="350">10²⁴</text>
  </g>

  <text x="400" y="400" text-anchor="middle" font-size="13" fill="#8B0029" font-weight="bold">모든 전자기파는 진공에서 같은 속력 c = 3.0×10⁸ m/s로 진행한다</text>
</svg>
