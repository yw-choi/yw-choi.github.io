<svg viewBox="0 0 800 420" width="800" height="420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="tR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
  </defs>

  <!-- ===== upper: rays from a source in glass ===== -->
  <rect x="30" y="110" width="740" height="140" fill="#F3F4F6"/>
  <line x1="30" y1="110" x2="770" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <text x="55" y="50" font-size="13" fill="#1a1a1a">공기 <tspan font-style="italic">n</tspan>₂ = 1.00</text>
  <text x="55" y="145" font-size="13" fill="#1a1a1a">유리 <tspan font-style="italic">n</tspan>₁ = 1.50</text>
  <text x="600" y="45" text-anchor="middle" font-size="12" fill="#6B7280">θ &gt; θ<tspan font-size="9" baseline-shift="sub">c</tspan> 이면 굴절 광선이 사라지고 전부 반사된다</text>

  <!-- source -->
  <circle cx="180" cy="235" r="5" fill="#8B0029"/>
  <text x="164" y="245" text-anchor="end" font-size="13" font-style="italic" fill="#8B0029">S</text>

  <!-- ray a: normal incidence -->
  <line x1="180" y1="235" x2="180" y2="112" stroke="#8B0029" stroke-width="2"/>
  <line x1="180" y1="110" x2="180" y2="42" stroke="#8B0029" stroke-width="2" marker-end="url(#tR)"/>

  <!-- ray b: 25 deg, refracted + weak reflection -->
  <line x1="180" y1="235" x2="238" y2="112" stroke="#8B0029" stroke-width="2"/>
  <line x1="238" y1="110" x2="288.7" y2="48" stroke="#8B0029" stroke-width="2" marker-end="url(#tR)"/>
  <line x1="238" y1="110" x2="296" y2="233" stroke="#8B0029" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.55"/>

  <!-- critical ray: 41.8 deg -->
  <line x1="180" y1="235" x2="291.7" y2="112" stroke="#8B0029" stroke-width="2"/>
  <line x1="296" y1="106" x2="420" y2="106" stroke="#8B0029" stroke-width="2" marker-end="url(#tR)"/>
  <line x1="291.7" y1="110" x2="403.4" y2="232" stroke="#8B0029" stroke-width="1.6" opacity="0.75"/>
  <text x="392" y="96" text-anchor="middle" font-size="12" fill="#8B0029">굴절 광선이 표면을 따라 진행 (θ₂ = 90°)</text>

  <!-- normal at critical point + critical angle arc -->
  <line x1="291.7" y1="62" x2="291.7" y2="195" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M291.7,155 A45 45 0 0 1 261.7,143.6" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="268" y="172" font-size="14" font-style="italic" fill="#1a1a1a">θ<tspan font-size="10" baseline-shift="sub">c</tspan></text>

  <!-- total internal reflection ray: 60 deg -->
  <line x1="180" y1="235" x2="396.5" y2="112" stroke="#8B0029" stroke-width="2.5"/>
  <line x1="396.5" y1="110" x2="611" y2="231" stroke="#8B0029" stroke-width="2.5" marker-end="url(#tR)"/>
  <text x="535" y="165" font-size="13" font-weight="bold" fill="#8B0029">전반사!</text>

  <!-- ===== lower: optical fiber ===== -->
  <text x="400" y="285" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">광섬유 (optical fiber)</text>
  <rect x="80" y="300" width="640" height="80" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <line x1="80" y1="322" x2="720" y2="322" stroke="#6B7280" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="80" y1="358" x2="720" y2="358" stroke="#6B7280" stroke-width="1" stroke-dasharray="5 4"/>
  <polyline points="95,340 190,326 310,354 430,326 550,354 668,340" fill="none" stroke="#8B0029" stroke-width="2"/>
  <line x1="668" y1="340" x2="700" y2="336" stroke="#8B0029" stroke-width="2" marker-end="url(#tR)"/>
  <text x="520" y="315" text-anchor="middle" font-size="11.5" fill="#6B7280">클래딩 (cladding, n₂ &lt; n₁)</text>
  <text x="452" y="349" text-anchor="middle" font-size="11.5" fill="#6B7280">코어 (core, n₁)</text>
  <text x="400" y="373" text-anchor="middle" font-size="11.5" fill="#6B7280">경계에 임계각보다 크게 입사 → 내부 전반사가 반복되며 빛이 코어에 갇혀 진행</text>
</svg>
