<svg viewBox="0 0 800 360" width="800" height="360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aG2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="aR2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
  </defs>

  <!-- energy source -->
  <rect x="30" y="140" width="80" height="60" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" rx="4"/>
  <text x="70" y="175" text-anchor="middle" font-size="13" fill="#1a1a1a">에너지원</text>
  <line x1="114" y1="170" x2="142" y2="170" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#aG2)"/>

  <!-- LC circuit loop -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="150" y1="120" x2="260" y2="120"/>
    <line x1="150" y1="220" x2="260" y2="220"/>
    <line x1="150" y1="120" x2="150" y2="162"/>
    <line x1="150" y1="174" x2="150" y2="220"/>
    <line x1="132" y1="162" x2="168" y2="162"/>
    <line x1="132" y1="174" x2="168" y2="174"/>
    <line x1="260" y1="120" x2="260" y2="140"/>
    <path d="M260 140 a8 8 0 0 1 0 14 a8 8 0 0 1 0 14 a8 8 0 0 1 0 14 a8 8 0 0 1 0 14"/>
    <line x1="260" y1="196" x2="260" y2="220"/>
  </g>
  <text x="124" y="173" text-anchor="end" font-size="14" font-style="italic" fill="#1a1a1a">C</text>
  <text x="238" y="173" font-size="14" font-style="italic" fill="#1a1a1a">L</text>
  <text x="205" y="248" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">LC 발진기</text>
  <text x="205" y="268" text-anchor="middle" font-size="13" font-style="italic" fill="#6B7280">ω = 1/√(LC)</text>

  <!-- transformer: core + secondary coil -->
  <line x1="271" y1="133" x2="271" y2="203" stroke="#6B7280" stroke-width="2"/>
  <line x1="276" y1="133" x2="276" y2="203" stroke="#6B7280" stroke-width="2"/>
  <path d="M287 140 a8 8 0 0 0 0 14 a8 8 0 0 0 0 14 a8 8 0 0 0 0 14 a8 8 0 0 0 0 14" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <text x="274" y="230" text-anchor="middle" font-size="12" fill="#6B7280">변압기</text>

  <!-- transmission line -->
  <line x1="287" y1="140" x2="470" y2="140" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="287" y1="196" x2="470" y2="196" stroke="#1a1a1a" stroke-width="2"/>
  <text x="380" y="128" text-anchor="middle" font-size="12" fill="#6B7280">전송선</text>

  <!-- dipole antenna -->
  <line x1="470" y1="140" x2="470" y2="50" stroke="#6B7280" stroke-width="4" stroke-linecap="round"/>
  <line x1="470" y1="196" x2="470" y2="286" stroke="#6B7280" stroke-width="4" stroke-linecap="round"/>
  <text x="470" y="312" text-anchor="middle" font-size="13" fill="#1a1a1a">전기 쌍극자 안테나</text>

  <!-- radiated wavefront arcs -->
  <g stroke="#8B0029" fill="none" stroke-width="1.5">
    <path d="M490 133.4 A40 40 0 0 1 490 202.6"/>
    <path d="M505 107.4 A70 70 0 0 1 505 228.6"/>
    <path d="M520 81.4 A100 100 0 0 1 520 254.6"/>
    <path d="M535 55.4 A130 130 0 0 1 535 280.6"/>
  </g>

  <!-- c arrow and distant point -->
  <line x1="625" y1="168" x2="700" y2="168" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR2)"/>
  <text x="662" y="153" text-anchor="middle" font-size="14" font-style="italic" fill="#8B0029">c</text>
  <text x="662" y="195" text-anchor="middle" font-size="12" fill="#8B0029">진행하는 전자기파</text>
  <circle cx="742" cy="168" r="4" fill="#1a1a1a"/>
  <text x="742" y="150" text-anchor="middle" font-size="12" fill="#1a1a1a">P (원거리점)</text>

  <text x="400" y="345" text-anchor="middle" font-size="12.5" fill="#6B7280">LC 발진기의 각진동수 ω로 안테나의 전하가 진동 → 같은 진동수의 전자기파가 방출된다</text>
</svg>
