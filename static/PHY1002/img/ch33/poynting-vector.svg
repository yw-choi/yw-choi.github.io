<svg viewBox="0 0 700 380" width="700" height="380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="pR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="pB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="pD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="350" y="34" text-anchor="middle" font-size="14" font-weight="bold" fill="#8B0029">포인팅 벡터 (Poynting vector) — 에너지 흐름의 방향과 크기</text>

  <!-- wavefront plane spanned by y and z -->
  <path d="M222.4,158 L337.6,62 L337.6,262 L222.4,358 Z" fill="#F3F4F6" opacity="0.7" stroke="#6B7280" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- right-angle markers -->
  <path d="M280,196 L294,196 L294,210" fill="none" stroke="#6B7280" stroke-width="1"/>
  <path d="M294,210 L283.2,219 L269.3,219" fill="none" stroke="#6B7280" stroke-width="1"/>

  <!-- E (up, +y) -->
  <line x1="280" y1="210" x2="280" y2="70" stroke="#8B0029" stroke-width="2.5" marker-end="url(#pR)"/>
  <text x="262" y="88" text-anchor="end" font-size="16" font-style="italic" font-weight="bold" fill="#8B0029">E</text>

  <!-- B (+z, oblique) -->
  <line x1="280" y1="210" x2="195.5" y2="280.4" stroke="#2563EB" stroke-width="2.5" marker-end="url(#pB)"/>
  <text x="182" y="302" font-size="16" font-style="italic" font-weight="bold" fill="#2563EB">B</text>

  <!-- S (+x) -->
  <line x1="280" y1="210" x2="556" y2="210" stroke="#1a1a1a" stroke-width="3" marker-end="url(#pD)"/>
  <text x="452" y="192" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold" fill="#1a1a1a">S = (E × B)/μ₀</text>

  <text x="452" y="243" text-anchor="middle" font-size="12.5" fill="#6B7280">에너지 수송 방향 = 파동의 진행 방향</text>
  <text x="452" y="263" text-anchor="middle" font-size="12.5" fill="#6B7280">크기 S = 단위 넓이를 지나는 일률 (W/m²)</text>

  <text x="350" y="352" text-anchor="middle" font-size="12.5" fill="#6B7280">S는 E와 B가 만드는 면에 수직 — 오른손 규칙: E에서 B로 감아쥐면 엄지가 S 방향</text>
</svg>
