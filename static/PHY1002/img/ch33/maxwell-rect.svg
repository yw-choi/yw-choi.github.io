<svg viewBox="0 0 700 400" width="700" height="400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="mG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="mR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="mB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="370" y="40" text-anchor="middle" font-size="12.5" fill="#6B7280">진동하는 전기장(y축)이 xz면의 닫힌 경로에 자기장을 유도한다 — 맥스웰 유도 법칙</text>

  <!-- axes -->
  <line x1="150" y1="280" x2="636" y2="280" stroke="#6B7280" stroke-width="1" marker-end="url(#mG)"/>
  <line x1="150" y1="280" x2="150" y2="72" stroke="#6B7280" stroke-width="1" marker-end="url(#mG)"/>
  <line x1="150" y1="280" x2="93" y2="328" stroke="#6B7280" stroke-width="1" marker-end="url(#mG)"/>
  <text x="643" y="270" font-size="14" font-style="italic" fill="#6B7280">x</text>
  <text x="133" y="82" font-size="14" font-style="italic" fill="#6B7280">y</text>
  <text x="82" y="318" font-size="14" font-style="italic" fill="#6B7280">z</text>

  <!-- dashed rectangle in xz plane -->
  <path d="M340,280 L415,280 L342,340.8 L267,340.8 Z" fill="#F3F4F6" fill-opacity="0.5" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- B arrows along +z on the two z-edges -->
  <line x1="340" y1="280" x2="271" y2="337.4" stroke="#2563EB" stroke-width="2.5" marker-end="url(#mB)"/>
  <line x1="415" y1="280" x2="331" y2="349.9" stroke="#2563EB" stroke-width="2.5" marker-end="url(#mB)"/>
  <text x="252" y="352" text-anchor="end" font-size="15" font-style="italic" font-weight="bold" fill="#2563EB">B</text>
  <text x="345" y="368" font-size="15" font-style="italic" font-weight="bold" fill="#2563EB">B + dB</text>

  <!-- E arrow up through the rectangle -->
  <line x1="341" y1="310.4" x2="341" y2="130" stroke="#8B0029" stroke-width="2.5" marker-end="url(#mR)"/>
  <text x="354" y="158" font-size="15" font-style="italic" font-weight="bold" fill="#8B0029">E</text>

  <!-- dx dimension (above) -->
  <line x1="343" y1="266" x2="412" y2="266" stroke="#6B7280" stroke-width="1" marker-start="url(#mG)" marker-end="url(#mG)"/>
  <text x="377" y="256" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">dx</text>

  <!-- wave direction -->
  <line x1="490" y1="110" x2="590" y2="110" stroke="#8B0029" stroke-width="2.5" marker-end="url(#mR)"/>
  <text x="540" y="96" text-anchor="middle" font-size="13" fill="#8B0029" font-weight="bold">파동 진행 <tspan font-style="italic">c</tspan></text>
</svg>
