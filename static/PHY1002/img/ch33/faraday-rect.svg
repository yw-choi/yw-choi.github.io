<svg viewBox="0 0 700 400" width="700" height="400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/>
    </marker>
    <marker id="fB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="150" y1="330" x2="636" y2="330" stroke="#6B7280" stroke-width="1" marker-end="url(#fG)"/>
  <line x1="150" y1="330" x2="150" y2="64" stroke="#6B7280" stroke-width="1" marker-end="url(#fG)"/>
  <line x1="150" y1="330" x2="95" y2="376" stroke="#6B7280" stroke-width="1" marker-end="url(#fG)"/>
  <text x="643" y="320" font-size="14" font-style="italic" fill="#6B7280">x</text>
  <text x="133" y="74" font-size="14" font-style="italic" fill="#6B7280">y</text>
  <text x="84" y="366" font-size="14" font-style="italic" fill="#6B7280">z</text>

  <!-- dashed rectangle in xy plane -->
  <rect x="330" y="135" width="55" height="185" fill="#F3F4F6" fill-opacity="0.5" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- B arrows along +z through the rectangle -->
  <line x1="362" y1="268" x2="318" y2="304.7" stroke="#2563EB" stroke-width="2.5" marker-end="url(#fB)"/>
  <line x1="362" y1="230" x2="318" y2="266.7" stroke="#2563EB" stroke-width="2.5" marker-end="url(#fB)"/>
  <text x="302" y="322" font-size="15" font-style="italic" font-weight="bold" fill="#2563EB">B</text>

  <!-- E arrows on the two long sides -->
  <line x1="330" y1="297" x2="330" y2="160" stroke="#8B0029" stroke-width="2.5" marker-end="url(#fR)"/>
  <line x1="385" y1="303" x2="385" y2="145" stroke="#8B0029" stroke-width="2.5" marker-end="url(#fR)"/>
  <text x="318" y="195" text-anchor="end" font-size="15" font-style="italic" font-weight="bold" fill="#8B0029">E</text>
  <text x="395" y="215" font-size="15" font-style="italic" font-weight="bold" fill="#8B0029">E + dE</text>

  <!-- h dimension (right side) -->
  <line x1="385" y1="135" x2="465" y2="135" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="385" y1="320" x2="465" y2="320" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="458" y1="141" x2="458" y2="314" stroke="#6B7280" stroke-width="1" marker-start="url(#fG)" marker-end="url(#fG)"/>
  <text x="470" y="235" font-size="14" font-style="italic" fill="#6B7280">h</text>

  <!-- dx dimension (top) -->
  <line x1="333" y1="123" x2="382" y2="123" stroke="#6B7280" stroke-width="1" marker-start="url(#fG)" marker-end="url(#fG)"/>
  <text x="357" y="112" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7280">dx</text>

  <!-- wave direction -->
  <line x1="490" y1="90" x2="590" y2="90" stroke="#8B0029" stroke-width="2.5" marker-end="url(#fR)"/>
  <text x="540" y="76" text-anchor="middle" font-size="13" fill="#8B0029" font-weight="bold">파동 진행 <tspan font-style="italic">c</tspan></text>

  <text x="370" y="392" text-anchor="middle" font-size="12.5" fill="#6B7280">진동하는 자기장(z축)이 xy면의 닫힌 경로에 전기장을 유도한다 — 패러데이 법칙</text>
</svg>
