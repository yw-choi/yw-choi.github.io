<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrG1" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Row 1: whole magnet -->
  <rect x="190" y="60" width="160" height="46" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <rect x="350" y="60" width="160" height="46" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="270" y="90" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">N</text>
  <text x="430" y="90" font-size="17" font-weight="bold" fill="#6B7280" text-anchor="middle">S</text>
  <text x="545" y="90" font-size="14" fill="#1a1a1a">자기 쌍극자</text>

  <!-- arrow 1 -->
  <line x1="350" y1="118" x2="350" y2="148" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrG1)"/>
  <text x="368" y="138" font-size="13" fill="#6B7280">반으로 쪼갠다</text>

  <!-- Row 2: two magnets -->
  <rect x="110" y="160" width="105" height="42" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <rect x="215" y="160" width="105" height="42" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="162" y="188" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">N</text>
  <text x="267" y="188" font-size="15" font-weight="bold" fill="#6B7280" text-anchor="middle">S</text>
  <rect x="380" y="160" width="105" height="42" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <rect x="485" y="160" width="105" height="42" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="432" y="188" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">N</text>
  <text x="537" y="188" font-size="15" font-weight="bold" fill="#6B7280" text-anchor="middle">S</text>

  <!-- arrow 2 -->
  <line x1="350" y1="214" x2="350" y2="244" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrG1)"/>
  <text x="368" y="234" font-size="13" fill="#6B7280">또 쪼갠다</text>

  <!-- Row 3: four magnets -->
  <rect x="45" y="256" width="65" height="38" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <rect x="110" y="256" width="65" height="38" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="77" y="281" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">N</text>
  <text x="142" y="281" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">S</text>

  <rect x="205" y="256" width="65" height="38" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <rect x="270" y="256" width="65" height="38" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="237" y="281" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">N</text>
  <text x="302" y="281" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">S</text>

  <rect x="365" y="256" width="65" height="38" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <rect x="430" y="256" width="65" height="38" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="397" y="281" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">N</text>
  <text x="462" y="281" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">S</text>

  <rect x="525" y="256" width="65" height="38" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <rect x="590" y="256" width="65" height="38" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="557" y="281" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">N</text>
  <text x="622" y="281" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">S</text>

  <!-- bottom notes -->
  <text x="350" y="350" font-size="15" font-weight="bold" fill="#8B0029" text-anchor="middle">아무리 잘게 쪼개도 각 조각은 N극과 S극을 모두 가진 쌍극자이다</text>
  <text x="350" y="382" font-size="14" fill="#6B7280" text-anchor="middle">원자, 전자 수준까지 내려가도 고립된 자기 단극자(monopole)는 발견된 적이 없다</text>
</svg>
