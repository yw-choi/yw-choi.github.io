<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrG5" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- axes: origin (110, 340) -->
  <line x1="110" y1="340" x2="650" y2="340" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrG5)"/>
  <line x1="110" y1="340" x2="110" y2="50" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrG5)"/>
  <text x="660" y="345" font-size="15" font-style="italic" fill="#1a1a1a">r</text>
  <text x="98" y="42" font-size="15" font-style="italic" fill="#1a1a1a">B</text>
  <text x="96" y="358" font-size="13" fill="#6B7280">0</text>

  <!-- plate edge r = R at x = 290; peak B at y = 110 -->
  <line x1="290" y1="340" x2="290" y2="110" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="284" y="362" font-size="15" font-style="italic" fill="#1a1a1a">R</text>
  <text x="240" y="380" font-size="12.5" fill="#6B7280">(판의 반지름)</text>

  <!-- Bmax guide -->
  <line x1="110" y1="110" x2="290" y2="110" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="30" y="105" font-size="13.5" font-style="italic" fill="#1a1a1a">B<tspan font-size="10" dy="3">max</tspan></text>
  <text x="22" y="126" font-size="12" fill="#6B7280">μ₀i<tspan font-size="9" dy="2" font-style="italic">d</tspan><tspan dy="-2">/2πR</tspan></text>

  <!-- inside: linear from (110,340) to (290,110) -->
  <line x1="110" y1="340" x2="290" y2="110" stroke="#8B0029" stroke-width="2.5"/>

  <!-- outside: B = Bmax * R/r ; y(x) = 340 - 230*180/(x-110) -->
  <path d="M 290 110 L 310 133 L 330 151.8 L 355 171.1 L 380 186.7 L 410 202 L 440 214.5 L 470 225 L 500 233.8 L 540 243.7 L 580 251.9 L 640 261.9"
        fill="none" stroke="#8B0029" stroke-width="2.5"/>

  <!-- region annotations (아래 삼각형 영역: 상승 직선 오른쪽) -->
  <text x="172" y="272" font-size="14" fill="#1a1a1a">내부 (r &#8804; R)</text>
  <text x="172" y="295" font-size="14" font-style="italic" fill="#8B0029">B &#8733; r</text>
  <text x="166" y="318" font-size="12.5" fill="#6B7280">B = (μ₀i<tspan font-size="9" dy="2" font-style="italic">d</tspan><tspan dy="-2">/2πR²) r</tspan></text>

  <text x="450" y="145" font-size="14" fill="#1a1a1a">외부 (r &#8805; R)</text>
  <text x="432" y="168" font-size="14" font-style="italic" fill="#8B0029">B &#8733; 1/r</text>
  <text x="428" y="191" font-size="12.5" fill="#6B7280">B = μ₀i<tspan font-size="9" dy="2" font-style="italic">d</tspan><tspan dy="-2">/2πr</tspan></text>

  <text x="380" y="406" font-size="13.5" fill="#1a1a1a" text-anchor="middle">전류가 고르게 흐르는 도선의 B(r)와 똑같은 꼴 — 판 가장자리(r = R)에서 최대</text>
</svg>
