<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrR10" markerWidth="9" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#8B0029"/>
    </marker>
    <marker id="arrB10" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- panel titles -->
  <text x="200" y="52" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">(a) 외부 자기장 없음</text>
  <text x="545" y="52" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">(b) 외부 자기장 B₀ 적용</text>

  <!-- ===== panel (a): unmagnetized, 4 domains ===== -->
  <rect x="60" y="80" width="280" height="220" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <!-- domain boundaries -->
  <path d="M 195 80 L 185 300" fill="none" stroke="#6B7280" stroke-width="1.2"/>
  <path d="M 60 195 L 190 185" fill="none" stroke="#6B7280" stroke-width="1.2"/>
  <path d="M 190 200 L 340 210" fill="none" stroke="#6B7280" stroke-width="1.2"/>

  <!-- D1 (top-left): arrows right -->
  <line x1="95" y1="120" x2="155" y2="120" stroke="#8B0029" stroke-width="2" marker-end="url(#arrR10)"/>
  <line x1="95" y1="155" x2="155" y2="155" stroke="#8B0029" stroke-width="2" marker-end="url(#arrR10)"/>
  <!-- D2 (bottom-left): arrows down -->
  <line x1="105" y1="220" x2="105" y2="275" stroke="#8B0029" stroke-width="2" marker-end="url(#arrR10)"/>
  <line x1="145" y1="220" x2="145" y2="275" stroke="#8B0029" stroke-width="2" marker-end="url(#arrR10)"/>
  <!-- D3 (top-right): arrows left -->
  <line x1="310" y1="120" x2="250" y2="120" stroke="#8B0029" stroke-width="2" marker-end="url(#arrR10)"/>
  <line x1="310" y1="155" x2="250" y2="155" stroke="#8B0029" stroke-width="2" marker-end="url(#arrR10)"/>
  <!-- D4 (bottom-right): arrows up -->
  <line x1="245" y1="280" x2="245" y2="230" stroke="#8B0029" stroke-width="2" marker-end="url(#arrR10)"/>
  <line x1="290" y1="280" x2="290" y2="230" stroke="#8B0029" stroke-width="2" marker-end="url(#arrR10)"/>

  <text x="200" y="335" font-size="13.5" fill="#1a1a1a" text-anchor="middle">자구마다 정렬 방향이 제각각</text>
  <text x="200" y="356" font-size="13.5" fill="#1a1a1a" text-anchor="middle">→ 알짜 자화 = 0</text>

  <!-- ===== panel (b): field applied, favorable domain grows ===== -->
  <rect x="405" y="80" width="280" height="220" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <!-- shrunken unfavorable domain in bottom-right corner -->
  <path d="M 610 300 L 630 235 L 685 220" fill="none" stroke="#6B7280" stroke-width="1.2"/>

  <!-- main domain: arrows up (aligned with B0) -->
  <line x1="445" y1="270" x2="445" y2="115" stroke="#8B0029" stroke-width="2.2" marker-end="url(#arrR10)"/>
  <line x1="500" y1="270" x2="500" y2="115" stroke="#8B0029" stroke-width="2.2" marker-end="url(#arrR10)"/>
  <line x1="555" y1="270" x2="555" y2="115" stroke="#8B0029" stroke-width="2.2" marker-end="url(#arrR10)"/>
  <line x1="610" y1="200" x2="610" y2="115" stroke="#8B0029" stroke-width="2.2" marker-end="url(#arrR10)"/>
  <line x1="655" y1="185" x2="655" y2="115" stroke="#8B0029" stroke-width="2.2" marker-end="url(#arrR10)"/>
  <!-- leftover domain: small arrows right -->
  <line x1="638" y1="272" x2="672" y2="272" stroke="#8B0029" stroke-width="1.8" marker-end="url(#arrR10)"/>

  <!-- external field B0 -->
  <line x1="725" y1="270" x2="725" y2="130" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB10)"/>
  <text x="725" y="112" font-size="14" font-style="italic" fill="#2563EB" text-anchor="middle">B₀</text>

  <text x="545" y="335" font-size="13.5" fill="#1a1a1a" text-anchor="middle">장과 나란한 자구가 성장하고, 자구 전체가 회전</text>
  <text x="545" y="356" font-size="13.5" fill="#1a1a1a" text-anchor="middle">→ 알짜 자화 발생</text>

  <!-- bottom note -->
  <text x="380" y="398" font-size="14" font-weight="bold" fill="#8B0029" text-anchor="middle">외부 자기장은 ① 자구 경계를 이동시키고 ② 자구의 방향을 장 쪽으로 돌린다</text>
</svg>
