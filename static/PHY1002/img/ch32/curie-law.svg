<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrG12" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="100" y1="340" x2="655" y2="340" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrG12)"/>
  <line x1="100" y1="340" x2="100" y2="55" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrG12)"/>
  <text x="622" y="368" font-size="14" font-style="italic" fill="#1a1a1a">B<tspan font-size="10" dy="3">ext</tspan><tspan dy="-3">/T</tspan></text>
  <text x="40" y="48" font-size="14" font-style="italic" fill="#1a1a1a">M/M<tspan font-size="10" dy="3">max</tspan></text>
  <text x="88" y="358" font-size="13" fill="#6B7280">0</text>

  <!-- saturation guide at M/Mmax = 1 -->
  <line x1="100" y1="100" x2="640" y2="100" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="66" y="105" font-size="13" fill="#6B7280">1.0</text>
  <text x="560" y="90" font-size="12" fill="#6B7280">완전 정렬(포화): M<tspan font-size="9" dy="2">max</tspan><tspan dy="-2"> = Nμ/V</tspan></text>

  <!-- Curie's law straight line (tangent at origin), blue dashed -->
  <line x1="100" y1="340" x2="331" y2="80" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="345" y="80" font-size="13.5" fill="#2563EB">퀴리 법칙  M = C B<tspan font-size="10" dy="3">ext</tspan><tspan dy="-3">/T  (직선)</tspan></text>

  <!-- actual magnetization curve (quantum theory / experiment), red -->
  <path d="M 100 340 C 180 250, 240 175, 320 135 S 500 103, 640 100"
        fill="none" stroke="#8B0029" stroke-width="2.5"/>
  <text x="470" y="150" font-size="13.5" fill="#8B0029" text-anchor="middle">실제 측정 (양자 이론이 설명)</text>

  <!-- validity note -->
  <text x="175" y="315" font-size="12.5" fill="#6B7280">B<tspan font-size="9" dy="2">ext</tspan><tspan dy="-2">/T가 작은 영역에서만 직선과 일치</tspan></text>

  <!-- bottom caption -->
  <text x="360" y="400" font-size="13.5" fill="#1a1a1a" text-anchor="middle">상자성체의 자화: B<tspan font-size="10" dy="2">ext</tspan><tspan dy="-2">를 키우거나 T를 낮추면 정렬이 커지고, 결국 포화된다</tspan></text>
</svg>
