<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrR3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="arrB3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- ============ Panel (a): side view ============ -->
  <text x="200" y="38" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">(a) 측면도: 충전 중인 축전기</text>

  <!-- left wire + current -->
  <line x1="40" y1="215" x2="150" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="55" y1="197" x2="125" y2="197" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR3)"/>
  <text x="88" y="184" font-size="14" font-style="italic" fill="#8B0029" text-anchor="middle">i</text>

  <!-- plates -->
  <rect x="150" y="115" width="11" height="200" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <rect x="252" y="115" width="11" height="200" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="170" y="132" font-size="13" fill="#8B0029">+</text>
  <text x="170" y="177" font-size="13" fill="#8B0029">+</text>
  <text x="170" y="222" font-size="13" fill="#8B0029">+</text>
  <text x="170" y="267" font-size="13" fill="#8B0029">+</text>
  <text x="170" y="308" font-size="13" fill="#8B0029">+</text>
  <text x="238" y="132" font-size="14" fill="#2563EB">−</text>
  <text x="238" y="177" font-size="14" fill="#2563EB">−</text>
  <text x="238" y="222" font-size="14" fill="#2563EB">−</text>
  <text x="238" y="267" font-size="14" fill="#2563EB">−</text>
  <text x="238" y="308" font-size="14" fill="#2563EB">−</text>

  <!-- E arrows between plates -->
  <line x1="183" y1="150" x2="228" y2="150" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB3)"/>
  <line x1="183" y1="215" x2="228" y2="215" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB3)"/>
  <line x1="183" y1="280" x2="228" y2="280" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB3)"/>
  <text x="206" y="102" font-size="14" font-style="italic" fill="#2563EB" text-anchor="middle">E 증가</text>

  <!-- right wire + current -->
  <line x1="263" y1="215" x2="380" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="288" y1="197" x2="358" y2="197" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR3)"/>
  <text x="323" y="184" font-size="14" font-style="italic" fill="#8B0029" text-anchor="middle">i</text>

  <text x="200" y="360" font-size="13.5" fill="#1a1a1a" text-anchor="middle">전류 i가 판을 충전한다</text>
  <text x="200" y="382" font-size="13.5" fill="#1a1a1a" text-anchor="middle">→ 판 사이의 E와 전기다발 Φ<tspan font-size="10" dy="3" font-style="italic">E</tspan><tspan dy="-3">가 증가</tspan></text>

  <!-- ============ Panel (b): face view ============ -->
  <text x="565" y="38" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">(b) 판 사이에서 본 정면도</text>

  <!-- plate circle -->
  <circle cx="565" cy="215" r="115" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- E into page: x symbols (blue) -->
  <g fill="#2563EB" font-size="14" text-anchor="middle">
    <text x="565" y="172">×</text><text x="512" y="158">×</text><text x="622" y="160">×</text>
    <text x="480" y="205">×</text><text x="565" y="200">×</text><text x="650" y="205">×</text>
    <text x="520" y="245">×</text><text x="610" y="245">×</text>
    <text x="480" y="250">×</text><text x="650" y="250">×</text>
    <text x="565" y="255">×</text>
    <text x="525" y="295">×</text><text x="605" y="295">×</text>
  </g>

  <!-- Amperian loop r < R -->
  <circle cx="565" cy="215" r="68" fill="none" stroke="#8B0029" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- B tangent arrows (clockwise, since dE/dt is into the page) -->
  <line x1="545" y1="147" x2="597" y2="147" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR3)"/>
  <line x1="633" y1="195" x2="633" y2="247" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR3)"/>
  <line x1="585" y1="283" x2="533" y2="283" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR3)"/>
  <line x1="497" y1="235" x2="497" y2="183" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR3)"/>
  <text x="622" y="135" font-size="14" font-style="italic" font-weight="bold" fill="#8B0029">B</text>

  <!-- radius labels -->
  <line x1="565" y1="215" x2="612" y2="166" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="576" y="182" font-size="13" font-style="italic" fill="#6B7280">r</text>
  <line x1="565" y1="215" x2="484" y2="297" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="540" y="274" font-size="13" font-style="italic" fill="#6B7280">R</text>

  <text x="565" y="360" font-size="13.5" fill="#1a1a1a" text-anchor="middle">증가하는 E(×: 지면 안쪽) 둘레에</text>
  <text x="565" y="382" font-size="13.5" fill="#1a1a1a" text-anchor="middle">자기장 <tspan font-style="italic" fill="#8B0029">B</tspan>가 원형으로 유도된다</text>

  <text x="380" y="416" font-size="14" font-weight="bold" fill="#8B0029" text-anchor="middle">전류가 없는 판 사이 공간에서도, 변하는 전기다발이 자기장을 만든다</text>
</svg>
