<svg viewBox="0 0 760 390" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrR4" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="arrRd4" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
  </defs>

  <!-- left wire -->
  <line x1="30" y1="195" x2="300" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="70" y1="175" x2="180" y2="175" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR4)"/>
  <text x="125" y="160" font-size="14" fill="#8B0029" text-anchor="middle"><tspan font-style="italic">i</tspan> (실제 전류)</text>

  <!-- plates -->
  <rect x="300" y="95" width="12" height="200" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <rect x="448" y="95" width="12" height="200" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="306" y="88" font-size="14" fill="#8B0029" text-anchor="middle">+q</text>
  <text x="454" y="88" font-size="14" fill="#2563EB" text-anchor="middle">−q</text>

  <!-- displacement current arrows in the gap -->
  <line x1="322" y1="120" x2="436" y2="120" stroke="#8B0029" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRd4)"/>
  <line x1="322" y1="158" x2="436" y2="158" stroke="#8B0029" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRd4)"/>
  <line x1="322" y1="196" x2="436" y2="196" stroke="#8B0029" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRd4)"/>
  <line x1="322" y1="234" x2="436" y2="234" stroke="#8B0029" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRd4)"/>
  <line x1="322" y1="272" x2="436" y2="272" stroke="#8B0029" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRd4)"/>
  <text x="380" y="60" font-size="14" font-weight="bold" fill="#8B0029" text-anchor="middle">변위 전류 <tspan font-style="italic">i</tspan><tspan font-size="11" dy="3" font-style="italic">d</tspan></text>
  <text x="380" y="320" font-size="12.5" fill="#6B7280" text-anchor="middle">판 전체에 고르게 퍼져 있는 가상의 전류</text>

  <!-- right wire -->
  <line x1="460" y1="195" x2="730" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="570" y1="175" x2="680" y2="175" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrR4)"/>
  <text x="625" y="160" font-size="14" fill="#8B0029" text-anchor="middle"><tspan font-style="italic">i</tspan> (실제 전류)</text>

  <!-- bottom notes -->
  <text x="380" y="352" font-size="13.5" fill="#1a1a1a" text-anchor="middle">판 사이에서 실제로 이동하는 전하는 없다 — 변하는 전기다발이 전류 역할을 한다</text>
  <text x="380" y="378" font-size="14.5" font-weight="bold" fill="#8B0029" text-anchor="middle">i<tspan font-size="11" dy="3" font-style="italic">d</tspan><tspan dy="-3"> = ε₀ dΦ</tspan><tspan font-size="11" dy="3" font-style="italic">E</tspan><tspan dy="-3">/dt = i  →  전류가 축전기를 "통과"하듯 이어진다</tspan></text>
</svg>
