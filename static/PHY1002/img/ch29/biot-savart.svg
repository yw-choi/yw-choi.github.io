<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aR" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="aB" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2563EB"/>
    </marker>
    <marker id="aG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- arbitrary curved wire carrying current i -->
  <path d="M 175 380 C 130 300, 185 210, 160 130 C 150 95, 130 70, 105 40"
        fill="none" stroke="#8B0029" stroke-width="2"/>
  <!-- current direction arrows on wire -->
  <path d="M 158 345 L 152 310" fill="none" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
  <path d="M 150 105 L 133 75" fill="none" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR)"/>
  <text x="128" y="340" font-size="15" font-style="italic" fill="#8B0029">i</text>
  <text x="108" y="100" font-size="15" font-style="italic" fill="#8B0029">i</text>
  <text x="185" y="375" font-size="13" fill="#6B7280">전류 분포</text>

  <!-- current element i ds (tangent to wire at E=(163,225), tangent dir approx (-0.10,-0.99)) -->
  <line x1="167" y1="252" x2="160" y2="200" stroke="#8B0029" stroke-width="4" marker-end="url(#aR)"/>
  <text x="102" y="222" font-size="15" font-style="italic" font-weight="bold" fill="#8B0029">i&#160;ds</text>

  <!-- line from element to P -->
  <line x1="163" y1="225" x2="480" y2="268" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="310" y="232" font-size="15" font-style="italic" fill="#6B7280">r</text>

  <!-- unit vector r-hat from element toward P -->
  <line x1="186" y1="228" x2="243" y2="235.8" stroke="#6B7280" stroke-width="2.5" marker-end="url(#aG)"/>
  <text x="215" y="262" font-size="15" font-style="italic" fill="#6B7280">r&#770;</text>

  <!-- angle theta between ds and r-hat -->
  <path d="M 158 191 A 34 34 0 0 1 197 229" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="196" y="196" font-size="15" font-style="italic" fill="#1a1a1a">&#952;</text>

  <!-- point P and dB into page -->
  <circle cx="480" cy="268" r="4" fill="#1a1a1a"/>
  <text x="474" y="252" font-size="15" font-style="italic" fill="#1a1a1a">P</text>
  <circle cx="530" cy="268" r="13" fill="none" stroke="#2563EB" stroke-width="2"/>
  <line x1="521" y1="259" x2="539" y2="277" stroke="#2563EB" stroke-width="2"/>
  <line x1="539" y1="259" x2="521" y2="277" stroke="#2563EB" stroke-width="2"/>
  <text x="552" y="263" font-size="15" font-style="italic" font-weight="bold" fill="#2563EB">dB</text>
  <text x="552" y="283" font-size="12.5" fill="#2563EB">(지면 안으로)</text>

  <!-- formula box -->
  <rect x="380" y="60" width="280" height="86" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="398" y="95" font-size="16" font-style="italic" fill="#1a1a1a">dB = (&#956;&#8320;/4&#960;) · i ds &#215; r&#770; / r&#178;</text>
  <text x="398" y="126" font-size="13" fill="#6B7280">비오-사바르 법칙 (Biot&#8211;Savart law)</text>

  <!-- caption -->
  <text x="380" y="330" font-size="13.5" fill="#1a1a1a">전류 요소 i ds 가 점 P에 만드는 미소 자기장:</text>
  <text x="380" y="352" font-size="13.5" fill="#1a1a1a">방향은 ds &#215; r&#770; (여기서는 지면 안쪽 &#10683;)</text>
</svg>
