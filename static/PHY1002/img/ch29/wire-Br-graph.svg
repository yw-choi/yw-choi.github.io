<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aG7" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- axes: origin (110, 340), x to 650, y to 50 -->
  <line x1="110" y1="340" x2="650" y2="340" stroke="#6B7280" stroke-width="1.5" marker-end="url(#aG7)"/>
  <line x1="110" y1="340" x2="110" y2="50" stroke="#6B7280" stroke-width="1.5" marker-end="url(#aG7)"/>
  <text x="660" y="345" font-size="15" font-style="italic" fill="#1a1a1a">r</text>
  <text x="98" y="42" font-size="15" font-style="italic" fill="#1a1a1a">B</text>
  <text x="96" y="358" font-size="13" fill="#6B7280">0</text>

  <!-- wire surface r = R at x = 290; peak B at y = 110 -->
  <line x1="290" y1="340" x2="290" y2="110" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="284" y="362" font-size="15" font-style="italic" fill="#1a1a1a">R</text>

  <!-- Bmax guide -->
  <line x1="110" y1="110" x2="290" y2="110" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="30" y="105" font-size="13.5" font-style="italic" fill="#1a1a1a">B<tspan font-size="10" dy="3">max</tspan></text>
  <text x="18" y="126" font-size="12" fill="#6B7280">&#956;&#8320;i/2&#960;R</text>

  <!-- inside: linear from (110,340) to (290,110) -->
  <line x1="110" y1="340" x2="290" y2="110" stroke="#8B0029" stroke-width="2.5"/>

  <!-- outside: B = Bmax * R/r ; x=290->y=110 ; points: r_px = 290 + t, y = 340 - 230*(180/(x-110)) -->
  <!-- y(x) = 340 - 230*180/(x-110): x=290:110, x=330:151.8, x=380:186.7, x=440:214.5, x=500:233.8, x=560:248, x=640:261.9 -->
  <path d="M 290 110 L 310 133 L 330 151.8 L 355 171.1 L 380 186.7 L 410 202 L 440 214.5 L 470 225 L 500 233.8 L 540 243.7 L 580 251.9 L 640 261.9"
        fill="none" stroke="#8B0029" stroke-width="2.5"/>

  <!-- region annotations -->
  <text x="150" y="215" font-size="14" fill="#1a1a1a">내부</text>
  <text x="130" y="238" font-size="14" font-style="italic" fill="#8B0029">B &#8733; r</text>
  <text x="126" y="260" font-size="12.5" fill="#6B7280">B = (&#956;&#8320;i/2&#960;R&#178;) r</text>

  <text x="450" y="150" font-size="14" fill="#1a1a1a">외부</text>
  <text x="430" y="173" font-size="14" font-style="italic" fill="#8B0029">B &#8733; 1/r</text>
  <text x="426" y="195" font-size="12.5" fill="#6B7280">B = &#956;&#8320;i/2&#960;r</text>

  <!-- wire cross-section inset under axis -->
  <circle cx="200" cy="390" r="0" fill="none"/>
  <text x="380" y="400" font-size="13.5" fill="#1a1a1a" text-anchor="middle">균일한 전류가 흐르는 반지름 R인 도선: 표면(r = R)에서 두 식이 일치하며 B가 최대</text>
</svg>
