<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aR5" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
  </defs>

  <!-- ===== left panel: same direction -> attraction ===== -->
  <text x="195" y="45" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">같은 방향 전류 &#8594; 인력</text>

  <!-- wire a (top) -->
  <line x1="60" y1="110" x2="330" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="160" y1="110" x2="230" y2="110" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR5)"/>
  <text x="240" y="98" font-size="14" font-style="italic" fill="#8B0029">i&#8321;</text>
  <text x="46" y="115" font-size="14" font-style="italic" fill="#6B7280">a</text>

  <!-- wire b (bottom) -->
  <line x1="60" y1="270" x2="330" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="160" y1="270" x2="230" y2="270" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR5)"/>
  <text x="240" y="258" font-size="14" font-style="italic" fill="#8B0029">i&#8322;</text>
  <text x="46" y="275" font-size="14" font-style="italic" fill="#6B7280">b</text>

  <!-- separation d -->
  <line x1="90" y1="110" x2="90" y2="270" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="72" y="196" font-size="14" font-style="italic" fill="#6B7280">d</text>

  <!-- force arrows: toward each other -->
  <line x1="195" y1="128" x2="195" y2="180" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR5)"/>
  <text x="205" y="160" font-size="14" font-style="italic" font-weight="bold" fill="#8B0029">F</text>
  <line x1="195" y1="252" x2="195" y2="200" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR5)"/>
  <text x="205" y="232" font-size="14" font-style="italic" font-weight="bold" fill="#8B0029">F</text>

  <!-- field of wire a at wire b: into page below a -->
  <circle cx="300" cy="235" r="11" fill="none" stroke="#2563EB" stroke-width="2"/>
  <line x1="292.5" y1="227.5" x2="307.5" y2="242.5" stroke="#2563EB" stroke-width="2"/>
  <line x1="307.5" y1="227.5" x2="292.5" y2="242.5" stroke="#2563EB" stroke-width="2"/>
  <text x="288" y="212" font-size="13" font-style="italic" font-weight="bold" fill="#2563EB">B&#8321;</text>

  <!-- ===== right panel: opposite direction -> repulsion ===== -->
  <text x="565" y="45" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">반대 방향 전류 &#8594; 척력</text>

  <!-- wire a (top), current to the right -->
  <line x1="430" y1="110" x2="700" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="530" y1="110" x2="600" y2="110" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR5)"/>
  <text x="610" y="98" font-size="14" font-style="italic" fill="#8B0029">i&#8321;</text>

  <!-- wire b (bottom), current to the left -->
  <line x1="430" y1="270" x2="700" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="600" y1="270" x2="530" y2="270" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR5)"/>
  <text x="610" y="258" font-size="14" font-style="italic" fill="#8B0029">i&#8322;</text>

  <!-- separation d -->
  <line x1="460" y1="110" x2="460" y2="270" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="442" y="196" font-size="14" font-style="italic" fill="#6B7280">d</text>

  <!-- force arrows: away from each other -->
  <line x1="565" y1="92" x2="565" y2="65" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR5)"/>
  <text x="575" y="82" font-size="14" font-style="italic" font-weight="bold" fill="#8B0029">F</text>
  <line x1="565" y1="288" x2="565" y2="315" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR5)"/>
  <text x="575" y="310" font-size="14" font-style="italic" font-weight="bold" fill="#8B0029">F</text>

  <!-- bottom caption -->
  <text x="380" y="372" font-size="14" fill="#1a1a1a" text-anchor="middle">단위 길이당 힘: F/L = &#956;&#8320; i&#8321; i&#8322; / 2&#960;d</text>
</svg>
