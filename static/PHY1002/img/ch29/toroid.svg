<svg viewBox="0 0 700 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aR9" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="aB9" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2563EB"/>
    </marker>
    <marker id="aG9" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- annulus body -->
  <circle cx="280" cy="230" r="160" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <circle cx="280" cy="230" r="90" fill="#fff" stroke="#6B7280" stroke-width="1"/>

  <!-- inner winding crossings: current OUT of page (dots), r=90, every 30 deg -->
  <g stroke="#8B0029" stroke-width="1.8" fill="#fff">
    <circle cx="370" cy="230" r="7"/><circle cx="357.9" cy="185" r="7"/><circle cx="325" cy="152.1" r="7"/>
    <circle cx="280" cy="140" r="7"/><circle cx="235" cy="152.1" r="7"/><circle cx="202.1" cy="185" r="7"/>
    <circle cx="190" cy="230" r="7"/><circle cx="202.1" cy="275" r="7"/><circle cx="235" cy="307.9" r="7"/>
    <circle cx="280" cy="320" r="7"/><circle cx="325" cy="307.9" r="7"/><circle cx="357.9" cy="275" r="7"/>
  </g>
  <g fill="#8B0029">
    <circle cx="370" cy="230" r="2.2"/><circle cx="357.9" cy="185" r="2.2"/><circle cx="325" cy="152.1" r="2.2"/>
    <circle cx="280" cy="140" r="2.2"/><circle cx="235" cy="152.1" r="2.2"/><circle cx="202.1" cy="185" r="2.2"/>
    <circle cx="190" cy="230" r="2.2"/><circle cx="202.1" cy="275" r="2.2"/><circle cx="235" cy="307.9" r="2.2"/>
    <circle cx="280" cy="320" r="2.2"/><circle cx="325" cy="307.9" r="2.2"/><circle cx="357.9" cy="275" r="2.2"/>
  </g>

  <!-- outer winding crossings: current INTO page (crosses), r=160, every 30 deg -->
  <g stroke="#8B0029" stroke-width="1.8" fill="#fff">
    <circle cx="440" cy="230" r="7"/><circle cx="418.6" cy="150" r="7"/><circle cx="360" cy="91.4" r="7"/>
    <circle cx="280" cy="70" r="7"/><circle cx="200" cy="91.4" r="7"/><circle cx="141.4" cy="150" r="7"/>
    <circle cx="120" cy="230" r="7"/><circle cx="141.4" cy="310" r="7"/><circle cx="200" cy="368.6" r="7"/>
    <circle cx="280" cy="390" r="7"/><circle cx="360" cy="368.6" r="7"/><circle cx="418.6" cy="310" r="7"/>
  </g>
  <g stroke="#8B0029" stroke-width="1.5">
    <line x1="435.5" y1="225.5" x2="444.5" y2="234.5"/><line x1="444.5" y1="225.5" x2="435.5" y2="234.5"/>
    <line x1="414.1" y1="145.5" x2="423.1" y2="154.5"/><line x1="423.1" y1="145.5" x2="414.1" y2="154.5"/>
    <line x1="355.5" y1="86.9" x2="364.5" y2="95.9"/><line x1="364.5" y1="86.9" x2="355.5" y2="95.9"/>
    <line x1="275.5" y1="65.5" x2="284.5" y2="74.5"/><line x1="284.5" y1="65.5" x2="275.5" y2="74.5"/>
    <line x1="195.5" y1="86.9" x2="204.5" y2="95.9"/><line x1="204.5" y1="86.9" x2="195.5" y2="95.9"/>
    <line x1="136.9" y1="145.5" x2="145.9" y2="154.5"/><line x1="145.9" y1="145.5" x2="136.9" y2="154.5"/>
    <line x1="115.5" y1="225.5" x2="124.5" y2="234.5"/><line x1="124.5" y1="225.5" x2="115.5" y2="234.5"/>
    <line x1="136.9" y1="305.5" x2="145.9" y2="314.5"/><line x1="145.9" y1="305.5" x2="136.9" y2="314.5"/>
    <line x1="195.5" y1="364.1" x2="204.5" y2="373.1"/><line x1="204.5" y1="364.1" x2="195.5" y2="373.1"/>
    <line x1="275.5" y1="385.5" x2="284.5" y2="394.5"/><line x1="284.5" y1="385.5" x2="275.5" y2="394.5"/>
    <line x1="355.5" y1="364.1" x2="364.5" y2="373.1"/><line x1="364.5" y1="364.1" x2="355.5" y2="373.1"/>
    <line x1="414.1" y1="305.5" x2="423.1" y2="314.5"/><line x1="423.1" y1="305.5" x2="414.1" y2="314.5"/>
  </g>

  <!-- Amperian loop: dashed red circle r=125 -->
  <circle cx="280" cy="230" r="125" fill="none" stroke="#8B0029" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- integration direction arrow (CCW) at 45 deg -->
  <line x1="368.4" y1="141.6" x2="341" y2="114" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR9)"/>
  <text x="382" y="128" font-size="12.5" fill="#8B0029">암페어 고리</text>

  <!-- B tangent arrow (CCW) at 180 deg (left side): downward -->
  <line x1="155" y1="207" x2="155" y2="257" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB9)"/>
  <text x="128" y="236" font-size="15" font-style="italic" font-weight="bold" fill="#2563EB">B</text>

  <!-- radius r from center to loop (lower-right, 315 deg) -->
  <circle cx="280" cy="230" r="3" fill="#1a1a1a"/>
  <line x1="280" y1="230" x2="368.4" y2="318.4" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#aG9)"/>
  <text x="330" y="292" font-size="15" font-style="italic" fill="#6B7280">r</text>

  <!-- winding legend -->
  <text x="470" y="70" font-size="13" fill="#8B0029">&#8855; 바깥쪽: 들어가는 전류</text>
  <text x="470" y="94" font-size="13" fill="#8B0029">&#8857; 안쪽: 나오는 전류</text>
  <text x="470" y="118" font-size="13" fill="#6B7280">총 감은 수 N, 전류 i</text>

  <!-- formula box -->
  <rect x="470" y="160" width="210" height="140" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="488" y="192" font-size="14.5" font-style="italic" fill="#1a1a1a">B(2&#960;r) = &#956;&#8320; i N</text>
  <text x="488" y="226" font-size="15.5" font-style="italic" fill="#8B0029">B = &#956;&#8320; i N / 2&#960;r</text>
  <text x="488" y="258" font-size="12.5" fill="#6B7280">관 내부에서만 (1/r 로 감소)</text>
  <text x="488" y="282" font-size="12.5" fill="#6B7280">토로이드 밖: B = 0</text>

  <!-- caption -->
  <text x="350" y="440" font-size="13.5" fill="#1a1a1a" text-anchor="middle">토로이드의 수평 단면: 자기력선은 관 내부를 도는 동심원 &#8594; 반지름 r인 원을 암페어 고리로 선택</text>
</svg>
