<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aB2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- ===== left panel: current OUT of page, B counterclockwise ===== -->
  <text x="200" y="40" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">전류가 나오는 방향 &#8857;</text>

  <!-- concentric field-line circles -->
  <circle cx="200" cy="230" r="50" fill="none" stroke="#2563EB" stroke-width="2"/>
  <circle cx="200" cy="230" r="95" fill="none" stroke="#2563EB" stroke-width="2"/>
  <circle cx="200" cy="230" r="140" fill="none" stroke="#2563EB" stroke-width="2"/>

  <!-- CCW direction arrows (at top of each circle, pointing left; at bottom pointing right) -->
  <line x1="212" y1="180" x2="188" y2="180" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>
  <line x1="214" y1="135" x2="186" y2="135" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>
  <line x1="216" y1="90"  x2="184" y2="90"  stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>
  <line x1="188" y1="280" x2="212" y2="280" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>
  <line x1="186" y1="325" x2="214" y2="325" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>
  <line x1="184" y1="370" x2="216" y2="370" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>

  <!-- tangent B vector on middle circle, right side, pointing up (CCW) -->
  <line x1="295" y1="255" x2="295" y2="205" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>
  <text x="305" y="225" font-size="15" font-style="italic" font-weight="bold" fill="#2563EB">B</text>

  <!-- wire cross-section: dot (out of page) -->
  <circle cx="200" cy="230" r="13" fill="#fff" stroke="#8B0029" stroke-width="2"/>
  <circle cx="200" cy="230" r="4" fill="#8B0029"/>
  <text x="220" y="222" font-size="14" font-style="italic" fill="#8B0029">i</text>

  <!-- ===== right panel: current INTO page, B clockwise ===== -->
  <text x="560" y="40" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">전류가 들어가는 방향 &#8855;</text>

  <circle cx="560" cy="230" r="50" fill="none" stroke="#2563EB" stroke-width="2"/>
  <circle cx="560" cy="230" r="95" fill="none" stroke="#2563EB" stroke-width="2"/>
  <circle cx="560" cy="230" r="140" fill="none" stroke="#2563EB" stroke-width="2"/>

  <!-- CW direction arrows (top pointing right; bottom pointing left) -->
  <line x1="548" y1="180" x2="572" y2="180" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>
  <line x1="546" y1="135" x2="574" y2="135" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>
  <line x1="544" y1="90"  x2="576" y2="90"  stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>
  <line x1="572" y1="280" x2="548" y2="280" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>
  <line x1="574" y1="325" x2="546" y2="325" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>
  <line x1="576" y1="370" x2="544" y2="370" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>

  <!-- tangent B vector on middle circle, right side, pointing down (CW) -->
  <line x1="655" y1="205" x2="655" y2="255" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB2)"/>
  <text x="665" y="235" font-size="15" font-style="italic" font-weight="bold" fill="#2563EB">B</text>

  <!-- wire cross-section: cross (into page) -->
  <circle cx="560" cy="230" r="13" fill="#fff" stroke="#8B0029" stroke-width="2"/>
  <line x1="551" y1="221" x2="569" y2="239" stroke="#8B0029" stroke-width="2"/>
  <line x1="569" y1="221" x2="551" y2="239" stroke="#8B0029" stroke-width="2"/>
  <text x="580" y="222" font-size="14" font-style="italic" fill="#8B0029">i</text>

  <!-- bottom caption -->
  <text x="380" y="408" font-size="13.5" fill="#6B7280" text-anchor="middle">오른손 엄지 = 전류 방향, 감아쥔 네 손가락 = 자기장 방향 (자기력선은 도선을 감싸는 동심원)</text>
</svg>
