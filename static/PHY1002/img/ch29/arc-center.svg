<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="aR4" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="aG4" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- center C at (330,320), R=200. Arc from 30deg to 150deg (upper), current CCW -->
  <!-- arc wire: start (503.2,220) -> end (156.8,220) through top (330,120) -->
  <path d="M 503.2 220 A 200 200 0 0 0 156.8 220" fill="none" stroke="#8B0029" stroke-width="2.5"/>
  <!-- current direction arrows on arc (CCW = from right end toward left end over the top) -->
  <line x1="437" y1="153" x2="410" y2="137" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR4)"/>
  <line x1="250" y1="137" x2="223" y2="153" stroke="#8B0029" stroke-width="2.5" marker-end="url(#aR4)"/>
  <text x="447" y="140" font-size="15" font-style="italic" fill="#8B0029">i</text>

  <!-- radii (dashed) from C to both ends -->
  <line x1="330" y1="320" x2="503.2" y2="220" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="330" y1="320" x2="156.8" y2="220" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="430" y="288" font-size="15" font-style="italic" fill="#6B7280">R</text>

  <!-- central angle phi -->
  <path d="M 373 295 A 50 50 0 0 0 287 295" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="322" y="272" font-size="16" font-style="italic" fill="#1a1a1a">&#966;</text>

  <!-- center C with B out of page -->
  <circle cx="330" cy="320" r="13" fill="none" stroke="#2563EB" stroke-width="2"/>
  <circle cx="330" cy="320" r="4" fill="#2563EB"/>
  <text x="352" y="316" font-size="15" font-style="italic" font-weight="bold" fill="#2563EB">B</text>
  <text x="352" y="336" font-size="12.5" fill="#2563EB">(지면 밖으로)</text>
  <text x="296" y="316" font-size="15" font-style="italic" fill="#1a1a1a">C</text>

  <!-- current element ds at top of arc, tangent (CCW at top = -x direction) -->
  <line x1="352" y1="120" x2="306" y2="120" stroke="#8B0029" stroke-width="4" marker-end="url(#aR4)"/>
  <text x="360" y="112" font-size="15" font-style="italic" font-weight="bold" fill="#8B0029">ds</text>

  <!-- r-hat from element toward C (downward) -->
  <line x1="330" y1="132" x2="330" y2="190" stroke="#6B7280" stroke-width="2.5" marker-end="url(#aG4)"/>
  <text x="340" y="172" font-size="15" font-style="italic" fill="#6B7280">r&#770;</text>

  <!-- right angle marker between ds and r-hat -->
  <path d="M 330 144 L 318 144 L 318 132" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="272" y="158" font-size="12.5" fill="#6B7280">90&#176;</text>

  <!-- formula box -->
  <rect x="470" y="40" width="210" height="86" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="488" y="75" font-size="16" font-style="italic" fill="#1a1a1a">B = &#956;&#8320; i &#966; / 4&#960;R</text>
  <text x="488" y="106" font-size="13" fill="#6B7280">(&#966;는 라디안, 중심 C에서만)</text>

  <!-- caption -->
  <text x="60" y="405" font-size="13.5" fill="#1a1a1a">원호 위 어디서나 ds &#8869; r&#770;, r = R &#8594; 모든 요소의 dB 가 같은 방향으로 더해진다</text>
</svg>
