<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8B0029"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2563EB"/>
    </marker>
    <marker id="arrDark" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>
<text x="205.0" y="48.0" font-size="14.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">(a) 전압 위상자들</text>
<line x1="60.0" y1="265.0" x2="385.0" y2="265.0" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="205.0" y1="265.0" x2="337.4" y2="194.6" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
<text x="353.4" y="188.6" font-size="15" fill="#2563EB" text-anchor="middle" font-style="italic" font-weight="bold">I</text>
<line x1="205.0" y1="265.0" x2="297.7" y2="215.7" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
<text x="299.7" y="245.7" font-size="14" fill="#8B0029" text-anchor="middle" font-style="italic">V<tspan font-size="10" dy="3">R</tspan></text>
<line x1="205.0" y1="265.0" x2="149.6" y2="160.8" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
<text x="143.6" y="150.8" font-size="14" fill="#8B0029" text-anchor="middle" font-style="italic">V<tspan font-size="10" dy="3">L</tspan></text>
<line x1="205.0" y1="265.0" x2="232.2" y2="316.2" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
<text x="236.2" y="336.2" font-size="14" fill="#8B0029" text-anchor="middle" font-style="italic">V<tspan font-size="10" dy="3">C</tspan></text>
<text x="120.0" y="130.0" font-size="12" fill="#6B7280" text-anchor="middle">V<tspan font-size="10" dy="3">L</tspan><tspan dy="-3">: I보다 90° 앞</tspan></text>
<text x="300.0" y="350.0" font-size="12" fill="#6B7280" text-anchor="middle">V<tspan font-size="10" dy="3">C</tspan><tspan dy="-3">: I보다 90° 뒤</tspan></text>
<path d="M247,265 A42,42 0 0 0 242.1,245.3" fill="none" stroke="#6B7280" stroke-width="1"/>
<text x="279.0" y="255.0" font-size="12" fill="#6B7280" text-anchor="middle" font-style="italic">ω<tspan font-size="9" dy="3">d</tspan><tspan dy="-3">t − φ</tspan></text>
<text x="605.0" y="48.0" font-size="14.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">(b) 벡터 합 → 직각삼각형</text>
<line x1="470.0" y1="300.0" x2="585.0" y2="300.0" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="545.0" y1="300.0" x2="637.7" y2="250.7" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
<text x="614.0" y="292.0" font-size="14" fill="#8B0029" text-anchor="middle" font-style="italic">V<tspan font-size="10" dy="3">R</tspan></text>
<line x1="637.7" y1="250.7" x2="609.5" y2="197.7" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
<text x="649.5" y="199.7" font-size="13" fill="#8B0029" text-anchor="middle">V<tspan font-size="10" dy="3">L</tspan><tspan dy="-3"> − V</tspan><tspan font-size="10" dy="3">C</tspan></text>
<line x1="545.0" y1="300.0" x2="609.5" y2="197.7" stroke="#8B0029" stroke-width="3.5" marker-end="url(#arrRed)"/>
<text x="563.3" y="236.9" font-size="15" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">ℰ<tspan font-size="10" dy="3">m</tspan></text>
<path d="M627.1,256.3 L621.5,245.7 L632.1,240.1" fill="none" stroke="#6B7280" stroke-width="1.2"/>
<path d="M596.2,272.8 A58,58 0 0 0 576.0,251.0" fill="none" stroke="#2563EB" stroke-width="1.6"/>
<text x="599.2" y="253.7" font-size="14" fill="#2563EB" text-anchor="middle" font-style="italic" font-weight="bold">φ</text>
<text x="620.0" y="385.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-style="italic" font-weight="bold">ℰ<tspan font-size="10" dy="3">m</tspan><tspan dy="-3">² = V</tspan><tspan font-size="10" dy="3">R</tspan><tspan dy="-3">² + (V</tspan><tspan font-size="10" dy="3">L</tspan><tspan dy="-3"> − V</tspan><tspan font-size="10" dy="3">C</tspan><tspan dy="-3">)²</tspan></text>

</svg>
