<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="sans-serif">
  <defs>
    <marker id="dgB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="dgG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
    <marker id="dgR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="300" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">쌍극자 축 위의 점 P에서의 전기장</text>

  <!-- z axis -->
  <line x1="300" y1="440" x2="300" y2="52" stroke="#6B7280" stroke-width="1" marker-end="url(#dgG)"/>
  <text x="286" y="60" font-size="15" fill="#6B7280" font-style="italic" text-anchor="end">z</text>

  <!-- dashed connectors -->
  <g stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3">
    <line x1="120" y1="110" x2="420" y2="110"/>
    <line x1="180" y1="300" x2="296" y2="300"/>
    <line x1="120" y1="380" x2="296" y2="380"/>
    <line x1="304" y1="340" x2="420" y2="340"/>
  </g>

  <!-- point P -->
  <circle cx="300" cy="110" r="4" fill="#1a1a1a"/>
  <text x="284" y="102" font-size="15" fill="#1a1a1a" font-style="italic" text-anchor="end" font-weight="bold">P</text>

  <!-- E(+) long, E(-) short -->
  <line x1="314" y1="108" x2="314" y2="48" stroke="#2563EB" stroke-width="2.5" marker-end="url(#dgB)"/>
  <text x="328" y="66" font-size="15" fill="#2563EB" font-style="italic" font-weight="bold">E₊</text>
  <line x1="314" y1="112" x2="314" y2="152" stroke="#6B7280" stroke-width="2.5" marker-end="url(#dgG)"/>
  <text x="328" y="146" font-size="15" fill="#6B7280" font-style="italic" font-weight="bold">E₋</text>

  <!-- charges -->
  <circle cx="300" cy="300" r="13" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="300" y="306" font-size="14" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <text x="332" y="305" font-size="15" fill="#1a1a1a" font-style="italic">+q</text>
  <circle cx="300" cy="380" r="13" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="300" y="386" font-size="14" fill="white" text-anchor="middle" font-weight="bold">−</text>
  <text x="332" y="385" font-size="15" fill="#1a1a1a" font-style="italic">−q</text>

  <!-- dipole center -->
  <circle cx="300" cy="340" r="3" fill="#1a1a1a"/>
  <text x="392" y="332" font-size="12" fill="#6B7280" text-anchor="middle">쌍극자 중심</text>

  <!-- p vector (from -q toward +q) -->
  <line x1="272" y1="372" x2="272" y2="310" stroke="#8B0029" stroke-width="2.5" marker-end="url(#dgR)"/>
  <text x="258" y="345" font-size="15" fill="#8B0029" font-style="italic" text-anchor="end" font-weight="bold">p</text>

  <!-- d dimension (left) -->
  <line x1="234" y1="300" x2="234" y2="380" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="228" y1="300" x2="240" y2="300" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="228" y1="380" x2="240" y2="380" stroke="#6B7280" stroke-width="1.6"/>
  <text x="220" y="345" font-size="15" fill="#6B7280" font-style="italic" text-anchor="end">d</text>

  <!-- r+ dimension -->
  <line x1="180" y1="110" x2="180" y2="300" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="174" y1="110" x2="186" y2="110" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="174" y1="300" x2="186" y2="300" stroke="#6B7280" stroke-width="1.6"/>
  <text x="166" y="210" font-size="15" fill="#6B7280" font-style="italic" text-anchor="end">r₊</text>

  <!-- r- dimension -->
  <line x1="120" y1="110" x2="120" y2="380" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="114" y1="110" x2="126" y2="110" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="114" y1="380" x2="126" y2="380" stroke="#6B7280" stroke-width="1.6"/>
  <text x="106" y="250" font-size="15" fill="#6B7280" font-style="italic" text-anchor="end">r₋</text>

  <!-- z dimension (right) -->
  <line x1="420" y1="110" x2="420" y2="340" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="414" y1="110" x2="426" y2="110" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="414" y1="340" x2="426" y2="340" stroke="#6B7280" stroke-width="1.6"/>
  <text x="434" y="230" font-size="15" fill="#6B7280" font-style="italic">z</text>

  <!-- caption -->
  <text x="300" y="478" font-size="14" fill="#1a1a1a" text-anchor="middle">가까운 +q의 장 E₊가 먼 −q의 장 E₋보다 크다 → 알짜 장은 +z 방향 (p와 같은 방향)</text>
</svg>
