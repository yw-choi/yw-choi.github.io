<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="sans-serif">
  <defs>
    <marker id="wdR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="320" y="36" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">물 분자(H₂O)는 영구 전기 쌍극자다</text>

  <!-- positive / negative side labels + symmetry axis -->
  <text x="320" y="152" font-size="13" fill="#8B0029" text-anchor="middle" font-weight="bold">양(+)의 쪽</text>
  <line x1="320" y1="160" x2="320" y2="212" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="320" y1="368" x2="320" y2="384" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="320" y="402" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="bold">음(−)의 쪽</text>

  <!-- bonds -->
  <line x1="320" y1="290" x2="237" y2="226" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="320" y1="290" x2="403" y2="226" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- oxygen -->
  <circle cx="320" cy="290" r="72" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- hydrogens -->
  <circle cx="237" cy="226" r="40" fill="white" stroke="#6B7280" stroke-width="2"/>
  <circle cx="403" cy="226" r="40" fill="white" stroke="#6B7280" stroke-width="2"/>
  <text x="237" y="212" font-size="14" fill="#8B0029" text-anchor="middle" font-weight="bold">δ+</text>
  <text x="237" y="238" font-size="13" fill="#1a1a1a" text-anchor="middle">수소 (H)</text>
  <text x="403" y="212" font-size="14" fill="#8B0029" text-anchor="middle" font-weight="bold">δ+</text>
  <text x="403" y="238" font-size="13" fill="#1a1a1a" text-anchor="middle">수소 (H)</text>

  <!-- bond angle -->
  <path d="M 283.6,261.9 A 46 46 0 0 1 356.4,261.9" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="320" y="258" font-size="13" fill="#6B7280" text-anchor="middle">105°</text>

  <!-- oxygen labels -->
  <text x="320" y="296" font-size="13" fill="#1a1a1a" text-anchor="middle">산소 (O)</text>
  <text x="320" y="330" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="bold">δ−</text>

  <!-- dipole moment vector -->
  <line x1="520" y1="330" x2="520" y2="180" stroke="#8B0029" stroke-width="2.5" marker-end="url(#wdR)"/>
  <text x="536" y="252" font-size="16" fill="#8B0029" font-style="italic" font-weight="bold">p</text>
  <text x="520" y="160" font-size="12" fill="#6B7280" text-anchor="middle">쌍극자 모멘트</text>
  <text x="520" y="356" font-size="12" fill="#6B7280" text-anchor="middle">− 쪽에서 + 쪽으로</text>

  <!-- caption -->
  <text x="320" y="440" font-size="14" fill="#1a1a1a" text-anchor="middle">전자들이 산소 쪽에 몰려 있다 → 산소 쪽은 (−), 수소 쪽은 (+): <tspan font-style="italic">p</tspan> = 6.2×10⁻³⁰ C·m</text>
</svg>
