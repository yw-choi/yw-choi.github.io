<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="sans-serif">
  <defs>
    <marker id="mkR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="mkB" markerWidth="9" markerHeight="6.3" refX="9" refY="3.15" orient="auto"><polygon points="0 0, 9 3.15, 0 6.3" fill="#2563EB"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="350" y="36" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">밀리컨 기름방울 실험 (1910–1913)</text>

  <!-- chamber outline -->
  <rect x="160" y="80" width="380" height="330" fill="none" stroke="#6B7280" stroke-width="2"/>

  <!-- oil spray in chamber A -->
  <text x="300" y="106" font-size="13" fill="#1a1a1a" text-anchor="middle">기름 방울 분무</text>
  <g fill="#6B7280">
    <circle cx="260" cy="130" r="2.5"/><circle cx="300" cy="122" r="2.5"/><circle cx="330" cy="150" r="2.5"/>
    <circle cx="380" cy="135" r="2.5"/><circle cx="420" cy="126" r="2.5"/><circle cx="310" cy="168" r="2.5"/>
  </g>
  <!-- drop path through hole -->
  <line x1="350" y1="130" x2="350" y2="196" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- plate P1 with hole -->
  <rect x="180" y="200" width="150" height="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <rect x="370" y="200" width="150" height="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <g fill="#8B0029" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="210" y="196">+</text><text x="250" y="196">+</text><text x="290" y="196">+</text>
    <text x="410" y="196">+</text><text x="450" y="196">+</text><text x="490" y="196">+</text>
  </g>
  <text x="168" y="228" font-size="13" fill="#1a1a1a">판 P₁ (+)</text>

  <!-- plate P2 -->
  <rect x="180" y="340" width="340" height="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <g fill="#2563EB" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="210" y="336">−</text><text x="250" y="336">−</text><text x="290" y="336">−</text>
    <text x="410" y="336">−</text><text x="450" y="336">−</text><text x="490" y="336">−</text>
  </g>
  <text x="168" y="374" font-size="13" fill="#1a1a1a">판 P₂ (−)</text>

  <!-- E field arrows in chamber C -->
  <line x1="240" y1="235" x2="240" y2="285" stroke="#2563EB" stroke-width="2" marker-end="url(#mkB)"/>
  <line x1="460" y1="235" x2="460" y2="285" stroke="#2563EB" stroke-width="2" marker-end="url(#mkB)"/>
  <text x="224" y="264" font-size="15" fill="#2563EB" font-style="italic" text-anchor="end" font-weight="bold">E</text>

  <!-- oil drop with forces -->
  <circle cx="350" cy="272" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="350" y="277" font-size="11" fill="white" text-anchor="middle" font-weight="bold">−</text>
  <line x1="350" y1="261" x2="350" y2="226" stroke="#8B0029" stroke-width="2.5" marker-end="url(#mkR)"/>
  <text x="364" y="240" font-size="13" fill="#8B0029" font-style="italic" font-weight="bold">F = qE</text>
  <line x1="350" y1="283" x2="350" y2="318" stroke="#8B0029" stroke-width="2.5" marker-end="url(#mkR)"/>
  <text x="364" y="310" font-size="13" fill="#8B0029" font-style="italic" font-weight="bold">mg</text>

  <!-- circuit: P1 - battery - switch - P2 -->
  <g fill="none" stroke="#6B7280" stroke-width="1.6">
    <polyline points="520,206 600,206 600,253"/>
    <line x1="585" y1="255" x2="615" y2="255"/>
    <line x1="592" y1="268" x2="608" y2="268"/>
    <polyline points="600,268 600,300"/>
    <line x1="600" y1="300" x2="616" y2="322"/>
    <polyline points="600,327 600,346 520,346"/>
  </g>
  <circle cx="600" cy="300" r="3" fill="#6B7280"/>
  <circle cx="600" cy="327" r="3" fill="#6B7280"/>
  <text x="624" y="262" font-size="13" fill="#1a1a1a">전지 B</text>
  <text x="624" y="320" font-size="13" fill="#1a1a1a">스위치 S</text>

  <!-- caption -->
  <text x="350" y="446" font-size="14" fill="#1a1a1a" text-anchor="middle">스위치를 여닫으며 방울의 운동(낙하/상승)을 관찰한다</text>
  <text x="350" y="470" font-size="14" fill="#8B0029" text-anchor="middle" font-weight="bold">측정된 전하는 언제나 q = ne — 전하의 양자화를 직접 확인</text>
</svg>
