<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Electric field on the axis of a charged ring</title>
  <desc id="desc">Normalized axial field rises from zero, reaches a maximum at z over R equal to one over square root two, and then decays.</desc>
  <rect width="760" height="430" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <line x1="100" y1="350" x2="700" y2="350" stroke="#111" stroke-width="1.5"/>
    <line x1="100" y1="350" x2="100" y2="45" stroke="#111" stroke-width="1.5"/>
    <g font-size="17" text-anchor="middle">
      <line x1="100" y1="350" x2="100" y2="357" stroke="#111"/><text x="100" y="382">0</text>
      <line x1="250" y1="350" x2="250" y2="357" stroke="#111"/><text x="250" y="382">1</text>
      <line x1="400" y1="350" x2="400" y2="357" stroke="#111"/><text x="400" y="382">2</text>
      <line x1="550" y1="350" x2="550" y2="357" stroke="#111"/><text x="550" y="382">3</text>
      <line x1="700" y1="350" x2="700" y2="357" stroke="#111"/><text x="700" y="382">4</text>
      <text x="400" y="405" font-size="19" font-style="italic">z/R</text>
    </g>
    <g font-size="17" text-anchor="end">
      <text x="85" y="356">0</text><text x="85" y="280">0.1</text><text x="85" y="204">0.2</text><text x="85" y="128">0.3</text><text x="85" y="52">0.4</text>
      <line x1="93" y1="350" x2="100" y2="350" stroke="#111"/><line x1="93" y1="274" x2="100" y2="274" stroke="#111"/><line x1="93" y1="198" x2="100" y2="198" stroke="#111"/><line x1="93" y1="121" x2="100" y2="121" stroke="#111"/><line x1="93" y1="45" x2="100" y2="45" stroke="#111"/>
    </g>
    <text x="22" y="202" font-size="19" text-anchor="middle" transform="rotate(-90 22 202)">E / (kq/R²)</text>
    <polyline points="100,350 137.5,175.9 175,77.2 206.1,56.5 212.5,57.2 250,80.4 287.5,117.6 325,154.8 362.5,187 400,213.6 437.5,235.1 475,252.3 512.5,266.3 550,277.7 587.5,287 625,294.7 662.5,301.1 700,306.5" fill="none" stroke="#8B0029" stroke-width="3" stroke-linejoin="round"/>
    <line x1="206.1" y1="57" x2="206.1" y2="350" stroke="#6B7280" stroke-width="1" stroke-dasharray="5 5"/>
    <circle cx="206.1" cy="56.5" r="6" fill="#8B0029" stroke="#fff" stroke-width="2"/>
    <text x="222" y="51" fill="#8B0029" font-size="20" font-weight="700">z = R/√2</text>
    <text x="475" y="238" fill="#8B0029" font-size="20" font-weight="700">ring</text>
  </g>
</svg>
