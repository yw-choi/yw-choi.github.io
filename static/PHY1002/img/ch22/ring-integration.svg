<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" font-family="sans-serif">
  <defs>
    <marker id="riR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="riB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="riG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="320" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">대전된 고리의 축 위 전기장 — 적분 기하</text>

  <!-- z axis -->
  <line x1="320" y1="445" x2="320" y2="48" stroke="#6B7280" stroke-width="1" marker-end="url(#riG)"/>
  <text x="306" y="58" font-size="15" fill="#6B7280" font-style="italic" text-anchor="end">z</text>

  <!-- ring -->
  <ellipse cx="320" cy="390" rx="180" ry="45" fill="none" stroke="#8B0029" stroke-width="2.5"/>

  <!-- R line + right angle mark -->
  <line x1="320" y1="390" x2="140" y2="390" stroke="#6B7280" stroke-width="1.6"/>
  <text x="235" y="380" font-size="15" fill="#6B7280" font-style="italic">R</text>
  <path d="M 308,390 L 308,378 L 320,378" fill="none" stroke="#6B7280" stroke-width="1"/>
  <circle cx="320" cy="390" r="3" fill="#6B7280"/>

  <!-- z distance label -->
  <text x="332" y="285" font-size="15" fill="#6B7280" font-style="italic">z</text>

  <!-- r lines from elements to P -->
  <line x1="140" y1="390" x2="320" y2="160" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="216" y="266" font-size="15" fill="#6B7280" font-style="italic" text-anchor="end">r</text>
  <line x1="500" y1="390" x2="320" y2="160" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- charge element ds (left) -->
  <line x1="141.8" y1="396.3" x2="141.8" y2="383.7" stroke="#8B0029" stroke-width="7" stroke-linecap="round"/>
  <line x1="136" y1="382" x2="114" y2="334" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="110" y="322" font-size="13" fill="#1a1a1a" text-anchor="middle">전하 요소</text>
  <text x="110" y="302" font-size="13" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">dq = λ ds</text>

  <!-- symmetric element ds' (right) -->
  <line x1="498.2" y1="396.3" x2="498.2" y2="383.7" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
  <line x1="504" y1="382" x2="526" y2="334" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="532" y="322" font-size="13" fill="#1a1a1a" text-anchor="middle">대칭 요소</text>
  <text x="532" y="302" font-size="13" fill="#2563EB" text-anchor="middle" font-style="italic" font-weight="bold">ds′</text>

  <!-- point P -->
  <circle cx="320" cy="160" r="4" fill="#1a1a1a"/>
  <text x="302" y="156" font-size="15" fill="#1a1a1a" font-style="italic" text-anchor="end" font-weight="bold">P</text>

  <!-- dE and dE' at P -->
  <line x1="323.7" y1="155.3" x2="364.4" y2="103.3" stroke="#8B0029" stroke-width="2.5" marker-end="url(#riR)"/>
  <text x="378" y="102" font-size="15" fill="#8B0029" font-style="italic" font-weight="bold">dE</text>
  <line x1="316.3" y1="155.3" x2="275.6" y2="103.3" stroke="#2563EB" stroke-width="2.5" marker-end="url(#riB)"/>
  <text x="262" y="102" font-size="15" fill="#2563EB" font-style="italic" text-anchor="end" font-weight="bold">dE′</text>
  <!-- symmetry hint: horizontal dashed between tips -->
  <line x1="275.6" y1="103.3" x2="364.4" y2="103.3" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- theta angle at P -->
  <path d="M 320,130 A 30 30 0 0 1 338.5,136.4" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="337" y="122" font-size="14" fill="#6B7280" font-style="italic">θ</text>

  <!-- ring charge label -->
  <text x="320" y="470" font-size="13" fill="#1a1a1a" text-anchor="middle">균일하게 대전된 고리: 총 전하 <tspan font-style="italic">q</tspan>, 선전하 밀도 <tspan font-style="italic">λ = q/2πR</tspan></text>

  <!-- caption -->
  <text x="320" y="488" font-size="14" fill="#1a1a1a" text-anchor="middle">대칭 요소끼리 합치면 축에 수직인 성분은 상쇄 → 축 성분 <tspan font-style="italic">dE</tspan> cos <tspan font-style="italic">θ</tspan> 만 더하면 된다</text>
</svg>
