<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="sans-serif">
  <defs>
    <marker id="dtR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="dtB" markerWidth="9" markerHeight="6.3" refX="9" refY="3.15" orient="auto"><polygon points="0 0, 9 3.15, 0 6.3" fill="#2563EB"/></marker>
    <marker id="dtG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="350" y="40" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">균일한 전기장 속의 전기 쌍극자</text>

  <!-- uniform field lines -->
  <g stroke="#2563EB" stroke-width="1.2" opacity="0.55" marker-end="url(#dtB)">
    <line x1="60" y1="100" x2="640" y2="100"/>
    <line x1="60" y1="180" x2="640" y2="180"/>
    <line x1="60" y1="260" x2="640" y2="260"/>
    <line x1="60" y1="340" x2="640" y2="340"/>
  </g>
  <text x="622" y="88" font-size="15" fill="#2563EB" font-style="italic" font-weight="bold">E</text>

  <!-- rod -->
  <line x1="289" y1="281" x2="411" y2="159" stroke="#6B7280" stroke-width="3"/>

  <!-- angle reference and theta -->
  <line x1="350" y1="220" x2="470" y2="220" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M 390,220 A 40 40 0 0 0 378.3,191.7" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="398" y="214" font-size="14" fill="#6B7280" font-style="italic">θ</text>

  <!-- center of mass -->
  <circle cx="350" cy="220" r="4" fill="#1a1a1a"/>
  <text x="358" y="266" font-size="12" fill="#6B7280">질량중심</text>

  <!-- p vector (offset, parallel to rod) -->
  <line x1="310" y1="280" x2="410" y2="180" stroke="#8B0029" stroke-width="2.5" marker-end="url(#dtR)"/>
  <text x="428" y="196" font-size="15" fill="#8B0029" font-style="italic" font-weight="bold">p</text>

  <!-- charges -->
  <circle cx="420" cy="150" r="13" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="420" y="156" font-size="14" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <text x="420" y="126" font-size="14" fill="#1a1a1a" font-style="italic" text-anchor="middle">+q</text>
  <circle cx="280" cy="290" r="13" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="280" y="296" font-size="14" fill="white" text-anchor="middle" font-weight="bold">−</text>
  <text x="280" y="326" font-size="14" fill="#1a1a1a" font-style="italic" text-anchor="middle">−q</text>

  <!-- forces -->
  <line x1="436" y1="150" x2="514" y2="150" stroke="#8B0029" stroke-width="2.5" marker-end="url(#dtR)"/>
  <text x="524" y="155" font-size="15" fill="#8B0029" font-style="italic" font-weight="bold">F = qE</text>
  <line x1="264" y1="290" x2="186" y2="290" stroke="#8B0029" stroke-width="2.5" marker-end="url(#dtR)"/>
  <text x="176" y="295" font-size="15" fill="#8B0029" font-style="italic" text-anchor="end" font-weight="bold">−F</text>

  <!-- rotation (torque) arc near -q end -->
  <path d="M 269.4,270.3 A 95 95 0 0 1 255.1,223.3" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#dtG)"/>
  <text x="243" y="246" font-size="14" fill="#6B7280" text-anchor="end">토크 <tspan font-style="italic">τ</tspan></text>

  <!-- caption -->
  <text x="350" y="392" font-size="14" fill="#1a1a1a" text-anchor="middle">알짜힘은 0 (두 힘이 상쇄) — 하지만 토크는 남는다: <tspan font-style="italic">τ = pE</tspan> sin <tspan font-style="italic">θ</tspan></text>
  <text x="350" y="420" font-size="13" fill="#6B7280" text-anchor="middle">토크는 <tspan font-style="italic" fill="#8B0029">p</tspan> 를 <tspan font-style="italic" fill="#2563EB">E</tspan> 방향으로 정렬시키는 쪽으로 작용한다</text>
</svg>
