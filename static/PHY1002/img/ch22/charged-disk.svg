<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" font-family="sans-serif">
  <defs>
    <marker id="cdR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="cdG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="320" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">균일하게 대전된 원판의 축 위 전기장</text>

  <!-- disk -->
  <ellipse cx="320" cy="390" rx="200" ry="50" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <g fill="#8B0029" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="200" y="395">+</text><text x="250" y="358">+</text><text x="292" y="420">+</text>
    <text x="418" y="378">+</text><text x="388" y="418">+</text><text x="465" y="402">+</text>
    <text x="330" y="365">+</text>
  </g>

  <!-- ring element -->
  <ellipse cx="320" cy="390" rx="116" ry="29" fill="none" stroke="#8B0029" stroke-width="5" opacity="0.9"/>
  <line x1="238" y1="368" x2="166" y2="308" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="150" y="276" font-size="13" fill="#1a1a1a" text-anchor="middle">고리 요소:</text>
  <text x="150" y="296" font-size="13" fill="#8B0029" text-anchor="middle">반지름 <tspan font-style="italic">r</tspan>, 폭 <tspan font-style="italic">dr</tspan></text>

  <!-- radius lines -->
  <line x1="320" y1="390" x2="204" y2="390" stroke="#6B7280" stroke-width="1.6"/>
  <text x="256" y="380" font-size="14" fill="#6B7280" font-style="italic">r</text>
  <line x1="320" y1="390" x2="520" y2="390" stroke="#6B7280" stroke-width="1.6"/>
  <text x="436" y="380" font-size="14" fill="#6B7280" font-style="italic">R</text>
  <circle cx="320" cy="390" r="3" fill="#6B7280"/>

  <!-- z axis -->
  <line x1="320" y1="450" x2="320" y2="48" stroke="#6B7280" stroke-width="1" marker-end="url(#cdG)"/>
  <text x="306" y="58" font-size="15" fill="#6B7280" font-style="italic" text-anchor="end">z</text>

  <!-- point P and dE -->
  <circle cx="320" cy="130" r="4" fill="#1a1a1a"/>
  <text x="302" y="126" font-size="15" fill="#1a1a1a" font-style="italic" text-anchor="end" font-weight="bold">P</text>
  <line x1="320" y1="124" x2="320" y2="62" stroke="#8B0029" stroke-width="2.5" marker-end="url(#cdR)"/>
  <text x="336" y="90" font-size="15" fill="#8B0029" font-style="italic" font-weight="bold">dE</text>

  <!-- z dimension -->
  <g stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3">
    <line x1="330" y1="130" x2="560" y2="130"/>
    <line x1="330" y1="390" x2="560" y2="390"/>
  </g>
  <line x1="560" y1="130" x2="560" y2="390" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="554" y1="130" x2="566" y2="130" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="554" y1="390" x2="566" y2="390" stroke="#6B7280" stroke-width="1.6"/>
  <text x="574" y="265" font-size="15" fill="#6B7280" font-style="italic">z</text>

  <!-- labels -->
  <text x="320" y="472" font-size="13" fill="#1a1a1a" text-anchor="middle">균일한 표면전하 밀도 <tspan font-style="italic">σ</tspan> (C/m²)</text>
  <text x="320" y="488" font-size="14" fill="#1a1a1a" text-anchor="middle">고리 요소의 기여 <tspan font-style="italic">dE</tspan> 를 <tspan font-style="italic">r</tspan> = 0 부터 <tspan font-style="italic">R</tspan> 까지 적분한다</text>
</svg>
