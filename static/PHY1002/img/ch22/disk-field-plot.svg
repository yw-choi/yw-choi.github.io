<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Electric field on the axis of a uniformly charged disk</title>
  <desc id="desc">Normalized disk field begins at one near the disk and decreases with axial distance.</desc>
  <rect width="760" height="430" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <line x1="100" y1="350" x2="700" y2="350" stroke="#111" stroke-width="1.5"/>
    <line x1="100" y1="350" x2="100" y2="45" stroke="#111" stroke-width="1.5"/>
    <g font-size="17" text-anchor="middle">
      <line x1="100" y1="350" x2="100" y2="357" stroke="#111"/><text x="100" y="382">0</text>
      <line x1="220" y1="350" x2="220" y2="357" stroke="#111"/><text x="220" y="382">1</text>
      <line x1="340" y1="350" x2="340" y2="357" stroke="#111"/><text x="340" y="382">2</text>
      <line x1="460" y1="350" x2="460" y2="357" stroke="#111"/><text x="460" y="382">3</text>
      <line x1="580" y1="350" x2="580" y2="357" stroke="#111"/><text x="580" y="382">4</text>
      <line x1="700" y1="350" x2="700" y2="357" stroke="#111"/><text x="700" y="382">5</text>
      <text x="400" y="405" font-size="19" font-style="italic">z/R</text>
    </g>
    <g font-size="17" text-anchor="end">
      <text x="85" y="356">0</text><text x="85" y="295">0.2</text><text x="85" y="234">0.4</text><text x="85" y="173">0.6</text><text x="85" y="112">0.8</text><text x="85" y="51">1.0</text>
      <line x1="93" y1="350" x2="100" y2="350" stroke="#111"/><line x1="93" y1="289" x2="100" y2="289" stroke="#111"/><line x1="93" y1="228" x2="100" y2="228" stroke="#111"/><line x1="93" y1="167" x2="100" y2="167" stroke="#111"/><line x1="93" y1="106" x2="100" y2="106" stroke="#111"/><line x1="93" y1="45" x2="100" y2="45" stroke="#111"/>
    </g>
    <text x="22" y="203" font-size="19" text-anchor="middle" transform="rotate(-90 22 203)">E / (σ/2ε₀)</text>
    <polyline points="100,45 130,119 160,181.4 190,228 220,260.7 250,283.2 280,298.8 310,309.8 340,317.8 370,323.7 400,328.2 430,331.6 460,334.3 490,336.5 520,338.3 550,339.7 580,340.9 610,341.9 640,342.7 670,343.5 700,344.1" fill="none" stroke="#8B0029" stroke-width="3" stroke-linejoin="round"/>
    <text x="292" y="286" fill="#8B0029" font-size="20" font-weight="700">disk</text>
    <line x1="100" y1="45" x2="116" y2="45" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="126" y="52" fill="#6B7280" font-size="17">z/R → 0: 무한 평면 한계</text>
  </g>
</svg>
