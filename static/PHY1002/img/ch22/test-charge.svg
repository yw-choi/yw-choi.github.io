<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif">
  <defs>
    <marker id="tcR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8B0029"/></marker>
    <marker id="tcB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">전기장의 정의: 시험 전하로 장을 측정한다</text>

  <!-- ===== panel (a): force on test charge ===== -->
  <text x="190" y="66" font-size="14" fill="#6B7280" text-anchor="middle">(a) 시험 전하 q₀가 받는 힘</text>
  <!-- charged rod -->
  <rect x="60" y="110" width="52" height="210" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="86" y="140" font-size="16" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="86" y="175" font-size="16" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="86" y="210" font-size="16" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="86" y="245" font-size="16" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="86" y="280" font-size="16" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="86" y="315" font-size="16" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="86" y="345" font-size="13" fill="#1a1a1a" text-anchor="middle">대전체</text>
  <!-- test charge at P -->
  <line x1="112" y1="215" x2="216" y2="215" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="230" cy="215" r="14" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="230" y="221" font-size="15" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <text x="230" y="252" font-size="14" fill="#1a1a1a" text-anchor="middle">시험 전하 <tspan font-style="italic">q₀</tspan></text>
  <!-- force arrow -->
  <line x1="246" y1="215" x2="330" y2="215" stroke="#8B0029" stroke-width="2.5" marker-end="url(#tcR)"/>
  <text x="292" y="200" font-size="15" fill="#8B0029" text-anchor="middle" font-style="italic" font-weight="bold">F</text>
  <text x="292" y="240" font-size="13" fill="#6B7280" text-anchor="middle">정전기력</text>

  <!-- ===== panel (b): field at P ===== -->
  <text x="570" y="66" font-size="14" fill="#6B7280" text-anchor="middle">(b) 점 P의 전기장</text>
  <rect x="440" y="110" width="52" height="210" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="466" y="140" font-size="16" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="466" y="175" font-size="16" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="466" y="210" font-size="16" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="466" y="245" font-size="16" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="466" y="280" font-size="16" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="466" y="315" font-size="16" fill="#8B0029" text-anchor="middle" font-weight="bold">+</text>
  <text x="466" y="345" font-size="13" fill="#1a1a1a" text-anchor="middle">대전체</text>
  <!-- point P (no test charge) -->
  <line x1="492" y1="215" x2="600" y2="215" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="610" cy="215" r="4" fill="#1a1a1a"/>
  <text x="610" y="252" font-size="14" fill="#1a1a1a" text-anchor="middle" font-style="italic">P</text>
  <!-- E vector -->
  <line x1="616" y1="215" x2="700" y2="215" stroke="#2563EB" stroke-width="2.5" marker-end="url(#tcB)"/>
  <text x="660" y="200" font-size="15" fill="#2563EB" text-anchor="middle" font-style="italic" font-weight="bold">E</text>
  <text x="658" y="240" font-size="13" fill="#6B7280" text-anchor="middle">E = F / q₀</text>

  <!-- caption -->
  <text x="380" y="382" font-size="14" fill="#1a1a1a" text-anchor="middle">시험 전하를 치워도 전기장은 그 자리에 그대로 존재한다 — 장은 대전체가 만든다</text>
</svg>
