<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Dipole energy and torque versus angle</title>
  <desc id="desc">Normalized potential energy minus cosine theta and normalized torque magnitude sine theta from zero to pi.</desc>
  <rect width="760" height="430" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <line x1="100" y1="350" x2="700" y2="350" stroke="#111" stroke-width="1.5"/>
    <line x1="100" y1="350" x2="100" y2="45" stroke="#111" stroke-width="1.5"/>
    <line x1="100" y1="198" x2="700" y2="198" stroke="#6B7280" stroke-width="1"/>
    <g font-size="17" text-anchor="middle">
      <line x1="100" y1="350" x2="100" y2="357" stroke="#111"/><text x="100" y="382">0</text>
      <line x1="250" y1="350" x2="250" y2="357" stroke="#111"/><text x="250" y="382">π/4</text>
      <line x1="400" y1="350" x2="400" y2="357" stroke="#111"/><text x="400" y="382">π/2</text>
      <line x1="550" y1="350" x2="550" y2="357" stroke="#111"/><text x="550" y="382">3π/4</text>
      <line x1="700" y1="350" x2="700" y2="357" stroke="#111"/><text x="700" y="382">π</text>
      <text x="400" y="405" font-size="19" font-style="italic">θ</text>
    </g>
    <g font-size="17" text-anchor="end"><text x="85" y="356">−1</text><text x="85" y="280">−0.5</text><text x="85" y="204">0</text><text x="85" y="127">0.5</text><text x="85" y="51">1</text></g>
    <g stroke="#111"><line x1="93" y1="350" x2="100" y2="350"/><line x1="93" y1="274" x2="100" y2="274"/><line x1="93" y1="198" x2="100" y2="198"/><line x1="93" y1="121" x2="100" y2="121"/><line x1="93" y1="45" x2="100" y2="45"/></g>
    <text x="22" y="203" font-size="19" text-anchor="middle" transform="rotate(-90 22 203)">normalized value</text>
    <polyline points="100,350 137.5,347.1 175,338.4 212.5,324.3 250,305.3 287.5,282.2 325,255.9 362.5,227.3 400,197.5 437.5,167.7 475,139.1 512.5,112.8 550,89.7 587.5,70.7 625,56.6 662.5,47.9 700,45" fill="none" stroke="#8B0029" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="100,197.5 137.5,167.7 175,139.1 212.5,112.8 250,89.7 287.5,70.7 325,56.6 362.5,47.9 400,45 437.5,47.9 475,56.6 512.5,70.7 550,89.7 587.5,112.8 625,139.1 662.5,167.7 700,197.5" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/>
    <text x="565" y="87" fill="#8B0029" font-size="20" font-weight="700">U/pE = −cos θ</text>
    <text x="430" y="65" fill="#2563EB" font-size="20" font-weight="700">|τ|/pE = sin θ</text>
    <circle cx="100" cy="350" r="6" fill="#8B0029"/><circle cx="700" cy="45" r="6" fill="#8B0029"/>
  </g>
</svg>
