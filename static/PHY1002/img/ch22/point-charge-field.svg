<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="sans-serif">
  <defs>
    <marker id="pcB" markerWidth="9" markerHeight="6.3" refX="9" refY="3.15" orient="auto"><polygon points="0 0, 9 3.15, 0 6.3" fill="#2563EB"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">점전하 주위의 전기장 벡터</text>

  <!-- ===== positive charge panel, center (190,235) ===== -->
  <!-- inner ring arrows: r=60 -> 104 -->
  <g stroke="#2563EB" stroke-width="2.5" marker-end="url(#pcB)">
    <line x1="250" y1="235" x2="294" y2="235"/>
    <line x1="232.4" y1="192.6" x2="263.5" y2="161.5"/>
    <line x1="190" y1="175" x2="190" y2="131"/>
    <line x1="147.6" y1="192.6" x2="116.5" y2="161.5"/>
    <line x1="130" y1="235" x2="86" y2="235"/>
    <line x1="147.6" y1="277.4" x2="116.5" y2="308.5"/>
    <line x1="190" y1="295" x2="190" y2="339"/>
    <line x1="232.4" y1="277.4" x2="263.5" y2="308.5"/>
  </g>
  <!-- outer ring arrows: r=118 -> 150, diagonals only -->
  <g stroke="#2563EB" stroke-width="2.5" marker-end="url(#pcB)">
    <line x1="273.4" y1="151.6" x2="296.1" y2="129"/>
    <line x1="106.6" y1="151.6" x2="83.9" y2="129"/>
    <line x1="106.6" y1="318.4" x2="83.9" y2="341"/>
    <line x1="273.4" y1="318.4" x2="296.1" y2="341"/>
  </g>
  <!-- anchor dots -->
  <g fill="#1a1a1a">
    <circle cx="250" cy="235" r="3"/><circle cx="232.4" cy="192.6" r="3"/><circle cx="190" cy="175" r="3"/>
    <circle cx="147.6" cy="192.6" r="3"/><circle cx="130" cy="235" r="3"/><circle cx="147.6" cy="277.4" r="3"/>
    <circle cx="190" cy="295" r="3"/><circle cx="232.4" cy="277.4" r="3"/>
    <circle cx="273.4" cy="151.6" r="3"/><circle cx="106.6" cy="151.6" r="3"/>
    <circle cx="106.6" cy="318.4" r="3"/><circle cx="273.4" cy="318.4" r="3"/>
  </g>
  <!-- charge -->
  <circle cx="190" cy="235" r="17" fill="#8B0029" stroke="#8B0029" stroke-width="2"/>
  <text x="190" y="242" font-size="18" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <text x="312" y="222" font-size="15" fill="#2563EB" font-style="italic" font-weight="bold">E</text>
  <text x="190" y="392" font-size="14" fill="#1a1a1a" text-anchor="middle">양전하: 어디서나 전하에서 <tspan font-weight="bold">멀어지는</tspan> 방향</text>
  <text x="190" y="416" font-size="13" fill="#6B7280" text-anchor="middle">가까울수록 길다 (E ∝ 1/r²)</text>

  <!-- ===== negative charge panel, center (570,235) ===== -->
  <!-- inner ring: dot r=60, arrow 60 -> 24 (inward) -->
  <g stroke="#2563EB" stroke-width="2.5" marker-end="url(#pcB)">
    <line x1="630" y1="235" x2="594" y2="235"/>
    <line x1="612.4" y1="192.6" x2="587" y2="218"/>
    <line x1="570" y1="175" x2="570" y2="211"/>
    <line x1="527.6" y1="192.6" x2="553" y2="218"/>
    <line x1="510" y1="235" x2="546" y2="235"/>
    <line x1="527.6" y1="277.4" x2="553" y2="252"/>
    <line x1="570" y1="295" x2="570" y2="259"/>
    <line x1="612.4" y1="277.4" x2="587" y2="252"/>
  </g>
  <!-- outer ring: dot r=128, arrow 128 -> 94 (inward), diagonals -->
  <g stroke="#2563EB" stroke-width="2.5" marker-end="url(#pcB)">
    <line x1="660.5" y1="144.5" x2="636.5" y2="168.5"/>
    <line x1="479.5" y1="144.5" x2="503.5" y2="168.5"/>
    <line x1="479.5" y1="325.5" x2="503.5" y2="301.5"/>
    <line x1="660.5" y1="325.5" x2="636.5" y2="301.5"/>
  </g>
  <g fill="#1a1a1a">
    <circle cx="630" cy="235" r="3"/><circle cx="612.4" cy="192.6" r="3"/><circle cx="570" cy="175" r="3"/>
    <circle cx="527.6" cy="192.6" r="3"/><circle cx="510" cy="235" r="3"/><circle cx="527.6" cy="277.4" r="3"/>
    <circle cx="570" cy="295" r="3"/><circle cx="612.4" cy="277.4" r="3"/>
    <circle cx="660.5" cy="144.5" r="3"/><circle cx="479.5" cy="144.5" r="3"/>
    <circle cx="479.5" cy="325.5" r="3"/><circle cx="660.5" cy="325.5" r="3"/>
  </g>
  <circle cx="570" cy="235" r="17" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="570" y="241" font-size="18" fill="white" text-anchor="middle" font-weight="bold">−</text>
  <text x="570" y="392" font-size="14" fill="#1a1a1a" text-anchor="middle">음전하: 어디서나 전하를 <tspan font-weight="bold">향하는</tspan> 방향</text>
  <text x="570" y="416" font-size="13" fill="#6B7280" text-anchor="middle">벡터의 꼬리가 측정점에 붙어 있다</text>
</svg>
