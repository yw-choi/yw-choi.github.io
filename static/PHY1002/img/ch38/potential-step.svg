<svg viewBox="0 0 740 405" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs><marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B0029"/></marker><marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="390" y="180" width="300" height="140" fill="#F3F4F6"/>
<path d="M70,320 L390,320 L390,180 L690,180" stroke="#6B7280" stroke-width="2.5" fill="none"/>
<line x1="60" y1="320" x2="715" y2="320" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrInk)"/>
<line x1="70" y1="330" x2="70" y2="60" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrInk)"/>
<text x="712" y="342" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="italic">x</text>
<text x="56" y="66" font-size="13.5" fill="#1a1a1a" text-anchor="end" font-weight="normal">에너지</text>
<text x="390" y="342" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="normal" font-style="italic">x = 0</text>
<line x1="660" y1="316" x2="660" y2="184" stroke="#6B7280" stroke-width="1.5" marker-start="url(#arrGray)" marker-end="url(#arrGray)"/>
<text x="672" y="256" font-size="14.5" fill="#6B7280" text-anchor="start" font-weight="normal" font-style="italic">U<tspan font-size="10" dy="4">b</tspan></text>
<line x1="70" y1="120" x2="690" y2="120" stroke="#8B0029" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="700" y="124" font-size="15" fill="#8B0029" text-anchor="start" font-weight="bold" font-style="italic">E</text>
<text x="210" y="104" font-size="13" fill="#8B0029" text-anchor="middle" font-weight="normal" font-style="italic">총 에너지 E &gt; U<tspan font-size="10" dy="4">b</tspan><tspan dy="-4"> (고전적으로는 100% 통과)</tspan></text>
<text x="215" y="355" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="italic">영역 1 (U = 0)</text>
<text x="540" y="355" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="italic">영역 2 (U = U<tspan font-size="10" dy="4">b</tspan><tspan dy="-4">)</tspan></text>
<line x1="110" y1="155" x2="240" y2="155" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
<text x="175" y="143" font-size="12.5" fill="#8B0029" text-anchor="middle" font-weight="normal" font-style="italic">입사 (진폭 A)</text>
<line x1="240" y1="215" x2="110" y2="215" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
<text x="175" y="240" font-size="12.5" fill="#2563EB" text-anchor="middle" font-weight="normal" font-style="italic">반사 (진폭 B)</text>
<line x1="430" y1="155" x2="560" y2="155" stroke="#8B0029" stroke-width="2.5" marker-end="url(#arrRed)"/>
<text x="495" y="143" font-size="12.5" fill="#8B0029" text-anchor="middle" font-weight="normal" font-style="italic">투과 (진폭 C)</text>
<rect x="80" y="30" width="0" height="0" fill="none"/>
<text x="390" y="390" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="italic">반사 계수  R = |B|²/|A|²,   투과 계수  T = 1 − R   (양자역학: R ≠ 0 !)</text>
</svg>
