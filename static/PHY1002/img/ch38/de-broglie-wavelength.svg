<text x="307.5" y="46" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="italic">λ = h/p</text>
<text x="680" y="125" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="bold">물질파</text>
<text x="680" y="146" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal">(matter wave)</text>
<rect x="45" y="215" width="330" height="130" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/><text x="210" y="245" font-size="14.5" fill="#2563EB" text-anchor="middle" font-weight="bold">전자 (K = 120 eV)</text><text x="210" y="275" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal">λ ≈ 112 pm ≈ 원자 크기</text><text x="210" y="299" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal">→ 결정 격자에서 회절·간섭이</text><text x="210" y="323" font-size="13.5" fill="#8B0029" text-anchor="middle" font-weight="normal">실제로 관측된다</text>
<rect x="400" y="215" width="330" height="130" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/><text x="565" y="245" font-size="14.5" fill="#6B7280" text-anchor="middle" font-weight="bold">야구공 (0.145 kg, 40 m/s)</text><text x="565" y="275" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal">λ = h/p ≈ 1.1 × 10⁻³⁴ m</text><text x="565" y="299" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal">→ 어떤 슬릿보다도 터무니없이 작아</text><text x="565" y="323" font-size="13.5" fill="#6B7280" text-anchor="middle" font-weight="normal">파동성이 전혀 드러나지 않는다</text>
</svg>
