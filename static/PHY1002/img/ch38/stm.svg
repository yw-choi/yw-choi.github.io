<text x="660" y="245" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">A</text>
<text x="636" y="275" font-size="12.5" fill="#1a1a1a" text-anchor="end" font-weight="normal">터널링 전류 (~nA)</text>
<text x="636" y="293" font-size="12.5" fill="#6B7280" text-anchor="end" font-weight="normal">거리에 극도로 민감</text>
<text x="525" y="150" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal">바이어스 전압 ~10 mV</text>
<rect x="30" y="150" width="215" height="112" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
<text x="137" y="178" font-size="13.5" fill="#8B0029" text-anchor="middle" font-weight="bold">원리</text>
<text x="137" y="201" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal">전류가 일정해지도록</text>
<text x="137" y="220" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal">탐침 높이를 피드백 조절</text>
<text x="137" y="245" font-size="12.5" fill="#8B0029" text-anchor="middle" font-weight="bold">→ 높이 기록 = 원자 지도</text>
