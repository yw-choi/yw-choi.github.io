<text x="350" y="412" font-size="13.5" fill="#6B7280" text-anchor="middle" font-weight="normal">시료 표면의 원자들</text>
<polygon points="270,80 390,80 345,250 338,320 322,320 315,250" fill="#8B0029" opacity="0.92"/>
<text x="478" y="105" font-size="14" fill="#8B0029" text-anchor="middle" font-weight="bold">날카로운 금속 탐침</text>
<text x="478" y="125" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="normal">(끝이 원자 몇 개 크기)</text>
<line x1="240" y1="60" x2="420" y2="60" stroke="#1a1a1a" stroke-width="1.8" marker-start="url(#arrInk)" marker-end="url(#arrInk)"/>
<text x="330" y="44" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal">x–y 스캔</text>
<path d="M 330 324 L 330 343" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
<text x="250" y="300" font-size="13" fill="#2563EB" text-anchor="end" font-weight="normal">틈 ≈ 1 nm 진공</text>
<text x="250" y="318" font-size="13" fill="#2563EB" text-anchor="end" font-weight="bold">= 퍼텐셜 장벽</text>
