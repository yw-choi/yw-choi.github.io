<text x="565" y="340" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="italic">100 keV 전자: λ = h/p ≈ 3.7 pm</text>
<text x="565" y="364" font-size="13.5" fill="#8B0029" text-anchor="middle" font-weight="bold">원자 하나까지 분해 가능!</text>
