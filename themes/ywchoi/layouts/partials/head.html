<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>

<!-- SEO Meta Tags -->
<meta name="description" content="{{ if .IsHome }}Computational Quantum Materials Physics Lab at Sogang University. Understanding and predicting quantum materials properties using first-principles computational methods.{{ else }}{{ .Description | default .Summary | default (printf "%s - %s" .Title site.Title) }}{{ end }}">
<meta name="keywords" content="quantum materials, computational physics, first-principles calculations, density functional theory, DFT, nanomaterials, 2D materials, moiré materials, superconductors, Young Woo Choi, Sogang University">
<meta name="author" content="Young Woo Choi">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}">
<meta property="og:description" content="{{ if .IsHome }}Computational Quantum Materials Physics Lab at Sogang University{{ else }}{{ .Description | default .Summary | default .Title }}{{ end }}">
<meta property="og:site_name" content="{{ site.Title }}">

<!-- Twitter -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ if .IsHome }}Computational Quantum Materials Physics Lab at Sogang University{{ else }}{{ .Description | default .Summary | default .Title }}{{ end }}">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<!-- Canonical URL -->
<link rel="canonical" href="{{ .Permalink }}">

<!-- Schema.org structured data -->
{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ResearchOrganization",
  "name": "Computational Quantum Materials Physics Lab",
  "alternateName": "Young Woo Choi Research Group",
  "url": "{{ .Site.BaseURL }}",
  "logo": "{{ .Site.BaseURL }}/images/logo-regular.png",
  "description": "Computational Quantum Materials Physics Lab at Sogang University. Understanding and predicting quantum materials properties using first-principles computational methods.",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "35 Baekbeom-ro, Mapo-gu",
    "addressLocality": "Seoul",
    "postalCode": "04107",
    "addressCountry": "KR"
  },
  "parentOrganization": {
    "@type": "CollegeOrUniversity",
    "name": "Sogang University",
    "url": "https://sogang.ac.kr",
    "department": {
      "@type": "Organization",
      "name": "Department of Physics",
      "url": "https://physics.sogang.ac.kr"
    }
  },
  "member": {
    "@type": "Person",
    "name": "Young Woo Choi",
    "givenName": "Young Woo",
    "familyName": "Choi",
    "jobTitle": "Assistant Professor",
    "email": "ywchoi02@sogang.ac.kr",
    "url": "{{ .Site.BaseURL }}/people",
    "sameAs": [
      "https://scholar.google.com/citations?user=Qv4pipEAAAAJ"
    ],
    "affiliation": {
      "@type": "Organization",
      "name": "Sogang University"
    }
  }
}
</script>
{{ end }}
