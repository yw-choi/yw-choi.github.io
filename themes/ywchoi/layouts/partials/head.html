<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>

<!-- SEO Meta Tags -->
<meta name="description" content="{{ if .IsHome }}Computational Quantum Materials Physics Lab at Sogang University. Understanding and predicting quantum materials properties using first-principles computational methods.{{ else }}{{ .Description | default .Summary | default (printf "%s - %s" .Title site.Title) }}{{ end }}">
<meta name="keywords" content="quantum materials, computational physics, first-principles calculations, density functional theory, DFT, nanomaterials, 2D materials, moiré materials, superconductors, Young Woo Choi, Sogang University">
<meta name="author" content="Young Woo Choi">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}">
<meta property="og:description" content="{{ if .IsHome }}Computational Quantum Materials Physics Lab at Sogang University{{ else }}{{ .Description | default .Summary | default .Title }}{{ end }}">
<meta property="og:site_name" content="{{ site.Title }}">

<!-- Twitter -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ if .IsHome }}Computational Quantum Materials Physics Lab at Sogang University{{ else }}{{ .Description | default .Summary | default .Title }}{{ end }}">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<!-- Canonical URL -->
<link rel="canonical" href="{{ .Permalink }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
  rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/custom.css">

<style>
  body {
    font-family: 'Inter', sans-serif;
    font-optical-sizing: auto;
    max-width: 1000px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
  }
</style>
