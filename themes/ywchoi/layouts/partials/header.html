<div class="mt-3 mb-5 d-flex justify-content-end" style="min-height: 50px;">
  <img src="/images/logo-sogang.png" alt="Sogang University Logo" height="50">
</div>
<div class="d-flex flex-column flex-lg-row justify-content-lg-between align-items-center">
  <div class="me-lg-5 mb-3 mb-lg-0 d-flex justify-content-between align-items-center w-100 w-lg-auto">
    <a href="/" class="d-flex align-items-center" aria-label="Home - Young Woo Choi Lab">
      <img src="/images/logo-regular.png" alt="Young Woo Choi Lab Logo" height="24">
    </a>
    <!-- Mobile menu toggle button -->
    <button class="btn btn-link d-lg-none p-0 border-0 text-dark" type="button" data-bs-toggle="collapse"
      data-bs-target="#mainNav" aria-expanded="false" aria-controls="mainNav" aria-label="Toggle navigation menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-list"
        viewBox="0 0 16 16" aria-hidden="true">
        <path fill-rule="evenodd"
          d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z" />
      </svg>
    </button>
  </div>
  <!-- Desktop horizontal menu (visible on lg+) & Mobile accordion (visible below lg) -->
  <nav class="collapse d-lg-flex w-100 w-lg-auto" id="mainNav" aria-label="Main navigation">
    <div class="d-flex flex-column flex-lg-row w-100 w-lg-auto">
      {{ $currentPage := . }}
      {{ range site.Menus.main }}
      {{ if or ($currentPage.IsMenuCurrent .Menu .) ($currentPage.HasMenuCurrent .Menu .)}}
      <a href="{{ .URL }}"
        class="fs-6 fw-light link-dark link-offset-2 link-underline-opacity-100 align-middle px-2 py-2 py-lg-0"
        aria-current="page">
        {{ .Name }}
      </a>
      {{ else }}
      <a href="{{ .URL }}"
        class="fs-6 fw-light link-dark link-offset-2 link-underline-opacity-0 link-underline-opacity-25-hover align-middle px-2 py-2 py-lg-0">
        {{ .Name }}
      </a>
      {{ end }}
      {{- end }}
    </div>
  </nav>
</div>
