<div class="mt-3 mb-5 d-flex justify-content-end" style="min-height: 50px;">
  <img src="/images/logo-sogang.png" alt="Sogang University" height="50">
</div>
<div class="d-flex flex-column flex-lg-row justify-content-lg-between align-items-center">
  <div class="me-lg-5 mb-3 mb-lg-0">
    <a href="/" class=" d-flex align-items-center">
      <img src="/images/logo-regular.png" alt="Young Woo Choi" height="24">

    </a>
  </div>
  <nav class="d-flex">
    {{ $currentPage := . }}
    {{ range site.Menus.main }}
    {{ if or ($currentPage.IsMenuCurrent .Menu .) ($currentPage.HasMenuCurrent .Menu .)}}
    <a href="{{ .URL }}" class="fs-6 fw-light link-dark link-offset-2 link-underline-opacity-100 align-middle px-2">
      {{ .Name }}
    </a>
    {{ else }}
    <a href="{{ .URL }}"
      class="fs-6 fw-light link-dark link-offset-2 link-underline-opacity-0 link-underline-opacity-25-hover align-middle px-2">
      {{ .Name }}
    </a>
    {{ end }}
    {{- end }}
  </nav>
</div>
